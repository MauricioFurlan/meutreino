<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Configurações</title>
  <meta name="theme-color" content="#00bcd4">
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Treino">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="stylesheet" href="theme.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body::-webkit-scrollbar, *::-webkit-scrollbar { display: none; }
    body, * { scrollbar-width: none; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg-body); color: var(--text); min-height: 100vh; padding-bottom: 40px;
    }
    .header {
      background: var(--bg-header); padding: 16px; text-align: center;
      border-bottom: 1px solid var(--border); position: relative;
    }
    .header h1 { font-size: 1.1rem; color: var(--accent); letter-spacing: 1px; }
    .header .subtitle { font-size: 0.8rem; color: var(--text-muted); margin-top: 4px; }
    .nav-btn {
      position: absolute; top: 14px; background: none; border: 1px solid #555;
      color: var(--text-muted); font-size: 0.65rem; padding: 4px 10px; border-radius: 12px; cursor: pointer;
    }
    .nav-btn.left { left: 14px; }
    .nav-btn:active { opacity: 0.6; }

    .section-title {
      font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase;
      letter-spacing: 1px; padding: 20px 16px 8px; font-weight: 600;
    }

    .theme-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
      padding: 0 16px 16px;
    }

    .theme-card {
      border-radius: 12px; padding: 14px; cursor: pointer;
      border: 2px solid var(--border); transition: all 0.2s;
      position: relative; overflow: hidden;
    }
    .theme-card.active {
      border-color: var(--accent);
      box-shadow: 0 0 12px rgba(0,0,0,0.3);
    }
    .theme-card.active::after {
      content: '✓'; position: absolute; top: 8px; right: 10px;
      font-size: 0.8rem; font-weight: 700;
    }

    .theme-preview {
      display: flex; gap: 5px; margin-bottom: 10px; height: 24px;
      border-radius: 6px; overflow: hidden;
    }
    .theme-preview span { flex: 1; }

    .theme-name { font-size: 0.8rem; font-weight: 600; }
    .theme-desc { font-size: 0.65rem; opacity: 0.6; margin-top: 2px; }

    /* Previews individuais com cores reais de cada tema */
    .theme-card[data-theme="default"] { background: #0d2137; border-color: #1a3a4f; }
    .theme-card[data-theme="default"] .theme-name { color: #f0f0f0; }
    .theme-card[data-theme="default"] .theme-desc { color: #999; }
    .theme-card[data-theme="default"].active { border-color: #00bcd4; }
    .theme-card[data-theme="default"].active::after { color: #00bcd4; }

    .theme-card[data-theme="ember"] { background: #141414; border-color: #2a2a2a; }
    .theme-card[data-theme="ember"] .theme-name { color: #f0f0f0; }
    .theme-card[data-theme="ember"] .theme-desc { color: #999; }
    .theme-card[data-theme="ember"].active { border-color: #f97316; }
    .theme-card[data-theme="ember"].active::after { color: #f97316; }

    .theme-card[data-theme="emerald"] { background: #0c0c0c; border-color: rgba(255,255,255,0.15); }
    .theme-card[data-theme="emerald"] .theme-name { color: #f0f0f0; }
    .theme-card[data-theme="emerald"] .theme-desc { color: #999; }
    .theme-card[data-theme="emerald"].active { border-color: #10b981; }
    .theme-card[data-theme="emerald"].active::after { color: #10b981; }

    .theme-card[data-theme="colorblind"] { background: #1a1a2e; border-color: #2a2a5a; }
    .theme-card[data-theme="colorblind"] .theme-name { color: #f0f0f0; }
    .theme-card[data-theme="colorblind"] .theme-desc { color: #aaa; }
    .theme-card[data-theme="colorblind"].active { border-color: #4fc3f7; }
    .theme-card[data-theme="colorblind"].active::after { color: #4fc3f7; }

    .theme-card[data-theme="steel"] { background: #151b24; border-color: #2a3442; }
    .theme-card[data-theme="steel"] .theme-name { color: #f0f0f0; }
    .theme-card[data-theme="steel"] .theme-desc { color: #999; }
    .theme-card[data-theme="steel"].active { border-color: #cbd5e1; }
    .theme-card[data-theme="steel"].active::after { color: #cbd5e1; }

    .theme-card[data-theme="neon"] { background: #141414; border-color: #2a2a2a; }
    .theme-card[data-theme="neon"] .theme-name { color: #f0f0f0; }
    .theme-card[data-theme="neon"] .theme-desc { color: #999; }
    .theme-card[data-theme="neon"].active { border-color: #b388ff; }
    .theme-card[data-theme="neon"].active::after { color: #b388ff; }

    .theme-card[data-theme="light"] { background: #ffffff; border-color: #d4d4d8; }
    .theme-card[data-theme="light"] .theme-name { color: #18181b; }
    .theme-card[data-theme="light"] .theme-desc { color: #71717a; }
    .theme-card[data-theme="light"].active { border-color: #18181b; }
    .theme-card[data-theme="light"].active::after { color: #18181b; }

    .theme-card[data-theme="highvis"] { background: #0c0c0c; border-color: rgba(255,255,255,0.15); }
    .theme-card[data-theme="highvis"] .theme-name { color: #ffd600; font-size: 0.85rem; }
    .theme-card[data-theme="highvis"] .theme-desc { color: #999; }
    .theme-card[data-theme="highvis"].active { border-color: #ffd600; }
    .theme-card[data-theme="highvis"].active::after { color: #ffd600; }

    .toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: var(--accent); color: var(--text-dark); padding: 10px 20px;
      border-radius: 8px; font-size: 0.8rem; font-weight: 600;
      opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 999;
    }
    .toast.show { opacity: 1; }

    /* Loading overlay */
    .loading-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: var(--overlay-bg); z-index: 9999;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 16px; transition: opacity 0.3s;
    }
    .loading-overlay.hidden { opacity: 0; pointer-events: none; }
    .loading-spinner {
      width: 44px; height: 44px; border: 3px solid var(--spinner-track);
      border-top-color: var(--spinner-accent); border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { color: var(--text-muted); font-size: 0.8rem; font-weight: 500; letter-spacing: 0.5px; }
  </style>
</head>
<body>
  <div class="loading-overlay" id="loadingOverlay">
    <div class="loading-spinner"></div>
    <div class="loading-text">Carregando...</div>
  </div>

  <div class="header">
    <button class="nav-btn left" onclick="location.href='index.html'">← Voltar</button>
    <h1>⚙ Configurações</h1>
    <div class="subtitle">Personalize seu app</div>
  </div>

  <div class="section-title">Tema de cores</div>

  <div class="theme-grid" id="themeGrid">
    <div class="theme-card" data-theme="default" onclick="selectTheme('default')">
      <div class="theme-preview">
        <span style="background:#0d2137"></span>
        <span style="background:#00bcd4"></span>
        <span style="background:#0d0d0d"></span>
      </div>
      <div class="theme-name">Padrão</div>
      <div class="theme-desc">Ciano & escuro</div>
    </div>

    <div class="theme-card" data-theme="ember" onclick="selectTheme('ember')">
      <div class="theme-preview">
        <span style="background:#141414"></span>
        <span style="background:#f97316"></span>
        <span style="background:#0a0a0a"></span>
      </div>
      <div class="theme-name">Ember</div>
      <div class="theme-desc">Laranja & energia</div>
    </div>

    <div class="theme-card" data-theme="emerald" onclick="selectTheme('emerald')">
      <div class="theme-preview">
        <span style="background:#0c0c0c"></span>
        <span style="background:#10b981"></span>
        <span style="background:#050505"></span>
      </div>
      <div class="theme-name">Emerald</div>
      <div class="theme-desc">Verde & progresso</div>
    </div>

    <div class="theme-card" data-theme="colorblind" onclick="selectTheme('colorblind')">
      <div class="theme-preview">
        <span style="background:#1a1a2e"></span>
        <span style="background:#4fc3f7"></span>
        <span style="background:#ff9100"></span>
      </div>
      <div class="theme-name">Acessível</div>
      <div class="theme-desc">Otimizado para daltonismo</div>
    </div>

    <div class="theme-card" data-theme="steel" onclick="selectTheme('steel')">
      <div class="theme-preview">
        <span style="background:#151b24"></span>
        <span style="background:#cbd5e1"></span>
        <span style="background:#0f1115"></span>
      </div>
      <div class="theme-name">Steel</div>
      <div class="theme-desc">Azul aço & foco</div>
    </div>

    <div class="theme-card" data-theme="neon" onclick="selectTheme('neon')">
      <div class="theme-preview">
        <span style="background:#141414"></span>
        <span style="background:#b388ff"></span>
        <span style="background:#0a0a0a"></span>
      </div>
      <div class="theme-name">Neon</div>
      <div class="theme-desc">Roxo elétrico</div>
    </div>

    <div class="theme-card" data-theme="light" onclick="selectTheme('light')">
      <div class="theme-preview">
        <span style="background:#ffffff"></span>
        <span style="background:#18181b"></span>
        <span style="background:#f4f4f5"></span>
      </div>
      <div class="theme-name">Claro</div>
      <div class="theme-desc">Minimalista & limpo</div>
    </div>

    <div class="theme-card" data-theme="highvis" onclick="selectTheme('highvis')">
      <div class="theme-preview">
        <span style="background:#0c0c0c"></span>
        <span style="background:#ffd600"></span>
        <span style="background:#050505"></span>
      </div>
      <div class="theme-name">Ampliado</div>
      <div class="theme-desc">Fontes grandes & alto contraste</div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth-guard.js"></script>
<script>
function showLoading() { document.getElementById('loadingOverlay').classList.remove('hidden'); }
function hideLoading() { document.getElementById('loadingOverlay').classList.add('hidden'); }

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

let currentTheme = localStorage.getItem('app-theme') || 'default';
let studentId = null;

function selectTheme(theme) {
  currentTheme = theme;
  document.documentElement.setAttribute('data-theme', theme);
  localStorage.setItem('app-theme', theme);

  // Atualiza visual dos cards
  document.querySelectorAll('.theme-card').forEach(c => {
    c.classList.toggle('active', c.dataset.theme === theme);
  });

  // Salva no Supabase (fire-and-forget)
  if (studentId && _sb) {
    _sb.from('profiles').update({ app_theme: theme }).eq('id', studentId);
  }

  showToast('Tema aplicado!');
}

function applyTheme() {
  document.documentElement.setAttribute('data-theme', currentTheme);
  document.querySelectorAll('.theme-card').forEach(c => {
    c.classList.toggle('active', c.dataset.theme === currentTheme);
  });
}

guard('student', {
  onReady: async (session, profile) => {
    studentId = profile.id;

    // Carrega tema salvo no perfil (prioridade sobre localStorage)
    if (profile.app_theme) {
      currentTheme = profile.app_theme;
      localStorage.setItem('app-theme', currentTheme);
    }

    applyTheme();
    hideLoading();
  },
  onBlocked: () => {
    applyTheme();
    hideLoading();
  }
});

// Aplica tema imediatamente (antes do guard resolver)
applyTheme();

if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }
</script>
</body>
</html>
