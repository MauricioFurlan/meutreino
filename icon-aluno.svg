<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 192 192">
  <!-- =================================================================
       Ícone do ALUNO — mira (foco) + halter (treino).
       Fonte única: o plugin do Vite renderiza este SVG em 192 e 512 px.
       Conteúdo dentro do círculo de raio 76.8 (80% central) para
       sobreviver ao recorte "maskable" do Android.
       ================================================================= -->
  <rect width="192" height="192" rx="42" fill="#0d0d0d"/>

  <!-- Mira: anel externo com quebras nos 4 eixos (retícula) + anel interno.
       dasharray/dashoffset calculados para a circunferência r=66 (414.7):
       4 traços de 77.7 + 4 vãos de 26, deslocados para centrar os vãos
       em cima, embaixo, esquerda e direita. -->
  <circle cx="96" cy="96" r="66" fill="none" stroke="#00bcd4" stroke-width="9"
          stroke-linecap="round" stroke-dasharray="77.7 26" stroke-dashoffset="90.7"/>
  <circle cx="96" cy="96" r="48" fill="none" stroke="#00bcd4" stroke-width="5" opacity="0.4"/>

  <!-- Halter -->
  <g fill="#00bcd4">
    <rect x="62" y="92" width="68" height="8" rx="4"/>
    <rect x="68" y="79" width="13" height="34" rx="4"/>
    <rect x="111" y="79" width="13" height="34" rx="4"/>
    <rect x="56" y="86" width="8" height="20" rx="3"/>
    <rect x="128" y="86" width="8" height="20" rx="3"/>
  </g>
</svg>
