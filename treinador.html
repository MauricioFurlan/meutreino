<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Treino - Mauricio Furlan</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0d0d0d;
      color: #f0f0f0;
      min-height: 100vh;
      padding-bottom: 40px;
    }
    .header {
      background: #1a1a1a;
      padding: 16px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid #333;
    }
    .header h1 { font-size: 1.1rem; color: #f5c518; letter-spacing: 1px; }
    .header .subtitle { font-size: 0.8rem; color: #999; margin-top: 4px; }
    .tabs {
      display: flex;
      background: #1a1a1a;
      padding: 8px;
      gap: 4px;
      position: sticky;
      top: 96px;
      z-index: 99;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      flex: 1;
      padding: 8px 4px;
      border-radius: 20px;
      background: #2a2a2a;
      color: #888;
      font-size: 0.7rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      text-align: center;
    }
    .tab.active {
      background: #f5c518;
      color: #000;
    }
    .day-content { display: none; padding: 16px; }
    .day-content.active { display: block; }
    .exercise-card {
      background: #1a1a1a;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      border: 1px solid #333;
    }
    .exercise-name {
      font-size: 0.95rem;
      font-weight: 700;
      color: #f5c518;
      margin-bottom: 10px;
    }
    .set-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      align-items: center;
      padding: 6px 0;
      border-bottom: 1px solid #222;
    }
    .set-row:last-child { border-bottom: none; }
    .set-label {
      font-size: 0.75rem;
      color: #999;
      text-transform: uppercase;
    }
    .set-value {
      font-size: 0.85rem;
      color: #f0f0f0;
      text-align: center;
    }
    .set-value.empty { color: #555; font-style: italic; }
    .no-data {
      text-align: center;
      padding: 20px;
      color: #555;
      font-size: 0.85rem;
      font-style: italic;
    }
    .date-filter {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px;
      background: #1a1a1a;
      border-bottom: 1px solid #333;
      position: sticky;
      top: 52px;
      z-index: 100;
    }
    .date-filter input {
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #0d0d0d;
      color: #f0f0f0;
      font-size: 0.85rem;
    }
    .date-filter input:focus { outline: none; border-color: #f5c518; }
    .date-filter label { font-size: 0.8rem; color: #999; }
    .loading { text-align: center; padding: 40px; color: #888; }
    .summary {
      background: #2a2a2a;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 16px;
      font-size: 0.8rem;
      color: #bbb;
      text-align: center;
    }
    .summary strong { color: #f5c518; }
    .chart-btn {
      background: #2a2a2a;
      border: 1px solid #f5c518;
      color: #f5c518;
      font-size: 0.75rem;
      padding: 5px 10px;
      border-radius: 6px;
      cursor: pointer;
      margin-bottom: 10px;
    }
    .chart-btn:active { opacity: 0.7; }
    .chart-container {
      display: none;
      background: #0d0d0d;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 10px;
    }
    .chart-container.show { display: block; }
    .chart-container canvas { max-height: 200px; }
    .chart-legend {
      display: flex;
      justify-content: center;
      gap: 16px;
      font-size: 0.7rem;
      color: #999;
      margin-top: 6px;
    }
    .chart-legend span { display: flex; align-items: center; gap: 4px; }
    .chart-legend .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }
    .frequency {
      margin-top: 10px;
      padding: 8px;
      background: #1a1a1a;
      border-radius: 8px;
      font-size: 0.75rem;
      color: #bbb;
      text-align: center;
    }
    .frequency strong { color: #f5c518; }
    .freq-dots {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      justify-content: center;
      margin-top: 6px;
    }
    .freq-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #4caf50;
    }
    .freq-dot.missed {
      background: #f44336;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Treino - Mauricio Furlan</h1>
    <div class="subtitle">Visualização do treinador</div>
  </div>
  <div class="date-filter">
    <label>Data:</label>
    <input type="date" id="dateFilter">
  </div>
  <div class="tabs" id="tabs"></div>
  <div id="content"></div>

<script>
const SUPABASE_URL = 'https://qslvwyhpamazoqhcmqan.supabase.co';
const SUPABASE_KEY = 'sb_publishable_lTQKzQJc5uq7LNq-N1UvRg_w3aF_7zH';

const DAYS = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];

const PRESCRIBED_REPS = {
  'Barra fixa (ativação)': ['falha'],
  'Remada baixa triângulo cimerian': ['12-15','2-4','2-4','8-12','7-9'],
  'Remada curvada pronada irontech': ['2-4','2-4','8-12','8-12','7-9'],
  'Puxador alto aberto cimerian': ['2-4','8-12','7-9'],
  'Pulldown corda': ['2-4','8-12','8-12','8-12'],
  'Crucifixo inverso + Face pull (biset)': ['8-12','8-12','8-12'],
  'Rosca alta máquina unilateral': ['12-15','2-4','8-12','8-12','7-9'],
  'Peck Deck (ativação)': ['15'],
  'Supino reto sentado cimerian': ['12-15','2-4','8-12','8-12','7-9'],
  'Desenvolvimento irontech': ['12-15','2-4','2-4','8-12','8-12','7-9'],
  'Supino inclinado irontech guiado': ['2-4','8-12','8-12','7-9'],
  'Crossover cima pra baixo': ['8-12','7-9 + drop'],
  'Tríceps polia barra W': ['12-15','2-4','8-12','7-9'],
  'Banco romano (ativação)': ['15'],
  'Cadeira flexora': ['12-15','2-4','2-4','8-12','8-12','7-9'],
  'Elevação pélvica': ['12-15','2-4','2-4','7-9','8-12','8-12'],
  'Mesa flexora': ['2-4','8-12','8-12','7-9'],
  'Leg press 90° irontech': ['12-15','8-12','7-9'],
  'Cadeira abdutora + adutora': ['12-15','2-4','8-12','8-12','10-15'],
  'Panturrilha sentado': ['12-15','2-4','8-12','8-12','10-15'],
  'Panturrilha em pé': ['12-15','2-4','8-12','8-12','10-15'],
  'Abdômen máquina': ['12-15','2-4','8-12','8-12','10-15'],
  'Abdômen paralela': ['10-15','10-15','10-15'],
  'Cardio': ['40 min'],
  'Puxador frente aberto barra anatômica': ['12-15','2-4','8-12','7-9'],
  'Puxada unilateral Cimerian': ['8-12','7-9'],
  'Supino inclinado máquina Cimerian': ['12-15','2-4','8-12','8-12','7-9'],
  'Crossover baixo pra cima': ['8-12 + drop','8-12 + drop','8-12 + drop'],
  'Elevação frontal halter simultâneo': ['8-12 + parciais','8-12 + parciais','8-12 + parciais'],
  'Elevação lateral unilateral Crossover': ['8-12 + parciais','8-12 + parciais','8-12 + parciais'],
  'Tríceps corda + Bíceps corda': ['8-12','8-12','8-12'],
  'Extensora unilateral (ativação)': ['12-15'],
  'Leg press 45° articulado cimerian': ['12-15','2-4','8-12','8-12','7-9'],
  'Hack glutebuilder': ['2-4','2-4','8-12','8-12','7-9'],
  'Cadeira extensora (pico de contração)': ['8-12','7-9','8-12 + drop'],
  'Stiff glutebuilder': ['12-15','2-4','8-12','8-12','8-12'],
  'Cadeira abdutora pra frente': ['8-12','8-12','8-12']
};

async function supaFetch(endpoint) {
  const res = await fetch(SUPABASE_URL + '/rest/v1/' + endpoint, {
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + SUPABASE_KEY
    }
  });
  if (!res.ok) throw new Error('Erro: ' + res.status);
  return res.json();
}

async function loadDay(day, date) {
  const container = document.getElementById('day-' + day);
  container.innerHTML = '<div class="loading">Carregando...</div>';

  try {
    const data = await supaFetch(
      `workout_logs?day=eq.${encodeURIComponent(day)}&created_at=gte.${date}T00:00:00&created_at=lt.${date}T23:59:59&order=exercise_name.asc,set_number.asc`
    );

    if (!data || data.length === 0) {
      container.innerHTML = '<div class="no-data">Sem dados registrados nesta data</div>';
      return;
    }

    const exercises = {};
    data.forEach(r => {
      if (!exercises[r.exercise_name]) exercises[r.exercise_name] = [];
      exercises[r.exercise_name].push(r);
    });

    const totalSets = data.length;
    const totalExercises = Object.keys(exercises).length;
    let html = `<div class="summary"><strong>${totalExercises}</strong> exercícios · <strong>${totalSets}</strong> sets registrados</div>`;

    Object.entries(exercises).forEach(([name, sets], exIdx) => {
      const chartId = `chart-${day}-${date}-${exIdx}`;
      html += `<div class="exercise-card">`;
      html += `<div class="exercise-name">${name}</div>`;
      html += `<button class="chart-btn" onclick="toggleChart('${chartId}', '${name.replace(/'/g, "\\'")}')">📈 Evolução</button>`;
      html += `<div class="chart-container" id="${chartId}"><canvas></canvas><div class="chart-legend"><span><span class="dot" style="background:#f5c518"></span> Volume (kg×reps)</span><span><span class="dot" style="background:#4caf50"></span> Carga máx (kg)</span></div></div>`;
      html += `<div class="set-row"><span class="set-label">Set</span><span class="set-label" style="text-align:center">Carga</span><span class="set-label" style="text-align:center">Reps</span></div>`;
      sets.forEach(s => {
        const weight = s.weight ? s.weight + ' kg' : '-';
        const reps = s.notes ? s.notes : (s.reps ? s.reps + ' reps' : '-');
        const prescribedList = PRESCRIBED_REPS[name] || [];
        const prescribed = prescribedList[s.set_number - 1] || '';
        html += `<div class="set-row">`;
        html += `<span class="set-label">${s.set_type} ${s.set_number}${prescribed ? ' (' + prescribed + ')' : ''}</span>`;
        html += `<span class="set-value${!s.weight ? ' empty' : ''}">${weight}</span>`;
        html += `<span class="set-value${!s.reps ? ' empty' : ''}">${reps}</span>`;
        html += `</div>`;
      });
      html += `</div>`;
    });

    container.innerHTML = html;
  } catch (e) {
    container.innerHTML = `<div class="no-data">Erro ao carregar: ${e.message}</div>`;
  }
}

const chartInstances = {};

async function toggleChart(chartId, exerciseName) {
  const container = document.getElementById(chartId);
  if (container.classList.contains('show')) {
    container.classList.remove('show');
    return;
  }
  container.classList.add('show');

  if (chartInstances[chartId]) return; // já renderizado

  try {
    const data = await supaFetch(
      `workout_logs?exercise_name=eq.${encodeURIComponent(exerciseName)}&set_type=eq.hard&order=created_at.asc`
    );

    if (!data || data.length === 0) {
      container.innerHTML = '<div class="no-data">Sem histórico</div>';
      return;
    }

    // Agrupar por data
    const byDate = {};
    data.forEach(r => {
      const date = r.created_at.split('T')[0];
      if (!byDate[date]) byDate[date] = [];
      byDate[date].push(r);
    });

    const labels = [];
    const volumeData = [];
    const maxWeightData = [];

    Object.entries(byDate).forEach(([date, sets]) => {
      labels.push(new Date(date + 'T12:00:00').toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' }));
      let volume = 0;
      let maxWeight = 0;
      sets.forEach(s => {
        const w = s.weight || 0;
        const r = s.reps || 0;
        volume += w * r;
        if (w > maxWeight) maxWeight = w;
      });
      volumeData.push(volume);
      maxWeightData.push(maxWeight);
    });

    const canvas = container.querySelector('canvas');
    const ctx = canvas.getContext('2d');

    chartInstances[chartId] = new Chart(ctx, {
      type: 'line',
      data: {
        labels: labels,
        datasets: [
          {
            label: 'Volume (kg×reps)',
            data: volumeData,
            borderColor: '#f5c518',
            backgroundColor: 'rgba(245, 197, 24, 0.1)',
            borderWidth: 2,
            tension: 0.3,
            fill: true,
            pointRadius: 2,
            yAxisID: 'y'
          },
          {
            label: 'Carga máx (kg)',
            data: maxWeightData,
            borderColor: '#4caf50',
            backgroundColor: 'rgba(76, 175, 80, 0.1)',
            borderWidth: 2,
            tension: 0.3,
            fill: false,
            pointRadius: 2,
            yAxisID: 'y1'
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: '#1a1a1a',
            titleColor: '#f5c518',
            bodyColor: '#f0f0f0',
            borderColor: '#333',
            borderWidth: 1
          }
        },
        scales: {
          x: {
            ticks: { color: '#666', font: { size: 9 }, maxRotation: 45 },
            grid: { color: '#222' }
          },
          y: {
            position: 'left',
            ticks: { color: '#f5c518', font: { size: 9 } },
            grid: { color: '#222' },
            title: { display: false }
          },
          y1: {
            position: 'right',
            ticks: { color: '#4caf50', font: { size: 9 } },
            grid: { display: false },
            title: { display: false }
          }
        }
      }
    });

    // Indicador de frequência
    const dates = Object.keys(byDate).sort();
    const firstDate = new Date(dates[0] + 'T12:00:00');
    const lastDate = new Date(dates[dates.length - 1] + 'T12:00:00');
    const totalWeeks = Math.ceil((lastDate - firstDate) / (7 * 24 * 60 * 60 * 1000)) + 1;
    const trainedWeeks = new Set(dates.map(d => {
      const dt = new Date(d + 'T12:00:00');
      const startOfYear = new Date(dt.getFullYear(), 0, 1);
      return Math.ceil(((dt - startOfYear) / 86400000 + startOfYear.getDay() + 1) / 7);
    }));
    const attended = trainedWeeks.size;
    const percent = Math.round((attended / totalWeeks) * 100);

    // Gerar bolinhas por semana
    let dotsHtml = '';
    let currentWeek = new Date(firstDate);
    for (let i = 0; i < totalWeeks; i++) {
      const weekStart = new Date(currentWeek);
      const weekEnd = new Date(weekStart);
      weekEnd.setDate(weekEnd.getDate() + 6);
      const hadTraining = dates.some(d => {
        const dt = new Date(d + 'T12:00:00');
        return dt >= weekStart && dt <= weekEnd;
      });
      dotsHtml += `<span class="freq-dot${hadTraining ? '' : ' missed'}" title="Semana ${i+1}"></span>`;
      currentWeek.setDate(currentWeek.getDate() + 7);
    }

    const freqEl = document.createElement('div');
    freqEl.className = 'frequency';
    freqEl.innerHTML = `Frequência: <strong>${attended}/${totalWeeks} semanas (${percent}%)</strong><div class="freq-dots">${dotsHtml}</div><div style="margin-top:4px;font-size:0.65rem;">🟢 treinou &nbsp; 🔴 faltou</div>`;
    container.appendChild(freqEl);
  } catch (e) {
    container.innerHTML = `<div class="no-data">Erro: ${e.message}</div>`;
  }
}

function init() {
  const dateInput = document.getElementById('dateFilter');
  const today = new Date().toISOString().split('T')[0];
  dateInput.value = today;

  const tabsEl = document.getElementById('tabs');
  const contentEl = document.getElementById('content');
  const todayDay = DAYS[new Date().getDay()];

  DAYS.forEach((day, dayIdx) => {
    const tab = document.createElement('button');
    tab.className = 'tab' + (day === todayDay ? ' active' : '');
    tab.textContent = day.substring(0, 3);
    tab.onclick = () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.day-content').forEach(d => d.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById('day-' + day).classList.add('active');
      // Ajusta a data para o último dia da semana correspondente
      const now = new Date();
      const currentDayIdx = now.getDay();
      let diff = currentDayIdx - dayIdx;
      if (diff < 0) diff += 7;
      const targetDate = new Date(now);
      targetDate.setDate(now.getDate() - diff);
      dateInput.value = targetDate.toISOString().split('T')[0];
      loadDay(day, dateInput.value);
    };
    tabsEl.appendChild(tab);

    const div = document.createElement('div');
    div.className = 'day-content' + (day === todayDay ? ' active' : '');
    div.id = 'day-' + day;
    contentEl.appendChild(div);
  });

  dateInput.addEventListener('change', () => {
    const selectedDate = new Date(dateInput.value + 'T12:00:00');
    const dayOfWeek = DAYS[selectedDate.getDay()];
    // Move a tab pro dia correto
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.day-content').forEach(d => d.classList.remove('active'));
    const tabs = document.querySelectorAll('.tab');
    tabs.forEach(t => {
      if (t.textContent === dayOfWeek.substring(0, 3)) t.classList.add('active');
    });
    document.getElementById('day-' + dayOfWeek).classList.add('active');
    loadDay(dayOfWeek, dateInput.value);
  });

  loadDay(todayDay, today);
}

init();
</script>
</body>
</html>
