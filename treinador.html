<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Treino</title>
  <meta name="theme-color" content="#00bcd4">
  <!-- PWA: precisa estar em TODAS as páginas, senão o iOS mostra a barra do
       Safari ao navegar dentro do app instalado (modo standalone) -->
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Treino">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; connect-src 'self' https://*.supabase.co; img-src 'self' data:;">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body::-webkit-scrollbar, *::-webkit-scrollbar { display: none; }
    body, * { scrollbar-width: none; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0d0d0d;
      color: #f0f0f0;
      min-height: 100vh;
      padding-bottom: 40px;
    }
    .header {
      background: #0d2137;
      padding: 16px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 101;
      border-bottom: 1px solid #1a3a4f;
    }
    .header h1 { font-size: 1.1rem; color: #00bcd4; letter-spacing: 1px; }
    .header .subtitle { font-size: 0.8rem; color: #999; margin-top: 4px; }
    .logout-btn {
      position: absolute; top: 14px; right: 14px; background: none; border: 1px solid #555;
      color: #999; font-size: 0.65rem; padding: 4px 10px; border-radius: 12px; cursor: pointer;
    }
    .logout-btn:active { opacity: 0.6; }
    .tabs {
      display: flex;
      background: #0d2137;
      padding: 8px;
      gap: 4px;
      position: sticky;
      top: var(--header-h, 72px);
      z-index: 99;
      border-bottom: 1px solid #1a3a4f;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      flex: 1;
      padding: 8px 4px;
      border-radius: 20px;
      background: #132d42;
      color: #888;
      font-size: 0.7rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      text-align: center;
    }
    .tab.active {
      background: #00bcd4;
      color: #000;
    }
    .day-content { display: none; padding: 16px; }
    .day-content.active { display: block; }
    .exercise-card {
      background: #0d2137;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      border: 1px solid #1a3a4f;
    }
    .exercise-name {
      font-size: 0.95rem;
      font-weight: 700;
      color: #00bcd4;
      margin-bottom: 10px;
      text-transform: uppercase;
    }
    .set-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      align-items: center;
      padding: 6px 0;
      border-bottom: 1px solid #222;
    }
    .set-row:last-child { border-bottom: none; }
    .set-label {
      font-size: 0.75rem;
      color: #999;
      text-transform: uppercase;
    }
    .set-value {
      font-size: 0.85rem;
      color: #fff;
      text-align: center;
      font-weight: 600;
    }
    .set-value.empty { color: #666; font-style: italic; font-weight: 400; }
    .no-data {
      text-align: center;
      padding: 20px;
      color: #555;
      font-size: 0.85rem;
      font-style: italic;
    }
    .date-filter {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px;
      background: #0d2137;
      border-bottom: 1px solid #1a3a4f;
    }
    .date-filter input {
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid #1a3a4f;
      background: #0d0d0d;
      color: #f0f0f0;
      font-size: 0.85rem;
    }
    .date-filter input:focus { outline: none; border-color: #00bcd4; }
    .date-filter label { font-size: 0.8rem; color: #999; }
    .loading { text-align: center; padding: 40px; color: #888; }
    .summary {
      background: #132d42;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 16px;
      font-size: 0.8rem;
      color: #bbb;
      text-align: center;
    }
    .summary strong { color: #00bcd4; }
    .chart-btn {
      background: #132d42;
      border: 1px solid #00bcd4;
      color: #00bcd4;
      font-size: 0.75rem;
      padding: 5px 10px;
      border-radius: 6px;
      cursor: pointer;
      margin-bottom: 10px;
    }
    .chart-btn:active { opacity: 0.7; }
    .chart-container {
      display: none;
      background: #0d0d0d;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 10px;
    }
    .chart-container.show { display: block; }
    .chart-container canvas { max-height: 200px; }
    .chart-legend {
      display: flex;
      justify-content: center;
      gap: 16px;
      font-size: 0.7rem;
      color: #999;
      margin-top: 6px;
    }
    .chart-legend span { display: flex; align-items: center; gap: 4px; }
    .chart-legend .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }
    /* Área de texto do gráfico (melhor set, progressão, frequência).
       Existe para que mensagens de erro/vazio NÃO sobrescrevam o <canvas>. */
    .chart-info { margin-top: 8px; }
    .chart-info .stat-row { font-size: 0.72rem; }
    /* Aviso de janela: o gráfico vive na aba Diária mas fala de 12 semanas */
    .chart-caption {
      font-size: 0.62rem; color: #777; text-align: center;
      padding-bottom: 6px; border-bottom: 1px solid #222; margin-bottom: 4px;
    }
    .frequency {
      margin-top: 10px;
      padding: 8px;
      background: #0d2137;
      border-radius: 8px;
      font-size: 0.75rem;
      color: #bbb;
      text-align: center;
    }
    .frequency strong { color: #00bcd4; }
    .freq-dots {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      justify-content: center;
      margin-top: 6px;
    }
    .freq-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #4caf50;
    }
    .freq-dot.missed {
      background: #f44336;
    }
    .view-toggle {
      display: flex;
      justify-content: center;
      gap: 0;
      padding: 12px 16px;
      background: #0d2137;
      border-bottom: 1px solid #1a3a4f;
    }
    .view-btn {
      padding: 8px 16px;
      border: 1px solid #1a3a4f;
      background: #132d42;
      color: #888;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }
    .view-btn:first-child { border-radius: 8px 0 0 8px; }
    .view-btn:last-child { border-radius: 0 8px 8px 0; }
    .view-btn.active { background: #00bcd4; color: #000; border-color: #00bcd4; }
    .resume-section { display: none; padding: 16px; }
    .resume-section.active { display: block; }
    .resume-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 16px;
    }
    .resume-nav button {
      background: #132d42;
      border: none;
      color: #00bcd4;
      font-size: 1.2rem;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
    }
    .resume-nav span {
      font-size: 0.9rem;
      font-weight: 600;
      color: #f0f0f0;
    }
    .presence-calendar {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 3px;
      margin-bottom: 12px;
      max-width: 280px;
      margin-left: auto;
      margin-right: auto;
    }
    .cal-header {
      font-size: 0.6rem;
      color: #888;
      text-align: center;
      padding: 2px 0;
    }
    .cal-day {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.55rem;
      color: #666;
      max-width: 28px;
      max-height: 28px;
      margin: 0 auto;
    }
    .cal-day.trained { background: #4caf50; color: #fff; }
    .cal-day.missed { background: #f44336; color: #fff; }
    .cal-day.rest { background: #222; color: #555; }
    .cal-day.future { background: none; color: #1a3a4f; }
    .resume-card {
      background: #0d2137;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      border: 1px solid #1a3a4f;
    }
    .resume-card h3 {
      font-size: 0.8rem;
      color: #00bcd4;
      margin-bottom: 8px;
    }
    .volume-bar-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }
    .volume-bar-label {
      font-size: 0.7rem;
      color: #999;
      min-width: 35px;
    }
    .volume-bar-track {
      flex: 1;
      height: 14px;
      background: #222;
      border-radius: 7px;
      overflow: hidden;
    }
    .volume-bar-fill {
      height: 100%;
      background: #00bcd4;
      border-radius: 7px;
      transition: width 0.3s;
    }
    .volume-bar-value {
      font-size: 0.7rem;
      color: #bbb;
      min-width: 55px;
      text-align: right;
    }
    .stat-row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid #222;
      font-size: 0.8rem;
    }
    .stat-row:last-child { border-bottom: none; }
    .stat-label { color: #999; }
    .stat-value { color: #f0f0f0; font-weight: 600; }
    .stat-value.up { color: #4caf50; }
    .stat-value.down { color: #f44336; }

    /* Comparativo de cardio no card do dia: hoje vs. último treino.
       Vem antes de qualquer gráfico porque é a leitura imediata. */
    strong.cmp-now { color: #ff9800; }
    strong.cmp-prev { color: #ddd; font-weight: 600; }
    .cmp-up { color: #4caf50; font-weight: 700; }
    .cmp-down { color: #f44336; font-weight: 700; }
    .cmp-flat { color: #999; }
    .cmp-when { color: #777; font-size: 0.92em; }

    /* === Sequência (foguinho) === */
    .streak-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin: 0 14px 12px;
      padding: 10px 14px;
      background: #0d2137;
      border: 1px solid #1a3a4f;
      border-radius: 12px;
    }
    .streak-bar.hidden { display: none; }
    .streak-flame {
      font-size: 1.6rem;
      line-height: 1;
      filter: grayscale(1) opacity(0.4);
    }
    .streak-bar.on .streak-flame {
      filter: none;
      animation: flame-pulse 2s ease-in-out infinite;
    }
    @keyframes flame-pulse {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.12); }
    }
    .streak-count {
      font-size: 1.25rem;
      font-weight: 700;
      color: #00bcd4;
      line-height: 1;
    }
    .streak-bar:not(.on) .streak-count { color: #777; }
    .streak-texts { display: flex; flex-direction: column; gap: 2px; }
    .streak-label { font-size: 0.7rem; color: #999; }
    .streak-sub { font-size: 0.62rem; color: #666; }
    .streak-rest { color: #4caf50; }
    .weekly-days {
      display: flex;
      justify-content: space-around;
      margin-bottom: 16px;
    }
    .weekly-day {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .weekly-day-label { font-size: 0.65rem; color: #888; }
    .weekly-day-dot {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      color: #fff;
    }
    .weekly-day-dot.trained { background: #4caf50; }
    .weekly-day-dot.missed { background: #f44336; }
    .weekly-day-dot.rest { background: #1a3a4f; color: #666; }
    .weekly-day-dot.future { background: none; border: 1px dashed #444; color: #444; }
    .note-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .note-modal.show { display: flex; }
    .note-modal-content {
      background: #0d2137;
      border-radius: 12px;
      padding: 20px;
      width: 100%;
      max-width: 400px;
      border: 1px solid #1a3a4f;
    }
    .note-modal-content h3 {
      color: #00bcd4;
      font-size: 0.9rem;
      margin-bottom: 12px;
    }
    .note-modal-content textarea {
      width: 100%;
      height: 100px;
      background: #0d0d0d;
      border: 1px solid #1a3a4f;
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      padding: 10px;
      resize: none;
    }
    .note-modal-content textarea:focus { outline: none; border-color: #00bcd4; }
    .note-modal-btns {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    .note-modal-btns button {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .note-save-btn { background: #00bcd4; color: #000; }
    .note-cancel-btn { background: #132d42; color: #999; }
    .note-delete-btn { background: #f44336; color: #fff; }

    /* Loading overlay */
    .loading-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(13,13,13,0.92); z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 16px; transition: opacity 0.3s;
    }
    .loading-overlay.hidden { opacity: 0; pointer-events: none; }
    .loading-spinner {
      width: 44px; height: 44px; border: 3px solid #1a3a4f;
      border-top-color: #00bcd4; border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { color: #999; font-size: 0.8rem; font-weight: 500; letter-spacing: 0.5px; }
  </style>
</head>
<body>

  </div>

  <div class="header">
    <button class="logout-btn" onclick="location.href='professor.html'" style="left:14px;right:auto;">← Voltar</button>

  <div class="view-toggle">

    <button class="view-btn" onclick="switchView('weekly')">Semanal</button>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth-guard.js"></script>
<!-- Cálculos compartilhados com professor.html e evolucao.html (DAYS, datas,
     cardio, volume, 1RM, sequência). Não puxa nada da rede. -->
<script src="/metrics.js"></script>
<script>

// Mantém as abas de dia da semana coladas logo abaixo do header (nome do aluno).
// O header muda de altura quando o nome do aluno é carregado / quebra linha,
// então a altura é medida em runtime em vez de ficar chumbada no CSS.
function syncHeaderOffset() {
  const h = document.querySelector('.header');
  if (!h) return;
  document.documentElement.style.setProperty('--header-h', h.offsetHeight + 'px');
}
syncHeaderOffset();
window.addEventListener('resize', syncHeaderOffset);
if (window.ResizeObserver) {
  const _hEl = document.querySelector('.header');
  if (_hEl) new ResizeObserver(syncHeaderOffset).observe(_hEl);
}

const esc = (s) => { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; };

// =====================================================================
// As contas desta tela vivem em metrics.js (carregado no <head>): datas,
// formatação, cardio, volume, 1RM e sequência. Aqui fica só o que desenha.
// CARDIO: os minutos vêm de workout_logs.duration_minutes (coluna própria,
// criada em sql/10_add_cardio.sql) — não entram em volume nem em sets hard.
// =====================================================================

// Carregados dinamicamente do plano do aluno
let PRESCRIBED_REPS = {};
let PRESCRIBED_ORDER = {};
let studentId = null;
let planMode = 'weekly';
let planDaysPerWeek = null;

async function supaFetch(endpoint) {
  const session = (await _sb.auth.getSession()).data.session;
  if (!session) throw new Error('Sem sessão');
  const res = await fetch((window.__ENV || {}).SUPABASE_URL + '/rest/v1/' + endpoint, {
    headers: {
      'apikey': (window.__ENV || {}).SUPABASE_KEY,
      'Authorization': 'Bearer ' + session.access_token
    }
  });
  if (!res.ok) {
    const body = await res.text();
    console.error('supaFetch erro:', res.status, body);
    throw new Error('Erro ' + res.status + ': ' + body);
  }
  return res.json();
}

// =====================================================================
// SEQUÊNCIA (foguinho)
// O cálculo é computeStreak(), em metrics.js: conta apenas os DIAS DE TREINO
// PRESCRITOS; dia de descanso é ignorado (não conta e NÃO quebra); o dia de
// hoje sem registro fica pendente, porque o dia não acabou.
// A janela padrão (STREAK_WINDOW_DAYS) também vem de lá.
// =====================================================================

async function loadStreak() {
  const bar = document.getElementById('streakBar');
  const prescribed = planMode === 'cyclic'
    ? new Set(['Segunda','Terça','Quarta','Quinta','Sexta','Sábado','Domingo'])
    : prescribedDaySet(PRESCRIBED_ORDER);

  // Sem plano ativo não há como saber o que é treino e o que é descanso.
  if (prescribed.size === 0 && planMode !== 'cyclic') { bar.classList.add('hidden'); return; }
  if (planMode === 'cyclic' && !planDaysPerWeek) { bar.classList.add('hidden'); return; }

  const today = new Date();
  const windowStart = new Date(today);
  windowStart.setDate(today.getDate() - (STREAK_WINDOW_DAYS - 1));

  let rows;
  try {
    rows = await supaFetch(
      `workout_logs?student_id=eq.${studentId}` +
      `&session_date=gte.${toLocalISO(windowStart)}` +
      `&select=session_date&order=session_date.desc`
    );
  } catch (e) {
    bar.classList.add('hidden');
    return;
  }

  const trained = new Set((rows || []).map(r => r.session_date));
  
  let current, best, hitWindowEdge, todayIsRest;
  if (planMode === 'cyclic') {
    const result = computeStreakCyclic(trained, planDaysPerWeek, today);
    current = result.current;
    best = result.best;
    hitWindowEdge = false;
    todayIsRest = false;
  } else {
    const result = computeStreak(trained, prescribed, today);
    current = result.current;
    best = result.best;
    hitWindowEdge = result.hitWindowEdge;
    todayIsRest = !isTrainingDate(toLocalISO(today), prescribed);
  }

  // --- última vez que treinou ---
  const allDates = [...trained].sort();
  const lastTrained = allDates.length ? allDates[allDates.length - 1] : null;

  // --- render ---
  const todayStr = toLocalISO(today);
  const trainedToday = trained.has(todayStr);

  document.getElementById('streakCount').textContent = current + (hitWindowEdge ? '+' : '');
  bar.classList.remove('hidden');
  bar.classList.toggle('on', current > 0);

  const labelEl = document.getElementById('streakLabel');
  const subEl = document.getElementById('streakSub');

  if (current > 0) {
    labelEl.innerHTML = `treino${current > 1 ? 's' : ''} seguido${current > 1 ? 's' : ''} sem falhar`;
    const parts = [];
    if (todayIsRest) parts.push('<span class="streak-rest">hoje é descanso — sequência preservada</span>');
    else if (!trainedToday) parts.push('hoje ainda conta se treinar');
    if (best > current) parts.push(`recorde: ${best}`);
    subEl.innerHTML = parts.join(' · ');
  } else {
    labelEl.textContent = 'Sequência zerada';
    const quando = lastTrained
      ? new Date(lastTrained + 'T12:00:00').toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' })
      : null;
    subEl.innerHTML = quando
      ? `último treino em ${quando}${best > 0 ? ` · recorde: ${best}` : ''}`
      : 'nenhum treino registrado ainda';
  }
}

async function loadDay(day, date) {
  const container = document.getElementById('day-' + day);
  container.innerHTML = '<div class="loading">Carregando...</div>';

  try {
    // Buscar logs do dia, sessão do dia e o cardio anterior em paralelo.
    // O cardio anterior é o que permite responder "melhorou ou piorou?" sem
    // abrir gráfico: 1 query só, filtrando quem tem minutos preenchidos.
    const [data, sessionData, prevCardio] = await Promise.all([
      supaFetch(`workout_logs?student_id=eq.${studentId}&session_date=eq.${date}&order=set_number.asc`),
      supaFetch(`workout_sessions?student_id=eq.${studentId}&started_at=gte.${date}T00:00:00${TZ}&started_at=lte.${date}T23:59:59${TZ}&duration_seconds=not.is.null&order=started_at.desc&limit=1`),
      supaFetch(`workout_logs?student_id=eq.${studentId}&session_date=lt.${date}&duration_minutes=not.is.null&select=session_date,exercise_name,set_type,duration_minutes&order=session_date.desc&limit=500`)
    ]);

    if ((!data || data.length === 0) && (!sessionData || sessionData.length === 0)) {
      container.innerHTML = '<div class="no-data">Sem dados registrados nesta data</div>';
      return;
    }

    const exercises = {};
    (data || []).forEach(r => {
      if (!exercises[r.exercise_name]) exercises[r.exercise_name] = [];
      exercises[r.exercise_name].push(r);
    });

    // Ordenar pela ordem do treino prescrito
    const dayOrder = PRESCRIBED_ORDER[day] || [];
    const orderedNames = [];
    dayOrder.forEach(name => {
      if (exercises[name]) orderedNames.push(name);
    });
    Object.keys(exercises).forEach(name => {
      if (!orderedNames.includes(name)) orderedNames.push(name);
    });

    const totalExercises = orderedNames.length;
    const hardSets = (data || []).filter(r => r.set_type === 'hard');
    const dayVolume = hardSets.reduce((sum, r) => sum + (Number(r.weight) || 0) * (Number(r.reps) || 0), 0);
    // Cardio fica fora da contagem de sets de musculação: são coisas diferentes
    // e misturar faria "8 sets" significar 5 de força + 3 de bike.
    const strengthSets = (data || []).filter(r => !isCardio(r.set_type));
    const cardioMinutes = sumCardioMinutes(data);

    // Tempo de treino
    const session = sessionData && sessionData.length > 0 ? sessionData[0] : null;
    const durationText = session ? ` · <strong>⏱ ${formatDurationHM(session.duration_seconds)}</strong>` : '';

    // Horário de início (dado que já existia no banco e nunca era mostrado)
    let startedText = '';
    if (session && session.started_at) {
      const hora = new Date(session.started_at).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
      startedText = ` · início <strong>${hora}</strong>`;
    }

    // Densidade: volume por minuto de treino. Separa "treinou mais" de "treinou melhor".
    let densityText = '';
    if (session && session.duration_seconds > 0 && dayVolume > 0) {
      const kgPorMin = dayVolume / (session.duration_seconds / 60);
      densityText = ` · <strong>${kgPorMin.toFixed(1)} kg/min</strong>`;
    }

    let html = `<div class="summary"><strong>${totalExercises}</strong> exercícios · <strong>${hardSets.length}</strong> sets hard de ${strengthSets.length}${durationText}${startedText}</div>`;
    // Rótulo do "agora": 'hoje' só quando a data selecionada é realmente hoje —
    // o professor navega em datas passadas e ler "hoje 50min" ali seria mentira.
    const cmpLabel = date === toLocalISO(new Date()) ? 'hoje' : formatDayMonth(date);
    if (cardioMinutes > 0) {
      const cmpDia = cardioComparison(cardioMinutes, previousCardioSession(prevCardio, date), cmpLabel);
      html += `<div class="summary" style="margin-top:-6px;">🏃 Cardio: ${cmpDia.html}</div>`;
    }
    if (dayVolume > 0) {
      html += `<div class="summary" style="margin-top:-6px;">Volume: <strong>${Math.round(dayVolume).toLocaleString('pt-BR')} kg</strong>${densityText}</div>`;
    }

    orderedNames.forEach((name, exIdx) => {
      const sets = exercises[name];
      const chartId = `chart-${day}-${date}-${exIdx}`;
      const cardioMinEx = sumCardioMinutes(sets);
      const soCardio = sets.length > 0 && sets.every(s => isCardio(s.set_type));
      const temHard = sets.some(s => s.set_type === 'hard');
      // Qual gráfico abrir: o de força só plota sets hard, então em exercício
      // sem nenhum hard ele apareceria vazio — nesse caso o de cardio informa mais.
      const chartCardio = cardioMinEx > 0 && !temHard;

      // Melhor set do dia por 1RM estimado (não pelo peso bruto: 100kg×5 vale mais
      // que 105kg×1, e o peso máximo sozinho não mostra isso)
      let bestSet = null, bestE1rm = 0;
      sets.forEach(s => {
        if (s.set_type !== 'hard') return;
        const est = e1rm(s.weight, s.reps);
        if (est > bestE1rm) { bestE1rm = est; bestSet = s; }
      });

      html += `<div class="exercise-card">`;
      html += `<div class="exercise-name">${esc(name)}</div>`;
      // Minutos de cardio DESTE exercício, comparados com a última vez que o
      // aluno fez ESTE exercício. Aparece também em exercício misto, senão o
      // 🏃 do resumo do dia não fecha com a soma dos cards.
      if (cardioMinEx > 0) {
        const prevEx = previousCardioSession(
          (prevCardio || []).filter(r => r.exercise_name === name), date);
        const cmpEx = cardioComparison(cardioMinEx, prevEx, cmpLabel);
        html += `<div style="font-size:0.68rem;color:#888;margin-bottom:8px;line-height:1.5;">`;
        html += `🏃 ${soCardio ? 'Tempo' : 'Cardio neste exercício'}: ${cmpEx.html}`;
        html += `</div>`;
      }
      if (bestSet) {
        html += `<div style="font-size:0.68rem;color:#888;margin-bottom:8px;">`;
        html += `Melhor set: <strong style="color:#f0f0f0;">${bestSet.weight} kg × ${bestSet.reps}</strong>`;
        html += ` · 1RM est. <strong style="color:#4caf50;">${Math.round(bestE1rm)} kg</strong>`;
        html += `</div>`;
      }
      html += `<div style="display:flex;gap:8px;margin-bottom:10px;">`;
      html += `<button class="chart-btn" onclick="toggleChart('${chartId}', '${esc(name).replace(/'/g, "\\'")}', ${chartCardio})">📈 ${chartCardio ? 'Evolução do cardio' : 'Evolução'}</button>`;
      html += `</div>`;
      const legend = chartCardio
        ? `<div class="chart-legend"><span><span class="dot" style="background:#ff9800"></span> Minutos de cardio por treino</span></div>`
        : `<div class="chart-legend"><span><span class="dot" style="background:#00bcd4"></span> Volume (kg×reps)</span><span><span class="dot" style="background:#4caf50"></span> 1RM estimado (kg)</span></div>`;
      html += `<div class="chart-container" id="${chartId}"><canvas></canvas>${legend}<div class="chart-info"></div></div>`;
      html += `<div class="set-row"><span class="set-label">Set</span><span class="set-label" style="text-align:center">${soCardio ? 'Tempo' : 'Carga'}</span><span class="set-label" style="text-align:center">${soCardio ? '' : 'Reps'}</span></div>`;
      sets.forEach(s => {
        const prescribedList = PRESCRIBED_REPS[name] || [];
        const prescribed = prescribedList[s.set_number - 1] || '';
        html += `<div class="set-row">`;
        html += `<span class="set-label">${esc(s.set_type)} ${s.set_number}${prescribed ? ' (' + esc(prescribed) + ')' : ''}</span>`;
        if (isCardio(s.set_type)) {
          const min = Number(s.duration_minutes) > 0 ? Number(s.duration_minutes) : null;
          // ⏱ na frente porque em exercício misto a coluna se chama "Carga"
          html += `<span class="set-value${min ? '' : ' empty'}">${min ? '⏱ ' + min + ' min' : '-'}</span>`;
          html += `<span class="set-value"></span>`;
        } else {
          const weight = s.weight ? s.weight + ' kg' : '-';
          const reps = s.notes ? s.notes : (s.reps ? s.reps + ' reps' : '-');
          html += `<span class="set-value${!s.weight ? ' empty' : ''}">${weight}</span>`;
          html += `<span class="set-value${!s.reps ? ' empty' : ''}">${reps}</span>`;
        }
        html += `</div>`;
      });
      html += `</div>`;
    });

    container.innerHTML = html;
  } catch (e) {
    container.innerHTML = `<div class="no-data">Erro ao carregar: ${e.message}</div>`;
  }
}

const chartInstances = {};

function showLoading() { document.getElementById('loadingOverlay').classList.remove('hidden'); }
function hideLoading() { document.getElementById('loadingOverlay').classList.add('hidden'); }

// Janela do gráfico de evolução: 12 semanas (CHART_WINDOW_DAYS/WEEKS em
// metrics.js). Antes a query baixava o histórico INTEIRO do exercício, sem
// limite — o que deixava o eixo X ilegível (50+ rótulos num gráfico de 200px)
// e crescia para sempre.

async function toggleChart(chartId, exerciseName, isCardioExercise) {
  const container = document.getElementById(chartId);
  if (container.classList.contains('show')) {
    container.classList.remove('show');
    return;
  }
  container.classList.add('show');

  if (chartInstances[chartId]) return; // já renderizado

  // Escreve mensagens SEM destruir o <canvas> (antes usava container.innerHTML,
  // o que apagava o canvas e travava qualquer nova tentativa de abrir o gráfico).
  const infoEl = container.querySelector('.chart-info');
  const canvas = container.querySelector('canvas');
  const setInfo = (html) => { if (infoEl) infoEl.innerHTML = html; };

  if (isCardioExercise) {
    await renderCardioChart(chartId, exerciseName, canvas, setInfo);
    return;
  }

  try {
    const from = new Date();
    from.setDate(from.getDate() - (CHART_WINDOW_DAYS - 1));

    const data = await supaFetch(
      `workout_logs?student_id=eq.${studentId}` +
      `&exercise_name=eq.${encodeURIComponent(exerciseName)}` +
      `&set_type=eq.hard` +
      `&session_date=gte.${toLocalISO(from)}` +
      `&select=session_date,weight,reps` +
      `&order=session_date.asc&limit=400`
    );

    if (!data || data.length === 0) {
      canvas.style.display = 'none';
      setInfo('<div class="no-data">Sem registros nas últimas 12 semanas</div>');
      return;
    }
    canvas.style.display = '';

    // Agrupar por data do treino (session_date, não created_at: created_at é UTC e
    // jogava treinos da noite para o dia seguinte)
    const byDate = {};
    data.forEach(r => {
      if (!byDate[r.session_date]) byDate[r.session_date] = [];
      byDate[r.session_date].push(r);
    });

    const labels = [];
    const volumeData = [];
    const e1rmData = [];
    let bestE1rm = 0, bestSet = null, bestDate = null;
    let maxWeightWindow = 0;

    Object.keys(byDate).sort().forEach(date => {
      const sets = byDate[date];
      labels.push(new Date(date + 'T12:00:00').toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' }));
      let volume = 0;
      let dayBestE1rm = 0;
      sets.forEach(s => {
        const w = Number(s.weight) || 0;
        const r = Number(s.reps) || 0;
        volume += w * r;
        if (w > maxWeightWindow) maxWeightWindow = w;
        const est = e1rm(w, r);
        if (est > dayBestE1rm) dayBestE1rm = est;
        if (est > bestE1rm) { bestE1rm = est; bestSet = s; bestDate = date; }
      });
      volumeData.push(volume);
      e1rmData.push(Math.round(dayBestE1rm));
    });

    const ctx = canvas.getContext('2d');

    chartInstances[chartId] = new Chart(ctx, {
      type: 'line',
      data: {
        labels: labels,
        datasets: [
          {
            label: 'Volume (kg×reps)',
            data: volumeData,
            borderColor: '#00bcd4',
            backgroundColor: 'rgba(245, 197, 24, 0.1)',
            borderWidth: 2,
            tension: 0.3,
            fill: true,
            pointRadius: 2,
            yAxisID: 'y'
          },
          {
            label: '1RM estimado (kg)',
            data: e1rmData,
            borderColor: '#4caf50',
            backgroundColor: 'rgba(76, 175, 80, 0.1)',
            borderWidth: 2,
            tension: 0.3,
            fill: false,
            pointRadius: 2,
            yAxisID: 'y1'
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: '#0d2137',
            titleColor: '#00bcd4',
            bodyColor: '#f0f0f0',
            borderColor: '#1a3a4f',
            borderWidth: 1
          }
        },
        scales: {
          x: {
            ticks: { color: '#666', font: { size: 9 }, maxRotation: 45 },
            grid: { color: '#222' }
          },
          y: {
            position: 'left',
            ticks: { color: '#00bcd4', font: { size: 9 } },
            grid: { color: '#222' },
            title: { display: false }
          },
          y1: {
            position: 'right',
            ticks: { color: '#4caf50', font: { size: 9 } },
            grid: { display: false },
            title: { display: false }
          }
        }
      }
    });

    // --- Melhor set da janela + progressão ---
    const dates = Object.keys(byDate).sort();
    let infoHtml = `<div class="chart-caption">${FORCA_CAPTION}</div>`;
    if (bestSet) {
      const quando = new Date(bestDate + 'T12:00:00').toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
      // Rótulo honesto: é o melhor das últimas 12 semanas, não recorde histórico —
      // a query é limitada à janela de propósito.
      infoHtml += `<div class="stat-row"><span class="stat-label">🏆 Melhor (12 sem.)</span>`;
      infoHtml += `<span class="stat-value">${bestSet.weight} kg × ${bestSet.reps} · 1RM ${Math.round(bestE1rm)} kg <span style="color:#666;font-weight:400;">(${quando})</span></span></div>`;
      infoHtml += `<div class="stat-row"><span class="stat-label">Carga máx (12 sem.)</span><span class="stat-value">${maxWeightWindow} kg</span></div>`;
    }
    if (e1rmData.length >= 2) {
      const ini = e1rmData[0], fim = e1rmData[e1rmData.length - 1];
      const diff = ini > 0 ? Math.round(((fim - ini) / ini) * 100) : 0;
      const cls = diff > 0 ? 'up' : diff < 0 ? 'down' : '';
      const arrow = diff > 0 ? '↑' : diff < 0 ? '↓' : '=';
      infoHtml += `<div class="stat-row"><span class="stat-label">1ª → última sessão (1RM est.)</span>`;
      infoHtml += `<span class="stat-value ${cls}">${ini} → ${fim} kg ${arrow} ${Math.abs(diff)}%</span></div>`;
    }

    // --- Frequência: janela FIXA de 12 semanas terminando nesta semana ---
    // Antes o total de semanas vinha da primeira até a última sessão registrada, então
    // quem fez o exercício uma vez e parou aparecia como "1/1 semanas (100%)".
    const weekStartOf = (d) => {
      const x = new Date(d);
      const wd = x.getDay();
      x.setDate(x.getDate() - (wd === 0 ? 6 : wd - 1));
      x.setHours(12, 0, 0, 0);
      return toLocalISO(x);
    };
    const trainedWeeks = new Set(dates.map(ds => weekStartOf(new Date(ds + 'T12:00:00'))));

    const weeks = [];
    const cursor = new Date();
    for (let i = 0; i < CHART_WINDOW_WEEKS; i++) {
      const wk = new Date(cursor);
      wk.setDate(cursor.getDate() - i * 7);
      weeks.push(weekStartOf(wk));
    }
    weeks.reverse();

    const attended = weeks.filter(w => trainedWeeks.has(w)).length;
    const percent = Math.round((attended / CHART_WINDOW_WEEKS) * 100);
    const dotsHtml = weeks.map((w, i) => {
      const hit = trainedWeeks.has(w);
      const rotulo = new Date(w + 'T12:00:00').toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
      return `<span class="freq-dot${hit ? '' : ' missed'}" title="Semana de ${rotulo}"></span>`;
    }).join('');

    infoHtml += `<div class="frequency">Feito em <strong>${attended}/${CHART_WINDOW_WEEKS} semanas (${percent}%)</strong>`;
    infoHtml += `<div class="freq-dots">${dotsHtml}</div>`;
    infoHtml += `<div style="margin-top:4px;font-size:0.65rem;">🟢 fez &nbsp; 🔴 não fez &nbsp;·&nbsp; mais antiga → esta semana</div></div>`;

    setInfo(infoHtml);
  } catch (e) {
    if (canvas) canvas.style.display = 'none';
    setInfo(`<div class="no-data">Erro: ${e.message}</div>`);
  }
}

// Evolução de exercício de cardio: minutos por sessão, mesma janela de 12
// semanas dos gráficos de força. Volume e 1RM não existem aqui — o que evolui
// é tempo (e, quando o professor quiser, intensidade via nota).
async function renderCardioChart(chartId, exerciseName, canvas, setInfo) {
  try {
    const from = new Date();
    from.setDate(from.getDate() - (CHART_WINDOW_DAYS - 1));

    const data = await supaFetch(
      `workout_logs?student_id=eq.${studentId}` +
      `&exercise_name=eq.${encodeURIComponent(exerciseName)}` +
      `&set_type=eq.cardio` +
      `&duration_minutes=not.is.null` +
      `&session_date=gte.${toLocalISO(from)}` +
      `&select=session_date,set_type,duration_minutes` +
      `&order=session_date.asc&limit=400`
    );

    if (!data || data.length === 0) {
      canvas.style.display = 'none';
      setInfo(cardioChartInfo([], []).html);
      return;
    }

    // Mesmo dia pode ter mais de um set de cardio: soma.
    const byDate = {};
    data.forEach(r => {
      if (!byDate[r.session_date]) byDate[r.session_date] = [];
      byDate[r.session_date].push(r);
    });

    const dates = Object.keys(byDate).sort();
    const labels = dates.map(d => new Date(d + 'T12:00:00').toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' }));
    const minutesData = dates.map(d => sumCardioMinutes(byDate[d]));

    const info = cardioChartInfo(dates, minutesData);
    setInfo(info.html);
    if (!info.showChart) { canvas.style.display = 'none'; return; }
    canvas.style.display = '';

    chartInstances[chartId] = new Chart(canvas.getContext('2d'), {
      type: 'bar',
      data: {
        labels,
        datasets: [{
          label: 'Minutos',
          data: minutesData,
          backgroundColor: 'rgba(255, 152, 0, 0.55)',
          borderColor: '#ff9800',
          borderWidth: 1
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: '#0d2137', titleColor: '#ff9800', bodyColor: '#f0f0f0',
            borderColor: '#1a3a4f', borderWidth: 1
          }
        },
        scales: {
          x: { ticks: { color: '#666', font: { size: 9 }, maxRotation: 45 }, grid: { color: '#222' } },
          y: { beginAtZero: true, ticks: { color: '#ff9800', font: { size: 9 } }, grid: { color: '#222' } }
        }
      }
    });
  } catch (e) {
    if (canvas) canvas.style.display = 'none';
    setInfo(`<div class="no-data">Erro: ${e.message}</div>`);
  }
}

// === WEEKLY ===
// getWeekRange(offset) vem de metrics.js (semana de segunda a domingo).
let currentWeekOffset = 0;

function navWeek(dir) {
  currentWeekOffset += dir;
  loadWeekly();
}

async function loadWeekly() {
  const { start, end } = getWeekRange(currentWeekOffset);
  const startStr = toLocalISO(start);
  const endStr = toLocalISO(end);

  document.getElementById('weekLabel').textContent =
    start.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' }) + ' - ' +
    end.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' });

  const container = document.getElementById('weeklyContent');
  container.innerHTML = '<div class="loading">Carregando...</div>';

  try {
    // Semana anterior (para o comparativo)
    const prevStart = new Date(start); prevStart.setDate(prevStart.getDate() - 7);
    const prevEnd   = new Date(end);   prevEnd.setDate(prevEnd.getDate() - 7);
    const prevStartStr = toLocalISO(prevStart);
    const prevEndStr   = toLocalISO(prevEnd);

    // Tudo em paralelo. Antes a query da semana anterior ficava com um await solto
    // depois do render, custando uma ida extra ao servidor em série.
    const [data, sessionsData, prevData, prevSessions] = await Promise.all([
      supaFetch(`workout_logs?student_id=eq.${studentId}&session_date=gte.${startStr}&session_date=lte.${endStr}&order=session_date.asc`),
      supaFetch(`workout_sessions?student_id=eq.${studentId}&started_at=gte.${startStr}T00:00:00${TZ}&started_at=lte.${endStr}T23:59:59${TZ}&duration_seconds=not.is.null&order=started_at.asc`),
      supaFetch(`workout_logs?student_id=eq.${studentId}&session_date=gte.${prevStartStr}&session_date=lte.${prevEndStr}&select=session_date,set_type,weight,reps,duration_minutes`),
      supaFetch(`workout_sessions?student_id=eq.${studentId}&started_at=gte.${prevStartStr}T00:00:00${TZ}&started_at=lte.${prevEndStr}T23:59:59${TZ}&duration_seconds=not.is.null&select=duration_seconds`)
    ]);

    // Mapa sessões por data
    const sessionsByDate = {};
    let totalSessionSeconds = 0;
    if (sessionsData) {
      sessionsData.forEach(s => {
        const d = toLocalISO(new Date(s.started_at));
        if (!sessionsByDate[d]) sessionsByDate[d] = 0;
        sessionsByDate[d] += s.duration_seconds;
        totalSessionSeconds += s.duration_seconds;
      });
    }

    // Agrupar por dia
    const byDay = {};
    const dayNames = ['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
    for (let i = 0; i < 7; i++) {
      const d = new Date(start);
      d.setDate(start.getDate() + i);
      byDay[toLocalISO(d)] = [];
    }
    if (data) {
      data.forEach(r => {
        if (byDay[r.session_date]) byDay[r.session_date].push(r);
      });
    }

    // Presença semanal
    const prescribed = planMode === 'cyclic'
      ? new Set(['Segunda','Terça','Quarta','Quinta','Sexta','Sábado','Domingo'])
      : prescribedDaySet(PRESCRIBED_ORDER);
    const cardioMinByDate = cardioByDate(data);
    let html = '<div class="weekly-days">';
    const dates = Object.keys(byDay).sort();
    const today = toLocalISO(new Date());
    let totalVolume = 0;
    const volumeByDay = [];
    const timeByDay = [];
    const cardioDay = [];

    dates.forEach((date, i) => {
      const records = byDay[date];
      // Dia de treino = dia prescrito no plano ativo (antes: "tudo que não é domingo")
      const isRest = !isTrainingDate(date, prescribed);
      const isFuture = date > today;
      const trained = records.length > 0;

      let dayVolume = 0;
      records.forEach(r => {
        if (r.set_type === 'hard' && r.weight && r.reps) {
          dayVolume += r.weight * r.reps;
        }
      });
      totalVolume += dayVolume;
      volumeByDay.push({ label: dayNames[i], volume: dayVolume, trained, isRest, isFuture });
      timeByDay.push({ label: dayNames[i], seconds: sessionsByDate[date] || 0, isRest, isFuture });
      cardioDay.push({ label: dayNames[i], minutes: cardioMinByDate[date] || 0, isRest, isFuture });

      let dotClass = 'rest', simbolo = '–';
      if (trained)        { dotClass = 'trained'; simbolo = '✓'; }
      else if (isFuture)  { dotClass = 'future';  simbolo = '?'; }
      else if (isRest)    { dotClass = 'rest';    simbolo = '–'; }
      else                { dotClass = 'missed';  simbolo = '✗'; }

      html += `<div class="weekly-day"><span class="weekly-day-label">${dayNames[i]}</span>`;
      html += `<span class="weekly-day-dot ${dotClass}">${simbolo}</span></div>`;
    });
    html += '</div>';

    // Frequência sobre os dias PRESCRITOS que já passaram
    const trainingDays = volumeByDay.filter(d => !d.isRest && !d.isFuture);
    const attended = trainingDays.filter(d => d.trained).length;
    const totalDays = trainingDays.length;
    const percent = totalDays > 0 ? Math.round((attended / totalDays) * 100) : 0;
    const extras = prescribed.size > 0 ? volumeByDay.filter(d => d.isRest && d.trained).length : 0;

    html += `<div class="resume-card"><h3>Frequência</h3>`;
    if (totalDays > 0) {
      html += `<div class="stat-row"><span class="stat-label">Presença</span><span class="stat-value">${attended}/${totalDays} dias prescritos (${percent}%)</span></div>`;
    } else {
      html += `<div class="stat-row"><span class="stat-label">Presença</span><span class="stat-value">${attended} treino${attended !== 1 ? 's' : ''}</span></div>`;
    }
    if (extras > 0) {
      html += `<div class="stat-row"><span class="stat-label">Treinos extras</span><span class="stat-value up">+${extras} em dia de descanso</span></div>`;
    }
    if (prescribed.size > 0) {
      html += `<div style="font-size:0.62rem;color:#666;margin-top:6px;">Plano: ${[...prescribed].join(', ')}</div>`;
    } else {
      html += `<div style="font-size:0.62rem;color:#00bcd4;margin-top:6px;">Aluno sem treino ativo — não é possível calcular faltas.</div>`;
    }
    html += `</div>`;

    // Volume por dia (barras)
    const maxVolume = Math.max(...volumeByDay.map(d => d.volume), 1);
    html += `<div class="resume-card"><h3>Volume por dia (hard sets)</h3>`;
    volumeByDay.forEach(d => {
      if (d.isRest && !d.trained) return;
      const pct = (d.volume / maxVolume) * 100;
      const color = d.trained ? '#00bcd4' : '#f44336';
      html += `<div class="volume-bar-row">`;
      html += `<span class="volume-bar-label">${d.label}</span>`;
      html += `<div class="volume-bar-track"><div class="volume-bar-fill" style="width:${pct}%;background:${color}"></div></div>`;
      html += `<span class="volume-bar-value">${d.volume > 0 ? d.volume.toLocaleString('pt-BR') + ' kg' : (d.isFuture ? '-' : 'faltou')}</span>`;
      html += `</div>`;
    });
    html += `</div>`;

    // Tempo de treino por dia
    const maxTime = Math.max(...timeByDay.map(d => d.seconds), 1);
    html += `<div class="resume-card"><h3>⏱ Tempo de treino</h3>`;
    html += `<div class="stat-row" style="margin-bottom:10px;"><span class="stat-label">Total da semana</span><span class="stat-value">${formatDurationHM(totalSessionSeconds)}</span></div>`;
    timeByDay.forEach(d => {
      if (d.isRest && d.seconds === 0) return;
      const pct = (d.seconds / maxTime) * 100;
      const color = d.seconds > 0 ? '#4caf50' : (d.isFuture ? '#1a3a4f' : '#f44336');
      html += `<div class="volume-bar-row">`;
      html += `<span class="volume-bar-label">${d.label}</span>`;
      html += `<div class="volume-bar-track"><div class="volume-bar-fill" style="width:${pct}%;background:${color}"></div></div>`;
      html += `<span class="volume-bar-value">${d.seconds > 0 ? formatDurationHM(d.seconds) : (d.isFuture ? '-' : '—')}</span>`;
      html += `</div>`;
    });
    html += `</div>`;

    // Cardio da semana. Só aparece quando existe cardio registrado — card vazio
    // em aluno que não faz cardio é ruído.
    const totalCardioMin = cardioDay.reduce((sum, d) => sum + d.minutes, 0);
    const cardioDias = cardioDay.filter(d => d.minutes > 0).length;
    if (totalCardioMin > 0) {
      const maxCardio = Math.max(...cardioDay.map(d => d.minutes), 1);
      html += `<div class="resume-card"><h3>🏃 Cardio</h3>`;
      html += `<div class="stat-row" style="margin-bottom:10px;"><span class="stat-label">Total da semana</span><span class="stat-value">${formatMinutes(totalCardioMin)}</span></div>`;
      html += `<div class="stat-row" style="margin-bottom:10px;"><span class="stat-label">Dias com cardio</span><span class="stat-value">${cardioDias} dia${cardioDias !== 1 ? 's' : ''} · média ${formatMinutes(totalCardioMin / cardioDias)}</span></div>`;
      cardioDay.forEach(d => {
        if (d.minutes === 0) return;
        const pct = (d.minutes / maxCardio) * 100;
        html += `<div class="volume-bar-row">`;
        html += `<span class="volume-bar-label">${d.label}</span>`;
        html += `<div class="volume-bar-track"><div class="volume-bar-fill" style="width:${pct}%;background:#ff9800"></div></div>`;
        html += `<span class="volume-bar-value">${formatMinutes(d.minutes)}</span>`;
        html += `</div>`;
      });
      html += `</div>`;
    }

    // Eficiência: densidade e média por sessão (números que já existiam, só não eram cruzados)
    const sessoesFeitas = timeByDay.filter(d => d.seconds > 0).length;
    if (totalSessionSeconds > 0 && totalVolume > 0) {
      const densidade = totalVolume / (totalSessionSeconds / 60);
      const mediaSessao = totalSessionSeconds / Math.max(sessoesFeitas, 1);
      html += `<div class="resume-card"><h3>Eficiência</h3>`;
      html += `<div class="stat-row"><span class="stat-label">Densidade</span><span class="stat-value">${densidade.toFixed(1)} kg/min</span></div>`;
      html += `<div class="stat-row"><span class="stat-label">Duração média</span><span class="stat-value">${formatDurationHM(Math.round(mediaSessao))} / treino</span></div>`;
      html += `<div class="stat-row"><span class="stat-label">Volume médio</span><span class="stat-value">${Math.round(totalVolume / Math.max(sessoesFeitas, 1)).toLocaleString('pt-BR')} kg / treino</span></div>`;
      html += `</div>`;
    }

    // Comparativo com semana anterior
    let prevVolume = 0;
    const prevDays = new Set();
    if (prevData) {
      prevData.forEach(r => {
        if (r.set_type === 'hard' && r.weight && r.reps) prevVolume += r.weight * r.reps;
        prevDays.add(r.session_date);
      });
    }
    const prevAttended = prevDays.size;
    const prevCardioMin = sumCardioMinutes(prevData);
    let prevSeconds = 0;
    if (prevSessions) prevSessions.forEach(s => { prevSeconds += s.duration_seconds; });

    const volumeDiff = prevVolume > 0 ? Math.round(((totalVolume - prevVolume) / prevVolume) * 100) : 0;
    const volumeClass = volumeDiff > 0 ? 'up' : volumeDiff < 0 ? 'down' : '';
    const volumeArrow = volumeDiff > 0 ? '↑' : volumeDiff < 0 ? '↓' : '=';
    const timeDiff = prevSeconds > 0 ? Math.round(((totalSessionSeconds - prevSeconds) / prevSeconds) * 100) : 0;
    const timeClass = timeDiff > 0 ? 'up' : timeDiff < 0 ? 'down' : '';
    const timeArrow = timeDiff > 0 ? '↑' : timeDiff < 0 ? '↓' : '=';
    const cardioDiff = prevCardioMin > 0 ? Math.round(((totalCardioMin - prevCardioMin) / prevCardioMin) * 100) : 0;
    const cardioClass = cardioDiff > 0 ? 'up' : cardioDiff < 0 ? 'down' : '';
    const cardioArrow = cardioDiff > 0 ? '↑' : cardioDiff < 0 ? '↓' : '=';

    html += `<div class="resume-card"><h3>vs. Semana anterior</h3>`;
    html += `<div class="stat-row"><span class="stat-label">Volume total</span><span class="stat-value ${volumeClass}">${totalVolume.toLocaleString('pt-BR')} kg ${volumeArrow} ${Math.abs(volumeDiff)}%</span></div>`;
    html += `<div class="stat-row"><span class="stat-label">Frequência</span><span class="stat-value">${attended} vs ${prevAttended} dias</span></div>`;
    html += `<div class="stat-row"><span class="stat-label">⏱ Tempo</span><span class="stat-value ${timeClass}">${formatDurationHM(totalSessionSeconds)} ${timeArrow} ${Math.abs(timeDiff)}%</span></div>`;
    if (totalCardioMin > 0 || prevCardioMin > 0) {
      html += `<div class="stat-row"><span class="stat-label">🏃 Cardio</span><span class="stat-value ${cardioClass}">${formatMinutes(totalCardioMin)} vs ${formatMinutes(prevCardioMin)} ${cardioArrow} ${Math.abs(cardioDiff)}%</span></div>`;
    }
    html += `</div>`;

    container.innerHTML = html;
  } catch (e) {
    container.innerHTML = `<div class="no-data">Erro: ${e.message}</div>`;
  }
}

// === MONTHLY ===
let currentMonthOffset = 0;

function navMonth(dir) {
  currentMonthOffset += dir;
  loadMonthly();
}

async function loadMonthly() {
  const now = new Date();
  const targetMonth = new Date(now.getFullYear(), now.getMonth() + currentMonthOffset, 1);
  const year = targetMonth.getFullYear();
  const month = targetMonth.getMonth();
  const firstDay = new Date(year, month, 1);
  const lastDay = new Date(year, month + 1, 0);

  const monthNames = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  document.getElementById('monthLabel').textContent = `${monthNames[month]} ${year}`;

  const container = document.getElementById('monthlyContent');
  container.innerHTML = '<div class="loading">Carregando...</div>';

  try {
    const startStr = toLocalISO(firstDay);
    const endStr = toLocalISO(lastDay);

    // Mês anterior (comparativo)
    const prevMonth = new Date(year, month - 1, 1);
    const prevLastDay = new Date(year, month, 0);
    const prevStartStr = toLocalISO(prevMonth);
    const prevEndStr = toLocalISO(prevLastDay);

    // Tudo em paralelo, incluindo o comparativo (antes era um await em série no final)
    const [data, sessionsData, prevData, prevSessions] = await Promise.all([
      supaFetch(`workout_logs?student_id=eq.${studentId}&session_date=gte.${startStr}&session_date=lte.${endStr}&order=session_date.asc`),
      supaFetch(`workout_sessions?student_id=eq.${studentId}&started_at=gte.${startStr}T00:00:00${TZ}&started_at=lte.${endStr}T23:59:59${TZ}&duration_seconds=not.is.null&order=started_at.asc`),
      supaFetch(`workout_logs?student_id=eq.${studentId}&session_date=gte.${prevStartStr}&session_date=lte.${prevEndStr}&select=session_date,set_type,weight,reps,duration_minutes`),
      supaFetch(`workout_sessions?student_id=eq.${studentId}&started_at=gte.${prevStartStr}T00:00:00${TZ}&started_at=lte.${prevEndStr}T23:59:59${TZ}&duration_seconds=not.is.null&select=duration_seconds`)
    ]);

    // Total de tempo no mês
    let totalMonthSeconds = 0;
    const sessionDays = new Set();
    if (sessionsData) {
      sessionsData.forEach(s => {
        totalMonthSeconds += s.duration_seconds;
        sessionDays.add(toLocalISO(new Date(s.started_at)));
      });
    }

    // Dias com registro + volume por faixa de dias
    const trainedDates = new Set();
    const volumeByWeek = {};
    const cardioByWeek = {};
    const cardioDates = new Set();
    let totalCardioMin = 0;
    const today = toLocalISO(new Date());

    if (data) {
      data.forEach(r => {
        trainedDates.add(r.session_date);
        // Faixa de 7 dias dentro do mês (não é semana de calendário — ver rótulos abaixo)
        const d = new Date(r.session_date + 'T12:00:00');
        const weekNum = Math.ceil(d.getDate() / 7);
        if (!volumeByWeek[weekNum]) volumeByWeek[weekNum] = 0;
        if (r.set_type === 'hard' && r.weight && r.reps) {
          volumeByWeek[weekNum] += r.weight * r.reps;
        }
        const cardioMin = sumCardioMinutes([r]);
        if (cardioMin > 0) {
          cardioByWeek[weekNum] = (cardioByWeek[weekNum] || 0) + cardioMin;
          cardioDates.add(r.session_date);
          totalCardioMin += cardioMin;
        }
      });
    }

    const prescribed = planMode === 'cyclic'
      ? new Set(['Segunda','Terça','Quarta','Quinta','Sexta','Sábado','Domingo'])
      : prescribedDaySet(PRESCRIBED_ORDER);

    // Calendário
    let html = '<div class="resume-card"><h3>Calendário de presença</h3>';
    html += '<div class="presence-calendar">';
    const dayHeaders = ['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
    dayHeaders.forEach(d => { html += `<span class="cal-header">${d}</span>`; });

    // Offset para começar na segunda
    let startOffset = firstDay.getDay() - 1;
    if (startOffset < 0) startOffset = 6;
    for (let i = 0; i < startOffset; i++) {
      html += '<span class="cal-day"></span>';
    }

    let totalTrainingDays = 0;
    let totalAttended = 0;
    let extras = 0;

    for (let day = 1; day <= lastDay.getDate(); day++) {
      const date = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
      const isRest = !isTrainingDate(date, prescribed);
      const isFuture = date > today;
      const trained = trainedDates.has(date);

      // Dia de treino = dia prescrito no plano (antes: qualquer dia que não fosse domingo,
      // o que gerava ~8 faltas por mês para um aluno de 4x/semana)
      let cls;
      if (trained) {
        cls = 'trained';
        if (isRest && prescribed.size > 0) extras++;
        else if (!isRest) { totalAttended++; totalTrainingDays++; }
      } else if (isFuture) {
        cls = 'future';
      } else if (isRest) {
        cls = 'rest';
      } else {
        cls = 'missed';
        totalTrainingDays++;
      }

      html += `<span class="cal-day ${cls}">${day}</span>`;
    }
    html += '</div>';

    const freqPercent = totalTrainingDays > 0 ? Math.round((totalAttended / totalTrainingDays) * 100) : 0;
    if (totalTrainingDays > 0) {
      html += `<div class="stat-row"><span class="stat-label">Frequência</span><span class="stat-value">${totalAttended}/${totalTrainingDays} dias prescritos (${freqPercent}%)</span></div>`;
    } else {
      html += `<div class="stat-row"><span class="stat-label">Treinos</span><span class="stat-value">${trainedDates.size}</span></div>`;
    }
    if (extras > 0) {
      html += `<div class="stat-row"><span class="stat-label">Treinos extras</span><span class="stat-value up">+${extras} em dia de descanso</span></div>`;
    }
    html += `<div style="font-size:0.65rem;color:#666;margin-top:6px;text-align:center;">🟢 treinou &nbsp; 🔴 faltou &nbsp; ⚫ descanso</div>`;
    if (prescribed.size === 0) {
      html += `<div style="font-size:0.62rem;color:#00bcd4;margin-top:6px;text-align:center;">Aluno sem treino ativo — não é possível calcular faltas.</div>`;
    }
    html += '</div>';

    // Volume por faixa de dias.
    // Rótulo mostra o intervalo real: a última faixa costuma ter 1-3 dias, e quando era
    // rotulada como "Sem 5" a barra curta parecia queda de volume todo fim de mês.
    const diasNoMes = lastDay.getDate();
    const totalWeeks = Math.ceil(diasNoMes / 7);
    const maxWeekVol = Math.max(...Object.values(volumeByWeek), 1);
    html += `<div class="resume-card"><h3>Volume por faixa de dias</h3>`;
    for (let w = 1; w <= totalWeeks; w++) {
      const vol = volumeByWeek[w] || 0;
      const pct = (vol / maxWeekVol) * 100;
      const diaIni = (w - 1) * 7 + 1;
      const diaFim = Math.min(w * 7, diasNoMes);
      const qtdDias = diaFim - diaIni + 1;
      html += `<div class="volume-bar-row">`;
      html += `<span class="volume-bar-label" style="min-width:52px;">${diaIni}-${diaFim}</span>`;
      html += `<div class="volume-bar-track"><div class="volume-bar-fill" style="width:${pct}%"></div></div>`;
      html += `<span class="volume-bar-value">${vol > 0 ? vol.toLocaleString('pt-BR') + ' kg' : '-'}</span>`;
      html += `</div>`;
      if (qtdDias < 7 && vol > 0) {
        html += `<div style="font-size:0.58rem;color:#666;margin:-4px 0 6px 60px;">faixa de ${qtdDias} dia${qtdDias > 1 ? 's' : ''} — não comparável às demais</div>`;
      }
    }
    html += '</div>';

    // Cardio do mês (só quando existe registro)
    if (totalCardioMin > 0) {
      const maxCardioWeek = Math.max(...Object.values(cardioByWeek), 1);
      html += `<div class="resume-card"><h3>🏃 Cardio por faixa de dias</h3>`;
      for (let w = 1; w <= totalWeeks; w++) {
        const min = cardioByWeek[w] || 0;
        const pct = (min / maxCardioWeek) * 100;
        const diaIni = (w - 1) * 7 + 1;
        const diaFim = Math.min(w * 7, diasNoMes);
        html += `<div class="volume-bar-row">`;
        html += `<span class="volume-bar-label" style="min-width:52px;">${diaIni}-${diaFim}</span>`;
        html += `<div class="volume-bar-track"><div class="volume-bar-fill" style="width:${pct}%;background:#ff9800"></div></div>`;
        html += `<span class="volume-bar-value">${min > 0 ? formatMinutes(min) : '-'}</span>`;
        html += `</div>`;
      }
      html += `</div>`;
    }

    // Destaques
    let totalVolumeMonth = Object.values(volumeByWeek).reduce((a, b) => a + b, 0);
    const missedDays = totalTrainingDays - totalAttended;
    const bestWeek = Object.entries(volumeByWeek).sort((a, b) => b[1] - a[1])[0];
    const sessoesFeitas = Math.max(sessionDays.size, 1);

    html += `<div class="resume-card"><h3>Destaques do mês</h3>`;
    html += `<div class="stat-row"><span class="stat-label">Volume total</span><span class="stat-value">${totalVolumeMonth.toLocaleString('pt-BR')} kg</span></div>`;
    html += `<div class="stat-row"><span class="stat-label">⏱ Tempo total</span><span class="stat-value">${formatDurationHM(totalMonthSeconds)}</span></div>`;
    if (totalCardioMin > 0) {
      html += `<div class="stat-row"><span class="stat-label">🏃 Cardio total</span><span class="stat-value">${formatMinutes(totalCardioMin)}</span></div>`;
      html += `<div class="stat-row"><span class="stat-label">🏃 Dias com cardio</span><span class="stat-value">${cardioDates.size} dia${cardioDates.size !== 1 ? 's' : ''} · média ${formatMinutes(totalCardioMin / cardioDates.size)}</span></div>`;
    }
    if (totalMonthSeconds > 0) {
      html += `<div class="stat-row"><span class="stat-label">Duração média</span><span class="stat-value">${formatDurationHM(Math.round(totalMonthSeconds / sessoesFeitas))} / treino</span></div>`;
      if (totalVolumeMonth > 0) {
        html += `<div class="stat-row"><span class="stat-label">Densidade</span><span class="stat-value">${(totalVolumeMonth / (totalMonthSeconds / 60)).toFixed(1)} kg/min</span></div>`;
      }
    }
    html += `<div class="stat-row"><span class="stat-label">Faltas</span><span class="stat-value${missedDays > 0 ? ' down' : ''}">${missedDays} dia${missedDays !== 1 ? 's' : ''}</span></div>`;
    if (bestWeek) {
      const bw = parseInt(bestWeek[0]);
      html += `<div class="stat-row"><span class="stat-label">Melhor faixa</span><span class="stat-value">Dias ${(bw-1)*7+1}-${Math.min(bw*7, diasNoMes)} (${parseInt(bestWeek[1]).toLocaleString('pt-BR')} kg)</span></div>`;
    }
    html += '</div>';

    // Comparativo com mês anterior
    let prevVolume = 0;
    const prevTrainedDates = new Set();
    if (prevData) {
      prevData.forEach(r => {
        if (r.set_type === 'hard' && r.weight && r.reps) prevVolume += r.weight * r.reps;
        prevTrainedDates.add(r.session_date);
      });
    }
    let prevSeconds = 0;
    if (prevSessions) prevSessions.forEach(s => { prevSeconds += s.duration_seconds; });
    const prevCardioMin = sumCardioMinutes(prevData);

    const volDiff = prevVolume > 0 ? Math.round(((totalVolumeMonth - prevVolume) / prevVolume) * 100) : 0;
    const volClass = volDiff > 0 ? 'up' : volDiff < 0 ? 'down' : '';
    const volArrow = volDiff > 0 ? '↑' : volDiff < 0 ? '↓' : '=';
    const tDiff = prevSeconds > 0 ? Math.round(((totalMonthSeconds - prevSeconds) / prevSeconds) * 100) : 0;
    const tClass = tDiff > 0 ? 'up' : tDiff < 0 ? 'down' : '';
    const tArrow = tDiff > 0 ? '↑' : tDiff < 0 ? '↓' : '=';
    const cDiff = prevCardioMin > 0 ? Math.round(((totalCardioMin - prevCardioMin) / prevCardioMin) * 100) : 0;
    const cClass = cDiff > 0 ? 'up' : cDiff < 0 ? 'down' : '';
    const cArrow = cDiff > 0 ? '↑' : cDiff < 0 ? '↓' : '=';

    html += `<div class="resume-card"><h3>vs. Mês anterior</h3>`;
    html += `<div class="stat-row"><span class="stat-label">Volume</span><span class="stat-value ${volClass}">${volArrow} ${Math.abs(volDiff)}%</span></div>`;
    html += `<div class="stat-row"><span class="stat-label">Frequência</span><span class="stat-value">${trainedDates.size} vs ${prevTrainedDates.size} dias</span></div>`;
    html += `<div class="stat-row"><span class="stat-label">⏱ Tempo</span><span class="stat-value ${tClass}">${formatDurationHM(totalMonthSeconds)} ${tArrow} ${Math.abs(tDiff)}%</span></div>`;
    if (totalCardioMin > 0 || prevCardioMin > 0) {
      html += `<div class="stat-row"><span class="stat-label">🏃 Cardio</span><span class="stat-value ${cClass}">${formatMinutes(totalCardioMin)} vs ${formatMinutes(prevCardioMin)} ${cArrow} ${Math.abs(cDiff)}%</span></div>`;
    }
    html += '</div>';

    container.innerHTML = html;
  } catch (e) {
    container.innerHTML = `<div class="no-data">Erro: ${e.message}</div>`;
  }
}

async function initApp() {
  studentId = new URLSearchParams(location.search).get('aluno');
  if (!studentId) {
    document.getElementById('content').innerHTML = '<div class="no-data">Nenhum aluno selecionado. <a href="professor.html" style="color:#00bcd4;">Voltar</a></div>';
    return;
  }

  // Carregar plano do aluno → extrair PRESCRIBED_REPS e PRESCRIBED_ORDER
  const { data: plan } = await _sb.from('workout_plans')
    .select('structure, mode, days_per_week')
    .eq('student_id', studentId)
    .eq('is_active', true)
    .maybeSingle();

  if (plan && plan.structure) {
    planMode = plan.mode || 'weekly';
    planDaysPerWeek = plan.days_per_week || null;
    for (const [day, exercises] of Object.entries(plan.structure)) {
      PRESCRIBED_ORDER[day] = exercises.map(ex => ex.name);
      exercises.forEach(ex => {
        PRESCRIBED_REPS[ex.name] = (ex.sets || []).map(s => s.reps || '');
      });
    }
  }

  // Carregar nome do aluno no header
  const { data: student } = await _sb.from('profiles')
    .select('full_name').eq('id', studentId).maybeSingle();
  if (student) {
    document.querySelector('.header h1').textContent = student.full_name || 'Acompanhamento';
  }

  const dateInput = document.getElementById('dateFilter');
  const today = toLocalISO(new Date());
  dateInput.value = today;

  const tabsEl = document.getElementById('tabs');
  const contentEl = document.getElementById('content');
  const todayDay = DAYS[new Date().getDay()];

  DAYS.forEach((day, dayIdx) => {
    const tab = document.createElement('button');
    tab.className = 'tab' + (day === todayDay ? ' active' : '');
    tab.textContent = day.substring(0, 3);
    tab.onclick = () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.day-content').forEach(d => d.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById('day-' + day).classList.add('active');
      const now = new Date();
      const currentDayIdx = now.getDay();
      let diff = currentDayIdx - dayIdx;
      if (diff < 0) diff += 7;
      const targetDate = new Date(now);
      targetDate.setDate(now.getDate() - diff);
      dateInput.value = toLocalISO(targetDate);
      loadDay(day, dateInput.value);
    };
    tabsEl.appendChild(tab);

    const div = document.createElement('div');
    div.className = 'day-content' + (day === todayDay ? ' active' : '');
    div.id = 'day-' + day;
    contentEl.appendChild(div);
  });

  dateInput.addEventListener('change', () => {
    const selectedDate = new Date(dateInput.value + 'T12:00:00');
    const dayOfWeek = DAYS[selectedDate.getDay()];
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.day-content').forEach(d => d.classList.remove('active'));
    const tabs = document.querySelectorAll('.tab');
    tabs.forEach(t => {
      if (t.textContent === dayOfWeek.substring(0, 3)) t.classList.add('active');
    });
    document.getElementById('day-' + dayOfWeek).classList.add('active');
    loadDay(dayOfWeek, dateInput.value);
  });

  loadDay(todayDay, today);
  loadStreak();   // não bloqueia o render do dia
}

guard('trainer', {
  onReady: () => { showLoading(); initApp().finally(() => hideLoading()); },
  onBlocked: () => { location.replace('login.html'); }
});
</script>
</body>
</html>
