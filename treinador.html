<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Treino - Mauricio Furlan</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0d0d0d;
      color: #f0f0f0;
      min-height: 100vh;
      padding-bottom: 40px;
    }
    .header {
      background: #1a1a1a;
      padding: 16px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid #333;
    }
    .header h1 { font-size: 1.1rem; color: #f5c518; letter-spacing: 1px; }
    .header .subtitle { font-size: 0.8rem; color: #999; margin-top: 4px; }
    .tabs {
      display: flex;
      overflow-x: auto;
      background: #1a1a1a;
      padding: 8px;
      gap: 6px;
      position: sticky;
      top: 68px;
      z-index: 99;
      -webkit-overflow-scrolling: touch;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      flex-shrink: 0;
      padding: 8px 14px;
      border-radius: 20px;
      background: #2a2a2a;
      color: #888;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }
    .tab.active {
      background: #f5c518;
      color: #000;
    }
    .day-content { display: none; padding: 16px; }
    .day-content.active { display: block; }
    .exercise-card {
      background: #1a1a1a;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      border: 1px solid #333;
    }
    .exercise-name {
      font-size: 0.95rem;
      font-weight: 700;
      color: #f5c518;
      margin-bottom: 10px;
    }
    .set-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      align-items: center;
      padding: 6px 0;
      border-bottom: 1px solid #222;
    }
    .set-row:last-child { border-bottom: none; }
    .set-label {
      font-size: 0.75rem;
      color: #999;
      text-transform: uppercase;
    }
    .set-value {
      font-size: 0.85rem;
      color: #f0f0f0;
      text-align: center;
    }
    .set-value.empty { color: #555; font-style: italic; }
    .no-data {
      text-align: center;
      padding: 20px;
      color: #555;
      font-size: 0.85rem;
      font-style: italic;
    }
    .date-filter {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px;
      background: #1a1a1a;
      border-bottom: 1px solid #333;
    }
    .date-filter input {
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #0d0d0d;
      color: #f0f0f0;
      font-size: 0.85rem;
    }
    .date-filter input:focus { outline: none; border-color: #f5c518; }
    .date-filter label { font-size: 0.8rem; color: #999; }
    .loading { text-align: center; padding: 40px; color: #888; }
    .summary {
      background: #2a2a2a;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 16px;
      font-size: 0.8rem;
      color: #bbb;
      text-align: center;
    }
    .summary strong { color: #f5c518; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Treino - Mauricio Furlan</h1>
    <div class="subtitle">Visualização do treinador</div>
  </div>
  <div class="date-filter">
    <label>Data:</label>
    <input type="date" id="dateFilter">
  </div>
  <div class="tabs" id="tabs"></div>
  <div id="content"></div>

<script>
const SUPABASE_URL = 'https://qslvwyhpamazoqhcmqan.supabase.co';
const SUPABASE_KEY = 'sb_publishable_lTQKzQJc5uq7LNq-N1UvRg_w3aF_7zH';

const DAYS = ['Segunda','Terça','Quarta','Quinta','Sexta','Sábado','Domingo'];

async function supaFetch(endpoint) {
  const res = await fetch(SUPABASE_URL + '/rest/v1/' + endpoint, {
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + SUPABASE_KEY
    }
  });
  if (!res.ok) throw new Error('Erro: ' + res.status);
  return res.json();
}

async function loadDay(day, date) {
  const container = document.getElementById('day-' + day);
  container.innerHTML = '<div class="loading">Carregando...</div>';

  try {
    const data = await supaFetch(
      `workout_logs?day=eq.${encodeURIComponent(day)}&created_at=gte.${date}T00:00:00&created_at=lt.${date}T23:59:59&order=exercise_name.asc,set_number.asc`
    );

    if (!data || data.length === 0) {
      container.innerHTML = '<div class="no-data">Nenhum registro nesta data</div>';
      return;
    }

    const exercises = {};
    data.forEach(r => {
      if (!exercises[r.exercise_name]) exercises[r.exercise_name] = [];
      exercises[r.exercise_name].push(r);
    });

    const totalSets = data.length;
    const totalExercises = Object.keys(exercises).length;
    let html = `<div class="summary"><strong>${totalExercises}</strong> exercícios · <strong>${totalSets}</strong> sets registrados</div>`;

    Object.entries(exercises).forEach(([name, sets]) => {
      html += `<div class="exercise-card">`;
      html += `<div class="exercise-name">${name}</div>`;
      html += `<div class="set-row"><span class="set-label">Set</span><span class="set-label" style="text-align:center">Carga</span><span class="set-label" style="text-align:center">Reps</span></div>`;
      sets.forEach(s => {
        const weight = s.weight ? s.weight + ' kg' : '-';
        const reps = s.reps ? s.reps + ' reps' : '-';
        html += `<div class="set-row">`;
        html += `<span class="set-label">${s.set_type} ${s.set_number}</span>`;
        html += `<span class="set-value${!s.weight ? ' empty' : ''}">${weight}</span>`;
        html += `<span class="set-value${!s.reps ? ' empty' : ''}">${reps}</span>`;
        html += `</div>`;
      });
      html += `</div>`;
    });

    container.innerHTML = html;
  } catch (e) {
    container.innerHTML = `<div class="no-data">Erro ao carregar: ${e.message}</div>`;
  }
}

function init() {
  const dateInput = document.getElementById('dateFilter');
  const today = new Date().toISOString().split('T')[0];
  dateInput.value = today;

  const tabsEl = document.getElementById('tabs');
  const contentEl = document.getElementById('content');
  const todayDay = DAYS[new Date().getDay()];

  DAYS.forEach(day => {
    const tab = document.createElement('button');
    tab.className = 'tab' + (day === todayDay ? ' active' : '');
    tab.textContent = day.substring(0, 3);
    tab.onclick = () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.day-content').forEach(d => d.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById('day-' + day).classList.add('active');
      loadDay(day, dateInput.value);
    };
    tabsEl.appendChild(tab);

    const div = document.createElement('div');
    div.className = 'day-content' + (day === todayDay ? ' active' : '');
    div.id = 'day-' + day;
    contentEl.appendChild(div);
  });

  dateInput.addEventListener('change', () => {
    const activeDay = document.querySelector('.tab.active')?.textContent;
    const fullDay = DAYS.find(d => d.substring(0, 3) === activeDay);
    if (fullDay) loadDay(fullDay, dateInput.value);
  });

  loadDay(todayDay, today);
}

init();
</script>
</body>
</html>
