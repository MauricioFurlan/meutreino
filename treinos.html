<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Treinos do Aluno</title>
  <meta name="theme-color" content="#00bcd4">
  <!-- PWA: precisa estar em TODAS as páginas, senão o iOS mostra a barra do
       Safari ao navegar dentro do app instalado (modo standalone) -->
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Treino">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; connect-src 'self' https://*.supabase.co; img-src 'self' data:;">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body::-webkit-scrollbar, *::-webkit-scrollbar { display: none; }
    body, * { scrollbar-width: none; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0d0d0d; color: #f0f0f0; min-height: 100vh; padding-bottom: 90px;
      -webkit-text-size-adjust: 100%;
    }
    .header {
      background: #0d2137; padding: 16px; text-align: center;
      border-bottom: 1px solid #1a3a4f; position: relative;
    }
    .header h1 { font-size: 1.1rem; color: #00bcd4; letter-spacing: 1px; }
    .header .subtitle { font-size: 0.8rem; color: #999; margin-top: 4px; }
    .nav-btn {
      position: absolute; top: 12px; background: none; border: 1px solid #555;
      color: #999; font-size: 0.65rem; padding: 7px 11px; border-radius: 12px; cursor: pointer;
    }
    .nav-btn:active { opacity: 0.6; }
    .nav-btn.left { left: 12px; }
    .nav-btn.right { right: 12px; }

    .section { padding: 14px 12px; overflow: hidden; }
    .section-title {
      font-size: 0.85rem; color: #00bcd4; font-weight: 700; margin-bottom: 12px;
      text-transform: uppercase; letter-spacing: 0.5px;
    }
    .section-title span { font-weight: 400; color: #888; font-size: 0.7rem; text-transform: none; letter-spacing: 0; }

    .hint {
      font-size: 0.7rem; color: #888; margin-top: 10px; line-height: 1.4;
      background: #141414; border: 1px solid #262626; border-radius: 8px; padding: 10px 12px;
    }
    .hint strong { color: #4caf50; }

    /* Card de treino */
    .plan-card {
      background: #0d2137; border: 1px solid #1a3a4f; border-radius: 14px;
      padding: 14px; margin-bottom: 12px; position: relative; overflow: hidden;
    }
    .plan-card.active { border-color: #4caf50; background: #161c16; }
    .plan-top { display: flex; align-items: flex-start; gap: 10px; }
    .plan-main { flex: 1; min-width: 0; }
    .plan-title {
      font-size: 0.95rem; font-weight: 700; color: #fff;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .plan-badge {
      display: inline-block; font-size: 0.58rem; font-weight: 700; letter-spacing: 0.4px;
      padding: 3px 8px; border-radius: 10px; margin-top: 6px; text-transform: uppercase;
    }
    .plan-badge.on { background: #1b3a1b; color: #4caf50; }
    .plan-badge.off { background: #132d42; color: #888; }
    .plan-meta { font-size: 0.7rem; color: #999; margin-top: 6px; line-height: 1.5; }
    .plan-meta .sep { color: #444; }
    .plan-days { font-size: 0.68rem; color: #777; margin-top: 4px; }

    /* Toggle */
    .toggle-wrap { display: flex; flex-direction: column; align-items: center; gap: 4px; flex-shrink: 0; padding: 2px 0; }
    .toggle-wrap .toggle-label { font-size: 0.55rem; color: #777; text-transform: uppercase; font-weight: 700; letter-spacing: 0.3px; }
    .toggle { position: relative; display: block; width: 46px; height: 26px; flex-shrink: 0; }
    .toggle input { display: none; }
    .toggle-slider {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background: #555; border-radius: 26px; cursor: pointer; transition: 0.2s;
    }
    .toggle-slider::before {
      content: ''; position: absolute; width: 20px; height: 20px;
      left: 3px; bottom: 3px; background: #fff; border-radius: 50%; transition: 0.2s;
    }
    .toggle input:checked + .toggle-slider { background: #4caf50; }
    .toggle input:checked + .toggle-slider::before { transform: translateX(20px); }
    .toggle input:disabled + .toggle-slider { opacity: 0.5; }

    /* Ações */
    .plan-actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
    .action-btn {
      flex: 1; min-width: 88px; min-height: 40px; padding: 8px 10px;
      border: 1px solid #555; border-radius: 10px; background: none;
      color: #ccc; font-size: 0.72rem; font-weight: 600; cursor: pointer;
    }
    .action-btn:active { opacity: 0.6; }
    .action-btn.primary { border-color: #00bcd4; color: #00bcd4; }
    .action-btn.danger { border-color: #f44336; color: #f44336; flex: 0 0 46px; min-width: 46px; font-size: 0.95rem; }

    /* Barra fixa de criação */
    .bottom-bar {
      position: fixed; bottom: 0; left: 0; right: 0; background: #0d2137;
      border-top: 1px solid #1a3a4f; padding: 12px; z-index: 100;
      display: flex; gap: 8px; padding-bottom: calc(12px + env(safe-area-inset-bottom));
    }
    .bottom-bar button {
      min-height: 48px; border: none; border-radius: 12px; font-weight: 700;
      font-size: 0.85rem; cursor: pointer;
    }
    .bottom-bar .new-btn { flex: 1.4; background: #00bcd4; color: #000; }
    .bottom-bar .import-btn { flex: 1; background: #132d42; color: #00bcd4; border: 1px solid #444; }
    .bottom-bar button:active { opacity: 0.7; }

    .empty-state { text-align: center; padding: 34px 20px; color: #666; font-size: 0.85rem; line-height: 1.6; }

    .toast {
      position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
      background: #00bcd4; color: #000; padding: 10px 20px; border-radius: 20px;
      font-size: 0.85rem; font-weight: 600; display: none; z-index: 1001; max-width: 90vw; text-align: center;
    }
    .toast.error { background: #f44336; color: #fff; }
    .toast.show { display: block; animation: fadeOut 2.8s forwards; }
    @keyframes fadeOut { 0%,70% { opacity: 1; } 100% { opacity: 0; } }

    /* Modal visualizar treino */
    .modal {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.9); z-index: 1000; align-items: flex-end; justify-content: center;
    }
    .modal.show { display: flex; }
    .modal-content {
      background: #0d2137; border-radius: 16px 16px 0 0; padding: 18px;
      width: 100%; max-width: 480px; max-height: 88vh; overflow-y: auto;
      border: 1px solid #1a3a4f; padding-bottom: calc(18px + env(safe-area-inset-bottom));
    }
    .modal-content h3 { color: #00bcd4; font-size: 0.95rem; margin-bottom: 14px; }
    .modal-close {
      width: 100%; min-height: 46px; border: none; border-radius: 10px;
      background: #132d42; color: #999; font-weight: 600; font-size: 0.85rem;
      cursor: pointer; margin-top: 14px;
    }
    /* === Visualização da ficha ===
       Antes era uma lista corrida de texto: dia, nome e séries em linhas
       quase iguais, sem hierarquia. Agora cada exercício é um card com
       número, séries em pills e descanso/notas separados — o professor
       confere a ficha batendo o olho, sem ler tudo. */
    .v-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
    .v-chip {
      font-size: 0.62rem; color: #aaa; background: #222; border: 1px solid #1a3a4f;
      padding: 4px 9px; border-radius: 10px; white-space: nowrap;
    }
    .v-chip.on { color: #4caf50; border-color: #2c5c2c; background: #142014; font-weight: 700; }
    .v-chip.off { color: #888; }

    .v-day { margin-bottom: 16px; }
    .v-day-head {
      display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
      padding-bottom: 6px; border-bottom: 1px solid #132d42;
    }
    .v-day-name {
      font-size: 0.8rem; color: #00bcd4; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.6px;
    }
    .v-day-count { font-size: 0.62rem; color: #777; }

    .v-ex { background: #141414; border: 1px solid #262626; border-radius: 10px; padding: 10px; margin-bottom: 8px; }
    .v-ex-head { display: flex; align-items: center; gap: 8px; }
    .v-ex-num {
      flex-shrink: 0; width: 20px; height: 20px; border-radius: 50%;
      background: #132d42; color: #999; font-size: 0.6rem; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
    }
    .v-ex-name {
      flex: 1; min-width: 0; font-size: 0.82rem; font-weight: 600; color: #fff; line-height: 1.3;
    }
    .v-tag {
      flex-shrink: 0; font-size: 0.55rem; font-weight: 700; letter-spacing: 0.3px;
      padding: 3px 7px; border-radius: 8px; text-transform: uppercase;
    }
    .v-tag.cardio { color: #ffb74d; background: #2a1f10; border: 1px solid #005a6a; }

    /* Séries: pill TIPO + valor. Cardio em laranja porque o valor é tempo,
       não repetição — a cor evita ler "40min" como carga. */
    .v-sets { display: flex; flex-wrap: wrap; gap: 5px; margin: 8px 0 0 28px; }
    .v-set {
      display: inline-flex; align-items: center; gap: 5px; background: #1e1e1e;
      border: 1px solid #1a3a4f; border-radius: 8px; padding: 3px 7px; font-size: 0.66rem;
    }
    .v-set-type { color: #00bcd4; font-weight: 700; letter-spacing: 0.3px; }
    .v-set-val { color: #ddd; font-weight: 600; }
    .v-set.cardio { border-color: #005a6a; background: #201a12; }
    .v-set.cardio .v-set-type { color: #ff9800; }
    .v-set.cardio .v-set-val { color: #ffb74d; }

    .v-metas { display: flex; flex-wrap: wrap; gap: 5px; margin: 8px 0 0 28px; }
    .v-pill {
      font-size: 0.62rem; padding: 3px 8px; border-radius: 8px;
      border: 1px solid #2f4d5a; color: #4fc3f7; background: #12242b; white-space: nowrap;
    }
    .v-pill.link { border-color: #3b3b3b; color: #bbb; background: #1e1e1e; text-decoration: none; }
    .v-note { font-size: 0.68rem; color: #bbb; line-height: 1.45; margin: 7px 0 0 28px; }
    .v-note.sub { color: #888; }
    .v-empty { font-size: 0.66rem; color: #f44336; margin: 8px 0 0 28px; font-style: italic; }

    /* Biset/triset: mesma moldura amarela que o aluno vê no app */
    .v-group {
      border: 1px solid #5a4b10; border-left: 3px solid #00bcd4;
      border-radius: 10px; padding: 8px; margin-bottom: 8px; background: #131109;
    }
    .v-group-label {
      display: block; font-size: 0.58rem; color: #00bcd4; font-weight: 700;
      letter-spacing: 0.5px; margin-bottom: 6px;
    }
    .v-group .v-ex { background: #171614; margin-bottom: 6px; }
    .v-group .v-ex:last-child { margin-bottom: 0; }

    /* Loading overlay */
    .loading-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(13,13,13,0.92); z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 16px; transition: opacity 0.3s;
    }
    .loading-overlay.hidden { opacity: 0; pointer-events: none; }
    .loading-spinner {
      width: 44px; height: 44px; border: 3px solid #1a3a4f;
      border-top-color: #00bcd4; border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { color: #999; font-size: 0.8rem; font-weight: 500; letter-spacing: 0.5px; }
  </style>
</head>
<body>
  <div class="loading-overlay" id="loadingOverlay">
    <div class="loading-spinner"></div>
    <div class="loading-text">Carregando...</div>
  </div>

  <div class="header">
    <button class="nav-btn left" onclick="location.href='professor.html'">← Voltar</button>
    <h1>Treinos</h1>
    <div class="subtitle" id="studentName"></div>
  </div>

  <div class="section" style="padding-bottom:0;">
    <div class="hint">O aluno vê <strong>apenas o treino ativo</strong>. Ative um treino para enviar a ficha; os demais ficam no histórico.</div>
  </div>

  <div class="section">
    <div class="section-title">Histórico <span id="planCount"></span></div>
    <div id="plansList"></div>
  </div>

  <div class="bottom-bar">
    <button class="new-btn" id="newBtn">+ Novo Treino</button>
    <button class="import-btn" id="importBtn">⬇ Importar</button>
  </div>

  <!-- Modal visualizar treino -->
  <div class="modal" id="viewModal">
    <div class="modal-content">
      <h3 id="viewTitle">Treino</h3>
      <div id="viewBody"></div>
      <button class="modal-close" onclick="closeView()">Fechar</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth-guard.js"></script>
<script>
const DAYS = ['Segunda','Terça','Quarta','Quinta','Sexta','Sábado','Domingo'];
let studentId = null;
let inviteId = null; // invite pendente (aluno ainda sem login)
let plans = [];
let busy = false;

function showLoading() { document.getElementById('loadingOverlay').classList.remove('hidden'); }
function hideLoading() { document.getElementById('loadingOverlay').classList.add('hidden'); }

const esc = (s) => { const d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; };

// === Descanso por série (mesmas regras de editor.html e index.html) ===
// '90' → '90s' · '1:30' → '1min30s' · '2m' → '2min'. Texto livre passa intacto.
function normalizeRest(raw) {
  const t = String(raw || '').trim().toLowerCase();
  if (!t) return '';
  const compact = t.replace(/\s+/g, '');
  if (/^\d+$/.test(compact)) return compact + 's';
  const mmss = compact.match(/^(\d+):([0-5]\d)$/);
  if (mmss) return mmss[2] === '00' ? mmss[1] + 'min' : `${mmss[1]}min${Number(mmss[2])}s`;
  const seg = compact.match(/^(\d+)s(eg(undos?)?)?$/);
  if (seg) return seg[1] + 's';
  const min = compact.match(/^(\d+)m(in(uto)?s?)?$/);
  if (min) return min[1] + 'min';
  return t;
}

function restLabel(type) {
  const t = String(type || '').trim().toLowerCase();
  if (t === 'feeder') return 'FED';
  if (!t) return 'SET';
  const first = t.split(/[^0-9a-záàâãéêíóôõúç]+/i)[0] || t;
  return first.slice(0, 6).toUpperCase();
}

// 'AQUEC-2min / FED-2min / HARD-3min', ou só o valor quando é igual em tudo.
function restSummary(sets, legacyRest) {
  const list = (sets || []).map(s => ({
    label: restLabel(s.type),
    rest: normalizeRest(s.rest || legacyRest || '')
  })).filter(x => x.rest);
  if (list.length === 0) return { text: '', uniform: false };
  const distintos = [...new Set(list.map(x => x.rest))];
  if (distintos.length === 1 && list.length === (sets || []).length) {
    return { text: distintos[0], uniform: true };
  }
  const vistos = new Set();
  const partes = [];
  list.forEach(x => {
    const chave = x.label + '|' + x.rest;
    if (vistos.has(chave)) return;
    vistos.add(chave);
    partes.push(`${x.label}-${x.rest}`);
  });
  return { text: partes.join(' / '), uniform: false };
}

function showToast(text, isError) {
  const t = document.getElementById('toast');
  t.textContent = text;
  t.className = 'toast show' + (isError ? ' error' : '');
  setTimeout(() => t.className = 'toast', 2800);
}

function fmtDate(d) {
  if (!d) return null;
  const [y, m, dd] = d.split('-');
  return `${dd}/${m}/${y}`;
}
function fmtShort(d) {
  if (!d) return null;
  const [, m, dd] = d.split('-');
  return `${dd}/${m}`;
}

function countExercises(structure) {
  if (!structure) return 0;
  return DAYS.reduce((sum, d) => sum + (Array.isArray(structure[d]) ? structure[d].length : 0), 0);
}
function activeDays(structure) {
  if (!structure) return [];
  return DAYS.filter(d => Array.isArray(structure[d]) && structure[d].length > 0);
}

// === Carregar treinos do aluno ===
async function loadPlans() {
  let query = _sb.from('workout_plans')
    .select('id, title, structure, is_active, plan_start_date, plan_end_date, created_at, updated_at');

  if (studentId) {
    query = query.eq('student_id', studentId);
  } else if (inviteId) {
    query = query.eq('invite_id', inviteId);
  }

  const { data, error } = await query
    .order('is_active', { ascending: false })
    .order('created_at', { ascending: false });

  if (error) { showToast('Erro ao carregar treinos: ' + error.message, true); return; }
  plans = data || [];
  renderPlans();
}

function renderPlans() {
  const container = document.getElementById('plansList');
  const countEl = document.getElementById('planCount');
  countEl.textContent = plans.length ? `(${plans.length})` : '';

  if (plans.length === 0) {
    container.innerHTML = `<div class="empty-state">
      Nenhum treino cadastrado.<br>
      Toque em <strong>+ Novo Treino</strong> para montar do zero,<br>ou em <strong>Importar</strong> para copiar de outro aluno.
    </div>`;
    return;
  }

  container.innerHTML = plans.map(p => {
    const total = countExercises(p.structure);
    const days = activeDays(p.structure);
    const period = (p.plan_start_date || p.plan_end_date)
      ? `📅 ${fmtShort(p.plan_start_date) || '...'} — ${fmtShort(p.plan_end_date) || '...'}`
      : null;
    const created = new Date(p.created_at).toLocaleDateString('pt-BR');
    const meta = [
      `${total} exercício${total !== 1 ? 's' : ''}`,
      `${days.length} dia${days.length !== 1 ? 's' : ''}`,
      period
    ].filter(Boolean).join(' <span class="sep">·</span> ');

    return `
      <div class="plan-card ${p.is_active ? 'active' : ''}">
        <div class="plan-top">
          <div class="plan-main">
            <div class="plan-title">${esc(p.title || 'Treino')}</div>
            <span class="plan-badge ${p.is_active ? 'on' : 'off'}">${p.is_active ? '● Ativo para o aluno' : 'Inativo'}</span>
            <div class="plan-meta">${meta}</div>
            <div class="plan-days">${days.length ? esc(days.join(' · ')) : 'Sem exercícios'} <span class="sep">·</span> criado ${created}</div>
          </div>
          <div class="toggle-wrap">
            <span class="toggle-label">${p.is_active ? 'On' : 'Off'}</span>
            <label class="toggle">
              <input type="checkbox" ${p.is_active ? 'checked' : ''} data-plan="${p.id}" onchange="onToggle(this)">
              <span class="toggle-slider"></span>
            </label>
          </div>
        </div>
        <div class="plan-actions">
          <button class="action-btn" onclick="viewPlan('${p.id}')">👁 Ver</button>
          <button class="action-btn primary" onclick="location.href='editor.html?plan=${p.id}'">✏️ Editar</button>
          <button class="action-btn danger" onclick="deletePlan('${p.id}')" title="Excluir">×</button>
        </div>
      </div>
    `;
  }).join('');
}

// === Ativar / desativar ===
async function onToggle(input) {
  if (busy) { input.checked = !input.checked; return; }
  const planId = input.dataset.plan;
  const turnOn = input.checked;
  busy = true;
  document.querySelectorAll('.toggle input').forEach(i => i.disabled = true);

  try {
    if (turnOn) {
      // Só 1 treino ativo por aluno: desativa os outros antes (índice único no banco)
      let deactivateQuery = _sb.from('workout_plans')
        .update({ is_active: false })
        .eq('is_active', true)
        .neq('id', planId);
      if (studentId) deactivateQuery = deactivateQuery.eq('student_id', studentId);
      else if (inviteId) deactivateQuery = deactivateQuery.eq('invite_id', inviteId);

      const { error: e1 } = await deactivateQuery;
      if (e1) throw e1;

      const { error: e2 } = await _sb.from('workout_plans')
        .update({ is_active: true })
        .eq('id', planId);
      if (e2) throw e2;
      showToast('Treino ativado — o aluno já recebeu a ficha.');
    } else {
      const { error } = await _sb.from('workout_plans')
        .update({ is_active: false })
        .eq('id', planId);
      if (error) throw error;
      showToast('Treino desativado — o aluno não verá nenhuma ficha.');
    }
    await loadPlans();
  } catch (e) {
    showToast('Erro: ' + e.message, true);
    await loadPlans();
  } finally {
    busy = false;
    document.querySelectorAll('.toggle input').forEach(i => i.disabled = false);
  }
}

// === Visualizar (somente leitura) ===

// Cardio usa o campo de prescrição como TEMPO ('40min'), não reps.
// Mesma regra do editor e do app do aluno.
function isCardioType(type) {
  return String(type || '').trim().toLowerCase() === 'cardio';
}

function groupLabel(count) {
  return count === 2 ? 'BISET' : count === 3 ? 'TRISET' : 'GIANT SET';
}

// Só link http(s) vira <a>: 'javascript:...' salvo no campo de vídeo não pode
// virar clique executável dentro da ficha.
function safeVideoUrl(url) {
  const u = String(url || '').trim();
  return /^https?:\/\//i.test(u) ? u : null;
}

// Um exercício = um card: número, nome, séries em pills, descanso/vídeo e notas.
function renderViewExercise(ex, num) {
  const sets = Array.isArray(ex.sets) ? ex.sets : [];
  const soCardio = sets.length > 0 && sets.every(s => isCardioType(s.type));

  const pills = sets.map(s => {
    const cardio = isCardioType(s.type);
    const tipo = String(s.type || 'set').toUpperCase();
    const valor = String(s.reps == null ? '' : s.reps).trim();
    return `<span class="v-set${cardio ? ' cardio' : ''}">` +
      `<span class="v-set-type">${esc(tipo)}</span>` +
      (valor ? `<span class="v-set-val">${esc(valor)}</span>` : '') +
      `</span>`;
  }).join('');

  const descanso = restSummary(sets, ex.rest);
  const notasSet = sets.filter(s => s.note).map(s => `${String(s.type || 'set').toUpperCase()}: ${s.note}`);
  const video = safeVideoUrl(ex.video_url);

  const metas = [];
  if (descanso.text) {
    metas.push(`<span class="v-pill">⏱ ${descanso.uniform ? 'Descanso' : 'Descansos'}: ${esc(descanso.text)}</span>`);
  }
  if (video) {
    metas.push(`<a class="v-pill link" href="${esc(video)}" target="_blank" rel="noopener">🎥 Vídeo</a>`);
  }

  let h = `<div class="v-ex">`;
  h += `<div class="v-ex-head">`;
  h += `<span class="v-ex-num">${num}</span>`;
  h += `<span class="v-ex-name">${esc(ex.name || 'Sem nome')}</span>`;
  if (soCardio) h += `<span class="v-tag cardio">🏃 Cardio</span>`;
  h += `</div>`;
  h += sets.length
    ? `<div class="v-sets">${pills}</div>`
    : `<div class="v-empty">Sem séries definidas</div>`;
  if (metas.length) h += `<div class="v-metas">${metas.join('')}</div>`;
  if (ex.note) h += `<div class="v-note">❗ ${esc(ex.note)}</div>`;
  if (notasSet.length) h += `<div class="v-note sub">📝 ${notasSet.map(esc).join(' · ')}</div>`;
  h += `</div>`;
  return h;
}

// Monta um dia inteiro: exercícios soltos e grupos (biset/triset) na ordem
// do plano, com numeração contínua — é a ordem que o aluno executa.
function renderViewDay(day, list) {
  let html = `<div class="v-day">
      <div class="v-day-head">
        <span class="v-day-name">${day}</span>
        <span class="v-day-count">${list.length} exercício${list.length !== 1 ? 's' : ''}</span>
      </div>`;

  let i = 0, num = 0;
  while (i < list.length) {
    const grupo = list[i].group;
    if (grupo) {
      const bloco = [];
      while (i < list.length && list[i].group === grupo) bloco.push(list[i++]);
      if (bloco.length >= 2) {
        html += `<div class="v-group"><span class="v-group-label">🔗 ${groupLabel(bloco.length)}</span>`;
        bloco.forEach(ex => { html += renderViewExercise(ex, ++num); });
        html += `</div>`;
      } else {
        bloco.forEach(ex => { html += renderViewExercise(ex, ++num); });
      }
    } else {
      html += renderViewExercise(list[i++], ++num);
    }
  }
  return html + `</div>`;
}

function viewPlan(planId) {
  const p = plans.find(x => x.id === planId);
  if (!p) return;
  document.getElementById('viewTitle').textContent = p.title || 'Treino';

  const st = p.structure || {};
  const total = countExercises(st);
  const dias = activeDays(st);

  const chips = [
    `<span class="v-chip ${p.is_active ? 'on' : 'off'}">${p.is_active ? '● Ativo para o aluno' : 'Inativo'}</span>`,
    `<span class="v-chip">${total} exercício${total !== 1 ? 's' : ''}</span>`,
    `<span class="v-chip">${dias.length} dia${dias.length !== 1 ? 's' : ''} de treino</span>`
  ];
  if (p.plan_start_date || p.plan_end_date) {
    chips.push(`<span class="v-chip">📅 ${fmtDate(p.plan_start_date) || '...'} — ${fmtDate(p.plan_end_date) || '...'}</span>`);
  }

  let html = '';
  DAYS.forEach(day => {
    const list = Array.isArray(st[day]) ? st[day] : [];
    if (list.length === 0) return;
    html += renderViewDay(day, list);
  });

  document.getElementById('viewBody').innerHTML =
    `<div class="v-chips">${chips.join('')}</div>` +
    (html || '<div class="empty-state">Treino vazio.</div>');
  document.getElementById('viewModal').classList.add('show');
}
function closeView() { document.getElementById('viewModal').classList.remove('show'); }

// === Excluir treino ===
async function deletePlan(planId) {
  const p = plans.find(x => x.id === planId);
  if (!p) return;
  const warn = p.is_active
    ? `"${p.title || 'Treino'}" está ATIVO. Excluir vai deixar o aluno sem ficha. Continuar?`
    : `Excluir "${p.title || 'Treino'}"?`;
  if (!confirm(warn)) return;

  showLoading();
  const { error } = await _sb.from('workout_plans').delete().eq('id', planId);
  if (error) { hideLoading(); showToast('Erro: ' + error.message, true); return; }
  await loadPlans();
  hideLoading();
  showToast('Treino excluído.');
}

// === Inicialização ===
guard('trainer', {
  onReady: async (session, profile) => {
    showLoading();
    const params = new URLSearchParams(location.search);
    studentId = params.get('aluno');
    inviteId = params.get('invite');

    if (!studentId && !inviteId) {
      hideLoading();
      document.getElementById('plansList').innerHTML =
        '<div class="empty-state">Nenhum aluno selecionado.<br><a href="professor.html" style="color:#00bcd4;">Voltar</a></div>';
      document.querySelector('.bottom-bar').style.display = 'none';
      return;
    }

    // Parâmetro que passa para o editor
    const editorParam = studentId
      ? 'aluno=' + encodeURIComponent(studentId)
      : 'invite=' + encodeURIComponent(inviteId);
    document.getElementById('newBtn').onclick = () => location.href = 'editor.html?' + editorParam;
    document.getElementById('importBtn').onclick = () => location.href = 'editor.html?' + editorParam + '&importar=1';

    // Nome do aluno (do profile ou do invite)
    if (studentId) {
      const { data: student } = await _sb.from('profiles')
        .select('full_name')
        .eq('id', studentId)
        .maybeSingle();
      document.getElementById('studentName').textContent = student?.full_name || '';
    } else if (inviteId) {
      const { data: invite } = await _sb.from('invites')
        .select('full_name')
        .eq('id', inviteId)
        .maybeSingle();
      document.getElementById('studentName').textContent = (invite?.full_name || '') + ' (pendente)';
    }

    await loadPlans();
    hideLoading();
  },
  onBlocked: () => { location.replace('login.html'); }
});
