<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Editor de Treino</title>
  <meta name="theme-color" content="#00bcd4">
  <!-- PWA: precisa estar em TODAS as páginas, senão o iOS mostra a barra do
       Safari ao navegar dentro do app instalado (modo standalone) -->
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Treino">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; connect-src 'self' https://*.supabase.co; img-src 'self' data:;">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body::-webkit-scrollbar, *::-webkit-scrollbar { display: none; }
    body, * { scrollbar-width: none; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a1a2e; color: #f0f0f0; min-height: 100vh; padding-bottom: 100px;
      max-width: 100%; overflow-x: hidden;
    }
    .header {
      background: #0d2137; padding: 16px; text-align: center;
      border-bottom: 1px solid #1a3a4f; position: relative;
    }
    .header h1 { font-size: 1.1rem; color: #00bcd4; letter-spacing: 1px; }
    .header .subtitle { font-size: 0.8rem; color: #999; margin-top: 4px; }
    .nav-btn {
      position: absolute; top: 14px; background: none; border: 1px solid #555;
      color: #999; font-size: 0.65rem; padding: 4px 10px; border-radius: 12px; cursor: pointer;
    }
    .nav-btn:active { opacity: 0.6; }
    .nav-btn.left { left: 14px; }
    .nav-btn.right { right: 14px; }

    .title-section { padding: 12px; }
    .title-input {
      width: 100%; max-width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #1a3a4f;
      background: #0d2137; color: #00bcd4; font-size: 1rem; font-weight: 700; text-align: center;
      box-sizing: border-box;
    }
    .title-input:focus { outline: none; border-color: #00bcd4; }

    .dates-row { display: flex; gap: 8px; padding: 0 12px 12px; max-width: 100%; }
    /* flex-basis 0 + min-width 0 impede o input[type=date] do iOS de forçar
       largura intrínseca maior que a tela (causava scroll horizontal) */
    .date-field { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
    .date-field label {
      font-size: 0.7rem; color: #888; font-weight: 600; text-transform: uppercase;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .date-field input[type="date"] {
      width: 100%; min-width: 0; max-width: 100%; padding: 10px 8px; border-radius: 8px;
      border: 1px solid #1a3a4f; background: #0d2137; color: #fff; font-size: 0.8rem;
      box-sizing: border-box; -webkit-appearance: none; appearance: none;
    }
    /* Remove o padding interno que o Safari adiciona no seletor de data */
    .date-field input[type="date"]::-webkit-date-and-time-value { text-align: left; margin: 0; }
    .date-field input[type="date"]::-webkit-calendar-picker-indicator { margin-left: 2px; }
    .date-field input[type="date"]:focus { outline: none; border-color: #00bcd4; }

    /* Opções do plano (ativo + importar) */
    .options-row { padding: 0 12px 12px; display: flex; flex-direction: column; gap: 8px; }
    .opt-card {
      display: flex; align-items: center; gap: 12px;
      background: #0d2137; border: 1px solid #1a3a4f; border-radius: 12px; padding: 12px 14px;
    }
    .opt-card.on { border-color: #4caf50; background: #161c16; }
    .opt-text { flex: 1; min-width: 0; }
    .opt-title { font-size: 0.82rem; font-weight: 700; color: #f0f0f0; }
    .opt-sub { font-size: 0.66rem; color: #888; margin-top: 3px; line-height: 1.4; }
    .toggle { position: relative; display: block; width: 46px; height: 26px; flex-shrink: 0; }
    .toggle input { display: none; }
    .toggle-slider {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background: #555; border-radius: 26px; cursor: pointer; transition: 0.2s;
    }
    .toggle-slider::before {
      content: ''; position: absolute; width: 20px; height: 20px;
      left: 3px; bottom: 3px; background: #fff; border-radius: 50%; transition: 0.2s;
    }
    .toggle input:checked + .toggle-slider { background: #4caf50; }
    .toggle input:checked + .toggle-slider::before { transform: translateX(20px); }
    .import-open-btn {
      width: 100%; min-height: 46px; border: 1px dashed #00bcd4; border-radius: 12px;
      background: none; color: #00bcd4; font-size: 0.8rem; font-weight: 600; cursor: pointer;
    }
    .import-open-btn:active { opacity: 0.6; }

    /* Modal de importação */
    .modal {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.9); z-index: 1000; align-items: flex-end; justify-content: center;
    }
    .modal.show { display: flex; }
    .modal-content {
      background: #0d2137; border-radius: 16px 16px 0 0; padding: 18px;
      width: 100%; max-width: 480px; max-height: 88vh; overflow-y: auto;
      border: 1px solid #1a3a4f; padding-bottom: calc(18px + env(safe-area-inset-bottom));
    }
    .modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
    .modal-head h3 { color: #00bcd4; font-size: 0.95rem; }
    .modal-x {
      background: none; border: none; color: #888; font-size: 1.1rem; cursor: pointer;
      padding: 4px 8px; line-height: 1;
    }
    .modal-sub { font-size: 0.7rem; color: #888; margin-bottom: 12px; line-height: 1.4; }
    .modal-close {
      width: 100%; min-height: 46px; border: none; border-radius: 10px;
      background: #132d42; color: #999; font-weight: 600; font-size: 0.85rem;
      cursor: pointer; margin-top: 14px;
    }
    .import-search {
      width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #1a3a4f;
      background: #0a1a2e; color: #fff; font-size: 16px; box-sizing: border-box; margin-bottom: 10px;
    }
    .import-search:focus { outline: none; border-color: #00bcd4; }
    .pick-item {
      display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
      background: #0a1a2e; border: 1px solid #1a3a4f; border-radius: 12px;
      padding: 12px 14px; margin-bottom: 8px; cursor: pointer; min-height: 52px;
    }
    .pick-item:active { border-color: #00bcd4; }
    .pick-item .pick-avatar {
      width: 34px; height: 34px; border-radius: 50%; background: #262626; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      color: #00bcd4; font-weight: 700; font-size: 0.8rem;
    }
    .pick-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .pick-title { display: block; font-size: 0.85rem; font-weight: 600; color: #f0f0f0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pick-meta { display: block; font-size: 0.68rem; color: #888; }
    .pick-arrow { color: #555; font-size: 0.8rem; flex-shrink: 0; }
    .pick-badge {
      display: inline-block; font-size: 0.55rem; font-weight: 700; letter-spacing: 0.3px;
      padding: 2px 7px; border-radius: 8px; background: #1b3a1b; color: #4caf50; margin-left: 6px;
    }
    .back-link {
      background: none; border: none; color: #00bcd4; font-size: 0.75rem;
      cursor: pointer; padding: 4px 0 10px; font-weight: 600;
    }
    .confirm-btn {
      width: 100%; min-height: 50px; border: none; border-radius: 12px;
      background: #00bcd4; color: #000; font-weight: 700; font-size: 0.9rem; cursor: pointer; margin-top: 12px;
    }
    .confirm-btn:active { opacity: 0.7; }
    .preview-day { margin-bottom: 12px; }
    .preview-day h4 { font-size: 0.75rem; color: #00bcd4; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.5px; }
    .preview-ex { font-size: 0.76rem; color: #ddd; padding: 4px 0; border-bottom: 1px solid #222; }
    .preview-ex .sets { color: #888; font-size: 0.68rem; }
    .modal-empty { text-align: center; padding: 26px 12px; color: #666; font-size: 0.8rem; line-height: 1.6; }

    /* Accordion dias */
    .day-accordion { margin: 0 12px 8px; border: 1px solid #1a3a4f; border-radius: 12px; background: #0d2137; }
    .day-header {
      padding: 14px 16px; cursor: pointer; display: flex; align-items: center;
      justify-content: space-between; user-select: none; border-radius: 12px;
    }
    .day-header .day-name { font-weight: 700; font-size: 0.9rem; color: #00bcd4; }
    .day-header .day-count { font-size: 0.7rem; color: #888; }
    .day-header .arrow { color: #888; font-size: 0.6rem; transition: transform 0.2s; }
    .day-accordion.open .day-header .arrow { transform: rotate(180deg); }
    .day-body { display: none; padding: 0 10px 12px; }
    .day-accordion.open .day-body { display: block; }

    /* Exercício */
    .exercise-item {
      background: #0a1a2e; border: 1px solid #1a3a4f; border-radius: 10px;
      padding: 12px; margin-bottom: 10px;
    }
    .exercise-top { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .exercise-top input {
      flex: 1; min-width: 0; padding: 8px; border-radius: 6px; border: 1px solid #1a3a4f;
      background: #0d2137; color: #fff; font-size: 16px; box-sizing: border-box;
    }
    .exercise-top input:focus { outline: none; border-color: #00bcd4; }
    .exercise-extras { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
    .exercise-extras input {
      flex: 1; min-width: 0; padding: 6px 8px; border-radius: 6px; border: 1px solid #1a3a4f;
      background: #0d2137; color: #ccc; font-size: 14px; box-sizing: border-box;
    }
    .exercise-extras input:focus { outline: none; border-color: #00bcd4; }

    /* Sets: tipo | reps/tempo | descanso | nota | remover.
       O cabeçalho existe porque com 4 campos na linha o professor não tem
       como adivinhar qual é qual só pelo placeholder truncado. */
    .set-item, .set-head {
      display: grid; grid-template-columns: 54px 1fr 50px 1fr 22px; gap: 4px;
      align-items: center; margin-bottom: 6px;
    }
    .set-head { margin-bottom: 3px; }
    .set-head span {
      font-size: 0.55rem; color: #777; font-weight: 700;
      letter-spacing: 0.3px; text-align: center;
    }
    .set-head span:first-child { text-align: left; }
    .set-item input {
      padding: 6px 2px; border-radius: 6px; border: 1px solid #1a3a4f;
      background: #0d2137; color: #fff; font-size: 14px; text-align: center;
      min-width: 0; box-sizing: border-box;
    }
    .set-item input:focus { outline: none; border-color: #00bcd4; }
    .set-item input::placeholder { color: #5a5a5a; }
    /* 13px porque "FEEDER" em 14px não cabe nos 54px da coluna */
    .set-type-input { text-transform: uppercase; font-weight: 600; font-size: 13px; color: #00bcd4 !important; }
    .set-rest { color: #4fc3f7 !important; font-weight: 600; }
    .set-rest:focus { border-color: #4fc3f7 !important; }
    /* Cardio: o set deixa de ser carga×reps e passa a ser tempo — cor diferente
       para o professor perceber de imediato que aquela linha é minutos. */
    .set-item.is-cardio .set-type-input { color: #ff9800 !important; }
    .set-item.is-cardio .set-reps { border-color: #005a6a; color: #ffb74d; }
    .chips { display: flex; gap: 4px; margin-bottom: 8px; flex-wrap: wrap; align-items: center; }
    .chips-label { font-size: 0.6rem; color: #777; font-weight: 700; margin-right: 2px; }
    .chip {
      padding: 4px 10px; border-radius: 12px; border: 1px solid #555; background: none;
      color: #999; font-size: 0.6rem; cursor: pointer; font-weight: 600; text-transform: uppercase;
    }
    .chip:active { border-color: #00bcd4; color: #00bcd4; }
    .chip.chip-cardio { border-color: #005a6a; color: #ffb74d; }
    .chip.chip-cardio:active { border-color: #ff9800; color: #ff9800; }
    /* Descanso: o campo abre um seletor com os valores usuais e altera SÓ
       aquela série. Os chips antigos preenchiam todas as séries de uma vez,
       o que mudava linhas que já estavam certas. */
    .set-rest { cursor: pointer; }
    .set-rest.picking { border-color: #4fc3f7 !important; }
    .rest-picker {
      display: none; position: fixed; z-index: 1200; width: 216px;
      background: #16202a; border: 1px solid #2f4d5a; border-radius: 12px;
      padding: 10px; box-shadow: 0 10px 28px rgba(0,0,0,0.6);
    }
    .rest-picker.show { display: block; }
    .rest-picker-title {
      font-size: 0.6rem; color: #4fc3f7; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.4px; margin-bottom: 8px;
    }
    .rest-picker-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .rest-opt {
      padding: 9px 0; border: 1px solid #2f4d5a; border-radius: 8px; background: #0f1a21;
      color: #9fd9f5; font-size: 0.72rem; font-weight: 600; cursor: pointer;
    }
    .rest-opt.on { background: #4fc3f7; border-color: #4fc3f7; color: #06222e; }
    .rest-opt:active { opacity: 0.6; }
    .rest-picker-actions { display: flex; gap: 6px; margin-top: 8px; }
    .rest-picker-actions button {
      flex: 1; padding: 8px 4px; border-radius: 8px; background: none;
      font-size: 0.6rem; font-weight: 600; cursor: pointer; border: 1px solid #3a3a3a; color: #999;
    }
    .rest-picker-actions .all-btn { border-color: #4a4a2a; color: #d6c46a; }
    .rest-picker-actions button:active { opacity: 0.6; }
    .rest-picker-hint { font-size: 0.55rem; color: #6d7f88; margin-top: 7px; line-height: 1.4; }
    .remove-btn {
      background: none; border: none; color: #f44336; font-size: 1.1rem; cursor: pointer;
      padding: 0; line-height: 1;
    }
    .remove-btn:active { opacity: 0.5; }

    /* Botões de adicionar */
    .add-btn {
      display: block; width: 100%; padding: 8px; border: 1px dashed #555;
      border-radius: 8px; background: none; color: #888; font-size: 0.75rem;
      cursor: pointer; margin-top: 6px; text-align: center;
    }
    .add-btn:active { border-color: #00bcd4; color: #00bcd4; }
    .add-exercise-btn { margin: 8px 0; }

    /* Botões de ação do exercício */
    .ex-actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; align-items: center; }
    .ex-action-btn {
      padding: 5px 10px; border: 1px solid #555; border-radius: 6px; background: none;
      color: #999; font-size: 0.65rem; cursor: pointer; white-space: nowrap;
    }
    .ex-action-btn.danger { border-color: #f44336; color: #f44336; }
    .ex-action-btn.group-active { border-color: #00bcd4; color: #00bcd4; }
    .ex-action-btn:active { opacity: 0.5; }

    /* Grupo visual no editor */
    .group-wrapper {
      border: 2px solid #00bcd4; border-radius: 14px;
      padding: 10px; margin-bottom: 10px;
    }
    .group-header {
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px; margin-bottom: 8px; min-height: 26px;
    }
    .group-header .group-label {
      color: #00bcd4; font-size: 0.75rem; font-weight: 700;
      letter-spacing: 0.5px; white-space: nowrap; line-height: 1.3;
    }
    .group-wrapper .exercise-item { margin: 0 0 8px; }
    .group-wrapper .exercise-item:last-child { margin-bottom: 0; }
    .ungroup-btn {
      background: none; border: 1px solid #f44336; color: #f44336;
      font-size: 0.65rem; padding: 4px 10px; border-radius: 8px; cursor: pointer;
      white-space: nowrap; flex-shrink: 0; line-height: 1.3;
    }
    .ungroup-btn:active { opacity: 0.5; }

    /* Salvar fixo */
    .save-bar {
      position: fixed; bottom: 0; left: 0; right: 0; background: #0d2137;
      border-top: 1px solid #1a3a4f; padding: 12px 16px; z-index: 100;
    }
    .save-bar button {
      width: 100%; padding: 14px; border: none; border-radius: 10px;
      background: #00bcd4; color: #000; font-weight: 700; font-size: 0.95rem; cursor: pointer;
    }
    .save-bar button:disabled { opacity: 0.5; }
    .save-bar button:active { opacity: 0.7; }

    .toast {
      position: fixed; bottom: 70px; left: 50%; transform: translateX(-50%);
      background: #00bcd4; color: #000; padding: 10px 20px; border-radius: 20px;
      font-size: 0.85rem; font-weight: 600; display: none; z-index: 1001;
    }
    .toast.error { background: #f44336; color: #fff; }
    .toast.show { display: block; animation: fadeOut 2.5s forwards; }
    @keyframes fadeOut { 0%,70% { opacity: 1; } 100% { opacity: 0; } }

    .loading { text-align: center; padding: 40px; color: #888; }

    /* Loading overlay */
    .loading-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(10,26,46,0.92); z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 16px; transition: opacity 0.3s;
    }
    .loading-overlay.hidden { opacity: 0; pointer-events: none; }
    .loading-spinner {
      width: 44px; height: 44px; border: 3px solid #1a3a4f;
      border-top-color: #00bcd4; border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { color: #999; font-size: 0.8rem; font-weight: 500; letter-spacing: 0.5px; }
  </style>
</head>
<body>
  <div class="loading-overlay" id="loadingOverlay">
    <div class="loading-spinner"></div>
    <div class="loading-text">Carregando...</div>
  </div>

  <div class="header">
    <button class="nav-btn left" id="backBtn" onclick="goBack()">← Voltar</button>
    <h1 id="heading">Novo Treino</h1>
    <div class="subtitle" id="studentName"></div>
  </div>

  <div class="title-section">
    <input type="text" class="title-input" id="planTitle" placeholder="Título do treino (ex: Hipertrofia)">
  </div>

  <div class="dates-row">
    <div class="date-field">
      <label>Data Início</label>
      <input type="date" id="planStartDate">
    </div>
    <div class="date-field">
      <label>Data Fim</label>
      <input type="date" id="planEndDate">
    </div>
  </div>

  <div class="options-row">
    <div class="opt-card on" id="activeCard">
      <div class="opt-text">
        <div class="opt-title">Enviar para o aluno</div>
        <div class="opt-sub" id="activeHint">Ao salvar, esta ficha fica ativa para o aluno.</div>
      </div>
      <label class="toggle">
        <input type="checkbox" id="planActive" checked onchange="onActiveChange()">
        <span class="toggle-slider"></span>
      </label>
    </div>
    <button class="import-open-btn" id="importOpenBtn" onclick="openImport()">⬇ Importar treino de outro aluno</button>
  </div>

  <div id="daysContainer"></div>

  <div class="save-bar">
    <button id="saveBtn" onclick="savePlan()">Salvar Treino</button>
  </div>

  <!-- Modal de importação -->
  <div class="modal" id="importModal">
    <div class="modal-content">
      <div class="modal-head">
        <h3 id="importTitle">Importar treino</h3>
        <button class="modal-x" onclick="closeImport()">✕</button>
      </div>
      <div class="modal-sub" id="importSub">Escolha de qual aluno copiar o treino.</div>

      <div id="importStep1">
        <input type="text" class="import-search" id="importSearch" placeholder="Buscar aluno..." oninput="renderImportStudents()">
        <div id="importStudents"></div>
      </div>

      <div id="importStep2" style="display:none;">
        <button class="back-link" onclick="showImportStep(1)">← Trocar aluno</button>
        <div id="importPlans"></div>
      </div>

      <div id="importStep3" style="display:none;">
        <button class="back-link" onclick="showImportStep(2)">← Escolher outro treino</button>
        <div id="importPreview"></div>
        <button class="confirm-btn" onclick="confirmImport()">✓ Usar este treino</button>
      </div>

      <button class="modal-close" onclick="closeImport()">Cancelar</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth-guard.js"></script>
<script>
function showLoading() { document.getElementById('loadingOverlay').classList.remove('hidden'); }
function hideLoading() { document.getElementById('loadingOverlay').classList.add('hidden'); }

const DAYS = ['Segunda','Terça','Quarta','Quinta','Sexta','Sábado','Domingo'];
let studentId = null;
let inviteId = null; // invite pendente (aluno ainda sem login)
let coachId = null;
let planId = null;              // preenchido quando editando um treino existente
let otherActivePlan = null;     // treino ativo do aluno diferente do que está aberto
let importStudentsCache = [];   // alunos do professor (exceto o alvo)
let importPlansCache = [];      // treinos do aluno escolhido no modal
let importSelectedPlan = null;  // treino escolhido para importar

const esc = (s) => { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; };

function showToast(text, isError) {
  const t = document.getElementById('toast');
  t.textContent = text;
  t.className = 'toast show' + (isError ? ' error' : '');
  setTimeout(() => t.className = 'toast', 2500);
}

// === Parâmetros da URL ===
function getParam(name) {
  return new URLSearchParams(location.search).get(name);
}

function goBack() {
  if (studentId) location.href = 'treinos.html?aluno=' + encodeURIComponent(studentId);
  else if (inviteId) location.href = 'treinos.html?invite=' + encodeURIComponent(inviteId);
  else location.href = 'professor.html';
}

// === Toggle "enviar para o aluno" ===
function onActiveChange() {
  const on = document.getElementById('planActive').checked;
  document.getElementById('activeCard').classList.toggle('on', on);
  updateActiveHint();
}

function updateActiveHint() {
  const on = document.getElementById('planActive').checked;
  const hint = document.getElementById('activeHint');
  if (!on) {
    hint.textContent = 'Fica salvo no histórico, mas o aluno não vê esta ficha.';
    return;
  }
  if (otherActivePlan) {
    hint.textContent = `Ao salvar, "${otherActivePlan.title || 'Treino'}" será desativado automaticamente.`;
  } else {
    hint.textContent = 'Ao salvar, esta ficha fica ativa para o aluno.';
  }
}

// === Estrutura padrão vazia ===
function emptyStructure() {
  const s = {};
  DAYS.forEach(d => s[d] = []);
  return s;
}

// === Renderizar editor ===
function renderEditor(structure) {
  const container = document.getElementById('daysContainer');
  container.innerHTML = '';
  DAYS.forEach(day => {
    const exercises = structure[day] || [];
    const acc = document.createElement('div');
    acc.className = 'day-accordion';
    acc.innerHTML = `
      <div class="day-header" onclick="this.parentElement.classList.toggle('open')">
        <span class="day-name">${day}</span>
        <span class="day-count">0 exercícios</span>
        <span class="arrow">▼</span>
      </div>
      <div class="day-body" id="body-${day}"></div>
    `;
    container.appendChild(acc);
    renderDayBody(day, exercises);
  });
}

// === Renderiza (ou re-renderiza) o corpo de um dia a partir da lista de exercícios ===
// Toda alteração de agrupamento passa por aqui: reconstruir o subtree evita
// artefatos de repaint do WebKit/iOS ao mover nós entre containers.
function renderDayBody(day, exercises) {
  const body = document.getElementById('body-' + day);
  // O seletor de descanso aponta para um input desta subtree: reconstruir
  // sem fechar deixaria ele preso a um campo que não existe mais.
  closeRestPicker();
  body.innerHTML = '';

  let i = 0;
  while (i < exercises.length) {
    const ex = exercises[i];
    if (ex.group) {
      // Coleta todos os consecutivos com mesmo group
      const groupId = ex.group;
      const groupExercises = [];
      const startIdx = i;
      while (i < exercises.length && exercises[i].group === groupId) {
        groupExercises.push(exercises[i]);
        i++;
      }
      // Grupo de 1 só exercício não faz sentido: renderiza solto
      if (groupExercises.length < 2) {
        delete groupExercises[0].group;
        body.appendChild(renderExercise(day, startIdx, groupExercises[0]));
        continue;
      }
      const wrapper = document.createElement('div');
      wrapper.className = 'group-wrapper';
      wrapper.dataset.groupId = groupId;
      updateGroupLabel(wrapper, groupExercises.length);
      groupExercises.forEach((gex, gi) => {
        const node = renderExercise(day, startIdx + gi, gex);
        // Só o último do grupo pode vincular ao próximo (estender para triset/giant set)
        if (gi < groupExercises.length - 1) {
          const linkBtn = node.querySelector('.link-btn');
          if (linkBtn) linkBtn.remove();
        }
        wrapper.appendChild(node);
      });
      body.appendChild(wrapper);
    } else {
      body.appendChild(renderExercise(day, i, ex));
      i++;
    }
  }

  // Botão adicionar exercício
  const addBtn = document.createElement('button');
  addBtn.className = 'add-btn add-exercise-btn';
  addBtn.textContent = '+ Adicionar exercício';
  addBtn.onclick = () => addExercise(day);
  body.appendChild(addBtn);

  updateDayCount(day);
}

// === Lê os exercícios de um dia direto do DOM (preserva o que foi digitado) ===
function readDay(day) {
  const body = document.getElementById('body-' + day);
  const out = [];
  [...body.children].forEach(child => {
    if (child.classList.contains('group-wrapper')) {
      const groupId = child.dataset.groupId || newGroupId();
      child.querySelectorAll('.exercise-item').forEach(item => {
        const ex = extractExerciseData(item);
        ex.group = groupId;
        out.push(ex);
      });
    } else if (child.classList.contains('exercise-item')) {
      out.push(extractExerciseData(child));
    }
  });
  return out;
}

function newGroupId() {
  return 'group-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6);
}

// === Índice do exercício na lista plana do dia ===
function flatIndexOf(item, day) {
  const body = document.getElementById('body-' + day);
  return [...body.querySelectorAll('.exercise-item')].indexOf(item);
}

function dayOf(item) {
  return item.closest('.day-body').id.replace('body-', '');
}

function renderExercise(day, idx, ex) {
  const div = document.createElement('div');
  div.className = 'exercise-item';
  div.dataset.day = day;
  div.dataset.idx = idx;

  let setsHtml = '';
  // Compatibilidade: a primeira versão guardava o descanso no exercício
  // (ex.rest). Se existir, cai como padrão nas séries que não têm o seu —
  // no próximo salvamento o plano já sai só com descanso por série.
  (ex.sets || []).forEach((set, si) => {
    setsHtml += renderSetHtml(si, Object.assign({}, set, { rest: set.rest || ex.rest || '' }));
  });

  div.innerHTML = `
    <div class="exercise-top">
      <input type="text" class="ex-name" value="${esc(ex.name || '')}" placeholder="Nome do exercício">
    </div>
    <div class="exercise-extras">
      <input type="url" class="ex-video" value="${esc(ex.video_url || '')}" placeholder="Link do vídeo (opcional)">
      <input type="text" class="ex-note" value="${esc(ex.note || '')}" placeholder="Nota (opcional)">
    </div>
    <div class="set-head">
      <span>Tipo</span><span>Reps</span><span>Desc. ▾</span><span>Nota</span><span></span>
    </div>
    <div class="sets-container">${setsHtml}</div>
    ${renderChips()}
    <button class="add-btn" onclick="addSet(this)">+ Adicionar set</button>
    <div class="ex-actions">
      <button class="ex-action-btn" onclick="moveExercise(this, -1)">↑</button>
      <button class="ex-action-btn" onclick="moveExercise(this, 1)">↓</button>
      <button class="ex-action-btn link-btn" onclick="linkToNext(this)">🔗 Vincular ao próximo</button>
      <button class="ex-action-btn danger" onclick="removeExercise(this)">Remover</button>
    </div>
  `;
  return div;
}

// =====================================================================
// Descanso — por SÉRIE, escolhido em um seletor por campo
// Cada set tem seu próprio intervalo (aquec 2min, hard 3min...). Antes havia
// uma fileira de chips que preenchia TODAS as séries de uma vez: tocar em
// "2min" para ajustar a última linha reescrevia as anteriores, que já estavam
// certas. Agora o próprio campo abre um seletor com os valores usuais e
// altera só aquela série; "todas as séries" continua existindo, mas como
// ação explícita dentro do seletor.
// Não entra em nenhuma métrica — é informação de execução para o aluno.
// =====================================================================
const REST_PRESETS = ['30s', '45s', '60s', '90s', '2min', '3min'];

// Campo que abriu o seletor. Fica guardado porque o seletor vive fora da
// linha (position: fixed) — dentro da coluna de 50px ele seria cortado.
let restPickerInput = null;

function ensureRestPicker() {
  let picker = document.getElementById('restPicker');
  if (picker) return picker;
  picker = document.createElement('div');
  picker.className = 'rest-picker';
  picker.id = 'restPicker';
  document.body.appendChild(picker);
  return picker;
}

function renderRestPicker() {
  const picker = ensureRestPicker();
  const atual = normalizeRest(restPickerInput ? restPickerInput.value : '');
  const opts = REST_PRESETS.map(p =>
    `<button type="button" class="rest-opt${p === atual ? ' on' : ''}" onclick="pickRest('${p}')">${p}</button>`
  ).join('');
  picker.innerHTML = `
    <div class="rest-picker-title">⏱ Descanso desta série</div>
    <div class="rest-picker-grid">${opts}</div>
    <div class="rest-picker-actions">
      <button type="button" onclick="pickRest('')">Limpar</button>
      <button type="button" class="all-btn" onclick="applyRestToAll()">Usar em todas</button>
    </div>
    <div class="rest-picker-hint">Ou digite direto no campo (ex: 60-90s, até recuperar).</div>
  `;
}

// Encaixa o seletor perto do campo. Prefere ACIMA: no celular o teclado
// abre por baixo e cobriria a lista.
function positionRestPicker() {
  const picker = ensureRestPicker();
  if (!restPickerInput) return;
  const r = restPickerInput.getBoundingClientRect();
  const vw = window.innerWidth;
  const vh = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
  const h = picker.offsetHeight || 190;
  const w = picker.offsetWidth || 216;

  let top = r.top - h - 8;
  if (top < 8) top = Math.min(r.bottom + 8, vh - h - 8);
  if (top < 8) top = 8;

  let left = r.left + r.width / 2 - w / 2;
  left = Math.max(8, Math.min(left, vw - w - 8));

  picker.style.top = top + 'px';
  picker.style.left = left + 'px';
}

function openRestPicker(input) {
  if (restPickerInput && restPickerInput !== input) restPickerInput.classList.remove('picking');
  restPickerInput = input;
  input.classList.add('picking');
  renderRestPicker();
  const picker = ensureRestPicker();
  picker.classList.add('show');
  positionRestPicker();
}

function closeRestPicker() {
  const picker = document.getElementById('restPicker');
  if (picker) picker.classList.remove('show');
  if (restPickerInput) restPickerInput.classList.remove('picking');
  restPickerInput = null;
}

// Preenche SÓ a série do campo aberto.
function pickRest(value) {
  if (!restPickerInput) return;
  restPickerInput.value = value;
  closeRestPicker();
}

// Atalho explícito para o caso comum ("mesmo descanso em tudo"): 1 toque
// preenche as séries do exercício. Diferente dos chips antigos, o professor
// pediu por isso — não acontece ao escolher um valor.
function applyRestToAll() {
  if (!restPickerInput) return;
  const value = restPickerInput.value.trim();
  if (!value) {
    showToast('Escolha um descanso antes de aplicar em todas as séries.', true);
    return;
  }
  const item = restPickerInput.closest('.exercise-item');
  if (item) item.querySelectorAll('.set-rest').forEach(i => { i.value = value; });
  closeRestPicker();
}

// Digitar no campo mantém o seletor aberto, só reacende a opção equivalente.
function onRestInput(input) {
  if (restPickerInput === input) renderRestPicker();
}

document.addEventListener('pointerdown', (e) => {
  if (!restPickerInput) return;
  const t = e.target;
  if (t === restPickerInput) return;
  if (t && t.closest && t.closest('.rest-picker')) return;
  closeRestPicker();
}, true);

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && restPickerInput) closeRestPicker();
});

// O seletor é fixed: sem reposicionar ele "descola" do campo ao rolar
// (e no celular focar o input já rola a página).
window.addEventListener('scroll', () => { if (restPickerInput) positionRestPicker(); }, true);
window.addEventListener('resize', () => { if (restPickerInput) positionRestPicker(); });

// '90' → '90s' · '1:30' → '1min30s' · '2m'/'2minutos' → '2min' · '90seg' → '90s'.
// Número puro é lido como SEGUNDOS (é como o professor fala: "descansa 90").
// Texto livre ('até recuperar', '60-90s') passa intacto, com os espaços.
function normalizeRest(raw) {
  const t = String(raw || '').trim().toLowerCase();
  if (!t) return '';
  const compact = t.replace(/\s+/g, '');
  if (/^\d+$/.test(compact)) return compact + 's';
  const mmss = compact.match(/^(\d+):([0-5]\d)$/);
  if (mmss) return mmss[2] === '00' ? mmss[1] + 'min' : `${mmss[1]}min${Number(mmss[2])}s`;
  const seg = compact.match(/^(\d+)s(eg(undos?)?)?$/);
  if (seg) return seg[1] + 's';
  const min = compact.match(/^(\d+)m(in(uto)?s?)?$/);
  if (min) return min[1] + 'min';
  return t;
}

// Rótulo curto do tipo, para o resumo caber em uma linha no celular.
function restLabel(type) {
  const t = String(type || '').trim().toLowerCase();
  if (t === 'feeder') return 'FED';
  if (!t) return 'SET';
  const first = t.split(/[^0-9a-záàâãéêíóôõúç]+/i)[0] || t;
  return first.slice(0, 6).toUpperCase();
}

// Resumo mostrado ao aluno: 'AQUEC-2min / FED-2min / HARD-3min'.
// Quando todas as séries têm o mesmo intervalo, devolve só o valor ('2min')
// e quem exibe usa o singular — repetir 5x o mesmo número é ruído.
function restSummary(sets, legacyRest) {
  const list = (sets || []).map(s => ({
    label: restLabel(s.type),
    rest: normalizeRest(s.rest || legacyRest || '')
  })).filter(x => x.rest);
  if (list.length === 0) return { text: '', uniform: false };
  const distintos = [...new Set(list.map(x => x.rest))];
  if (distintos.length === 1 && list.length === (sets || []).length) {
    return { text: distintos[0], uniform: true };
  }
  const vistos = new Set();
  const partes = [];
  list.forEach(x => {
    const chave = x.label + '|' + x.rest;
    if (vistos.has(chave)) return;
    vistos.add(chave);
    partes.push(`${x.label}-${x.rest}`);
  });
  return { text: partes.join(' / '), uniform: false };
}

// =====================================================================
// Cardio
// Set de cardio não tem carga×reps: tem TEMPO. O campo de prescrição é o
// mesmo (reps), mas o hint muda para '40min' e a linha ganha cor, para
// não haver dúvida do que preencher.
// =====================================================================
const CARDIO_HINT = '40min';
const REPS_HINT = '8-12';

function isCardioType(type) {
  return String(type || '').trim().toLowerCase() === 'cardio';
}

function syncSetRow(row) {
  if (!row) return false;
  const typeInput = row.querySelector('.set-type-input');
  const repsInput = row.querySelector('.set-reps');
  const cardio = isCardioType(typeInput ? typeInput.value : '');
  row.classList.toggle('is-cardio', cardio);
  if (repsInput) repsInput.placeholder = cardio ? CARDIO_HINT : REPS_HINT;
  return cardio;
}

function onSetTypeInput(input) {
  syncSetRow(input.closest('.set-item'));
}

function renderSetHtml(idx, set) {
  const cardio = isCardioType(set.type);
  return `
    <div class="set-item${cardio ? ' is-cardio' : ''}">
      <input type="text" class="set-type-input" value="${esc(set.type || '')}" placeholder="Tipo" oninput="onSetTypeInput(this)">
      <input type="text" class="set-reps" value="${esc(set.reps || '')}" placeholder="${cardio ? CARDIO_HINT : REPS_HINT}">
      <input type="text" class="set-rest" value="${esc(normalizeRest(set.rest))}" placeholder="90s" oninput="onRestInput(this)" onfocus="openRestPicker(this)" onclick="openRestPicker(this)">
      <input type="text" class="set-note" value="${esc(set.note || '')}" placeholder="Nota">
      <button class="remove-btn" onclick="removeSet(this)">×</button>
    </div>
  `;
}

function renderChips() {
  return `<div class="chips">
    <button class="chip" type="button" onclick="fillLastType(this, 'aquec')">AQUEC</button>
    <button class="chip" type="button" onclick="fillLastType(this, 'feeder')">FEEDER</button>
    <button class="chip" type="button" onclick="fillLastType(this, 'hard')">HARD</button>
    <button class="chip" type="button" onclick="fillLastType(this, 'serie')">SERIE</button>
    <button class="chip chip-cardio" type="button" onclick="fillLastType(this, 'cardio')">CARDIO</button>
  </div>`;
}

function fillLastType(btn, type) {
  const container = btn.closest('.exercise-item').querySelector('.sets-container');
  const inputs = container.querySelectorAll('.set-type-input');
  if (inputs.length === 0) return;
  const last = inputs[inputs.length - 1];
  last.value = type;
  syncSetRow(last.closest('.set-item'));
}

// Exercício sem nenhuma série não é executável: o card do aluno apareceria
// vazio e não haveria o que salvar. A última série não pode ser removida.
function removeSet(btn) {
  const item = btn.closest('.exercise-item');
  const container = item.querySelector('.sets-container');
  if (container.querySelectorAll('.set-item').length <= 1) {
    showToast('O exercício precisa de pelo menos 1 série. Remova o exercício inteiro se não for usar.', true);
    return;
  }
  btn.closest('.set-item').remove();
  closeRestPicker();
}

// === Adicionar exercício ===
function addExercise(day) {
  const body = document.getElementById('body-' + day);
  const items = body.querySelectorAll('.exercise-item');
  const idx = items.length;
  const addBtn = body.querySelector('.add-exercise-btn');
  const newEx = renderExercise(day, idx, { name: '', video_url: null, note: null, sets: [{ type: '', reps: '', rest: null, note: null }] });
  body.insertBefore(newEx, addBtn);
  updateDayCount(day);
  newEx.querySelector('.ex-name').focus();
}

// === Adicionar set ===
function addSet(btn) {
  const exItem = btn.closest('.exercise-item');
  const container = exItem.querySelector('.sets-container');
  // Herda o descanso da última série: quem prescreve 90s em tudo não digita
  // de novo, e quem quer diferente só sobrescreve aquele campo.
  const anteriores = container.querySelectorAll('.set-rest');
  const restHerdado = anteriores.length ? anteriores[anteriores.length - 1].value.trim() : '';
  const temp = document.createElement('div');
  temp.innerHTML = renderSetHtml(container.children.length, { type: '', reps: '', rest: restHerdado, note: null });
  container.appendChild(temp.firstElementChild);
  // Foca no campo de tipo do novo set
  container.lastElementChild.querySelector('.set-type-input').focus();
}

// === Remover exercício ===
function removeExercise(btn) {
  const item = btn.closest('.exercise-item');
  const day = dayOf(item);
  const list = readDay(day);
  const idx = flatIndexOf(item, day);
  if (idx < 0) return;
  list.splice(idx, 1);
  renderDayBody(day, list);
}

// === Mover exercício ===
function moveExercise(btn, dir) {
  const item = btn.closest('.exercise-item');
  const day = dayOf(item);
  const list = readDay(day);
  const idx = flatIndexOf(item, day);
  if (idx < 0) return;

  const groupId = list[idx].group;

  if (groupId) {
    // Move apenas dentro do próprio grupo
    let start = idx, end = idx;
    while (start > 0 && list[start - 1].group === groupId) start--;
    while (end < list.length - 1 && list[end + 1].group === groupId) end++;
    const target = idx + dir;
    if (target < start || target > end) return;
    [list[idx], list[target]] = [list[target], list[idx]];
  } else {
    // Move blocos (exercício solto ou grupo inteiro) no nível do dia
    const blocks = [];
    let i = 0;
    while (i < list.length) {
      if (list[i].group) {
        const g = list[i].group;
        const block = [];
        while (i < list.length && list[i].group === g) block.push(list[i++]);
        blocks.push(block);
      } else {
        blocks.push([list[i++]]);
      }
    }
    const bIdx = blocks.findIndex(b => b.includes(list[idx]));
    const bTarget = bIdx + dir;
    if (bTarget < 0 || bTarget >= blocks.length) return;
    [blocks[bIdx], blocks[bTarget]] = [blocks[bTarget], blocks[bIdx]];
    list.length = 0;
    blocks.flat().forEach(ex => list.push(ex));
  }

  renderDayBody(day, list);
}

// === Vincular exercício ao próximo (criar biset / estender para triset, giant set) ===
function linkToNext(btn) {
  const item = btn.closest('.exercise-item');
  const day = dayOf(item);
  const list = readDay(day);
  const idx = flatIndexOf(item, day);
  if (idx < 0) return;

  if (idx >= list.length - 1) {
    showToast('Não há exercício abaixo para vincular.', true);
    return;
  }

  const curGroup = list[idx].group || null;
  const nextGroup = list[idx + 1].group || null;

  if (curGroup && curGroup === nextGroup) {
    showToast('Esses exercícios já estão vinculados.', true);
    return;
  }

  // Reaproveita o grupo existente (de cima ou de baixo) para que funcione
  // vincular nos dois sentidos: biset → triset → giant set.
  const groupId = curGroup || nextGroup || newGroupId();

  // Todos os membros dos grupos envolvidos migram para o grupo final
  list.forEach(ex => {
    if (curGroup && ex.group === curGroup) ex.group = groupId;
    if (nextGroup && ex.group === nextGroup) ex.group = groupId;
  });
  list[idx].group = groupId;
  list[idx + 1].group = groupId;

  renderDayBody(day, list);
}

// === Cria o header (label + desvincular) do grupo ===
function updateGroupLabel(wrapper, count) {
  const oldHeader = wrapper.querySelector('.group-header');
  if (oldHeader) oldHeader.remove();

  const n = count || wrapper.querySelectorAll('.exercise-item').length;
  const label = n === 2 ? 'BISET' : n === 3 ? 'TRISET' : 'GIANT SET';

  const header = document.createElement('div');
  header.className = 'group-header';
  header.innerHTML = `<span class="group-label">🔗 ${label}</span>`;

  const ungroupBtn = document.createElement('button');
  ungroupBtn.className = 'ungroup-btn';
  ungroupBtn.type = 'button';
  ungroupBtn.textContent = '✕ Desvincular';
  ungroupBtn.onclick = () => ungroupExercises(wrapper);
  header.appendChild(ungroupBtn);

  wrapper.prepend(header);
}

// === Desvincular todos os exercícios de um grupo ===
function ungroupExercises(wrapper) {
  const day = wrapper.closest('.day-body').id.replace('body-', '');
  const groupId = wrapper.dataset.groupId;
  const list = readDay(day);
  list.forEach(ex => { if (ex.group === groupId) delete ex.group; });
  renderDayBody(day, list);
}

// === Atualizar contagem ===
function updateDayCount(day) {
  const acc = document.getElementById('body-' + day).parentElement;
  const count = acc.querySelectorAll('.exercise-item').length;
  acc.querySelector('.day-count').textContent = `${count} exercício${count !== 1 ? 's' : ''}`;
}

// === Coletar structure do DOM ===
function collectStructure() {
  const structure = {};
  DAYS.forEach(day => {
    const body = document.getElementById('body-' + day);
    structure[day] = [];

    // Itera pelos filhos diretos do body (exercícios soltos e grupos)
    const children = [...body.children].filter(el =>
      el.classList.contains('exercise-item') || el.classList.contains('group-wrapper')
    );

    children.forEach(child => {
      if (child.classList.contains('group-wrapper')) {
        const groupId = child.dataset.groupId || ('group-' + Date.now() + '-' + Math.random().toString(36).substr(2,4));
        const items = child.querySelectorAll('.exercise-item');
        items.forEach(item => {
          const ex = extractExerciseData(item);
          if (ex.name) { ex.group = groupId; structure[day].push(ex); }
        });
      } else {
        const ex = extractExerciseData(child);
        if (ex.name) structure[day].push(ex);
      }
    });
  });
  return structure;
}

function extractExerciseData(item) {
  const name = item.querySelector('.ex-name').value.trim();
  const video_url = item.querySelector('.ex-video').value.trim() || null;
  const note = item.querySelector('.ex-note').value.trim() || null;
  const sets = [...item.querySelectorAll('.set-item')].map(si => ({
    type: si.querySelector('.set-type-input').value.trim().toLowerCase(),
    reps: si.querySelector('.set-reps').value.trim(),
    rest: normalizeRest(si.querySelector('.set-rest').value) || null,
    note: si.querySelector('.set-note').value.trim() || null
  }));
  return { name, video_url, note, sets };
}

// Exercícios sem nenhuma série — treino assim não é executável: o card do
// aluno aparece vazio e não há o que registrar. Bloqueia o salvamento.
function emptySetOffenders(structure) {
  const out = [];
  DAYS.forEach(day => {
    (structure[day] || []).forEach(ex => {
      if (!ex.sets || ex.sets.length === 0) out.push({ day, name: ex.name || 'sem nome' });
    });
  });
  return out;
}

// === Salvar ===
async function savePlan() {
  const title = document.getElementById('planTitle').value.trim();
  const structure = collectStructure();
  const planStartDate = document.getElementById('planStartDate').value || null;
  const planEndDate = document.getElementById('planEndDate').value || null;
  const makeActive = document.getElementById('planActive').checked;

  // Validação básica
  const totalEx = Object.values(structure).reduce((sum, d) => sum + d.length, 0);
  if (totalEx === 0) { showToast('Adicione pelo menos um exercício.', true); return; }

  const semSets = emptySetOffenders(structure);
  if (semSets.length > 0) {
    const primeiro = semSets[0];
    const resto = semSets.length > 1 ? ` (e mais ${semSets.length - 1})` : '';
    showToast(`"${primeiro.name}" em ${primeiro.day} está sem série${resto}. Adicione ao menos 1 ou remova o exercício.`, true);
    return;
  }

  const btn = document.getElementById('saveBtn');
  btn.disabled = true;
  btn.textContent = 'Salvando...';

  try {
    // Só 1 treino ativo por aluno (índice único no banco): desativa os outros antes
    if (makeActive) {
      let q = _sb.from('workout_plans')
        .update({ is_active: false })
        .eq('is_active', true);
      if (studentId) q = q.eq('student_id', studentId);
      else if (inviteId) q = q.eq('invite_id', inviteId);
      if (planId) q = q.neq('id', planId);
      const { error } = await q;
      if (error) throw error;
    }

    if (planId) {
      // Edição: atualiza o treino existente (mantém o histórico limpo)
      const { error } = await _sb.from('workout_plans').update({
        title: title || 'Treino',
        structure,
        is_active: makeActive,
        plan_start_date: planStartDate,
        plan_end_date: planEndDate
      }).eq('id', planId);
      if (error) throw error;
    } else {
      // Criação: insere um novo treino no histórico do aluno
      const insertData = {
        coach_id: coachId,
        title: title || 'Treino',
        structure,
        is_active: makeActive,
        plan_start_date: planStartDate,
        plan_end_date: planEndDate
      };
      if (studentId) insertData.student_id = studentId;
      else if (inviteId) insertData.invite_id = inviteId;

      const { data, error } = await _sb.from('workout_plans').insert(insertData).select('id').maybeSingle();
      if (error) throw error;
      // Passa para modo edição: salvar de novo não duplica o treino
      if (data && data.id) {
        planId = data.id;
        document.getElementById('heading').textContent = 'Editar Treino';
        history.replaceState(null, '', 'editor.html?plan=' + encodeURIComponent(planId));
      }
    }

    otherActivePlan = makeActive ? null : otherActivePlan;
    updateActiveHint();
    showToast(makeActive ? 'Treino salvo e enviado ao aluno!' : 'Treino salvo no histórico (inativo).');
    btn.textContent = '✓ Salvo!';
    setTimeout(() => { btn.textContent = 'Salvar Treino'; btn.disabled = false; }, 1500);
  } catch (e) {
    showToast('Erro: ' + e.message, true);
    btn.textContent = 'Salvar Treino';
    btn.disabled = false;
  }
}

// =====================================================================
// Importar treino de outro aluno
// Copia apenas a PRESCRIÇÃO (título + estrutura). Nenhum registro de
// execução (workout_logs) é copiado — o histórico do aluno é dele.
// =====================================================================
function openImport() {
  document.getElementById('importModal').classList.add('show');
  showImportStep(1);
  if (importStudentsCache.length === 0) loadImportStudents();
}

function closeImport() {
  document.getElementById('importModal').classList.remove('show');
}

function showImportStep(n) {
  document.getElementById('importStep1').style.display = n === 1 ? 'block' : 'none';
  document.getElementById('importStep2').style.display = n === 2 ? 'block' : 'none';
  document.getElementById('importStep3').style.display = n === 3 ? 'block' : 'none';
  const titles = { 1: 'Importar treino', 2: 'Treinos do aluno', 3: 'Confirmar importação' };
  const subs = {
    1: 'Escolha de qual aluno copiar o treino.',
    2: 'Toque no treino que deseja copiar.',
    3: 'Revise o treino antes de trazer para o editor.'
  };
  document.getElementById('importTitle').textContent = titles[n];
  document.getElementById('importSub').textContent = subs[n];
}

async function loadImportStudents() {
  const box = document.getElementById('importStudents');
  box.innerHTML = '<div class="modal-empty">Carregando alunos...</div>';

  const { data, error } = await _sb.from('profiles')
    .select('id, full_name, gym_name')
    .eq('coach_id', coachId)
    .eq('role', 'student')
    .eq('is_deleted', false)
    .order('full_name', { ascending: true });

  if (error) { box.innerHTML = '<div class="modal-empty">Erro ao carregar alunos.</div>'; return; }

  // Exclui o aluno alvo da lista
  const others = (data || []).filter(s => s.id !== studentId);

  // Mantém só quem tem treino cadastrado (evita beco sem saída no fluxo)
  if (others.length > 0) {
    const { data: rows } = await _sb.from('workout_plans')
      .select('student_id')
      .in('student_id', others.map(s => s.id));
    const counts = {};
    (rows || []).forEach(r => { counts[r.student_id] = (counts[r.student_id] || 0) + 1; });
    importStudentsCache = others
      .filter(s => counts[s.id])
      .map(s => Object.assign({}, s, { plan_count: counts[s.id] }));
  } else {
    importStudentsCache = [];
  }

  renderImportStudents();
}

function renderImportStudents() {
  const box = document.getElementById('importStudents');
  const term = (document.getElementById('importSearch').value || '').trim().toLowerCase();
  const list = term
    ? importStudentsCache.filter(s => (s.full_name || '').toLowerCase().includes(term))
    : importStudentsCache;

  if (importStudentsCache.length === 0) {
    box.innerHTML = '<div class="modal-empty">Nenhum outro aluno seu tem treino cadastrado ainda.</div>';
    return;
  }
  if (list.length === 0) {
    box.innerHTML = '<div class="modal-empty">Nenhum aluno encontrado.</div>';
    return;
  }

  box.innerHTML = list.map(s => {
    const initial = (s.full_name || '?').trim().charAt(0).toUpperCase();
    const meta = [
      `${s.plan_count} treino${s.plan_count !== 1 ? 's' : ''}`,
      s.gym_name || null
    ].filter(Boolean).join(' · ');
    return `
      <button class="pick-item" onclick="pickImportStudent('${s.id}')">
        <span class="pick-avatar">${esc(initial)}</span>
        <span class="pick-body">
          <span class="pick-title">${esc(s.full_name || 'Aluno')}</span>
          <span class="pick-meta">${esc(meta)}</span>
        </span>
        <span class="pick-arrow">›</span>
      </button>
    `;
  }).join('');
}

async function pickImportStudent(sourceStudentId) {
  showImportStep(2);
  const box = document.getElementById('importPlans');
  box.innerHTML = '<div class="modal-empty">Carregando treinos...</div>';

  const { data, error } = await _sb.from('workout_plans')
    .select('id, title, structure, is_active, plan_start_date, plan_end_date, created_at')
    .eq('student_id', sourceStudentId)
    .order('is_active', { ascending: false })
    .order('created_at', { ascending: false });

  if (error) { box.innerHTML = '<div class="modal-empty">Erro ao carregar treinos.</div>'; return; }

  importPlansCache = data || [];
  if (importPlansCache.length === 0) {
    box.innerHTML = '<div class="modal-empty">Esse aluno não tem treino cadastrado.<br>Escolha outro aluno.</div>';
    return;
  }

  box.innerHTML = importPlansCache.map(p => {
    const total = countExercises(p.structure);
    const days = activeDays(p.structure);
    const created = new Date(p.created_at).toLocaleDateString('pt-BR');
    return `
      <button class="pick-item" onclick="pickImportPlan('${p.id}')">
        <span class="pick-body">
          <span class="pick-title">${esc(p.title || 'Treino')}${p.is_active ? '<span class="pick-badge">ATIVO</span>' : ''}</span>
          <span class="pick-meta">${total} exercício${total !== 1 ? 's' : ''} · ${days.length} dia${days.length !== 1 ? 's' : ''} · ${created}</span>
        </span>
        <span class="pick-arrow">›</span>
      </button>
    `;
  }).join('');
}

function countExercises(structure) {
  if (!structure) return 0;
  return DAYS.reduce((sum, d) => sum + (Array.isArray(structure[d]) ? structure[d].length : 0), 0);
}

function activeDays(structure) {
  if (!structure) return [];
  return DAYS.filter(d => Array.isArray(structure[d]) && structure[d].length > 0);
}

function pickImportPlan(sourcePlanId) {
  const p = importPlansCache.find(x => x.id === sourcePlanId);
  if (!p) return;
  importSelectedPlan = p;
  showImportStep(3);

  const st = p.structure || {};
  let html = `<div class="pick-title" style="margin-bottom:10px;">${esc(p.title || 'Treino')}</div>`;
  DAYS.forEach(day => {
    const list = Array.isArray(st[day]) ? st[day] : [];
    if (list.length === 0) return;
    let exHtml = '';
    list.forEach(ex => {
      const sets = (ex.sets || []).map(s => `${(s.type || '').toUpperCase()} ${s.reps || ''}`.trim()).join(' | ');
      const descanso = restSummary(ex.sets, ex.rest);
      const meta = [sets, descanso.text ? '⏱ ' + descanso.text : ''].filter(Boolean).join(' · ');
      exHtml += `<div class="preview-ex">${ex.group ? '🔗 ' : ''}${esc(ex.name || '')}${meta ? `<div class="sets">${esc(meta)}</div>` : ''}</div>`;
    });
    html += `<div class="preview-day"><h4>${day} · ${list.length} ex.</h4>${exHtml}</div>`;
  });
  document.getElementById('importPreview').innerHTML = html;
}

function confirmImport() {
  if (!importSelectedPlan) return;
  // Cópia profunda: nada do plano de origem fica referenciado
  const copy = JSON.parse(JSON.stringify(importSelectedPlan.structure || {}));
  const structure = emptyStructure();
  DAYS.forEach(d => { if (Array.isArray(copy[d])) structure[d] = copy[d]; });

  const currentTitle = document.getElementById('planTitle').value.trim();
  if (!currentTitle) document.getElementById('planTitle').value = importSelectedPlan.title || 'Treino';

  renderEditor(structure);
  closeImport();
  showToast('Treino importado — revise e toque em Salvar.');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// === Inicialização ===
guard('trainer', {
  onReady: async (session, profile) => {
    showLoading();
    coachId = profile.id;
    planId = getParam('plan');
    studentId = getParam('aluno');
    inviteId = getParam('invite');

    let plan = null;

    if (planId) {
      // Modo edição: o aluno vem do próprio treino
      const { data } = await _sb.from('workout_plans')
        .select('id, student_id, invite_id, title, structure, is_active, plan_start_date, plan_end_date')
        .eq('id', planId)
        .maybeSingle();
      if (!data) {
        hideLoading();
        document.getElementById('daysContainer').innerHTML = '<div class="loading">Treino não encontrado.<br><a href="professor.html" style="color:#00bcd4;">Voltar</a></div>';
        return;
      }
      plan = data;
      studentId = data.student_id;
      inviteId = data.invite_id;
      document.getElementById('heading').textContent = 'Editar Treino';
    }

    if (!studentId && !inviteId) {
      hideLoading();
      document.getElementById('daysContainer').innerHTML = '<div class="loading">Nenhum aluno selecionado.<br><a href="professor.html" style="color:#00bcd4;">Voltar</a></div>';
      return;
    }

    // Nome do aluno
    if (studentId) {
      const { data: student } = await _sb.from('profiles')
        .select('full_name')
        .eq('id', studentId)
        .maybeSingle();
      document.getElementById('studentName').textContent = student?.full_name || '';
    } else if (inviteId) {
      const { data: invite } = await _sb.from('invites')
        .select('full_name')
        .eq('id', inviteId)
        .maybeSingle();
      document.getElementById('studentName').textContent = (invite?.full_name || '') + ' (pendente)';
    }

    // Treino ativo do aluno (para avisar que será substituído)
    let activeQuery = _sb.from('workout_plans')
      .select('id, title')
      .eq('is_active', true);
    if (studentId) activeQuery = activeQuery.eq('student_id', studentId);
    else if (inviteId) activeQuery = activeQuery.eq('invite_id', inviteId);

    const { data: active } = await activeQuery.maybeSingle();
    otherActivePlan = (active && active.id !== planId) ? active : null;

    const today = new Date().toISOString().split('T')[0];
    if (plan) {
      document.getElementById('planTitle').value = plan.title || '';
      document.getElementById('planStartDate').value = plan.plan_start_date || '';
      document.getElementById('planEndDate').value = plan.plan_end_date || '';
      document.getElementById('planActive').checked = !!plan.is_active;
      renderEditor(plan.structure || emptyStructure());
    } else {
      document.getElementById('planTitle').value = '';
      document.getElementById('planStartDate').value = today;
      document.getElementById('planEndDate').value = '';
      document.getElementById('planActive').checked = true;
      renderEditor(emptyStructure());
    }
    onActiveChange();

    hideLoading();

    // Abertura direta do modal de importação (vindo de treinos.html)
    if (getParam('importar') === '1') openImport();
  },
  onBlocked: () => { location.replace('login.html'); }
});
