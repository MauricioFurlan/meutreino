<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Painel do Professor</title>
  <meta name="theme-color" content="#00d5ff">
  <!-- PWA: precisa estar em TODAS as páginas, senão o iOS mostra a barra do
       Safari ao navegar dentro do app instalado (modo standalone) -->
  <link rel="manifest" href="/manifest-pro.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MeuTreino Pro">
  <link rel="icon" type="image/png" href="/icon-pro-192.png">
  <link rel="apple-touch-icon" href="/icon-pro-192.png">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; connect-src 'self' https://*.supabase.co; img-src 'self' data:;">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body::-webkit-scrollbar, *::-webkit-scrollbar { display: none; }
    body, * { scrollbar-width: none; }
    /* Mesma escala tipográfica do index.html (tela do aluno) — mantém os
       dois lados do app com a mesma hierarquia de tamanhos de texto. */
    :root {
      --fs-2xs: 0.65rem;
      --fs-xs: 0.7rem;
      --fs-sm: 0.75rem;
      --fs-base: 0.8rem;
      --fs-md: 0.85rem;
      --fs-lg: 0.9rem;
      --fs-xl: 1rem;
      --fs-2xl: 1.1rem;
      --fs-3xl: 1.3rem;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #08090c; color: #f0f0f0; min-height: 100vh; padding-bottom: 40px;
    }
    .header {
      background: #101419; padding: 16px; text-align: center;
      border-bottom: 1px solid #232a33; position: relative;
    }
    .header h1 { font-size: var(--fs-2xl); color: #00d5ff; letter-spacing: 1px; }
    .header .subtitle { font-size: var(--fs-base); color: #999; margin-top: 4px; }
    .logout-btn {
      position: absolute; top: 14px; right: 14px; background: none; border: 1px solid #555;
      color: #999; font-size: var(--fs-2xs); padding: 4px 10px; border-radius: 12px; cursor: pointer;
    }
    .logout-btn:active { opacity: 0.6; }
    .section { padding: 16px; overflow: hidden; }
    .section-title { font-size: var(--fs-md); color: #00d5ff; font-weight: 700; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px; }

    /* Alertas */
    .alert-card { background: #0c1015; border: 1px solid #00d5ff; border-radius: 10px; padding: 12px; margin-bottom: 8px; }
    .alert-card.expired { background: #2a0000; border-color: #f44336; }
    .alert-card.plan-expiring { background: #1a1a00; border-color: #ff9800; }
    .alert-card.plan-expiring.expired { background: #2a0000; border-color: #f44336; }
    .alert-card .name { font-weight: 600; font-size: var(--fs-lg); }
    .alert-card .info { font-size: var(--fs-sm); color: #ccc; margin-top: 2px; }

    /* Lista de alunos */
    .student-card {
      background: #101419; border: 1px solid #232a33; border-radius: 12px;
      padding: 14px; margin-bottom: 10px; position: relative;
    }
    .student-card.suspended { opacity: 0.5; }
    .student-card.pending {
      border: 1px dashed #00d5ff; background: #08090c; opacity: 0.85;
    }
    .pending-badge {
      display: inline-block; font-size: var(--fs-2xs); padding: 2px 8px; border-radius: 10px;
      background: #0c1015; color: #00d5ff; font-weight: 600; margin-left: 8px;
      letter-spacing: 0.3px; vertical-align: middle;
    }
    .student-card .toggle-wrap {
      position: absolute; top: 14px; right: 14px; z-index: 2;
    }
    .delete-x {
      position: absolute; bottom: 12px; right: 14px;
      background: none; border: none; color: #f44336; font-size: 1.4rem;
      cursor: pointer; line-height: 1; opacity: 0.5; padding: 0; z-index: 2;
    }
    .delete-x:active { opacity: 1; }
    .student-avatar {
      width: 38px; height: 38px; border-radius: 50%; background: #232a33;
      display: flex; align-items: center; justify-content: center;
      font-size: var(--fs-lg); font-weight: 700; color: #00d5ff; flex-shrink: 0;
    }
    .student-info { min-width: 0; padding-right: 50px; }
    /* Flex para o nome truncar sozinho e o lápis + foguinho nunca serem cortados */
    .student-name { font-size: var(--fs-lg); font-weight: 600; display: flex; align-items: center; gap: 4px; min-width: 0; }
    .student-name-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    .edit-icon { background: none; border: none; font-size: var(--fs-sm); cursor: pointer; padding: 2px 4px; vertical-align: middle; opacity: 0.7; flex-shrink: 0; }
    .edit-icon:active { opacity: 1; }

    /* Sequência (foguinho) ao lado do lápis: leitura rápida de quem está treinando */
    .streak-chip {
      display: inline-flex; align-items: center; gap: 3px; flex-shrink: 0;
      font-size: var(--fs-xs); font-weight: 700; color: #ff9800;
      background: #0c1015; border: 1px solid #1c3d47;
      padding: 2px 7px; border-radius: 10px; line-height: 1.4;
    }
    .streak-chip .flame { font-size: var(--fs-base); line-height: 1; }
    .streak-chip.cold { color: #777; background: #1f1f1f; border-color: #232a33; }
    .streak-chip.cold .flame { filter: grayscale(1) opacity(0.5); }
    .student-meta { font-size: var(--fs-xs); color: #999; margin-top: 2px; }
    .student-meta .gym { color: #888; }
    .student-status { font-size: var(--fs-2xs); padding: 3px 8px; border-radius: 10px; font-weight: 600; flex-shrink: 0; }
    .student-status.active { background: #1b3a1b; color: #4caf50; }
    .student-status.expired { background: #3a1b1b; color: #f44336; }
    .student-status.suspended { background: #161b22; color: #888; }

    /* Botões de ação */
    .actions { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
    .action-btn {
      padding: 6px 12px; border: 1px solid #555; border-radius: 8px; background: none;
      color: #ccc; font-size: var(--fs-xs); cursor: pointer; font-weight: 500;
    }
    .action-btn:active { opacity: 0.6; }
    .action-btn.danger { border-color: #f44336; color: #f44336; }
    .action-btn.success { border-color: #4caf50; color: #4caf50; }

    /* Toggle switch */
    .toggle { position: relative; display: block; width: 36px; height: 20px; flex-shrink: 0; }
    .toggle input { display: none; }
    .toggle-slider {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background: #666; border-radius: 20px; cursor: pointer; transition: 0.2s;
    }
    .toggle-slider::before {
      content: ''; position: absolute; width: 16px; height: 16px;
      left: 2px; bottom: 2px; background: #fff; border-radius: 50%; transition: 0.2s;
    }
    .toggle input:checked + .toggle-slider { background: #4caf50; }
    .toggle input:checked + .toggle-slider::before { transform: translateX(16px); }

    /* Formulário */
    .form-section { background: #101419; border: 1px solid #232a33; border-radius: 12px; margin-bottom: 16px; overflow: hidden; }
    .form-section h3 {
      font-size: var(--fs-lg); color: #00d5ff; padding: 14px 16px; margin: 0; cursor: pointer;
      display: flex; align-items: center; justify-content: space-between;
    }
    .form-section h3::after { content: '▼'; font-size: var(--fs-2xs); color: #888; transition: transform 0.2s; }
    .form-section.open h3::after { transform: rotate(180deg); }
    .form-body { display: none; padding: 0 16px 16px; overflow: hidden; }
    .form-section.open .form-body { display: block; }
    .form-group { margin-bottom: 12px; overflow: hidden; }
    .form-group label { display: block; font-size: var(--fs-xs); color: #999; margin-bottom: 4px; text-transform: uppercase; font-weight: 600; }
    .form-group input, .form-group select {
      width: 100%; max-width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #232a33;
      background: #08090c; color: #fff; font-size: 16px; box-sizing: border-box;
      -webkit-appearance: none; appearance: none;
    }
    .form-group input[type="date"] { min-width: 0; }
    .form-group input:focus, .form-group select:focus { outline: none; border-color: #00d5ff; }
    .submit-btn {
      width: 100%; padding: 14px; border: none; border-radius: 10px;
      background: #00d5ff; color: #000; font-weight: 700; font-size: var(--fs-lg); cursor: pointer;
    }
    .submit-btn:disabled { opacity: 0.5; }
    .submit-btn:active { opacity: 0.7; }

    /* Modal de renovação */
    .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.9); z-index: 1000; align-items: center; justify-content: center; padding: 16px; }
    .modal.show { display: flex; }
    .modal-content { background: #101419; border-radius: 12px; padding: 20px; width: 100%; max-width: 360px; border: 1px solid #232a33; }
    .modal-content h3 { color: #00d5ff; font-size: var(--fs-lg); margin-bottom: 14px; }
    .modal-close { width: 100%; padding: 10px; border: none; border-radius: 8px; background: #161b22; color: #999; font-weight: 600; font-size: var(--fs-md); cursor: pointer; margin-top: 12px; }

    .toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: #00d5ff; color: #000; padding: 10px 20px; border-radius: 20px;
      font-size: var(--fs-md); font-weight: 600; display: none; z-index: 1001;
    }
    .toast.error { background: #f44336; color: #fff; }
    .toast.show { display: block; animation: fadeOut 2.5s forwards; }
    @keyframes fadeOut { 0%,70% { opacity: 1; } 100% { opacity: 0; } }

    .empty-state { text-align: center; padding: 30px; color: #666; font-size: var(--fs-md); }
    .nav-link { display: block; text-align: center; margin-top: 12px; color: #00d5ff; font-size: var(--fs-base); text-decoration: underline; cursor: pointer; }

    /* Info de sessão de treino */
    .session-info {
      display: flex; align-items: center; gap: 6px; margin-top: 6px;
      font-size: var(--fs-xs); color: #4caf50; font-weight: 600;
    }
    .session-info.in-progress { color: #00d5ff; }
    .session-info .dot {
      width: 8px; height: 8px; border-radius: 50%; background: #4caf50;
      flex-shrink: 0;
    }
    .session-info.in-progress .dot {
      background: #00d5ff;
      animation: pulse 1.2s infinite;
    }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

    /* Birthday badge */
    .birthday-badge {
      display: inline-flex; align-items: center; gap: 3px; flex-shrink: 0;
      font-size: var(--fs-2xs); font-weight: 700; color: #e91e63;
      background: #2a0a1a; border: 1px solid #5a1a3a;
      padding: 2px 7px; border-radius: 10px; line-height: 1.4;
      margin-left: 4px;
    }
    .birthday-badge.today {
      color: #fff; background: #e91e63; border-color: #e91e63;
      animation: birthdayPulse 1.5s infinite;
    }
    @keyframes birthdayPulse { 0%,100% { opacity: 1; } 50% { opacity: 0.7; } }

    /* Loading overlay */
    .loading-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(13,13,13,0.92); z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 16px; transition: opacity 0.3s;
    }
    .loading-overlay.hidden { opacity: 0; pointer-events: none; }
    .loading-spinner {
      width: 44px; height: 44px; border: 3px solid #232a33;
      border-top-color: #00d5ff; border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { color: #999; font-size: var(--fs-base); font-weight: 500; letter-spacing: 0.5px; }

    /* Acima da largura de um celular a tela esticava de ponta a ponta —
       aqui o painel vira uma coluna centralizada, como o index.html. */
    @media (min-width: 640px) {
      .header, .section {
        max-width: 480px;
        margin-left: auto;
        margin-right: auto;
      }
    }
  </style>
  <!-- Camada de identidade visual (precisa vir DEPOIS do <style> inline) -->
  <link rel="stylesheet" href="brand.css">
</head>
<body>
  <div class="loading-overlay" id="loadingOverlay">
    <div class="loading-spinner"></div>
    <div class="loading-text">Carregando...</div>
  </div>

  <div class="header">
    <button class="logout-btn" onclick="location.href='login.html?logout'">Sair</button>
    <h1 id="greeting">Painel do Professor</h1>
    <div class="subtitle" id="subtitle"></div>
  </div>

  <!-- Alertas -->
  <div class="section" id="alertsSection" style="display:none;">
    <div class="section-title">⚠️ Atenção</div>
    <div id="alertsList"></div>
  </div>

  <!-- Criar aluno -->
  <div class="section">
    <div class="form-section" id="createForm">
      <h3 onclick="this.parentElement.classList.toggle('open')">+ Novo Aluno</h3>
      <div class="form-body">
        <div class="form-group">
          <label>Nome completo</label>
          <input type="text" id="newName" placeholder="Nome do aluno">
        </div>
        <div class="form-group">
          <label>E-mail</label>
          <input type="email" id="newEmail" inputmode="email" placeholder="email@exemplo.com">
        </div>
        <div class="form-group">
          <label>Academia</label>
          <input type="text" id="newGym" placeholder="Nome da academia (opcional)">
        </div>
        <div class="form-group">
          <label>Duração (meses)</label>
          <input type="number" id="newMonths" inputmode="numeric" value="3" min="1" max="24">
        </div>
        <div class="form-group">
          <label>Data de nascimento</label>
          <input type="date" id="newBirth">
        </div>
        <div class="form-group">
          <label>Sexo</label>
          <select id="newSex">
            <option value="">-</option>
            <option value="M">Masculino</option>
            <option value="F">Feminino</option>
          </select>
        </div>
        <button class="submit-btn" id="createBtn" onclick="createStudent()">Cadastrar Aluno</button>
      </div>
    </div>
  </div>

  <!-- Lista de alunos -->
  <div class="section">
    <div class="section-title">Meus Alunos <span id="studentCountInfo" style="font-weight:400;color:#888;font-size: var(--fs-xs);"></span></div>
    <div id="studentsList"></div>
  </div>

  <!-- Link para acompanhamento (movido para dentro do card do aluno futuramente) -->

  <!-- Modal de renovação -->
  <div class="modal" id="renewModal">
    <div class="modal-content">
      <h3>Renovar Prazo</h3>
      <div class="form-group">
        <label>Aluno</label>
        <input type="text" id="renewName" disabled>
      </div>
      <div class="form-group">
        <label>Acrescentar meses</label>
        <input type="number" id="renewMonths" inputmode="numeric" value="3" min="1" max="24">
      </div>
      <button class="submit-btn" onclick="confirmRenew()">Renovar</button>
      <button class="modal-close" onclick="closeRenewModal()">Cancelar</button>
    </div>
  </div>

  <!-- Modal de edição do aluno -->
  <div class="modal" id="editModal">
    <div class="modal-content">
      <h3>Editar Aluno</h3>
      <div class="form-group">
        <label>E-mail</label>
        <input type="text" id="editEmail" readonly style="color:#888; border-color:#222; cursor:not-allowed;">
      </div>
      <div class="form-group">
        <label>Nome completo</label>
        <input type="text" id="editName">
      </div>
      <div class="form-group">
        <label>Academia</label>
        <input type="text" id="editGym" placeholder="Nome da academia">
      </div>
      <div class="form-group">
        <label>Data de nascimento</label>
        <input type="date" id="editBirth">
      </div>
      <div class="form-group">
        <label>Sexo</label>
        <select id="editSex">
          <option value="">-</option>
          <option value="M">Masculino</option>
          <option value="F">Feminino</option>
        </select>
      </div>
      <button class="submit-btn" onclick="confirmEdit()">Salvar</button>
      <button class="modal-close" onclick="closeEditModal()">Cancelar</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth-guard.js"></script>
<!-- Cálculos compartilhados (sequência, datas, cardio, volume) -->
<script src="/metrics.js"></script>
<script>
let myId = null;
let students = [];
let pendingInvites = [];
let maxStudents = 20;
let sessionsMap = {}; // student_id -> { started_at, ended_at, duration_seconds }
let streakMap = {};   // student_id -> { current, best, hitWindowEdge, lastTrained }
let planEndMap = {};  // student_id -> plan_end_date (do plano ativo)
let streakLoadedFor = ''; // assinatura da lista de alunos já processada

// Ordem alfabética tolerante a acento/maiúscula ("Ávila" antes de "Bruno", "ana" antes de "Bruno")
const byName = (a, b) => (a.full_name || '').localeCompare(b.full_name || '', 'pt-BR', { sensitivity: 'base' });

function showLoading() { document.getElementById('loadingOverlay').classList.remove('hidden'); }
function hideLoading() { document.getElementById('loadingOverlay').classList.add('hidden'); }

const esc = (s) => { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; };

function showToast(text, isError) {
  const t = document.getElementById('toast');
  t.textContent = text;
  t.className = 'toast show' + (isError ? ' error' : '');
  setTimeout(() => t.className = 'toast', 2500);
}

function updateStudentCount() {
  const activeCount = students.filter(s => s.status === 'active').length;
  const el = document.getElementById('studentCountInfo');
  if (el) el.textContent = `${activeCount} / ${maxStudents} alunos`;
}

// === Carregar convites pendentes ===
async function loadPendingInvites() {
  const { data, error } = await _sb.from('invites')
    .select('id, full_name, email, gym_name, created_at')
    .eq('coach_id', myId)
    .eq('role', 'student')
    .eq('redeemed', false)
    .order('created_at', { ascending: false });
  if (error) { console.log('Erro ao carregar invites:', error); return; }
  pendingInvites = (data || []).sort(byName);
}

// === Carregar sessões de treino de hoje ===
async function loadTodaySessions() {
  const today = new Date().toISOString().split('T')[0];
  const studentIds = students.map(s => s.id);
  if (studentIds.length === 0) { sessionsMap = {}; return; }

  const { data, error } = await _sb.from('workout_sessions')
    .select('student_id, started_at, ended_at, duration_seconds')
    .in('student_id', studentIds)
    .gte('started_at', today + 'T00:00:00')
    .lte('started_at', today + 'T23:59:59')
    .order('started_at', { ascending: false });

  sessionsMap = {};
  if (!error && data) {
    data.forEach(s => {
      // Pega apenas a sessão mais recente do dia de cada aluno
      if (!sessionsMap[s.student_id]) {
        sessionsMap[s.student_id] = s;
      }
    });
  }
}

function formatSessionDuration(seconds) {
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  if (h > 0) return `${h}h${String(m).padStart(2,'0')}min`;
  return `${m}min`;
}

function getSessionHtml(studentId) {
  const session = sessionsMap[studentId];
  if (!session) return '';
  if (!session.ended_at) {
    // Em andamento
    const started = new Date(session.started_at);
    const elapsed = Math.floor((Date.now() - started.getTime()) / 1000);
    return `<div class="session-info in-progress"><span class="dot"></span>🏋️ Treinando agora · ${formatSessionDuration(elapsed)}</div>`;
  }
  // Concluído
  return `<div class="session-info"><span class="dot"></span>✅ Treinou hoje · ${formatSessionDuration(session.duration_seconds)}</div>`;
}

// =====================================================================
// SEQUÊNCIA (foguinho)
// A regra vive em metrics.js (computeStreak): conta só os DIAS DE TREINO
// PRESCRITOS, descanso não conta e não quebra, hoje sem registro fica pendente.
// DAYS, toLocalISO e isTrainingDate também vêm de lá.
// =====================================================================
// Janela menor que a da tela de acompanhamento: aqui a consulta é multiplicada
// pelo número de alunos da lista, e 120 dias já cobrem qualquer sequência real.
const STREAK_WINDOW_LIST_DAYS = 120;

async function loadStreaks() {
  const ids = students.map(s => s.id);
  if (ids.length === 0) return;

  // loadStudents() roda de novo a cada renovar/ativar/editar. Recalcular a sequência
  // nessas horas custaria uma consulta por aluno sem nada ter mudado no treino, então
  // só recalcula quando o conjunto de alunos muda (ou quando a página recarrega).
  const key = ids.slice().sort().join(',');
  if (key === streakLoadedFor) return;
  streakLoadedFor = key;
  streakMap = {};

  // Dias prescritos vêm do plano ativo. Sem plano ativo não há como separar treino
  // de descanso, então o aluno fica sem foguinho (em vez de aparecer zerado à toa).
  const { data: plans, error: plansError } = await _sb.from('workout_plans')
    .select('student_id, structure, mode, days_per_week, plan_end_date')
    .in('student_id', ids)
    .eq('is_active', true);

  // Falhou a rede: solta o cache para a próxima chamada tentar de novo.
  if (plansError) { streakLoadedFor = ''; console.log('Erro ao carregar planos:', plansError); return; }

  // Mapeia plan_end_date para usar nos alertas de vencimento de treino
  planEndMap = {};
  (plans || []).forEach(p => {
    if (p.plan_end_date) planEndMap[p.student_id] = p.plan_end_date;
  });

  const prescribedBy = {};
  const cyclicBy = {};  // student_id → days_per_week (para cálculo cíclico)
  (plans || []).forEach(p => {
    const st = p.structure || {};
    if (p.mode === 'cyclic' && p.days_per_week) {
      // Modo cíclico: qualquer dia pode ser treino
      prescribedBy[p.student_id] = new Set(DAYS);
      cyclicBy[p.student_id] = p.days_per_week;
    } else {
      // Modo semanal: dia com lista vazia não é dia de treino
      const days = DAYS.filter(d => Array.isArray(st[d]) && st[d].length > 0);
      if (days.length > 0) prescribedBy[p.student_id] = new Set(days);
    }
  });

  const withPlan = ids.filter(id => prescribedBy[id]);
  if (withPlan.length === 0) return;

  const today = new Date();
  const windowStart = new Date(today);
  windowStart.setDate(today.getDate() - (STREAK_WINDOW_LIST_DAYS - 1));
  const from = toLocalISO(windowStart);

  // Uma consulta por aluno, filtrando set_number=1: para saber SE treinou no dia
  // basta uma linha por exercício, o que corta o payload em ~3x numa lista de 20 alunos.
  const results = await Promise.all(withPlan.map(id =>
    _sb.from('workout_logs')
      .select('session_date')
      .eq('student_id', id)
      .eq('set_number', 1)
      .gte('session_date', from)
      .order('session_date', { ascending: false })
  ));

  withPlan.forEach((id, i) => {
    const { data, error } = results[i];
    if (error || !data) { streakLoadedFor = ''; return; }  // tenta de novo na próxima
    const trained = new Set(data.map(r => r.session_date));
    let st;
    if (cyclicBy[id]) {
      const result = computeStreakCyclic(trained, cyclicBy[id], today);
      st = { current: result.current, best: result.best, hitWindowEdge: false };
    } else {
      st = computeStreak(trained, prescribedBy[id], today, STREAK_WINDOW_LIST_DAYS);
    }
    const sorted = [...trained].sort();
    st.lastTrained = sorted.length ? sorted[sorted.length - 1] : null;
    streakMap[id] = st;
  });
}

function getStreakHtml(studentId) {
  const st = streakMap[studentId];
  if (!st) return '';
  const n = st.current + (st.hitWindowEdge ? '+' : '');
  const parts = [];
  if (st.current > 0) parts.push(`${st.current} treino${st.current > 1 ? 's' : ''} seguido${st.current > 1 ? 's' : ''} sem falhar`);
  else parts.push('Sequência zerada');
  if (st.best > st.current) parts.push(`recorde: ${st.best}`);
  if (st.lastTrained) {
    const q = new Date(st.lastTrained + 'T12:00:00').toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
    parts.push(`último treino em ${q}`);
  } else {
    parts.push('nenhum treino registrado');
  }
  return `<span class="streak-chip ${st.current > 0 ? '' : 'cold'}" title="${esc(parts.join(' · '))}"><span class="flame">🔥</span>${n}</span>`;
}

// === Carregar alunos ===
async function loadStudents() {
  await loadPendingInvites();
  const { data, error } = await _sb.from('profiles')
    .select('id, full_name, email, gym_name, sex, birth_date, status, access_starts_at, access_expires_at')
    .eq('coach_id', myId)
    .eq('role', 'student')
    .eq('is_deleted', false)
    .order('full_name', { ascending: true });
  if (error) { console.log('Erro ao carregar alunos:', error); return; }
  // Reordena no cliente: o ORDER BY do Postgres usa collation do banco e joga
  // acento/maiúscula fora de ordem ("Ávila" depois de "Zé", "ana" depois de "Bruno").
  students = (data || []).sort(byName);
  await Promise.all([loadTodaySessions(), loadStreaks()]);
  renderStudents();
  renderAlerts();
  updateStudentCount();
}

// === Aniversário ===
function getBirthdayInfo(birthDate) {
  if (!birthDate) return { badge: '', isToday: false, isBirthdayMonth: false };
  const today = new Date();
  const [y, m, d] = birthDate.split('-').map(Number);
  const isToday = today.getDate() === d && (today.getMonth() + 1) === m;
  const isBirthdayMonth = (today.getMonth() + 1) === m && !isToday;
  let badge = '';
  if (isToday) {
    badge = `<span class="birthday-badge today">🎂 Hoje!</span>`;
  } else if (isBirthdayMonth) {
    badge = `<span class="birthday-badge">🎂 ${String(d).padStart(2,'0')}/${String(m).padStart(2,'0')}</span>`;
  }
  return { badge, isToday, isBirthdayMonth };
}

// === Renderizar lista ===
function renderStudents() {
  const container = document.getElementById('studentsList');
  if (students.length === 0 && pendingInvites.length === 0) {
    container.innerHTML = '<div class="empty-state">Nenhum aluno cadastrado ainda.</div>';
    return;
  }

  // Cards de convites pendentes
  let pendingHtml = pendingInvites.map(inv => {
    const createdDate = new Date(inv.created_at).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
    return `
      <div class="student-card pending">
        <button class="delete-x" onclick="cancelInvite('${inv.id}','${esc(inv.full_name).replace(/'/g,"\\'")}')" title="Cancelar convite">×</button>
        <div class="student-info">
          <div class="student-name"><span class="student-name-text">${esc(inv.full_name)}</span> <span class="pending-badge">⏳ Pendente</span></div>
          <div class="student-meta">
            ${inv.gym_name ? `<span class="gym">${esc(inv.gym_name)} · </span>` : ''}
            ${esc(inv.email)} · convidado em ${createdDate}
          </div>
          <div class="student-meta" style="color:#00d5ff; margin-top:4px; font-size: var(--fs-2xs);">Aguardando primeiro acesso do aluno</div>
          <div class="actions">
            <button class="action-btn" onclick="location.href='treinos.html?invite=${inv.id}'">🏋️ Treinos</button>
            <button class="action-btn" onclick="location.href='anamnese.html?invite=${inv.id}'">🩺 Anamnese</button>
            <button class="action-btn" onclick="location.href='anotacoes.html?invite=${inv.id}'">📝 Anotações</button>
          </div>
        </div>
      </div>
    `;
  }).join('');

  // Cards de alunos ativos/suspensos
  let studentsHtml = students.map(s => {
    const status = getStatus(s);
    const isActive = s.status === 'active';
    const expiresText = s.access_expires_at
      ? new Date(s.access_expires_at + 'T00:00:00').toLocaleDateString('pt-BR')
      : 'Sem prazo';
    const bday = getBirthdayInfo(s.birth_date);
    return `
      <div class="student-card ${s.status === 'suspended' ? 'suspended' : ''}">
        <div class="toggle-wrap">
          <label class="toggle" title="${isActive ? 'Desativar' : 'Reativar'}">
            <input type="checkbox" ${isActive ? 'checked' : ''} onchange="toggleStatus('${s.id}', this.checked ? 'active' : 'suspended')">
            <span class="toggle-slider"></span>
          </label>
        </div>
        <button class="delete-x" onclick="deleteStudent('${s.id}','${esc(s.full_name).replace(/'/g,"\\'")}')" title="Excluir">×</button>
        <div class="student-info">
          <div class="student-name"><span class="student-name-text">${esc(s.full_name)}</span> <button class="edit-icon" onclick="openEditModal('${s.id}')">✏️</button>${getStreakHtml(s.id)}${bday.badge}</div>
          <div class="student-meta">
            ${s.gym_name ? `<span class="gym">${esc(s.gym_name)} · </span>` : ''}
            até ${expiresText}
          </div>
          <div class="student-meta" style="color:#777; font-size: var(--fs-2xs);">📧 ${esc(s.email)}</div>
          ${getSessionHtml(s.id)}
          <div class="actions">
            <button class="action-btn" onclick="openRenewModal('${s.id}','${esc(s.full_name).replace(/'/g,"\\'")}')">Renovar</button>
            <button class="action-btn" onclick="location.href='treinador.html?aluno=${s.id}'">📊 Resultados</button>
            <button class="action-btn" onclick="location.href='treinos.html?aluno=${s.id}'">🏋️ Treinos</button>
            <button class="action-btn" onclick="location.href='anamnese.html?aluno=${s.id}'">🩺 Anamnese</button>
            <button class="action-btn" onclick="location.href='anotacoes.html?aluno=${s.id}'">📝 Anotações</button>
          </div>
        </div>
      </div>
    `;
  }).join('');

  container.innerHTML = pendingHtml + studentsHtml;
}

function getStatus(s) {
  if (s.status === 'suspended') return 'suspended';
  if (s.access_expires_at && new Date(s.access_expires_at + 'T23:59:59') < new Date()) return 'expired';
  return 'active';
}

// === Alertas ===
function renderAlerts() {
  const now = new Date();
  const in7days = new Date(now.getTime() + 7 * 24 * 60 * 60 * 1000);

  // Alertas de vencimento de acesso
  const expiringAlerts = students.filter(s => {
    if (s.status === 'suspended') return false;
    if (!s.access_expires_at) return false;
    const exp = new Date(s.access_expires_at + 'T23:59:59');
    return exp <= in7days;
  }).sort((a, b) => a.access_expires_at.localeCompare(b.access_expires_at));

  // Alertas de vencimento do treino ativo (plan_end_date <= 7 dias)
  const planExpiringAlerts = students.filter(s => {
    if (s.status === 'suspended') return false;
    const endDate = planEndMap[s.id];
    if (!endDate) return false;
    const exp = new Date(endDate + 'T23:59:59');
    return exp <= in7days;
  }).map(s => {
    const endDate = planEndMap[s.id];
    const exp = new Date(endDate + 'T23:59:59');
    const isExpired = exp < now;
    const daysLeft = Math.ceil((exp - now) / (1000 * 60 * 60 * 24));
    return { ...s, planEndDate: endDate, isExpired, daysLeft };
  }).sort((a, b) => a.planEndDate.localeCompare(b.planEndDate));

  // Alertas de aniversário do dia
  const todayDay = now.getDate();
  const todayMonth = now.getMonth() + 1;
  const birthdayAlerts = students.filter(s => {
    if (!s.birth_date) return false;
    const [y, m, d] = s.birth_date.split('-').map(Number);
    return d === todayDay && m === todayMonth;
  });

  const section = document.getElementById('alertsSection');
  const container = document.getElementById('alertsList');
  if (expiringAlerts.length === 0 && birthdayAlerts.length === 0 && planExpiringAlerts.length === 0) { section.style.display = 'none'; return; }
  section.style.display = 'block';

  let html = '';

  // Aniversários primeiro
  if (birthdayAlerts.length > 0) {
    html += birthdayAlerts.map(s => {
      const [y] = s.birth_date.split('-').map(Number);
      const age = now.getFullYear() - y;
      return `
        <div class="alert-card" style="background:#2a0a1a; border-color:#e91e63;">
          <div class="name">🎂 ${esc(s.full_name)}</div>
          <div class="info">Aniversário hoje! Completa ${age} anos. Mande parabéns! 🎉</div>
        </div>
      `;
    }).join('');
  }

  // Vencimento de treino ativo
  if (planExpiringAlerts.length > 0) {
    html += planExpiringAlerts.map(a => {
      const label = a.isExpired
        ? 'Treino vencido'
        : a.daysLeft === 0
          ? 'Treino vence hoje'
          : `Treino vence em ${a.daysLeft} dia${a.daysLeft !== 1 ? 's' : ''}`;
      const dateStr = new Date(a.planEndDate + 'T00:00:00').toLocaleDateString('pt-BR');
      return `
        <div class="alert-card plan-expiring ${a.isExpired ? 'expired' : ''}" onclick="location.href='treinos.html?aluno=${a.id}'" style="cursor:pointer;">
          <div class="name">📋 ${esc(a.full_name)}</div>
          <div class="info">${label} · ${dateStr} <span style="float:right;color:#ff9800;font-size: var(--fs-xs);">Editar treino →</span></div>
        </div>
      `;
    }).join('');
  }

  // Vencimentos de acesso
  html += expiringAlerts.map(s => {
    const exp = new Date(s.access_expires_at + 'T23:59:59');
    const isExpired = exp < now;
    const daysLeft = Math.ceil((exp - now) / (1000 * 60 * 60 * 24));
    const label = isExpired ? 'Vencido' : `Vence em ${daysLeft} dia${daysLeft !== 1 ? 's' : ''}`;
    return `
      <div class="alert-card ${isExpired ? 'expired' : ''}">
        <div class="name">${esc(s.full_name)}</div>
        <div class="info">${label} · ${new Date(s.access_expires_at + 'T00:00:00').toLocaleDateString('pt-BR')}</div>
      </div>
    `;
  }).join('');

  container.innerHTML = html;
}

// === Criar aluno ===
async function createStudent() {
  const name = document.getElementById('newName').value.trim();
  const email = document.getElementById('newEmail').value.trim().toLowerCase();
  const gym = document.getElementById('newGym').value.trim();
  const months = parseInt(document.getElementById('newMonths').value) || 3;
  const birthDate = document.getElementById('newBirth').value || null;
  const sex = document.getElementById('newSex').value || null;

  if (!name || !email) { showToast('Preencha nome e e-mail.', true); return; }
  const activeCount = students.filter(s => s.status === 'active').length;
  if (activeCount >= maxStudents) { showToast(`Limite de ${maxStudents} alunos ativos atingido. Fale com o administrador.`, true); return; }

  const btn = document.getElementById('createBtn');
  btn.disabled = true;

  // Bloqueia se o email já é de um professor/owner (não pode ser aluno e professor ao mesmo tempo)
  const { data: existingAny } = await _sb.from('profiles')
    .select('id, role, is_deleted, coach_id')
    .eq('email', email)
    .maybeSingle();

  if (existingAny && existingAny.role !== 'student') {
    btn.disabled = false;
    showToast('Esse e-mail já pertence a um ' + (existingAny.role === 'trainer' ? 'professor' : 'administrador') + '.', true);
    return;
  }

  const existing = existingAny && existingAny.role === 'student' ? existingAny : null;

  if (existing && existing.is_deleted && existing.coach_id === myId) {
    // Reativar aluno deletado
    const newExp = new Date();
    newExp.setMonth(newExp.getMonth() + months);
    const { error } = await _sb.from('profiles').update({
      is_deleted: false,
      status: 'active',
      full_name: name,
      gym_name: gym || null,
      birth_date: birthDate,
      sex,
      access_starts_at: new Date().toISOString().split('T')[0],
      access_expires_at: newExp.toISOString().split('T')[0]
    }).eq('id', existing.id);
    btn.disabled = false;
    if (error) { showToast('Erro: ' + error.message, true); return; }
    showToast('Aluno reativado!');
  } else {
    // Criar invite normalmente
    const { error } = await _sb.from('invites').insert({
      email,
      role: 'student',
      coach_id: myId,
      full_name: name,
      gym_name: gym || null,
      months,
      birth_date: birthDate,
      sex,
      created_by: myId
    });
    btn.disabled = false;
    if (error) {
      if (error.code === '23505') { showToast('Esse e-mail já tem um convite pendente.', true); }
      else { showToast('Erro: ' + error.message, true); }
      return;
    }
    showToast('Aluno cadastrado! Peça pra acessar com esse e-mail.');
  }

  document.getElementById('newName').value = '';
  document.getElementById('newEmail').value = '';
  document.getElementById('newGym').value = '';
  document.getElementById('newMonths').value = '3';
  document.getElementById('newBirth').value = '';
  document.getElementById('newSex').value = '';
  await loadStudents();
}

// === Desativar / Reativar ===
async function toggleStatus(studentId, newStatus) {
  const { error } = await _sb.from('profiles')
    .update({ status: newStatus })
    .eq('id', studentId);
  if (error) { showToast('Erro: ' + error.message, true); return; }
  showToast(newStatus === 'active' ? 'Aluno reativado!' : 'Aluno desativado.');
  await loadStudents();
}

// === Renovar prazo ===
let renewStudentId = null;

function openRenewModal(studentId, name) {
  renewStudentId = studentId;
  document.getElementById('renewName').value = name;
  document.getElementById('renewMonths').value = '3';
  document.getElementById('renewModal').classList.add('show');
}

function closeRenewModal() {
  document.getElementById('renewModal').classList.remove('show');
  renewStudentId = null;
}

async function confirmRenew() {
  if (!renewStudentId) return;
  const months = parseInt(document.getElementById('renewMonths').value) || 3;

  // Busca a data atual de expiração
  const student = students.find(s => s.id === renewStudentId);
  if (!student) { closeRenewModal(); return; }

  // Nova data: a partir de hoje ou da expiração atual (o que for mais tarde) + meses
  const now = new Date();
  const currentExp = student.access_expires_at ? new Date(student.access_expires_at + 'T00:00:00') : now;
  const base = currentExp > now ? currentExp : now;
  const newExp = new Date(base);
  newExp.setMonth(newExp.getMonth() + months);
  const newExpStr = newExp.toISOString().split('T')[0];

  const { error } = await _sb.from('profiles')
    .update({ access_expires_at: newExpStr, status: 'active' })
    .eq('id', renewStudentId);

  if (error) { showToast('Erro: ' + error.message, true); return; }
  showToast(`Prazo renovado até ${newExp.toLocaleDateString('pt-BR')}!`);
  closeRenewModal();
  await loadStudents();
}

// === Editar dados do aluno ===
let editStudentId = null;

function openEditModal(studentId) {
  const s = students.find(x => x.id === studentId);
  if (!s) return;
  editStudentId = studentId;
  document.getElementById('editEmail').value = s.email || '';
  document.getElementById('editName').value = s.full_name || '';
  document.getElementById('editGym').value = s.gym_name || '';
  document.getElementById('editBirth').value = s.birth_date || '';
  document.getElementById('editSex').value = s.sex || '';
  document.getElementById('editModal').classList.add('show');
}

function closeEditModal() {
  document.getElementById('editModal').classList.remove('show');
  editStudentId = null;
}

async function confirmEdit() {
  if (!editStudentId) return;
  const name = document.getElementById('editName').value.trim();
  const gym = document.getElementById('editGym').value.trim();
  const birth = document.getElementById('editBirth').value || null;
  const sex = document.getElementById('editSex').value || null;

  if (!name) { showToast('Nome é obrigatório.', true); return; }

  const { error } = await _sb.from('profiles')
    .update({ full_name: name, gym_name: gym || null, birth_date: birth, sex })
    .eq('id', editStudentId);

  if (error) { showToast('Erro: ' + error.message, true); return; }
  showToast('Dados atualizados!');
  closeEditModal();
  await loadStudents();
}

// === Excluir aluno (soft delete) ===
async function deleteStudent(studentId, name) {
  if (!confirm(`Excluir "${name}"?`)) return;
  const { error } = await _sb.from('profiles')
    .update({ is_deleted: true })
    .eq('id', studentId);
  if (error) { showToast('Erro: ' + error.message, true); return; }
  showToast('Aluno excluído.');
  await loadStudents();
}

// === Cancelar convite pendente ===
async function cancelInvite(inviteId, name) {
  if (!confirm(`Cancelar convite de "${name}"?`)) return;
  const { error } = await _sb.from('invites')
    .delete()
    .eq('id', inviteId);
  if (error) { showToast('Erro: ' + error.message, true); return; }
  showToast('Convite cancelado.');
  await loadStudents();
}
