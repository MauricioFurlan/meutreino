<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Painel do Professor</title>
  <meta name="theme-color" content="#00d5ff">
  <!-- PWA: precisa estar em TODAS as páginas, senão o iOS mostra a barra do
       Safari ao navegar dentro do app instalado (modo standalone) -->
  <link rel="manifest" href="/manifest-pro.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MeuTreino Pro">
  <link rel="icon" type="image/png" href="/icon-pro-192.png">
  <link rel="apple-touch-icon" href="/icon-pro-192.png">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; connect-src 'self' https://*.supabase.co; img-src 'self' data:;">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body::-webkit-scrollbar, *::-webkit-scrollbar { display: none; }
    body, * { scrollbar-width: none; }
    /* Escala tipográfica das telas do PROFESSOR: um degrau acima da escala do
       aluno (index.html). O aluno usa o app de pé na academia, olhando uma
       série por vez; o professor lê listas densas de aluno no mesmo celular e
       reclamava do texto pequeno. O editor de treino (editor.html) ficou na
       escala menor de propósito: a linha de série tem colunas de 54px/50px
       calibradas na unha e texto maior estoura a grade. */
    :root {
      --fs-2xs: 0.72rem;
      --fs-xs: 0.78rem;
      --fs-sm: 0.82rem;
      --fs-base: 0.88rem;
      --fs-md: 0.92rem;
      --fs-lg: 0.96rem;
      --fs-xl: 1.05rem;
      --fs-2xl: 1.15rem;
      --fs-3xl: 1.35rem;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #08090c; color: #f0f0f0; min-height: 100vh; padding-bottom: 96px;
    }
    .header {
      background: #101419; padding: 16px; text-align: center;
      border-bottom: 1px solid #232a33; position: relative;
    }
    .header h1 { font-size: var(--fs-2xl); color: #00d5ff; letter-spacing: 1px; }
    .header .subtitle { font-size: var(--fs-base); color: #999; margin-top: 4px; }
    .logout-btn {
      position: absolute; top: 14px; right: 14px; background: none; border: 1px solid #555;
      color: #999; font-size: var(--fs-2xs); padding: 4px 10px; border-radius: 12px; cursor: pointer;
    }
    .logout-btn:active { opacity: 0.6; }
    .section { padding: 16px; overflow: hidden; }

    /* ── Resumo do dia ───────────────────────────────────────────────
       Primeira dobra do painel. Antes era o botão "Novo Aluno", uma ação
       de uma vez por mês; quem abre o painel quer saber o estado do dia.
       Cada bloco é um filtro da lista: tocar em "treinaram hoje" mostra
       quem treinou, e não só o número. */
    .summary-bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 14px 16px 0; }
    .summary-tile {
      background: #101419; border: 1px solid #232a33; border-radius: 12px;
      padding: 10px 8px; text-align: center; cursor: pointer; min-height: 62px;
      display: flex; flex-direction: column; justify-content: center; gap: 2px;
    }
    .summary-tile:active { opacity: 0.7; }
    .summary-tile.on { border-color: #00d5ff; background: #0c1015; }
    .summary-tile .n { font-size: var(--fs-2xl); font-weight: 700; color: #f0f0f0; line-height: 1.1; }
    .summary-tile .lbl { font-size: var(--fs-2xs); color: #888; font-weight: 600; letter-spacing: 0.2px; }
    .summary-tile.warn .n { color: #ff9800; }
    .summary-tile.warn.zero .n { color: #f0f0f0; }

    /* ── Busca e filtros da lista ────────────────────────────────── */
    .list-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
    .sort-btn {
      background: none; border: none; color: #888; font-size: var(--fs-2xs);
      font-weight: 600; cursor: pointer; padding: 4px 0; white-space: nowrap;
    }
    .sort-btn:active { color: #00d5ff; }
    .search-input {
      width: 100%; background: #101419; border: 1px solid #232a33; border-radius: 10px;
      color: #f0f0f0; padding: 11px 12px; font-size: var(--fs-base); margin-bottom: 10px;
    }
    .search-input:focus { outline: none; border-color: #00d5ff; }
    .search-input::placeholder { color: #5a5a5a; }
    .filter-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .filter-chip {
      font-size: var(--fs-2xs); font-weight: 700; padding: 7px 12px; border-radius: 14px;
      border: 1px solid #232a33; background: #101419; color: #999; cursor: pointer; white-space: nowrap;
    }
    .filter-chip.on { border-color: #00d5ff; color: #00d5ff; background: #0c1015; }

    /* ── Novo aluno flutuante ────────────────────────────────────── */
    .fab {
      position: fixed; right: 16px; bottom: 20px; z-index: 900;
      background: #00d5ff; color: #000; border: none; border-radius: 26px;
      padding: 0 22px; min-height: 52px; font-size: var(--fs-md); font-weight: 700;
      cursor: pointer; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.5);
    }
    .fab:active { opacity: 0.8; }

    /* ── Esqueleto de carregamento ───────────────────────────────────
       Substitui o overlay preto na abertura: o painel já aparece com a
       forma da lista, em vez de cobrir a tela e revelar tudo de uma vez. */
    .skel-card {
      background: #101419; border: 1px solid #232a33; border-radius: 12px;
      padding: 14px; margin-bottom: 10px;
    }
    .skel-line { height: 12px; border-radius: 6px; background: #1a2029; margin-bottom: 8px; animation: skelPulse 1.2s ease-in-out infinite; }
    .skel-line.w60 { width: 60%; }
    .skel-line.w40 { width: 40%; height: 10px; }
    .skel-actions { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 12px; }
    .skel-btn { height: 44px; border-radius: 8px; background: #161b22; animation: skelPulse 1.2s ease-in-out infinite; }
    @keyframes skelPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
    .section-title { font-size: var(--fs-md); color: #00d5ff; font-weight: 700; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px; }

    /* Alertas */
    .alert-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .alert-chip {
      font-size: var(--fs-xs); font-weight: 700; padding: 4px 10px; border-radius: 12px;
      border: 1px solid #1c3d47; background: #0c1015; color: #00d5ff; white-space: nowrap;
    }
    .alert-chip .n { opacity: 0.7; font-weight: 600; margin-left: 2px; }
    /* O chip contava e parava por aí; agora filtra a lista de alunos abaixo. */
    .alert-chip { cursor: pointer; }
    .alert-chip.on { background: #00d5ff; color: #000; border-color: #00d5ff; }
    .alert-chip.on .n { opacity: 0.75; }
    .alert-chip.today { border-color: #ff9800; color: #ff9800; background: #1a1a00; }
    .alert-chip.overdue { border-color: #f44336; color: #f44336; background: #2a0000; }

    .alert-card { background: #0c1015; border: 1px solid #00d5ff; border-left-width: 4px; border-radius: 10px; padding: 12px; margin-bottom: 8px; }
    .alert-card.today { background: #1a1a00; border-color: #ff9800; }
    .alert-card.overdue { background: #2a0000; border-color: #f44336; }
    .alert-card.expired { background: #2a0000; border-color: #f44336; }
    .alert-card.plan-expiring { background: #1a1a00; border-color: #ff9800; }
    .alert-card.plan-expiring.expired { background: #2a0000; border-color: #f44336; }
    .alert-card.note-reminder { background: #1a1a00; border-color: #ff9800; }
    .alert-card.note-reminder.expired { background: #2a0000; border-color: #f44336; }
    .alert-card .name { font-weight: 600; font-size: var(--fs-lg); margin-bottom: 4px; }
    .alert-card .info { font-size: var(--fs-sm); color: #ccc; margin-top: 2px; }
    .alert-item {
      font-size: var(--fs-sm); color: #ccc; padding: 5px 0;
      border-top: 1px solid rgba(255,255,255,0.06);
      display: flex; justify-content: space-between; gap: 8px; align-items: baseline;
    }
    .alert-item:first-of-type { border-top: none; }
    .alert-item.link { cursor: pointer; }
    .alert-item .go { color: #ff9800; font-size: var(--fs-xs); white-space: nowrap; flex-shrink: 0; }
    .alerts-more {
      width: 100%; margin-top: 4px; padding: 8px; border: 1px dashed #2a3540; border-radius: 8px;
      background: none; color: #999; font-size: var(--fs-xs); font-weight: 600; cursor: pointer;
    }
    .alerts-more:active { opacity: 0.6; }

    /* Lista de alunos */
    .student-card {
      background: #101419; border: 1px solid #232a33; border-radius: 12px;
      padding: 14px; margin-bottom: 10px; position: relative;
    }
    /* Estado na borda esquerda: dá para varrer a coluna de cor sem ler nada.
       (A pílula .student-status existia no CSS mas nunca chegou a ser usada
       no card — a faixa ocupa o lugar dela.) */
    .student-card { border-left: 3px solid #2a3540; }
    .student-card.st-active { border-left-color: #4caf50; }
    .student-card.st-expiring { border-left-color: #ff9800; }
    .student-card.st-expired { border-left-color: #f44336; }
    .student-card.st-suspended { border-left-color: #555; }
    .student-card.suspended { opacity: 0.5; }
    .student-card.pending {
      border: 1px dashed #00d5ff; background: #08090c; opacity: 0.85;
    }
    .pending-badge {
      display: inline-block; font-size: var(--fs-2xs); padding: 2px 8px; border-radius: 10px;
      background: #0c1015; color: #00d5ff; font-weight: 600; margin-left: 8px;
      letter-spacing: 0.3px; vertical-align: middle;
    }
    .student-card .toggle-wrap {
      position: absolute; top: 14px; right: 14px; z-index: 2;
    }
    .delete-x {
      position: absolute; bottom: 12px; right: 14px;
      background: none; border: none; color: #f44336; font-size: 1.4rem;
      cursor: pointer; line-height: 1; opacity: 0.5; padding: 0; z-index: 2;
    }
    .delete-x:active { opacity: 1; }
    .student-avatar {
      width: 38px; height: 38px; border-radius: 50%; background: #232a33;
      display: flex; align-items: center; justify-content: center;
      font-size: var(--fs-lg); font-weight: 700; color: #00d5ff; flex-shrink: 0;
    }
    .student-info { min-width: 0; padding-right: 50px; }
    /* Flex para o nome truncar sozinho e o lápis + foguinho nunca serem cortados */
    .student-name { font-size: var(--fs-lg); font-weight: 600; display: flex; align-items: center; gap: 4px; min-width: 0; }
    .student-name-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    .edit-icon { background: none; border: none; font-size: var(--fs-sm); cursor: pointer; padding: 2px 4px; vertical-align: middle; opacity: 0.7; flex-shrink: 0; }
    .edit-icon:active { opacity: 1; }

    /* Sequência (foguinho) ao lado do lápis: leitura rápida de quem está treinando */
    .streak-chip {
      display: inline-flex; align-items: center; gap: 3px; flex-shrink: 0;
      font-size: var(--fs-xs); font-weight: 700; color: #ff9800;
      background: #0c1015; border: 1px solid #1c3d47;
      padding: 2px 7px; border-radius: 10px; line-height: 1.4;
    }
    .streak-chip .flame { font-size: var(--fs-base); line-height: 1; }
    .streak-chip.cold { color: #777; background: #1f1f1f; border-color: #232a33; }
    .streak-chip.cold .flame { filter: grayscale(1) opacity(0.5); }
    .student-meta { font-size: var(--fs-xs); color: #999; margin-top: 2px; }
    .student-meta .gym { color: #888; }
    /* Botões de ação: grade de 2 colunas, não flex-wrap. Em fileira livre a
       largura seguia o texto ("Renovar" curto, "📊 Resultados" comprido) e a
       última linha ficava com um botão solto pela metade. Na grade todos têm
       a mesma largura e o mesmo alvo de toque, e as 6 ações fecham 3 fileiras
       certinhas (os cards de convite, com 4, fecham 2). */
    .actions { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 10px; }
    /* Renovar / Resultados / Treinos / Anamnese / Anotações: são o caminho
       para todas as telas do aluno e ficavam com ~29px de altura, difícil de
       acertar em celular pequeno. min-height 44px é o alvo de toque mínimo do
       iOS; inline-flex centra o texto dentro dessa altura. Eles já quebram
       linha (.actions tem flex-wrap), então crescer só ocupa mais uma fileira. */
    .action-btn {
      padding: 10px 14px; border: 1px solid #555; border-radius: 8px; background: none;
      color: #ccc; font-size: var(--fs-sm); cursor: pointer; font-weight: 500;
      min-height: 44px; display: inline-flex; align-items: center; justify-content: center;
      line-height: 1.1;
    }
    .action-btn:active { opacity: 0.6; }
    .action-btn.danger { border-color: #f44336; color: #f44336; }
    .action-btn.success { border-color: #4caf50; color: #4caf50; }

    /* Toggle switch */
    .toggle { position: relative; display: block; width: 36px; height: 20px; flex-shrink: 0; }
    .toggle input { display: none; }
    .toggle-slider {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background: #666; border-radius: 20px; cursor: pointer; transition: 0.2s;
    }
    .toggle-slider::before {
      content: ''; position: absolute; width: 16px; height: 16px;
      left: 2px; bottom: 2px; background: #fff; border-radius: 50%; transition: 0.2s;
    }
    .toggle input:checked + .toggle-slider { background: #4caf50; }
    .toggle input:checked + .toggle-slider::before { transform: translateX(16px); }

    /* Formulário */
    .form-group { margin-bottom: 12px; overflow: hidden; }
    .form-group label { display: block; font-size: var(--fs-xs); color: #999; margin-bottom: 4px; text-transform: uppercase; font-weight: 600; }
    .form-group input, .form-group select {
      width: 100%; max-width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #232a33;
      background: #08090c; color: #fff; font-size: 16px; box-sizing: border-box;
      -webkit-appearance: none; appearance: none;
    }
    .form-group input[type="date"] { min-width: 0; }
    .form-group input:focus, .form-group select:focus { outline: none; border-color: #00d5ff; }
    .submit-btn {
      width: 100%; padding: 14px; border: none; border-radius: 10px;
      background: #00d5ff; color: #000; font-weight: 700; font-size: var(--fs-lg); cursor: pointer;
    }
    .submit-btn:disabled { opacity: 0.5; }
    .submit-btn:active { opacity: 0.7; }

    /* Modais */
    .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.9); z-index: 1000; align-items: center; justify-content: center; padding: 16px; }
    .modal.show { display: flex; }
    .modal-content { background: #101419; border-radius: 12px; padding: 20px; width: 100%; max-width: 360px; border: 1px solid #232a33; max-height: 90vh; overflow-y: auto; }
    .modal-content h3 { color: #00d5ff; font-size: var(--fs-lg); margin-bottom: 14px; }
    .modal-close { width: 100%; padding: 10px; border: none; border-radius: 8px; background: #161b22; color: #999; font-weight: 600; font-size: var(--fs-md); cursor: pointer; margin-top: 12px; }

    /* ── Lembretes (modal) ───────────────────────────────────────────
       Vieram das anotações, onde ficavam presos dentro do editor de texto.
       O lembrete é sobre o aluno, não sobre a anotação — o lugar dele é o
       card do aluno, ao lado das outras telas. */
    .reminder-who { font-size: var(--fs-sm); color: #999; margin: -8px 0 12px; }
    .reminder-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
    .reminder-item {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      background: #161b22; border: 1px solid #232a33; border-radius: 8px; padding: 8px 10px;
    }
    .reminder-item.due { border-color: #00d5ff; }
    .reminder-item.overdue { border-color: #f44336; }
    .reminder-item-info { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .reminder-item-date { font-size: var(--fs-xs); color: #00d5ff; font-weight: 700; }
    .reminder-item.overdue .reminder-item-date { color: #f44336; }
    .reminder-item-msg { font-size: var(--fs-sm); color: #ccc; overflow-wrap: anywhere; }
    .reminder-item-remove {
      flex-shrink: 0; background: none; border: 1px solid #444; color: #999;
      font-size: var(--fs-2xs); padding: 8px 12px; border-radius: 8px; cursor: pointer;
      font-weight: 600; min-height: 36px;
    }
    .reminder-item-remove:active { border-color: #f44336; color: #f44336; }
    .reminder-empty { font-size: var(--fs-sm); color: #666; margin-bottom: 14px; text-align: center; padding: 10px 0; }
    .reminder-suggestions { display: flex; gap: 6px; flex-wrap: wrap; margin: -4px 0 12px; }
    .suggestion-chip {
      background: #161b22; border: 1px solid #232a33; color: #999;
      font-size: var(--fs-2xs); padding: 7px 12px; border-radius: 20px;
      cursor: pointer; font-weight: 600;
    }
    .suggestion-chip:active { background: #00d5ff; color: #000; border-color: #00d5ff; }
    .reminder-hint { font-size: var(--fs-2xs); color: #666; margin-top: 10px; line-height: 1.5; }

    .toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: #00d5ff; color: #000; padding: 10px 20px; border-radius: 20px;
      font-size: var(--fs-md); font-weight: 600; display: none; z-index: 1001;
    }
    .toast.error { background: #f44336; color: #fff; }
    .toast.show { display: block; animation: fadeOut 2.5s forwards; }
    @keyframes fadeOut { 0%,70% { opacity: 1; } 100% { opacity: 0; } }

    .empty-state { text-align: center; padding: 30px; color: #666; font-size: var(--fs-md); }
    .nav-link { display: block; text-align: center; margin-top: 12px; color: #00d5ff; font-size: var(--fs-base); text-decoration: underline; cursor: pointer; }

    /* Info de sessão de treino */
    .session-info {
      display: flex; align-items: center; gap: 6px; margin-top: 6px;
      font-size: var(--fs-xs); color: #4caf50; font-weight: 600;
    }
    .session-info.in-progress { color: #00d5ff; }
    .session-info .dot {
      width: 8px; height: 8px; border-radius: 50%; background: #4caf50;
      flex-shrink: 0;
    }
    .session-info.in-progress .dot {
      background: #00d5ff;
      animation: pulse 1.2s infinite;
    }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
    .session-rating {
      margin-top: 4px; font-size: var(--fs-xs); color: var(--text-muted2);
    }

    /* Birthday badge */
    .birthday-badge {
      display: inline-flex; align-items: center; gap: 3px; flex-shrink: 0;
      font-size: var(--fs-2xs); font-weight: 700; color: #e91e63;
      background: #2a0a1a; border: 1px solid #5a1a3a;
      padding: 2px 7px; border-radius: 10px; line-height: 1.4;
      margin-left: 4px;
    }
    .birthday-badge.today {
      color: #fff; background: #e91e63; border-color: #e91e63;
      animation: birthdayPulse 1.5s infinite;
    }
    @keyframes birthdayPulse { 0%,100% { opacity: 1; } 50% { opacity: 0.7; } }

    /* Loading overlay */
    .loading-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(13,13,13,0.92); z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 16px; transition: opacity 0.3s;
    }
    .loading-overlay.hidden { opacity: 0; pointer-events: none; }
    .loading-spinner {
      width: 44px; height: 44px; border: 3px solid #232a33;
      border-top-color: #00d5ff; border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { color: #999; font-size: var(--fs-base); font-weight: 500; letter-spacing: 0.5px; }

    /* Acima da largura de um celular a tela esticava de ponta a ponta —
       aqui o painel vira uma coluna centralizada, como o index.html. */
    @media (min-width: 640px) {
      /* Tela larga = navegador/desktop, não o celular do aluno. Fontes maiores
         aqui ajudam quem tem dificuldade de leitura pra gerenciar os alunos. */
      :root {
        --fs-2xs: 0.78rem;
        --fs-xs: 0.85rem;
        --fs-sm: 0.9rem;
        --fs-base: 0.95rem;
        --fs-md: 1rem;
        --fs-lg: 1.05rem;
        --fs-xl: 1.15rem;
        --fs-2xl: 1.3rem;
        --fs-3xl: 1.5rem;
      }
      .header, .section {
        max-width: 480px;
        margin-left: auto;
        margin-right: auto;
      }
    }
  </style>
  <!-- Camada de identidade visual (precisa vir DEPOIS do <style> inline) -->
  <link rel="stylesheet" href="brand.css">
</head>
<body>
  <!-- Nasce escondido: a abertura mostra o esqueleto da lista. O overlay
       continua para as ações pontuais (cadastrar, excluir, renovar). -->
  <div class="loading-overlay hidden" id="loadingOverlay">
    <div class="loading-spinner"></div>
    <div class="loading-text">Carregando...</div>
  </div>

  <div class="header">
    <button class="logout-btn" onclick="openLogoutModal()">Sair</button>
    <h1 id="greeting">Painel do Professor</h1>
    <div class="subtitle" id="subtitle"></div>
  </div>

  <!-- Resumo do dia (primeira dobra) -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth-guard.js"></script>
<!-- Cálculos compartilhados (sequência, datas, cardio, volume) -->
<script src="/metrics.js"></script>
<script>
let myId = null;
let students = [];
let pendingInvites = [];
let maxStudents = 20;
let sessionsMap = {}; // student_id -> { started_at, ended_at, duration_seconds }
let streakMap = {};   // student_id -> { current, best, hitWindowEdge, lastTrained }
let planEndMap = {};  // student_id -> plan_end_date (do plano ativo)
let noteAlertMap = {}; // student_id -> [{ id, alert_date, message }] (lembretes de anotações)
let streakLoadedFor = ''; // assinatura da lista de alunos já processada

// Ordem alfabética tolerante a acento/maiúscula ("Ávila" antes de "Bruno", "ana" antes de "Bruno")
const byName = (a, b) => (a.full_name || '').localeCompare(b.full_name || '', 'pt-BR', { sensitivity: 'base' });

function showLoading() { document.getElementById('loadingOverlay').classList.remove('hidden'); }
function hideLoading() { document.getElementById('loadingOverlay').classList.add('hidden'); }

const esc = (s) => { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; };

function showToast(text, isError) {
  const t = document.getElementById('toast');
  t.textContent = text;
  t.className = 'toast show' + (isError ? ' error' : '');
  setTimeout(() => t.className = 'toast', 2500);
}

// =====================================================================
// Resumo, busca, filtro e ordem da lista
// A lista chega a 20 alunos: rolar tudo para achar um aluno (ou para ver
// quem treinou) era o gargalo da tela. O resumo do topo, os chips e a busca
// são três entradas para o MESMO filtro, então o estado é um só.
// =====================================================================
let studentQuery = '';       // texto da busca
let studentFilter = '';      // '' | 'atencao' | 'hoje' | chave de categoria de alerta
let studentSort = 'atencao'; // 'atencao' (padrão) | 'nome'
let attentionIds = new Set();          // alunos com algum alerta
let catIds = {};                       // categoria de alerta -> Set de alunos
const CAT_LABELS = { access: 'Acessos vencendo', plan: 'Treinos a renovar', note: 'Lembretes', birthday: 'Aniversários' };

// Busca sem acento e sem caixa: "jose" acha "José".
const norm = (t) => (t || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');

function trainedTodayCount() { return students.filter(s => sessionsMap[s.id]).length; }

// Renderiza alertas → lista → resumo, nessa ordem: a lista ordena por quem
// tem alerta e o resumo conta os grupos, ambos calculados em renderAlerts().
function refreshPanel() {
  renderAlerts();
  renderStudents();
  renderSummary();
}

function renderSummary() {
  const ativos = students.filter(s => s.status === 'active').length;
  const hoje = trainedTodayCount();
  const atencao = attentionIds.size;
  const tile = (key, n, lbl, extra) =>
    `<div class="summary-tile ${studentFilter === key ? 'on' : ''} ${extra || ''}" onclick="setFilter('${key}')">
       <span class="n">${n}</span><span class="lbl">${lbl}</span>
     </div>`;
  document.getElementById('summaryBar').innerHTML =
    tile('', `${ativos}<span style="font-size:var(--fs-sm);color:#666;">/${maxStudents}</span>`, 'alunos ativos') +
    tile('hoje', hoje, 'treinos hoje') +
    tile('atencao', atencao, 'pedem atenção', 'warn' + (atencao === 0 ? ' zero' : ''));

  document.getElementById('sortBtn').textContent =
    studentSort === 'atencao' ? 'Ordem: atenção' : 'Ordem: A-Z';
  renderFilterChips();
}

function renderFilterChips() {
  const chip = (key, label) =>
    `<button class="filter-chip ${studentFilter === key ? 'on' : ''}" onclick="setFilter('${key}')">${label}</button>`;
  let html = chip('', 'Todos') +
    chip('atencao', `Atenção (${attentionIds.size})`) +
    chip('hoje', `Treinou hoje (${trainedTodayCount()})`);
  // Categoria só aparece quando veio de um chip de alerta — senão a fileira
  // teria 7 chips, quase todos zerados.
  if (CAT_LABELS[studentFilter]) html += chip(studentFilter, CAT_LABELS[studentFilter]);
  document.getElementById('filterChips').innerHTML = html;
}

function setFilter(key) {
  studentFilter = (studentFilter === key) ? '' : key;
  renderStudents();
  renderSummary();
  renderAlerts();
}

function toggleSort() {
  studentSort = studentSort === 'atencao' ? 'nome' : 'atencao';
  renderStudents();
  renderSummary();
}

function onSearch(value) {
  studentQuery = value;
  renderStudents();
}

// Quem precisa de atenção primeiro, depois quem já treinou hoje, depois o
// alfabeto. A ordem alfabética pura continua a um toque de distância.
function orderStudents(list) {
  if (studentSort === 'nome') return list.slice().sort(byName);
  const peso = (s) => attentionIds.has(s.id) ? 0 : (sessionsMap[s.id] ? 1 : 2);
  return list.slice().sort((a, b) => peso(a) - peso(b) || byName(a, b));
}

function filteredStudents() {
  let list = students;
  if (studentFilter === 'atencao') list = list.filter(s => attentionIds.has(s.id));
  else if (studentFilter === 'hoje') list = list.filter(s => sessionsMap[s.id]);
  else if (catIds[studentFilter]) list = list.filter(s => catIds[studentFilter].has(s.id));
  const q = norm(studentQuery).trim();
  if (q) list = list.filter(s => norm(s.full_name).includes(q) || norm(s.gym_name).includes(q));
  return orderStudents(list);
}

// Esqueleto da lista enquanto os alunos não chegam.
function renderSkeleton() {
  const card = `<div class="skel-card">
      <div class="skel-line w60"></div><div class="skel-line w40"></div>
      <div class="skel-actions"><div class="skel-btn"></div><div class="skel-btn"></div></div>
    </div>`;
  document.getElementById('studentsList').innerHTML = card + card + card;
}

// === Carregar convites pendentes ===
async function loadPendingInvites() {
  const { data, error } = await _sb.from('invites')
    .select('id, full_name, email, gym_name, created_at')
    .eq('coach_id', myId)
    .eq('role', 'student')
    .eq('redeemed', false)
    .order('created_at', { ascending: false });
  if (error) { console.log('Erro ao carregar invites:', error); return; }
  pendingInvites = (data || []).sort(byName);
}

// === Carregar sessões de treino de hoje ===
async function loadTodaySessions() {
  const today = new Date().toISOString().split('T')[0];
  const studentIds = students.map(s => s.id);
  if (studentIds.length === 0) { sessionsMap = {}; return; }

  const { data, error } = await _sb.from('workout_sessions')
    .select('student_id, started_at, ended_at, duration_seconds, paused_seconds, pause_started_at, rating, feedback_text')
    .in('student_id', studentIds)
    .gte('started_at', today + 'T00:00:00')
    .lte('started_at', today + 'T23:59:59')
    .order('started_at', { ascending: false });

  sessionsMap = {};
  if (!error && data) {
    data.forEach(s => {
      // Pega apenas a sessão mais recente do dia de cada aluno
      if (!sessionsMap[s.student_id]) {
        sessionsMap[s.student_id] = s;
      }
    });
  }
}

// === Carregar lembretes de anotações ===
async function loadNoteAlerts() {
  const studentIds = students.map(s => s.id);
  if (studentIds.length === 0) { noteAlertMap = {}; return; }

  const { data, error } = await _sb.from('trainer_reminders')
    .select('id, student_id, alert_date, message')
    .in('student_id', studentIds);

  noteAlertMap = {};
  if (!error && data) {
    data.forEach(n => {
      if (!noteAlertMap[n.student_id]) noteAlertMap[n.student_id] = [];
      noteAlertMap[n.student_id].push(n);
    });
  }
}

// =====================================================================
// Lembretes — CRUD no modal do card do aluno
// Saíram das anotações: lá o lembrete ficava dentro do editor de texto, então
// para lembrar de renovar a dieta o professor tinha que abrir uma anotação
// que nada tinha a ver. Aqui ele fica ao lado das outras telas do aluno, e o
// mesmo modal atende aluno (student_id) e convite pendente (invite_id).
// =====================================================================
let reminderTarget = null;   // { kind: 'student'|'invite', id, name }
let reminders = [];          // lembretes do alvo aberto

const REMINDER_SUGGESTIONS = ['Renovar dieta', 'Renovar protocolo', 'Atendimento presencial', 'Dia de anamnese'];

function reminderCount(studentId) {
  return (noteAlertMap[studentId] || []).length;
}

function openReminders(kind, id) {
  // O nome vem do array, não do onclick: um aluno chamado O'Brien ou com aspas
  // no nome quebraria o atributo (esc() escapa < e >, não aspas).
  const alvo = (kind === 'student' ? students : pendingInvites).find(x => x.id === id);
  reminderTarget = { kind, id, name: (alvo && alvo.full_name) || '' };
  document.getElementById('remindersWho').textContent = reminderTarget.name;
  document.getElementById('newReminderDate').value = '';
  document.getElementById('newReminderMessage').value = '';
  document.getElementById('reminderList').innerHTML = '<div class="reminder-empty">Carregando...</div>';
  renderReminderSuggestions();
  document.getElementById('remindersModal').classList.add('show');
  loadReminders();
}

function closeReminders() {
  document.getElementById('remindersModal').classList.remove('show');
  reminderTarget = null;
}

function renderReminderSuggestions() {
  const box = document.getElementById('reminderSuggestions');
  box.innerHTML = REMINDER_SUGGESTIONS.map(t =>
    `<button type="button" class="suggestion-chip" data-text="${esc(t)}">${esc(t)}</button>`).join('');
  box.querySelectorAll('.suggestion-chip').forEach(btn => {
    btn.addEventListener('click', () => { document.getElementById('newReminderMessage').value = btn.dataset.text; });
  });
}

function renderReminders() {
  const list = document.getElementById('reminderList');
  if (reminders.length === 0) {
    list.innerHTML = '<div class="reminder-empty">Nenhum lembrete cadastrado.</div>';
    return;
  }
  // Mesma régua dos alertas do painel: vencido em vermelho, os 5 dias que já
  // estão aparecendo no painel em ciano, o resto neutro.
  const hoje = new Date(); hoje.setHours(23, 59, 59, 999);
  const em5 = new Date(hoje); em5.setDate(em5.getDate() + 5);

  list.innerHTML = reminders.map(r => {
    const dia = new Date(r.alert_date + 'T23:59:59');
    const cls = dia < hoje ? 'overdue' : dia <= em5 ? 'due' : '';
    const msg = r.message ? `<span class="reminder-item-msg">${esc(r.message)}</span>` : '';
    return `
      <div class="reminder-item ${cls}">
        <div class="reminder-item-info">
          <span class="reminder-item-date">${new Date(r.alert_date + 'T00:00:00').toLocaleDateString('pt-BR')}</span>
          ${msg}
        </div>
        <button class="reminder-item-remove" data-id="${r.id}">Remover</button>
      </div>`;
  }).join('');

  list.querySelectorAll('.reminder-item-remove').forEach(btn => {
    btn.addEventListener('click', () => deleteReminder(btn.dataset.id));
  });
}

async function loadReminders() {
  if (!reminderTarget) return;
  let query = _sb.from('trainer_reminders')
    .select('id, alert_date, message')
    .order('alert_date', { ascending: true });
  query = reminderTarget.kind === 'student'
    ? query.eq('student_id', reminderTarget.id)
    : query.eq('invite_id', reminderTarget.id);

  const { data, error } = await query;
  if (error) {
    console.error('Erro ao carregar lembretes:', error);
    document.getElementById('reminderList').innerHTML = '<div class="reminder-empty">Erro ao carregar.</div>';
    return;
  }
  reminders = data || [];
  renderReminders();
  syncReminderMap();
}

// O card mostra a contagem e o painel de alertas lê o mesmo mapa: depois de
// mexer nos lembretes os dois precisam refletir a mudança sem recarregar tudo.
function syncReminderMap() {
  if (!reminderTarget || reminderTarget.kind !== 'student') return;
  noteAlertMap[reminderTarget.id] = reminders.map(r =>
    ({ id: r.id, student_id: reminderTarget.id, alert_date: r.alert_date, message: r.message }));
  refreshPanel();
}

async function addReminder() {
  if (!reminderTarget) return;
  const alertDate = document.getElementById('newReminderDate').value || null;
  const message = document.getElementById('newReminderMessage').value.trim() || null;
  if (!alertDate) { showToast('Escolha uma data para o lembrete', true); return; }

  const btn = document.getElementById('addReminderBtn');
  btn.disabled = true;
  const insertData = { coach_id: myId, alert_date: alertDate, message };
  if (reminderTarget.kind === 'student') insertData.student_id = reminderTarget.id;
  else insertData.invite_id = reminderTarget.id;

  try {
    const { data, error } = await _sb.from('trainer_reminders')
      .insert(insertData)
      .select('id, alert_date, message')
      .single();
    if (error) throw error;
    reminders.push(data);
    reminders.sort((a, b) => a.alert_date.localeCompare(b.alert_date));
    renderReminders();
    syncReminderMap();
    document.getElementById('newReminderDate').value = '';
    document.getElementById('newReminderMessage').value = '';
    showToast('Lembrete adicionado');
  } catch (e) {
    console.error('Erro ao salvar lembrete:', e);
    showToast('Erro ao salvar lembrete', true);
  } finally {
    btn.disabled = false;
  }
}

async function deleteReminder(id) {
  if (!confirm('Remover este lembrete?')) return;
  try {
    const { error } = await _sb.from('trainer_reminders').delete().eq('id', id);
    if (error) throw error;
    reminders = reminders.filter(r => r.id !== id);
    renderReminders();
    syncReminderMap();
    showToast('Lembrete removido');
  } catch (e) {
    console.error('Erro ao remover lembrete:', e);
    showToast('Erro ao remover lembrete', true);
  }
}

function formatSessionDuration(seconds) {
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  if (h > 0) return `${h}h${String(m).padStart(2,'0')}min`;
  return `${m}min`;
}

function getSessionHtml(studentId) {
  const session = sessionsMap[studentId];
  if (!session) return '';
  if (!session.ended_at) {
    // Em andamento
    const started = new Date(session.started_at);
    let elapsed = Math.floor((Date.now() - started.getTime()) / 1000) - (session.paused_seconds || 0);
    if (session.pause_started_at) {
      elapsed -= Math.floor((Date.now() - new Date(session.pause_started_at).getTime()) / 1000);
      return `<div class="session-info in-progress"><span class="dot"></span>🏋️ Pausado · ${formatSessionDuration(Math.max(0, elapsed))}</div>`;
    }
    return `<div class="session-info in-progress"><span class="dot"></span>🏋️ Treinando agora · ${formatSessionDuration(Math.max(0, elapsed))}</div>`;
  }
  // Concluído
  let html = `<div class="session-info"><span class="dot"></span>✅ Treinou hoje · ${formatSessionDuration(session.duration_seconds)}</div>`;
  if (session.rating !== null && session.rating !== undefined) {
    html += `<div class="session-rating">Nota do treino: ${session.rating}/5</div>`;
  }
  if (session.feedback_text) {
    html += `<div class="session-rating">"${esc(session.feedback_text)}"</div>`;
  }
  return html;
}

// =====================================================================
// SEQUÊNCIA (foguinho)
// A regra vive em metrics.js (computeStreak): conta só os DIAS DE TREINO
// PRESCRITOS, descanso não conta e não quebra, hoje sem registro fica pendente.
// DAYS, toLocalISO e isTrainingDate também vêm de lá.
// =====================================================================
// Janela menor que a da tela de acompanhamento: aqui a consulta é multiplicada
// pelo número de alunos da lista, e 120 dias já cobrem qualquer sequência real.
const STREAK_WINDOW_LIST_DAYS = 120;

async function loadStreaks() {
  const ids = students.map(s => s.id);
  if (ids.length === 0) return;

  // loadStudents() roda de novo a cada renovar/ativar/editar. Recalcular a sequência
  // nessas horas custaria uma consulta por aluno sem nada ter mudado no treino, então
  // só recalcula quando o conjunto de alunos muda (ou quando a página recarrega).
  const key = ids.slice().sort().join(',');
  if (key === streakLoadedFor) return;
  streakLoadedFor = key;
  streakMap = {};

  // Dias prescritos vêm do plano ativo. Sem plano ativo não há como separar treino
  // de descanso, então o aluno fica sem foguinho (em vez de aparecer zerado à toa).
  const { data: plans, error: plansError } = await _sb.from('workout_plans')
    .select('student_id, structure, mode, days_per_week, plan_end_date')
    .in('student_id', ids)
    .eq('is_active', true);

  // Falhou a rede: solta o cache para a próxima chamada tentar de novo.
  if (plansError) { streakLoadedFor = ''; console.log('Erro ao carregar planos:', plansError); return; }

  // Mapeia plan_end_date para usar nos alertas de vencimento de treino
  planEndMap = {};
  (plans || []).forEach(p => {
    if (p.plan_end_date) planEndMap[p.student_id] = p.plan_end_date;
  });

  const prescribedBy = {};
  const cyclicBy = {};  // student_id → days_per_week (para cálculo cíclico)
  (plans || []).forEach(p => {
    const st = p.structure || {};
    if (p.mode === 'cyclic' && p.days_per_week) {
      // Modo cíclico: qualquer dia pode ser treino
      prescribedBy[p.student_id] = new Set(DAYS);
      cyclicBy[p.student_id] = p.days_per_week;
    } else {
      // Modo semanal: dia com lista vazia não é dia de treino
      const days = DAYS.filter(d => Array.isArray(st[d]) && st[d].length > 0);
      if (days.length > 0) prescribedBy[p.student_id] = new Set(days);
    }
  });

  const withPlan = ids.filter(id => prescribedBy[id]);
  if (withPlan.length === 0) return;

  const today = new Date();
  const windowStart = new Date(today);
  windowStart.setDate(today.getDate() - (STREAK_WINDOW_LIST_DAYS - 1));
  const from = toLocalISO(windowStart);

  // Uma consulta por aluno, filtrando set_number=1: para saber SE treinou no dia
  // basta uma linha por exercício, o que corta o payload em ~3x numa lista de 20 alunos.
  const results = await Promise.all(withPlan.map(id =>
    _sb.from('workout_logs')
      .select('session_date')
      .eq('student_id', id)
      .eq('set_number', 1)
      .gte('session_date', from)
      .order('session_date', { ascending: false })
  ));

  withPlan.forEach((id, i) => {
    const { data, error } = results[i];
    if (error || !data) { streakLoadedFor = ''; return; }  // tenta de novo na próxima
    const trained = new Set(data.map(r => r.session_date));
    let st;
    if (cyclicBy[id]) {
      const result = computeStreakCyclic(trained, cyclicBy[id], today);
      st = { current: result.current, best: result.best, hitWindowEdge: false };
    } else {
      st = computeStreak(trained, prescribedBy[id], today, STREAK_WINDOW_LIST_DAYS);
    }
    const sorted = [...trained].sort();
    st.lastTrained = sorted.length ? sorted[sorted.length - 1] : null;
    streakMap[id] = st;
  });
}

function getStreakHtml(studentId) {
  const st = streakMap[studentId];
  if (!st) return '';
  const n = st.current + (st.hitWindowEdge ? '+' : '');
  const parts = [];
  if (st.current > 0) parts.push(`${st.current} treino${st.current > 1 ? 's' : ''} seguido${st.current > 1 ? 's' : ''} sem falhar`);
  else parts.push('Sequência zerada');
  if (st.best > st.current) parts.push(`recorde: ${st.best}`);
  if (st.lastTrained) {
    const q = new Date(st.lastTrained + 'T12:00:00').toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
    parts.push(`último treino em ${q}`);
  } else {
    parts.push('nenhum treino registrado');
  }
  return `<span class="streak-chip ${st.current > 0 ? '' : 'cold'}" title="${esc(parts.join(' · '))}"><span class="flame">🔥</span>${n}</span>`;
}

// === Aniversário ===
// Janela do selo: 5 dias antes, o dia, e 3 dias depois (para o "atrasado, mas
// de coração"). Antes era o MÊS inteiro — com 20 alunos quase sempre havia um
// bolo aceso na lista, e o selo parava de chamar atenção para alguma coisa.
const BDAY_ANTES = 5;
const BDAY_DEPOIS = 3;

// Distância em dias até o aniversário, com sinal (negativo = já passou).
// Comparar dia/mês soltos erra as viradas: 30/nov não enxergaria 03/dez, e
// 28/dez não enxergaria 02/jan. Por isso testa o aniversário no ano passado,
// neste e no que vem, e fica com o mais próximo de hoje.
// (29/02 em ano comum: o Date rola para 01/03 — o selo aparece um dia depois,
// que é o comportamento aceito por quem comemora nessa data.)
function daysToBirthday(m, d, hoje) {
  let melhor = null;
  for (const ano of [hoje.getFullYear() - 1, hoje.getFullYear(), hoje.getFullYear() + 1]) {
    const data = new Date(ano, m - 1, d);
    data.setHours(0, 0, 0, 0);
    const dias = Math.round((data - hoje) / 86400000);
    if (melhor === null || Math.abs(dias) < Math.abs(melhor)) melhor = dias;
  }
  return melhor;
}

function getBirthdayInfo(birthDate) {
  if (!birthDate) return { badge: '', isToday: false, days: null };
  const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
  const [, m, d] = birthDate.split('-').map(Number);
  const dias = daysToBirthday(m, d, hoje);

  if (dias > BDAY_ANTES || dias < -BDAY_DEPOIS) return { badge: '', isToday: false, days: dias };
  if (dias === 0) return { badge: `<span class="birthday-badge today">🎂 Hoje!</span>`, isToday: true, days: 0 };

  const texto = dias === 1 ? 'amanhã'
    : dias > 1 ? `em ${dias} dias`
    : dias === -1 ? 'ontem'
    : `há ${-dias} dias`;
  return { badge: `<span class="birthday-badge">🎂 ${texto}</span>`, isToday: false, days: dias };
}

// Cor da faixa: vencido/suspenso são estados; "vencendo" é o aviso de 7 dias,
// a mesma janela que o painel de alertas usa.
function stripeOf(s, status) {
  if (status !== 'active') return status === 'expired' ? 'expired' : 'suspended';
  if (s.access_expires_at) {
    const dias = (new Date(s.access_expires_at + 'T23:59:59') - new Date()) / 86400000;
    if (dias <= 7) return 'expiring';
  }
  return 'active';
}

function getStatus(s) {
  if (s.status === 'suspended') return 'suspended';
  if (s.access_expires_at && new Date(s.access_expires_at + 'T23:59:59') < new Date()) return 'expired';
  return 'active';
}

// === Alertas ===
// Quantos cards de alerta aparecem antes de recolher o resto atrás do "Ver mais".
const ALERTS_VISIBLE = 4;
let alertsShowAll = false;
function toggleAlertsShowAll() { alertsShowAll = !alertsShowAll; renderAlerts(); }

function renderAlerts() {
  const now = new Date();
  const MS_DAY = 24 * 60 * 60 * 1000;
  const in7days = new Date(now.getTime() + 7 * MS_DAY);
  const in5days = new Date(now.getTime() + 5 * MS_DAY);
  const dfmt = (iso) => new Date(iso + 'T00:00:00').toLocaleDateString('pt-BR');
  const daysLeftOf = (exp) => Math.ceil((exp - now) / MS_DAY);
  // rank de gravidade: 0 = vencido, 1 = vence hoje, 2 = vence esta semana
  const rankOf = (exp) => exp < now ? 0 : (daysLeftOf(exp) === 0 ? 1 : 2);

  // Uma entrada por aluno; cada aluno acumula suas pendências em items[].
  const groups = new Map();
  const push = (s, item) => {
    let g = groups.get(s.id);
    if (!g) { g = { student: s, items: [], rank: 3, when: '9999-99-99' }; groups.set(s.id, g); }
    g.items.push(item);
    if (item.rank < g.rank) g.rank = item.rank;
    if (item.when < g.when) g.when = item.when;
  };

  // Contadores por categoria (contam tudo, inclusive o que fica recolhido).
  const cat = {
    access:   { label: CAT_LABELS.access,   n: 0, rank: 3, ids: new Set() },
    plan:     { label: CAT_LABELS.plan,     n: 0, rank: 3, ids: new Set() },
    note:     { label: CAT_LABELS.note,     n: 0, rank: 3, ids: new Set() },
    birthday: { label: CAT_LABELS.birthday, n: 0, rank: 3, ids: new Set() },
  };
  // O id entra junto do contador: é o que deixa o chip filtrar a lista abaixo.
  const bump = (key, rank, sid) => { cat[key].n++; cat[key].ids.add(sid); if (rank < cat[key].rank) cat[key].rank = rank; };

  // Vencimento de acesso ao app
  students.forEach(s => {
    if (s.status === 'suspended' || !s.access_expires_at) return;
    const exp = new Date(s.access_expires_at + 'T23:59:59');
    if (exp > in7days) return;
    const rank = rankOf(exp), dl = daysLeftOf(exp);
    const label = rank === 0 ? 'Acesso vencido'
      : dl === 0 ? 'Acesso vence hoje'
      : `Acesso vence em ${dl} dia${dl !== 1 ? 's' : ''}`;
    push(s, { rank, when: s.access_expires_at, text: `${label} · ${dfmt(s.access_expires_at)}`,
      onclick: `openEditModal('${s.id}')`, go: 'Ajustar prazo →' });
    bump('access', rank, s.id);
  });

  // Vencimento do treino (plano) ativo
  students.forEach(s => {
    if (s.status === 'suspended') return;
    const endDate = planEndMap[s.id];
    if (!endDate) return;
    const exp = new Date(endDate + 'T23:59:59');
    if (exp > in7days) return;
    const rank = rankOf(exp), dl = daysLeftOf(exp);
    const label = rank === 0 ? 'Treino vencido'
      : dl === 0 ? 'Treino vence hoje'
      : `Treino vence em ${dl} dia${dl !== 1 ? 's' : ''}`;
    push(s, { rank, when: endDate, text: `${label} · ${dfmt(endDate)}`,
      onclick: `location.href='treinos.html?aluno=${s.id}'`, go: 'Editar treino →' });
    bump('plan', rank, s.id);
  });

  // Lembretes de anotações (alert_date <= 5 dias)
  students.forEach(s => {
    if (s.status === 'suspended') return;
    const reminders = noteAlertMap[s.id];
    if (!reminders) return;
    reminders.forEach(n => {
      const exp = new Date(n.alert_date + 'T23:59:59');
      if (exp > in5days) return;
      const rank = rankOf(exp), dl = daysLeftOf(exp);
      const label = rank === 0 ? 'Lembrete' : dl === 0 ? 'Lembrete hoje' : `Lembrete em ${dl} dia${dl !== 1 ? 's' : ''}`;
      const msg = n.message ? ` — ${esc(n.message)}` : '';
      push(s, { rank, when: n.alert_date, text: `${label} · ${dfmt(n.alert_date)}${msg}`,
        onclick: `openReminders('student','${s.id}')`, go: 'Ver lembretes →' });
      bump('note', rank, s.id);
    });
  });

  // Aniversário do dia. O alerta continua só no dia: o selo do card avisa a
  // semana toda, mas 9 dias de aniversário na seção Atenção empurrariam para
  // baixo o que de fato vence.
  students.forEach(s => {
    if (!s.birth_date) return;
    if (!getBirthdayInfo(s.birth_date).isToday) return;
    const age = now.getFullYear() - Number(s.birth_date.split('-')[0]);
    push(s, { rank: 1, when: '0000-00-00', text: `🎂 Aniversário hoje! Completa ${age} anos. Mande parabéns! 🎉` });
    bump('birthday', 1, s.id);
  });

  // Publica o que a lista e o resumo consomem — inclusive quando não há
  // alerta nenhum, senão o filtro anterior ficaria preso em memória.
  attentionIds = new Set(groups.keys());
  catIds = { access: cat.access.ids, plan: cat.plan.ids, note: cat.note.ids, birthday: cat.birthday.ids };

  const section = document.getElementById('alertsSection');
  const container = document.getElementById('alertsList');
  if (groups.size === 0) { section.style.display = 'none'; return; }
  section.style.display = 'block';

  // Grupos ordenados por gravidade, depois data mais próxima, depois nome.
  const ordered = [...groups.values()].sort((a, b) =>
    a.rank - b.rank || a.when.localeCompare(b.when) || byName(a.student, b.student));

  const sevCls = (r) => r === 0 ? 'overdue' : r === 1 ? 'today' : '';

  // Chips: só categorias com ocorrência, coloridas pela pior gravidade do grupo.
  const chips = Object.entries(cat).filter(([, c]) => c.n > 0).map(([key, c]) =>
    `<span class="alert-chip ${sevCls(c.rank)} ${studentFilter === key ? 'on' : ''}" onclick="setFilter('${key}')">${c.label} <span class="n">· ${c.n}</span></span>`
  ).join('');

  // Todos os urgentes (vencido/hoje) sempre visíveis; completa até ALERTS_VISIBLE com os "desta semana".
  const urgent = ordered.filter(g => g.rank <= 1);
  const soon = ordered.filter(g => g.rank === 2);
  const soonSlots = Math.max(0, ALERTS_VISIBLE - urgent.length);
  const visibleSoon = alertsShowAll ? soon : soon.slice(0, soonSlots);
  const hiddenCount = soon.length - visibleSoon.length;

  const cardsHtml = urgent.concat(visibleSoon).map(g => {
    const items = [...g.items]
      .sort((a, b) => a.rank - b.rank || a.when.localeCompare(b.when))
      .map(it => {
        const go = it.go ? `<span class="go">${it.go}</span>` : '';
        return it.onclick
          ? `<div class="alert-item link" onclick="${it.onclick}">${it.text}${go}</div>`
          : `<div class="alert-item">${it.text}</div>`;
      }).join('');
    return `<div class="alert-card ${sevCls(g.rank)}"><div class="name">${esc(g.student.full_name)}</div>${items}</div>`;
  }).join('');

  let moreBtn = '';
  if (hiddenCount > 0) {
    moreBtn = `<button class="alerts-more" onclick="toggleAlertsShowAll()">Ver mais ${hiddenCount}</button>`;
  } else if (alertsShowAll && soon.length > soonSlots) {
    moreBtn = `<button class="alerts-more" onclick="toggleAlertsShowAll()">Ver menos</button>`;
  }

  container.innerHTML = `<div class="alert-chips">${chips}</div>${cardsHtml}${moreBtn}`;
}

// === Criar aluno ===
async function createStudent() {
  const name = document.getElementById('newName').value.trim();
  const email = document.getElementById('newEmail').value.trim().toLowerCase();
  const gym = document.getElementById('newGym').value.trim();
  const months = parseInt(document.getElementById('newMonths').value) || 3;
  const birthDate = document.getElementById('newBirth').value || null;
  const sex = document.getElementById('newSex').value || null;

  if (!name || !email) { showToast('Preencha nome e e-mail.', true); return; }
  const activeCount = students.filter(s => s.status === 'active').length;
  if (activeCount >= maxStudents) { showToast(`Limite de ${maxStudents} alunos ativos atingido. Fale com o administrador.`, true); return; }

  const btn = document.getElementById('createBtn');
  btn.disabled = true;

  // Bloqueia se o email já é de um professor/owner (não pode ser aluno e professor ao mesmo tempo)
  const { data: existingAny } = await _sb.from('profiles')
    .select('id, role, is_deleted, coach_id')
    .eq('email', email)
    .maybeSingle();

  if (existingAny && existingAny.role !== 'student') {
    btn.disabled = false;
    showToast('Esse e-mail já pertence a um ' + (existingAny.role === 'trainer' ? 'professor' : 'administrador') + '.', true);
    return;
  }

  const existing = existingAny && existingAny.role === 'student' ? existingAny : null;

  if (existing && existing.is_deleted && existing.coach_id === myId) {
    // Reativar aluno deletado
    const newExp = new Date();
    newExp.setMonth(newExp.getMonth() + months);
    const { error } = await _sb.from('profiles').update({
      is_deleted: false,
      status: 'active',
      full_name: name,
      gym_name: gym || null,
      birth_date: birthDate,
      sex,
      access_starts_at: new Date().toISOString().split('T')[0],
      access_expires_at: newExp.toISOString().split('T')[0]
    }).eq('id', existing.id);
    btn.disabled = false;
    if (error) { showToast('Erro: ' + error.message, true); return; }
    showToast('Aluno reativado!');
  } else {
    // Criar invite normalmente
    const { error } = await _sb.from('invites').insert({
      email,
      role: 'student',
      coach_id: myId,
      full_name: name,
      gym_name: gym || null,
      months,
      birth_date: birthDate,
      sex,
      created_by: myId
    });
    btn.disabled = false;
    if (error) {
      if (error.code === '23505') { showToast('Esse e-mail já tem um convite pendente.', true); }
      else { showToast('Erro: ' + error.message, true); }
      return;
    }
    showToast('Aluno cadastrado! Peça pra acessar com esse e-mail.');
  }

  document.getElementById('newName').value = '';
  document.getElementById('newEmail').value = '';
  document.getElementById('newGym').value = '';
  document.getElementById('newMonths').value = '3';
  document.getElementById('newBirth').value = '';
  document.getElementById('newSex').value = '';
  closeCreateModal();
  await loadStudents();
}

  editStudentId = studentId;
  document.getElementById('editEmail').value = s.email || '';
  document.getElementById('editName').value = s.full_name || '';

  document.getElementById('editGym').value = s.gym_name || '';

async function confirmEdit() {
  if (!editStudentId) return;
  const name = document.getElementById('editName').value.trim();
  const gym = document.getElementById('editGym').value.trim();
  const birth = document.getElementById('editBirth').value || null;
  const sex = document.getElementById('editSex').value || null;
  const expires = document.getElementById('editExpires').value || null;

  if (!name) { showToast('Nome é obrigatório.', true); return; }

  const patch = { full_name: name, gym_name: gym || null, birth_date: birth, sex, access_expires_at: expires };

  // Se o novo vencimento está no futuro, reativa o acesso (a suspensão manual continua valendo).
  const student = students.find(s => s.id === editStudentId);
  if (expires && student && student.status !== 'suspended'
      && new Date(expires + 'T23:59:59') > new Date()) {
    patch.status = 'active';
  }

  const { error } = await _sb.from('profiles').update(patch).eq('id', editStudentId);

  if (error) { showToast('Erro: ' + error.message, true); return; }
  showToast('Dados atualizados!');
  closeEditModal();
  await loadStudents();
}

// === Excluir aluno (soft delete) ===
async function deleteStudent(studentId, name) {
  if (!confirm(`Excluir "${name}"?`)) return;
  const { error } = await _sb.from('profiles')
    .update({ is_deleted: true })
    .eq('id', studentId);
  if (error) { showToast('Erro: ' + error.message, true); return; }
  showToast('Aluno excluído.');
  await loadStudents();
}

// === Cancelar convite pendente ===
async function cancelInvite(inviteId, name) {
  if (!confirm(`Cancelar convite de "${name}"?`)) return;
  const { error } = await _sb.from('invites')
    .delete()
    .eq('id', inviteId);
  if (error) { showToast('Erro: ' + error.message, true); return; }
  showToast('Convite cancelado.');
  await loadStudents();
}

// === Inicialização ===
// Fora do guard: o esqueleto precisa aparecer ANTES do login resolver, senão
// a tela fica em branco durante a checagem de sessão (era o que o overlay
// preto cobria).
renderSkeleton();
document.getElementById('searchInput').addEventListener('input', (e) => onSearch(e.target.value));

guard('trainer', {
  onReady: async (session, profile) => {
    myId = profile.id;
    // Buscar max_students
    const { data: me } = await _sb.from('profiles').select('max_students').eq('id', myId).maybeSingle();
    if (me && me.max_students) maxStudents = me.max_students;
    document.getElementById('greeting').textContent = 'Olá ' + (profile.full_name || 'Professor');
    document.getElementById('subtitle').textContent = 'Gestão de Alunos';
    await loadStudents();
    hideLoading();
  },
  onBlocked: (state) => {
    document.body.innerHTML = `
      <div style="text-align:center;padding:60px 24px;">
        <div style="font-size:2.4rem;margin-bottom:12px;">🔒</div>
        <h2 style="color:#00d5ff;margin-bottom:8px;">Acesso suspenso</h2>
        <p style="color:#ccc;">Seu acesso está suspenso. Entre em contato para regularizar.</p>
        <button onclick="location.href='login.html?logout'" style="margin-top:20px;padding:10px 20px;border:1px solid #555;border-radius:8px;background:none;color:#999;cursor:pointer;">Sair</button>
      </div>
    `;
  }
});
</script>
