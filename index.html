    .history-btn {

      margin-bottom: 8px;

    .history-panel {

      padding: 10px;
      margin-bottom: 10px;

    .history-entry { padding: 4px 0; border-bottom: 1px solid #333; }
    .check-icon {

      display: flex;
      align-items: center;
      justify-content: center;

    .check-icon.done {

      background: #4caf50;
    }
    .check-icon.done svg { display: block; }
    .loading { text-align: center; padding: 40px; color: #888; }
    .toast {

      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #f5c518;
      color: #000;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;

    .date-display {

function getToday() {
  const days = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
  return days[new Date().getDay()];
}

function getTodayDate() {
  const now = new Date();
  return now.toISOString().split('T')[0];
}

async function loadTodayData(day) {
  try {
    const today = getTodayDate();
    const data = await supaFetch(
      `workout_logs?day=eq.${encodeURIComponent(day)}&created_at=gte.${today}T00:00:00&created_at=lt.${today}T23:59:59&order=set_number.asc`
    );
    if (!data || data.length === 0) {
      // Sem dados de hoje — carregar fantasma do último treino
      await loadLastWorkout(day);
      return;
    }
    data.forEach(record => {
      const card = document.querySelector(`[data-exercise="${CSS.escape(record.exercise_name)}"][data-day="${day}"]`);
      if (!card) return;
      const rows = card.querySelectorAll('.set-row');
      const row = rows[record.set_number - 1];
      if (!row) return;
      const weightInput = row.querySelector('.weight-input');
      const repsInput = row.querySelector('.reps-input');
      const check = row.querySelector('.check-icon');
      if (weightInput && record.weight) weightInput.value = record.weight;
      if (repsInput && record.reps) repsInput.value = record.reps;
      if (check && (record.weight || record.reps)) check.classList.add('done');
    });
  } catch (e) {
    console.log('Erro ao carregar dados do dia:', e);
  }
}

async function loadLastWorkout(day) {
  try {
    const data = await supaFetch(
      `workout_logs?day=eq.${encodeURIComponent(day)}&order=created_at.desc&limit=100`
    );
    if (!data || data.length === 0) return;
    // Pega só os registros do dia mais recente
    const lastDate = data[0].created_at.split('T')[0];
    const lastData = data.filter(r => r.created_at.startsWith(lastDate));

    lastData.forEach(record => {
      const card = document.querySelector(`[data-exercise="${CSS.escape(record.exercise_name)}"][data-day="${day}"]`);
      if (!card) return;
      const rows = card.querySelectorAll('.set-row');
      const row = rows[record.set_number - 1];
      if (!row) return;
      const weightInput = row.querySelector('.weight-input');
      const repsInput = row.querySelector('.reps-input');
      if (weightInput && record.weight) {
        weightInput.placeholder = record.weight + ' kg';
      }
      if (repsInput && record.reps) {
        const prescribed = repsInput.placeholder;
        repsInput.placeholder = record.reps + ' · ' + prescribed;
      }
    });
  } catch (e) {
    console.log('Erro ao carregar último treino:', e);
  }
}

function showToast(msg, isError) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isError ? ' error' : '');
  setTimeout(() => t.className = 'toast', 2500);
}

async function supaFetch(endpoint, options = {}) {
  const headers = {
    'apikey': SUPABASE_KEY,
    'Authorization': 'Bearer ' + SUPABASE_KEY,
    'Content-Type': 'application/json'
  };
  if (options.method === 'POST') headers['Prefer'] = 'return=minimal';
  const res = await fetch(SUPABASE_URL + '/rest/v1/' + endpoint, {
    ...options,
    headers: { ...headers, ...options.headers }
  });
  if (!res.ok) throw new Error('Erro: ' + res.status);
  if (options.method === 'POST' || options.method === 'DELETE') return null;
  return res.json();
}

async function saveExercise(day, exerciseName, card) {
  const rows = card.querySelectorAll('.set-row');
  const records = [];
  rows.forEach((row, i) => {
    const weight = row.querySelector('.weight-input')?.value;
    const reps = row.querySelector('.reps-input')?.value;
    if (weight || reps) {
      records.push({
        day: day,
        exercise_name: exerciseName,
        set_type: row.dataset.setType,
        set_number: i + 1,
        weight: weight ? parseFloat(weight) : null,
        reps: reps ? parseInt(reps) : null,
        notes: row.dataset.notes || null
      });
    }
  });
  if (records.length === 0) { showToast('Preencha ao menos um set', true); return; }
  try {
    const today = getTodayDate();
    await supaFetch(
      `workout_logs?day=eq.${encodeURIComponent(day)}&exercise_name=eq.${encodeURIComponent(exerciseName)}&created_at=gte.${today}T00:00:00&created_at=lt.${today}T23:59:59`,
      { method: 'DELETE' }
    );
    await supaFetch('workout_logs', { method: 'POST', body: JSON.stringify(records) });
    const btn = card.querySelector('.save-btn');
    btn.textContent = '✓ Salvo!';
    btn.classList.add('saved');
    rows.forEach(row => {
      const weight = row.querySelector('.weight-input')?.value;
      const reps = row.querySelector('.reps-input')?.value;
      const check = row.querySelector('.check-icon');
      if ((weight || reps) && check) check.classList.add('done');
      else if (check) check.classList.remove('done');
    });
    setTimeout(() => { btn.textContent = 'Salvar'; btn.classList.remove('saved'); }, 2000);
    showToast('Salvo com sucesso!');
  } catch (e) {
    showToast('Erro ao salvar: ' + e.message, true);
  }
}

async function loadHistory(exerciseName, panel) {
  try {
    const data = await supaFetch(
      `workout_logs?exercise_name=eq.${encodeURIComponent(exerciseName)}&order=created_at.desc&limit=15`
    );
    if (data.length === 0) { panel.innerHTML = '<em>Sem histórico</em>'; return; }
    let html = '';
    let lastDate = '';
    data.forEach(r => {
      const date = new Date(r.created_at).toLocaleDateString('pt-BR');
      if (date !== lastDate) { html += `<strong>${date}</strong><br>`; lastDate = date; }
      html += `<div class="history-entry">Set ${r.set_number} (${r.set_type}): ${r.weight || '-'}kg x ${r.reps || '-'} reps</div>`;
    });
    panel.innerHTML = html;
  } catch (e) {
    panel.innerHTML = '<em>Erro ao carregar histórico</em>';
  }
}

function renderDay(day) {
  const exercises = WORKOUT[day];
  if (!exercises || exercises.length === 0) {
    return '<div class="loading">Dia de descanso 🎉</div>';
  }
  let html = '';
  exercises.forEach((ex, exIdx) => {
    html += `<div class="exercise-card" id="card-${day}-${exIdx}" data-exercise="${ex.name}" data-day="${day}">`;
    html += `<div class="exercise-header"><div class="exercise-name">${ex.name}</div><button class="video-btn" onclick="openVideo('${ex.name.replace(/'/g, "\\'")}')">▶</button><button class="note-icon" id="note-icon-${day}-${exIdx}" onclick="toggleNote('${day}', ${exIdx}, null)">!</button></div>`;
    html += `<div class="note-bubble" id="note-bubble-${day}-${exIdx}"><div class="note-bubble-label">📋 Observação do treinador:</div><span id="note-text-${day}-${exIdx}"></span></div>`;
    html += `<button class="history-btn" onclick="toggleHistory('${day}', ${exIdx}, '${ex.name.replace(/'/g, "\\'")}')">Ver histórico</button>`;
    html += `<div class="history-panel" id="history-${day}-${exIdx}"></div>`;
    ex.sets.forEach((set, setIdx) => {
      const typeLabel = set.type === 'aquec' ? 'AQUEC' : set.type === 'feeder' ? 'FEEDER' : 'HARD';
      const notes = set.reps.includes('+') ? set.reps.split('+')[1].trim() : '';
      html += `<div class="set-row" data-set-type="${set.type}" data-notes="${notes}">`;
      html += `<span class="set-label">${typeLabel} ${setIdx+1} <button class="note-icon" id="note-icon-${day}-${exIdx}-${setIdx}" onclick="toggleNote('${day}', ${exIdx}, ${setIdx})">!</button></span>`;
      html += `<div class="input-wrap"><input type="number" class="weight-input" placeholder="kg" inputmode="decimal"><span class="input-suffix">kg</span></div>`;
      html += `<div class="input-wrap"><input type="number" class="reps-input" placeholder="${set.reps}" inputmode="numeric"><span class="input-suffix">reps</span></div>`;
      html += `<span class="check-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></span>`;
      html += `</div>`;
      html += `<div class="note-bubble" id="note-bubble-${day}-${exIdx}-${setIdx}"><div class="note-bubble-label">📋 Observação do treinador:</div><span id="note-text-${day}-${exIdx}-${setIdx}"></span></div>`;
    });
    html += `<button class="save-btn" onclick="saveExercise('${day}', '${ex.name.replace(/'/g, "\\'")}', document.getElementById('card-${day}-${exIdx}'))">Salvar</button>`;
    html += `</div>`;
  });
  return html;
}

function toggleHistory(day, exIdx, name) {
  const panel = document.getElementById(`history-${day}-${exIdx}`);
  if (panel.classList.contains('show')) {
    panel.classList.remove('show');
  } else {
    panel.classList.add('show');
    panel.innerHTML = '<em>Carregando...</em>';
    loadHistory(name, panel);
  }
}

// === VIDEO LINKS ===
const videoLinks = {};

async function loadVideoLinks() {
  try {
    const data = await supaFetch('exercise_videos?order=created_at.desc');
    if (!data || data.length === 0) return;
    data.forEach(r => {
      if (!videoLinks[r.exercise_name]) {
        videoLinks[r.exercise_name] = r.video_url;
      }
    });
  } catch (e) {
    console.log('Erro ao carregar vídeos:', e);
  }
}

function openVideo(exerciseName) {
  const url = videoLinks[exerciseName]
    ? videoLinks[exerciseName]
    : 'https://www.youtube.com/results?search_query=' + encodeURIComponent(exerciseName + ' execução correta');
  // location.href força o iOS a sair da PWA e abrir no Safari
  window.location.href = url;
}

function toggleNote(day, exIdx, setIdx) {
  const id = setIdx !== null ? `note-bubble-${day}-${exIdx}-${setIdx}` : `note-bubble-${day}-${exIdx}`;
  const bubble = document.getElementById(id);
  if (bubble) bubble.classList.toggle('show');
}

async function loadTrainerNotes() {
  try {
    const data = await supaFetch('trainer_notes?active=eq.true&order=created_at.desc');
    if (!data || data.length === 0) return;

    const days = ['Segunda','Terça','Quarta','Quinta','Sexta','Sábado','Domingo'];
    days.forEach(day => {
      if (!WORKOUT[day]) return;
      WORKOUT[day].forEach((ex, exIdx) => {
        data.forEach(note => {
          if (note.exercise_name !== ex.name) return;
          if (note.set_number) {
            // Nota específica de um set
            const setIdx = note.set_number - 1;
            const icon = document.getElementById(`note-icon-${day}-${exIdx}-${setIdx}`);
            const text = document.getElementById(`note-text-${day}-${exIdx}-${setIdx}`);
            if (icon) icon.classList.add('visible');
            if (text) text.textContent = note.note;
          } else {
            // Nota geral do exercício
            const icon = document.getElementById(`note-icon-${day}-${exIdx}`);
            const text = document.getElementById(`note-text-${day}-${exIdx}`);
            if (icon) icon.classList.add('visible');
            if (text) text.textContent = note.note;
          }
        });
      });
    });
  } catch (e) {
    console.log('Erro ao carregar notas:', e);
  }
}

function init() {
  const today = getToday();
  const days = ['Segunda','Terça','Quarta','Quinta','Sexta','Sábado','Domingo'];

  document.getElementById('dateDisplay').textContent = new Date().toLocaleDateString('pt-BR', {
    weekday: 'long', day: 'numeric', month: 'long'
  });

  const tabsEl = document.getElementById('tabs');
  const contentEl = document.getElementById('content');

  days.forEach(day => {
    const tab = document.createElement('button');
    tab.className = 'tab' + (day === today ? ' active' : '');
    tab.textContent = day.substring(0, 3);
    tab.onclick = () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.day-content').forEach(d => d.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById('day-' + day).classList.add('active');
      loadTodayData(day);
    };
    tabsEl.appendChild(tab);

    const div = document.createElement('div');
    div.className = 'day-content' + (day === today ? ' active' : '');
    div.id = 'day-' + day;
    div.innerHTML = renderDay(day);
    contentEl.appendChild(div);
  });

  loadTodayData(today);
  loadTrainerNotes();
  loadVideoLinks();
}

init();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
</script>
