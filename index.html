<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Treino</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#00d5ff">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; connect-src 'self' https://*.supabase.co; img-src 'self' data:; frame-src https://www.youtube-nocookie.com;">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MeuTreino">
  <link rel="icon" type="image/png" href="/icon-192.png">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="stylesheet" href="theme.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body::-webkit-scrollbar, *::-webkit-scrollbar { display: none; }
    body, * { scrollbar-width: none; }
    /* Escala tipográfica — 9 passos fixos. Sem isso cada elemento nascia com
       um font-size "quase igual" ao vizinho (0.6/0.62/0.65/0.66/0.68rem...)
       e a tela ia acumulando tamanhos que não conversavam entre si. */
    :root {
      --fs-2xs: 0.65rem;
      --fs-xs: 0.7rem;
      --fs-sm: 0.75rem;
      --fs-base: 0.8rem;
      --fs-md: 0.85rem;
      --fs-lg: 0.9rem;
      --fs-xl: 1rem;
      --fs-2xl: 1.1rem;
      --fs-3xl: 1.3rem;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg-body);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 80px;
    }
    .header {
      background: var(--bg-header);
      padding: 16px;
      text-align: center;
      border-bottom: 1px solid var(--border);
      position: relative;
    }
    .header h1 { font-size: var(--fs-2xl); color: var(--accent); letter-spacing: 1px; }
    .header .subtitle { font-size: var(--fs-base); color: var(--text-muted); margin-top: 4px; }
    .header .app-logo {
      display: inline-block; height: 76px; width: auto; color: var(--logo-color);
    }
    .header .plan-title { font-size: var(--fs-xl); color: var(--text); font-weight: bold; margin-top: 2px; }
    .header .plan-dates {
      position: absolute; bottom: 10px; right: 14px;
      font-size: var(--fs-2xs); color: var(--text-muted2);
      background: var(--bg-secondary); padding: 3px 9px;
      border-radius: 10px; border: 1px solid var(--border);
      white-space: nowrap;
    }
    .header .plan-dates.hidden { display: none; }
    .header .plan-dates.expiring { color: var(--warning); border-color: var(--warning); }
    .header .plan-dates.expired { color: var(--error); border-color: var(--error); }
    .block-logout-btn {
      margin-top: 18px; background: none; border: 1px solid var(--text-dim);
      color: var(--text-muted); font-size: var(--fs-sm); padding: 6px 16px; border-radius: 14px; cursor: pointer;
    }
    .block-logout-btn:active { opacity: 0.6; }
    .sticky-top {
      position: sticky; top: 0; z-index: 99; background: var(--bg-header);
    }
    .tabs {
      display: flex;
      background: var(--bg-header);
      padding: 8px;
      gap: 4px;
      border-bottom: 1px solid var(--border);
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      flex: 1;
      padding: 8px 4px;
      border-radius: 20px;
      background: var(--bg-secondary);
      color: var(--text-muted2);
      font-size: var(--fs-xs);
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      text-align: center;
    }
    .tab.active { background: var(--accent); color: var(--text-dark); }
    .day-content { display: none; padding: 16px; }
    .day-content.active { display: block; }

    /* === Modo cíclico: tela do aluno === */
    .cyclic-view { padding: 16px; }
    .cyclic-sequence-bar {
      display: flex; gap: 4px; align-items: center; flex-wrap: wrap;
      padding: 10px 12px; margin-bottom: 14px;
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px;
      font-size: var(--fs-xs); color: var(--text-muted2);
    }
    .cyclic-sequence-bar .seq-dot {
      padding: 4px 8px; border-radius: 6px; font-weight: 700;
      background: var(--bg-secondary); color: var(--text-muted2); font-size: var(--fs-xs);
    }
    .cyclic-sequence-bar .seq-dot.current { background: var(--accent); color: var(--text-dark); }
    .cyclic-sequence-bar .seq-dot.rest { color: var(--text-muted); font-weight: 400; font-style: italic; }
    .cyclic-sequence-bar .seq-arrow { color: var(--text-dim); font-size: var(--fs-2xs); }

    .cyclic-suggested {
      background: var(--bg-card); border: 2px solid var(--accent); border-radius: 14px;
      padding: 18px 16px; margin-bottom: 14px; text-align: center;
    }
    .cyclic-suggested .cs-label { font-size: var(--fs-xs); color: var(--text-muted2); text-transform: uppercase; font-weight: 700; letter-spacing: 0.5px; margin-bottom: 6px; }
    .cyclic-suggested .cs-title { font-size: var(--fs-2xl); font-weight: 700; color: var(--accent); }
    .cyclic-suggested .cs-subtitle { font-size: var(--fs-base); color: var(--text-muted); margin-top: 4px; }
    .cyclic-suggested .cs-btn {
      margin-top: 14px; width: 100%; padding: 14px; border: none; border-radius: 10px;
      background: var(--accent); color: var(--text-dark); font-weight: 700; font-size: var(--fs-lg); cursor: pointer;
    }
    .cyclic-suggested .cs-btn:active { opacity: 0.7; }

    .cyclic-rest-card {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px;
      padding: 24px 16px; margin-bottom: 14px; text-align: center;
    }
    .cyclic-rest-card .cr-title { font-size: var(--fs-xl); font-weight: 700; color: var(--text-muted); margin-bottom: 4px; }
    .cyclic-rest-card .cr-sub { font-size: var(--fs-sm); color: var(--text-muted2); }

    .cyclic-others-label { font-size: var(--fs-xs); color: var(--text-muted2); font-weight: 600; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.3px; }
    .cyclic-option {
      display: flex; align-items: center; gap: 12px;
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px;
      padding: 14px; margin-bottom: 8px; cursor: pointer; transition: border-color 0.2s;
    }
    .cyclic-option:active { border-color: var(--accent); }
    .cyclic-option .co-letter {
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--bg-secondary); display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: var(--fs-md); color: var(--accent); flex-shrink: 0;
    }
    .cyclic-option .co-body { flex: 1; min-width: 0; }
    .cyclic-option .co-title { font-size: var(--fs-md); font-weight: 600; color: var(--text); }
    .cyclic-option .co-subtitle { font-size: var(--fs-xs); color: var(--text-muted2); margin-top: 2px; }
    .cyclic-option .co-arrow { color: var(--text-dim); font-size: var(--fs-base); }

    /* Quando o aluno está dentro de um treino cíclico (exercícios abertos) */
    .cyclic-back-btn {
      display: inline-flex; align-items: center; gap: 4px;
      background: none; border: 1px solid var(--border); color: var(--text-muted);
      font-size: var(--fs-xs); font-weight: 600; padding: 6px 12px;
      border-radius: 8px; cursor: pointer; margin-bottom: 12px;
    }
    .cyclic-back-btn:active { opacity: 0.6; }
    .cyclic-day-title {
      font-size: var(--fs-xl); font-weight: 700; color: var(--accent); margin-bottom: 4px;
    }
    .cyclic-day-subtitle { font-size: var(--fs-base); color: var(--text-muted); margin-bottom: 14px; }
    .exercise-card {
      background: var(--bg-card);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      border: 1px solid var(--border);
    }

    /* Biset/Triset/Giant Set wrapper */
    .biset-wrapper {
      border: 2px solid var(--accent);
      border-radius: 14px;
      padding: 12px 10px 10px;
      margin-bottom: 12px;
      position: relative;
      background: var(--bg-input);
    }
    .biset-wrapper .biset-label {
      position: absolute; top: -11px; left: 14px;
      background: var(--bg-input); color: var(--accent); font-size: var(--fs-xs);
      font-weight: 700; padding: 0 8px; letter-spacing: 0.5px;
    }
    .biset-wrapper .exercise-card {
      margin-bottom: 8px;
      border: 1px solid var(--border);
    }
    .biset-wrapper .exercise-card:last-of-type { margin-bottom: 10px; }
    .biset-wrapper .save-btn { margin-top: 4px; }
    .exercise-name {
      font-size: var(--fs-3xl);
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 10px;
      text-transform: uppercase;
    }
    .set-row {
      display: grid;
      grid-template-columns: auto 1fr 1fr 40px;
      gap: 8px;
      align-items: center;
      margin-bottom: 10px;
      padding: 6px 0;
    }
    /* Coluna do descanso: largura FIXA porque cada .set-row e um grid
       proprio — com 'auto' a linha sem botao dava coluna de 0px e
       desalinhava KG/REPS entre as series do mesmo exercicio. */
    .set-row.has-rest { grid-template-columns: auto 1fr 1fr 52px 40px; }
    .set-label {
      font-size: var(--fs-sm);
      color: var(--text);
      text-transform: uppercase;
      min-width: 72px;
      font-weight: 600;
    }
    .set-label.type-aquec { color: var(--success-light); }
    .set-label.type-feeder { color: var(--info); }
    .set-label.type-hard { color: var(--error-light); }
    .set-label.type-cardio { color: var(--warning); }
    /* Cardio: uma coluna só (minutos) em vez de KG × REPS */
    .set-row.cardio-row { grid-template-columns: auto 1fr 40px; }
    .set-row.cardio-row.has-rest { grid-template-columns: auto 1fr 52px 40px; }
    .set-row.cardio-row input { border-color: var(--accent-dark); }
    .set-row.cardio-row input:focus { border-color: var(--warning); }
    /* Descanso prescrito: sempre visível, em linha PRÓPRIA — quando era
       inline dividia a linha com o "Ver histórico" e ficava colado nele. */
    .rest-line { display: block; margin: 2px 0 8px; }
    .rest-pill {
      display: inline-flex; align-items: baseline; flex-wrap: wrap; gap: 5px;
      background: var(--bg-input); border: 1px solid var(--border); color: var(--accent-hover);
      font-size: var(--fs-xs); font-weight: 600; padding: 5px 10px;
      border-radius: 10px; line-height: 1.4; max-width: 100%;
    }
    .rest-pill .rest-key { color: var(--text-muted2); font-weight: 600; }
    .rest-pill .rest-value { font-size: var(--fs-sm); font-weight: 700; word-break: break-word; }
    .history-btn { display: block; }
    .no-sets {
      background: var(--bg-input); border: 1px solid var(--accent-dark); color: var(--warning-light);
      font-size: var(--fs-sm); padding: 8px 10px; border-radius: 8px; margin-top: 4px;
    }
    .set-row input {
      width: 100%;
      padding: 10px 8px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-body);
      color: var(--text-bright);
      font-size: 16px;
      font-weight: 600;
      text-align: center;
      min-width: 0;
      box-sizing: border-box;
    }
    .set-header { margin-bottom: 0; padding: 0; }
    .col-title { font-size: var(--fs-2xs); color: var(--text-muted2); text-align: center; font-weight: 700; text-transform: uppercase; }
    .col-title.col-rest { font-size: var(--fs-base); }
    .set-row input::placeholder { color: var(--text-muted); font-size: 14px; font-weight: 500; }
    .set-row input:focus { outline: none; border-color: var(--accent); }
    /* Treino do dia: placeholder de referência (peso/reps da semana passada) em destaque. */
    .today-tab .set-row input::placeholder { color: var(--accent); font-size: 15px; font-weight: 600; opacity: 0.85; }
    .save-btn {
      width: 100%; padding: 12px; border: none; border-radius: 8px;
      background: var(--accent); color: var(--text-dark); font-weight: 700; font-size: var(--fs-lg);
      cursor: pointer; margin-top: 8px; transition: opacity 0.2s;
    }
    .save-btn:active:not(:disabled) { opacity: 0.7; }
    .save-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .save-btn.saved { background: var(--save-done); color: var(--text-bright); }
    /* "Salvando" com os três pontos pulsando em sequência: o botão fica
       desabilitado durante o POST e, parado, parecia travado. Só a opacidade
       muda — os pontos ocupam o mesmo espaço o tempo todo, sem pulo de layout. */
    .saving-dots i { font-style: normal; animation: savingDot 1s infinite; }
    .saving-dots i:nth-child(2) { animation-delay: 0.16s; }
    .saving-dots i:nth-child(3) { animation-delay: 0.32s; }
    @keyframes savingDot { 0%, 60%, 100% { opacity: 0.25; } 30% { opacity: 1; } }
    .history-btn {
      background: none; border: none; color: var(--accent); font-size: var(--fs-sm);
      cursor: pointer; padding: 4px 0; margin-bottom: 8px; text-decoration: underline;
    }
    .check-icon {
      width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--text-muted3);
      display: flex; align-items: center; justify-content: center; transition: all 0.2s;
      /* position: o halo do salvar é um ::after ancorado aqui. */
      position: relative;
      /* Vazia, a bolinha é um encaixe fundo esperando o ✓. */
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.18);
    }
    /* Medalha: a bolinha cheia diz como a série foi contra a MESMA série da
       sessão anterior (ouro subiu o volume, prata empatou, bronze caiu; sem
       referência é ouro). São as únicas cores fixas da tela — medalha de prata
       muda de cor com o tema é uma medalha que não significa nada. O tom entra
       por --medal, que .done já usa no fundo, na borda e no halo, então nenhuma
       regra é duplicada; sem classe de medalha vale a cor do tema, como antes. */
    .check-icon { --medal: var(--save-done); }
    .check-icon.medal-ouro { --medal: #dfa616; }
    .check-icon.medal-prata { --medal: #9aa3af; }
    .check-icon.medal-bronze { --medal: #a86a34; }
    /* Respiro entre a coluna do descanso e a bolinha, que estavam coladas. */
    .set-row.has-rest .check-icon { margin-left: 8px; }
    .check-icon svg { display: none; }
    /* Cheia: volume em cima da cor da medalha — brilho no alto à esquerda,
       sombra embaixo e um anel externo suave. Tudo em rgba sobre var(--medal),
       sem color-mix, para render igual em WebView antigo e em qualquer tema. */
    .check-icon.done {
      border-color: var(--medal); border-width: 2px;
      background:
        radial-gradient(circle at 32% 26%, rgba(255, 255, 255, 0.55), rgba(255, 255, 255, 0) 58%),
        linear-gradient(145deg, rgba(255, 255, 255, 0.3), rgba(0, 0, 0, 0.22)),
        var(--medal);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.45),
        inset 0 -2px 3px rgba(0, 0, 0, 0.22),
        0 2px 6px rgba(0, 0, 0, 0.3);
    }
    .check-icon.done svg { display: block; filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.35)); }
    /* Confirmação do salvar: a bolinha estufa e o ✓ é desenhado por cima.
       Só entra no clique do Salvar (classe .just-saved) — ao abrir a tela as
       séries já feitas aparecem prontas, sem a lista inteira piscando.
       --pop-delay escalona as séries de cima para baixo. */
    .check-icon.just-saved {
      animation: checkPop 420ms ease-out var(--pop-delay, 0ms) backwards;
    }
    .check-icon.just-saved svg polyline {
      stroke-dasharray: 24;
      animation: checkDraw 300ms ease-out calc(var(--pop-delay, 0ms) + 80ms) backwards;
    }
    /* Anel que se abre e some no momento do ✓. opacity 0 na base para que,
       terminada a animação, não sobre nenhum aro na tela. */
    .check-icon.just-saved::after {
      content: ''; position: absolute; inset: -4px; border-radius: 50%;
      border: 2px solid var(--medal); opacity: 0;
      animation: checkHalo 520ms ease-out var(--pop-delay, 0ms);
    }
    @keyframes checkPop { 0% { transform: scale(1); } 40% { transform: scale(1.35); } 100% { transform: scale(1); } }
    @keyframes checkDraw { from { stroke-dashoffset: 24; } to { stroke-dashoffset: 0; } }
    @keyframes checkHalo { 0% { opacity: 0.8; transform: scale(0.65); } 100% { opacity: 0; transform: scale(1.5); } }
    /* ── Descanso: botão por série + cronômetro ──────────────────────
       O valor prescrito daquela série vira o próprio botão ("90s"), então
       o aluno vê o tempo e dispara a contagem no mesmo toque. Séries sem
       descanso prescrito (ou com texto livre, "até recuperar") mantêm a
       célula vazia para a grade não desalinhar. */
    .rest-cell { min-width: 0; }
    .rest-timer-btn {
      width: 100%; background: none; border: 1px solid var(--accent-dark); color: var(--accent);
      font-size: var(--fs-2xs); font-weight: 700; font-variant-numeric: tabular-nums;
      padding: 7px 2px; border-radius: 8px; cursor: pointer; white-space: nowrap;
      min-width: 0; transition: opacity 0.2s;
    }
    .rest-timer-btn:active { opacity: 0.6; }
    .rest-timer-btn.running { border-color: var(--accent); background: rgba(var(--accent-rgb), 0.15); }

    .rest-modal {
      display: none; position: fixed; inset: 0; background: var(--overlay-bg);
      z-index: 1300; align-items: center; justify-content: center; padding: 20px;
    }
    .rest-modal.show { display: flex; animation: restFadeIn 0.18s ease-out; }
    @keyframes restFadeIn { from { opacity: 0; } to { opacity: 1; } }
    .rest-modal-sheet {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 20px;
      padding: 22px 20px 18px; width: 100%; max-width: 360px; text-align: center;
      animation: restSheetIn 0.22s cubic-bezier(0.2, 0.9, 0.3, 1.2);
    }
    @keyframes restSheetIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .rest-modal-title {
      font-size: var(--fs-sm); color: var(--text-muted2); text-transform: uppercase;
      letter-spacing: 1.5px; font-weight: 700;
    }
    .rest-modal-sub {
      font-size: var(--fs-md); color: var(--text-muted3); margin-top: 4px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .rest-ring-wrap { position: relative; width: 216px; height: 216px; margin: 16px auto 8px; }
    .rest-ring { width: 100%; height: 100%; transform: rotate(-90deg); }
    .rest-ring-track { fill: none; stroke: var(--border); stroke-width: 10; }
    .rest-ring-bar {
      fill: none; stroke: var(--accent); stroke-width: 10; stroke-linecap: round;
      filter: drop-shadow(0 0 6px rgba(var(--accent-rgb), 0.55));
      transition: stroke 0.3s;
    }
    .rest-ring-center {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 2px;
    }
    .rest-time {
      font-size: 3.1rem; line-height: 1; font-weight: 800; color: var(--text-bright);
      font-variant-numeric: tabular-nums; letter-spacing: 1px;
    }
    .rest-of {
      font-size: var(--fs-xs); color: var(--text-muted3); font-weight: 600;
      letter-spacing: 0.5px;
    }
    /* Últimos 5s: o anel respira junto com a contagem. */
    .rest-modal.warning .rest-ring-bar { stroke: var(--warning); filter: drop-shadow(0 0 8px var(--warning)); }
    .rest-modal.warning .rest-time { color: var(--warning); animation: restPulse 1s ease-in-out infinite; }
    @keyframes restPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.12); } }
    .rest-modal.paused .rest-ring-bar { stroke: var(--text-dim); filter: none; }
    .rest-modal.paused .rest-time { color: var(--text-muted); }
    .rest-modal.done .rest-ring-bar { stroke: var(--success); filter: drop-shadow(0 0 10px var(--success)); }
    .rest-modal.done .rest-ring-wrap { animation: restDone 0.5s ease-out 2; }
    @keyframes restDone { 0%, 100% { transform: scale(1); } 45% { transform: scale(1.07); } }
    .rest-modal.done .rest-time { color: var(--success); font-size: 2.1rem; }
    .rest-status {
      font-size: var(--fs-md); font-weight: 700; color: var(--text-muted2);
      min-height: 18px; letter-spacing: 0.5px;
    }
    .rest-modal.done .rest-status { color: var(--success); }
    .rest-controls { display: flex; gap: 8px; margin-top: 16px; }
    .rest-controls button {
      flex: 1; background: none; border: 1px solid var(--border); color: var(--text);
      font-size: var(--fs-md); font-weight: 700; padding: 11px 4px; border-radius: 10px;
      cursor: pointer; transition: opacity 0.2s;
    }
    .rest-controls button:active { opacity: 0.6; }
    .rest-controls .rest-main-btn { border-color: var(--accent); color: var(--accent); }
    .rest-close-btn {
      width: 100%; margin-top: 10px; background: none; border: none;
      color: var(--text-muted3); font-size: var(--fs-md); font-weight: 600;
      padding: 10px; cursor: pointer;
    }
    .rest-close-btn:active { opacity: 0.6; }
    .rest-modal-note {
      font-size: var(--fs-2xs); color: var(--text-muted3); margin-top: 2px;
    }
    /* Timer de treino - discreto */
    .start-workout-row {
      display: flex; flex-direction: column; align-items: stretch; gap: 8px;
      padding: 10px 16px; background: var(--bg-header); border-bottom: 1px solid var(--border-light);
    }
    .start-workout-btn {
      width: 100%; background: none; border: 1px solid var(--accent); color: var(--accent);
      font-size: var(--fs-lg); font-weight: 700; padding: 12px;
      border-radius: 8px; cursor: pointer; transition: opacity 0.2s;
    }
    .start-workout-btn:active { opacity: 0.6; }
    .start-workout-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .workout-timer-inline {
      font-size: var(--fs-lg); color: var(--accent); font-weight: 700;
      font-variant-numeric: tabular-nums; letter-spacing: 0.5px;
      text-align: center;
    }
    .end-workout-row {
      display: flex; gap: 8px; padding: 12px 16px; margin-top: 8px;
    }
    .end-workout-btn, .pause-workout-btn, .restart-workout-btn {
      flex: 1; background: none; border: 1px solid var(--accent); color: var(--accent);
      font-size: var(--fs-lg); font-weight: 700; padding: 12px;
      border-radius: 8px; cursor: pointer; transition: opacity 0.2s;
    }
    .end-workout-btn:active, .pause-workout-btn:active, .restart-workout-btn:active { opacity: 0.6; }
    .restart-workout-btn { border-color: var(--text-muted); color: var(--text-muted); }
    .workout-timer-inline.paused { opacity: 0.7; }
    .workout-done-msg {
      font-size: var(--fs-lg); color: var(--accent); font-weight: 700;
      text-align: center; padding: 12px 16px;
    }
    .restart-workout-row {
      display: flex; padding: 0 16px 12px; margin-top: 8px;
    }

    /* ── Modal: nota do treino ao encerrar ────────────────────────── */
    .rating-modal {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75);
      z-index: 2000; align-items: flex-end; justify-content: center;
    }
    .rating-modal.show { display: flex; }
    .rating-modal-content {
      background: var(--bg-card); border-radius: 18px 18px 0 0;
      width: 100%; max-width: 480px; padding: 20px 20px 24px;
    }
    .rating-modal-content h3 { font-size: var(--fs-xl); color: var(--text); margin-bottom: 4px; }
    .rating-modal-sub { font-size: var(--fs-sm); color: var(--text-muted3); margin-bottom: 16px; }
    .rating-scale { display: flex; gap: 8px; margin-bottom: 16px; }
    .rating-option {
      flex: 1; padding: 12px 0; text-align: center; border-radius: 8px;
      background: var(--bg-input); border: 1px solid var(--border); color: var(--text-muted);
      font-size: var(--fs-lg); font-weight: 700; cursor: pointer;
    }
    .rating-option.selected { background: var(--accent); border-color: var(--accent); color: var(--text-dark); }
    #ratingFeedback {
      width: 100%; min-height: 70px; background: var(--bg-input); color: var(--text);
      border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px;
      font-family: inherit; font-size: var(--fs-md); resize: none; margin-bottom: 16px;
    }
    #ratingFeedback:focus { outline: none; border-color: var(--accent); }
    .rating-actions { display: flex; gap: 10px; }
    .rating-skip-btn {
      padding: 12px 16px; border: 1px solid var(--border); border-radius: 10px;
      background: none; color: var(--text-muted2); font-size: var(--fs-base); cursor: pointer;
    }
    .rating-save-btn {
      flex: 1; padding: 12px; border: none; border-radius: 10px;
      background: var(--accent); color: var(--text-dark); font-weight: 700; font-size: var(--fs-lg); cursor: pointer;
    }
    .rating-save-btn:active, .rating-skip-btn:active { opacity: 0.7; }

    .loading { text-align: center; padding: 40px; color: var(--text-muted2); }
    .empty-state {
      text-align: center; padding: 60px 24px;
      display: flex; flex-direction: column; align-items: center; gap: 12px;
    }
    .empty-state .empty-icon { font-size: 3rem; }
    .empty-state .empty-title { font-size: var(--fs-2xl); font-weight: 700; color: var(--accent); }
    .empty-state .empty-text { font-size: var(--fs-lg); color: var(--text-muted); line-height: 1.6; }
    .toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: var(--accent); color: var(--text-dark); padding: 10px 20px; border-radius: 20px;
      font-size: var(--fs-md); font-weight: 600; display: none; z-index: 1000;
    }
    .toast.error { background: var(--error); color: var(--text-bright); }
    .toast.show { display: block; animation: fadeOut 2s forwards; }
    @keyframes fadeOut { 0%,70% { opacity: 1; } 100% { opacity: 0; } }
    .note-icon {
      display: none; background: var(--error); color: var(--text-bright); width: 18px; height: 18px;
      border-radius: 50%; font-size: var(--fs-2xs); font-weight: 700; border: none;
      cursor: pointer; margin-left: 4px; flex-shrink: 0; vertical-align: middle;
    }
    .note-icon.visible { display: inline-flex; align-items: center; justify-content: center; }
    .exercise-header { display: flex; align-items: center; }
    .exercise-name { flex: 1; }
    /* Bola de 22px com um triangulo nao lia como botao: virou pill com
       rotulo, fundo tingido do accent e borda da mesma cor. */
    .video-btn {
      background: rgba(var(--accent-rgb), 0.14); border: 1px solid var(--accent-dark);
      color: var(--accent); font-size: var(--fs-2xs); font-weight: 700; line-height: 1;
      padding: 6px 10px; border-radius: 999px; cursor: pointer; margin-left: 8px;
      flex-shrink: 0; white-space: nowrap; gap: 4px;
      display: none; align-items: center; justify-content: center;
    }
    .video-btn.visible { display: inline-flex; }
    .video-btn:active { background: rgba(var(--accent-rgb), 0.3); }
    .note-bubble {
      display: none; background: var(--bg-secondary); border: 1px solid var(--accent); border-radius: 8px;
      padding: 10px; margin-bottom: 10px; font-size: var(--fs-base); color: var(--text);
    }
    .note-bubble.show { display: block; }
    .note-bubble-label { font-size: var(--fs-2xs); color: var(--accent); margin-bottom: 4px; font-weight: 600; }
    .history-modal {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.9); z-index: 1000; align-items: center;
      justify-content: center; padding: 16px;
    }
    .history-modal.show { display: flex; }
    .history-modal-content {
      background: var(--bg-card); border-radius: 12px; padding: 16px; width: 100%;
      max-width: 400px; max-height: 80vh; overflow-y: auto; border: 1px solid var(--border);
    }
    .history-modal-content h3 { color: var(--accent); font-size: var(--fs-lg); margin-bottom: 12px; }
    .history-modal-close {
      width: 100%; padding: 10px; border: none; border-radius: 8px;
      background: var(--bg-secondary); color: var(--text-muted); font-weight: 600; font-size: var(--fs-md);
      cursor: pointer; margin-top: 12px;
    }
    .logout-modal { z-index: 1150; }
    .history-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; }
    .history-day { min-width: 0; }
    .history-date { color: var(--accent); font-size: var(--fs-sm); font-weight: 600; margin-bottom: 4px; }
    .history-set { font-size: var(--fs-base); color: var(--text); padding: 3px 0; border-bottom: 1px solid var(--border-light); }
    /* Tela de bloqueio */
    .block-screen { display: none; text-align: center; padding: 60px 24px; }
    .block-screen.show { display: block; }
    .block-screen .icon { font-size: 2.4rem; margin-bottom: 12px; }
    .block-screen h2 { font-size: var(--fs-2xl); color: var(--accent); margin-bottom: 8px; }
    .block-screen p { font-size: var(--fs-lg); color: var(--text-muted); line-height: 1.5; }
    /* Loading overlay */
    .loading-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: var(--overlay-bg); z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 16px; transition: opacity 0.3s;
    }
    .loading-overlay.hidden { opacity: 0; pointer-events: none; }
    .loading-spinner {
      width: 44px; height: 44px; border: 3px solid var(--spinner-track);
      border-top-color: var(--spinner-accent); border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { color: var(--text-muted); font-size: var(--fs-base); font-weight: 500; letter-spacing: 0.5px; }

    /* ── Modal de anotações do aluno ─────────────────────────── */
    .notes-modal {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.92); z-index: 1000;
      align-items: flex-end; justify-content: center;
    }
    .notes-modal.show { display: flex; }
    .notes-modal-sheet {
      background: var(--bg-card); border-radius: 16px 16px 0 0;
      width: 100%; max-width: 520px;
      max-height: 88vh; display: flex; flex-direction: column;
      border: 1px solid var(--border); border-bottom: none;
    }
    .notes-modal-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px 10px; border-bottom: 1px solid var(--bg-secondary); flex-shrink: 0;
    }
    .notes-modal-header h3 { color: var(--accent); font-size: var(--fs-xl); font-weight: 700; }
    .notes-modal-close {
      background: var(--bg-secondary); border: none; color: var(--text-muted); font-size: var(--fs-2xl);
      width: 28px; height: 28px; border-radius: 50%; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .notes-modal-close:active { opacity: 0.6; }
    .notes-modal-body {
      overflow-y: auto; padding: 12px 16px 20px; flex: 1;
    }

    /* ── Modal de vídeo do exercício (embutido, sem sair do app) ────── */
    .video-modal {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.92); z-index: 1000;
      align-items: flex-end; justify-content: center;
    }
    .video-modal.show { display: flex; }
    .video-modal-sheet {
      background: var(--bg-card); border-radius: 16px 16px 0 0;
      width: 100%; max-width: 480px; padding: 14px 16px 24px;
      border: 1px solid var(--border); border-bottom: none;
    }
    .video-modal-header {
      display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px;
    }
    .video-modal-header h3 { color: var(--accent); font-size: var(--fs-lg); font-weight: 700; }
    .video-modal-frame-wrap {
      position: relative; width: 100%; max-width: 260px; margin: 0 auto;
      aspect-ratio: 9 / 16; border-radius: 12px; overflow: hidden;
      background: #000; border: 1px solid var(--border);
    }
    .video-modal-frame-wrap iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    .video-modal-fallback {
      display: block; text-align: center; margin-top: 12px; font-size: var(--fs-sm);
      color: var(--text-muted2); text-decoration: none;
    }
    .video-modal-fallback:active { opacity: 0.6; }

    /* ── Renderização das notas ──────────────────────────────── */
    .note-render { line-height: 1.7; font-size: var(--fs-lg); }
    .note-render .note-section {
      background: var(--bg-input); border: 1px solid var(--bg-secondary);
      border-radius: 10px; padding: 12px 14px; margin-bottom: 10px;
    }
    .note-render .note-section-title {
      font-size: var(--fs-base); font-weight: 700; color: var(--accent);
      text-transform: uppercase; letter-spacing: 0.5px;
      margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px solid var(--bg-secondary);
    }
    .note-render .note-line {
      font-size: var(--fs-md); color: var(--text); padding: 2px 0;
    }
    .note-render .note-line.bullet::before { content: '• '; color: var(--accent); }
    .note-render .note-line.dash::before   { content: '— '; color: var(--text-muted2); }
    .note-render .note-line.num::before    { content: attr(data-num) '. '; color: var(--accent); }
    .note-render .note-spacer { height: 4px; }
    .note-modal-updated {
      font-size: var(--fs-2xs); color: var(--text-muted3); text-align: right;
      margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border-light);
    }

    /* ── Botão hamburger (header) ─────────────────────────────── */
    .menu-btn {
      position: absolute; top: 12px; left: 14px;
      background: var(--bg-input); border: 1px solid var(--accent);
      width: 34px; height: 30px; border-radius: 10px; cursor: pointer;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 4px; padding: 0;
    }
    .menu-btn:active { opacity: 0.7; }
    .menu-btn span { display: block; width: 16px; height: 2px; background: var(--accent); border-radius: 2px; }
    /* Ponto vermelho: orientação nova que o aluno ainda não abriu.
       Sem isso, esconder as Orientações dentro do menu faria o aluno
       perder o recado do professor sem nunca saber que existia. */
    .menu-btn .menu-badge {
      position: absolute; top: -3px; right: -3px;
      width: 9px; height: 9px; border-radius: 50%;
      background: var(--error); border: none; display: none;
    }
    .menu-btn.has-news .menu-badge { display: block; }

    /* ── Menu lateral ─────────────────────────────────────────── */
    .drawer-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.6);
      z-index: 1100; opacity: 0; pointer-events: none; transition: opacity 0.2s;
    }
    .drawer-backdrop.show { opacity: 1; pointer-events: auto; }
    .drawer {
      position: fixed; top: 0; left: 0; bottom: 0; width: 82%; max-width: 300px;
      background: var(--bg-header); border-right: 1px solid var(--border); z-index: 1101;
      transform: translateX(-100%); transition: transform 0.22s ease-out;
      display: flex; flex-direction: column;
      padding-top: env(safe-area-inset-top);
    }
    .drawer.show { transform: translateX(0); }
    .drawer-header {
      padding: 16px 16px 12px; border-bottom: 1px solid var(--bg-secondary);
      display: flex; align-items: flex-start; justify-content: space-between; gap: 8px;
    }
    .drawer-header .drawer-title { font-size: var(--fs-xl); font-weight: 700; color: var(--accent); }
    .drawer-header .drawer-sub { font-size: var(--fs-xs); color: var(--text-dim); margin-top: 3px; }
    .drawer-close {
      background: var(--bg-secondary); border: none; color: var(--text-muted); font-size: var(--fs-xl);
      width: 28px; height: 28px; border-radius: 50%; cursor: pointer; flex-shrink: 0;
    }
    .drawer-items { padding: 8px; overflow-y: auto; flex: 1; }
    .drawer-item {
      width: 100%; display: flex; align-items: center; gap: 12px;
      background: none; border: none; border-radius: 10px;
      padding: 13px 12px; cursor: pointer; text-align: left; color: var(--text);
    }
    .drawer-item:active { background: var(--bg-secondary); }
    .drawer-item .di-icon { font-size: var(--fs-2xl); width: 24px; text-align: center; flex-shrink: 0; }
    .drawer-item .di-text { flex: 1; min-width: 0; }
    /* label e desc são <span>: sem display:block ficariam na mesma linha */
    .drawer-item .di-label { display: block; font-size: var(--fs-lg); font-weight: 600; }
    .drawer-item .di-desc { display: block; font-size: var(--fs-2xs); color: var(--text-dim); margin-top: 2px; }
    .drawer-item .di-dot {
      width: 8px; height: 8px; border-radius: 50%; background: var(--error);
      flex-shrink: 0; display: none;
    }
    .drawer-item.has-news .di-dot { display: block; }
    .drawer-footer { padding: 8px; border-top: 1px solid var(--bg-secondary); flex-shrink: 0; }
    .drawer-item-logout .di-label { color: var(--text-bright); }
    .drawer-section {
      font-size: var(--fs-2xs); color: var(--text-muted3); text-transform: uppercase;
      letter-spacing: 0.6px; padding: 12px 12px 4px;
    }

    /* ── Gráfico de evolução do exercício (dentro do histórico) ── */
    .chart-btn {
      width: 100%; background: var(--bg-secondary); border: 1px solid var(--accent); color: var(--accent);
      font-size: var(--fs-base); font-weight: 600; padding: 9px; border-radius: 8px;
      cursor: pointer; margin-top: 12px;
    }
    .chart-btn:active { opacity: 0.7; }
    .chart-btn:disabled { opacity: 0.5; cursor: default; }
    .chart-container {
      display: none; background: var(--bg-body); border-radius: 8px;
      padding: 10px; margin-top: 10px;
    }
    .chart-container.show { display: block; }
    .chart-container canvas { max-height: 200px; }
    .chart-legend {
      display: flex; justify-content: center; gap: 14px; flex-wrap: wrap;
      font-size: var(--fs-2xs); color: var(--text-muted); margin-top: 6px;
    }
    .chart-legend span { display: flex; align-items: center; gap: 4px; }
    .chart-legend .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    /* Área de texto do gráfico. Existe separada para que mensagens de
       erro/vazio NÃO sobrescrevam o <canvas> (isso travava a reabertura). */
    .chart-info { margin-top: 8px; }
    .chart-info .stat-row {
      display: flex; justify-content: space-between; gap: 8px;
      font-size: var(--fs-xs); padding: 5px 0; border-bottom: 1px solid var(--border-light);
    }
    .chart-info .stat-row:last-child { border-bottom: none; }
    .chart-info .stat-label { color: var(--text-muted); }
    .chart-info .stat-value { color: var(--text); font-weight: 600; text-align: right; }
    .chart-info .stat-value.up { color: var(--success-light); }
    .chart-info .stat-value.down { color: var(--error); }
    .chart-caption {
      font-size: var(--fs-2xs); color: var(--text-dim); text-align: center;
      padding-bottom: 6px; border-bottom: 1px solid var(--border-light); margin-bottom: 4px;
    }
    .chart-info .no-data {
      text-align: center; padding: 16px; color: var(--text-muted3);
      font-size: var(--fs-base); font-style: italic;
    }
    .frequency {
      margin-top: 10px; padding: 8px; background: var(--bg-card);
      border-radius: 8px; font-size: var(--fs-xs); color: var(--text-muted); text-align: center;
    }
    .frequency strong { color: var(--accent); }
    .freq-dots { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; margin-top: 6px; }
    .freq-dot { width: 10px; height: 10px; border-radius: 50%; background: #4caf50; }
    .freq-dot.missed { background: var(--error); }

    /* Acima da largura de um celular a tela esticava de ponta a ponta —
       aqui o app vira uma coluna centralizada, como qualquer app mobile
       aberto num navegador largo (desktop/tablet). */
    /* Celular: a margem lateral cede espaco para os campos.
       O placeholder de REPS mostra 'feito na semana passada · prescrito' —
       com o respiro de 16px+16px ele era cortado em qualquer tela <= 414px. */
    @media (max-width: 480px) {
      .day-content { padding: 12px 8px; }
      .cyclic-view { padding: 12px 8px; }
      .exercise-card { padding: 14px 10px; }
      .biset-wrapper { padding: 12px 6px 10px; }
      /* card dentro de biset: a moldura do grupo ja da o recuo */
      .biset-wrapper .exercise-card { padding-left: 6px; padding-right: 6px; }
      .set-row { gap: 6px; }
      .set-label { min-width: 64px; }
      /* o texto do placeholder vale mais que o respiro interno do campo */
      .set-row input { padding: 10px 4px; }
    }

    @media (min-width: 640px) {
      .header, .sticky-top, #content, .block-screen {
        max-width: 480px;
        margin-left: auto;
        margin-right: auto;
      }
    }
  </style>

  <nav class="drawer" id="drawer" aria-label="Menu">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth-guard.js"></script>
<!-- Cálculos compartilhados com as telas do professor (toLocalISO, e1rm,
     helpers de cardio, janela dos gráficos). Não puxa nada da rede. -->
<script src="/metrics.js"></script>
<script>
// === Estado global ===
function showLoading() { document.getElementById('loadingOverlay').classList.remove('hidden'); }
function hideLoading() { document.getElementById('loadingOverlay').classList.add('hidden'); }
let WORKOUT = {};  // carregado do banco
let studentId = null;
let planMode = 'weekly';      // 'weekly' | 'cyclic'
let planSubtitles = {};       // subtítulos por dia/letra
let planCycleSequence = [];   // sequência do ciclo (ex: ['A','B','rest','C'])
let cyclicPosition = 0;       // posição atual na sequência (derivada do último log)
let activePlanId = null;      // id do treino ativo — escopo do histórico do aluno
let planScoped = false;       // false enquanto a migration 30 não rodou (fallback)

// === Escopo do histórico ===
// O histórico que o ALUNO vê é o do treino atual. Quando o professor ativa
// outro treino, activePlanId muda e a referência de carga, o modal de
// histórico, o gráfico do exercício e a posição do ciclo começam do zero —
// carga de um treino que não existe mais só atrapalha quem está executando.
// Nada é apagado: os logs antigos ficam no banco marcados com o plano de
// origem, e evolucao.html e as telas do professor continuam vendo tudo.
// Editar o MESMO treino não reseta: o id do plano não muda.
function scopeToPlan(query) {
  return planScoped ? query.eq('plan_id', activePlanId) : query;
}

// Carimbo do plano nos registros novos (vazio enquanto a coluna não existe).
function planStamp() {
  return planScoped ? { plan_id: activePlanId } : {};
}

// Sem a migration 30 a coluna plan_id não existe e todo insert/select com ela
// falharia. Uma sondagem no boot decide entre escopar por plano ou seguir com
// o histórico global de antes.
async function detectPlanScope() {
  if (!activePlanId) return false;
  const { error } = await _sb.from('workout_logs')
    .select('plan_id')
    .eq('student_id', studentId)
    .limit(1);
  if (error) {
    console.warn('[MeuTreino] Histórico não escopado por treino. Rode sql/30_logs_plan_id.sql no Supabase.', error.message || error);
    return false;
  }
  return true;
}

// === Helpers ===
const esc = (s) => { // escape HTML (proteção XSS)
  const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML;
};

function getToday() {
  const days = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
  return days[new Date().getDay()];
}

// toLocalISO() vem de metrics.js: converte um Date para 'YYYY-MM-DD' no fuso
// LOCAL. NÃO usar toISOString() para datas — ele converte para UTC e, após ~21h
// no Brasil, devolve o dia seguinte, gravando o treino na data errada.

function getTodayDate() { return toLocalISO(new Date()); }

// Retorna a data mais recente para o dia da semana informado
// Ex: se hoje é Domingo e day='Segunda', retorna a segunda passada (há 6 dias)
// Se day é o dia de hoje, retorna hoje
// No modo cíclico (letras), sempre retorna hoje
function getDateForDay(day) {
  if (planMode === 'cyclic') return getTodayDate();
  const dayIndex = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'].indexOf(day);
  if (dayIndex < 0) return getTodayDate(); // letra cíclica ou desconhecido
  const now = new Date();
  const todayIndex = now.getDay();
  let diff = todayIndex - dayIndex;
  if (diff < 0) diff += 7;
  const target = new Date(now);
  target.setDate(now.getDate() - diff);
  return toLocalISO(target);
}

function showToast(text, isError) {
  const t = document.getElementById('toast');
  t.textContent = text;
  t.className = 'toast show' + (isError ? ' error' : '');
  setTimeout(() => t.className = 'toast', 2500);
}

// Linhas de série de um dia. No modo cíclico não existe div#day-X (os cards
// vivem soltos), então cai no seletor por data-day.
function dayRows(day) {
  const dayEl = document.getElementById('day-' + day);
  return dayEl
    ? dayEl.querySelectorAll('.set-row:not(.set-header)')
    : document.querySelectorAll(`[data-day="${day}"] .set-row:not(.set-header)`);
}

// === Medalha da bolinha ===
// A bolinha cheia ganha a cor da comparação com a MESMA série na sessão
// anterior: ouro subiu o volume, prata empatou, bronze caiu. A regra está em
// setMedal (metrics.js); aqui só ficam a referência guardada na linha e a cor.
const MEDALHAS = ['medal-ouro', 'medal-prata', 'medal-bronze'];
const MEDAL_TITULO = {
  ouro: 'Volume acima da última vez',
  prata: 'Mesmo volume da última vez',
  bronze: 'Volume abaixo da última vez'
};

// Referência da linha = o registro da sessão anterior daquela série. Fica no
// dataset porque o placeholder some quando o aluno digita, e a cor precisa da
// referência mesmo com a série já preenchida.
function setRowRef(row, record) {
  // String() explícito: o dataset já converteria, mas quem lê rowRef() merece
  // ver de onde vem o texto que setMedal recebe.
  row.dataset.refWeight = record.weight == null ? '' : String(record.weight);
  row.dataset.refReps = record.reps == null ? '' : String(record.reps);
  row.dataset.refMinutes = record.duration_minutes == null ? '' : String(record.duration_minutes);
}

function clearRowRef(row) {
  delete row.dataset.refWeight;
  delete row.dataset.refReps;
  delete row.dataset.refMinutes;
}

function rowRef(row) {
  const { refWeight, refReps, refMinutes } = row.dataset;
  if (!refWeight && !refReps && !refMinutes) return null;
  return { weight: refWeight, reps: refReps, duration_minutes: refMinutes };
}

// O que está na linha AGORA. Ler os inputs (e não o registro salvo) faz o
// mesmo caminho servir para o clique no Salvar e para a abertura da tela.
function rowValues(row) {
  if (row.classList.contains('cardio-row')) {
    return { weight: null, reps: null, duration_minutes: parseCardioMinutes(row.querySelector('.minutes-input')?.value) };
  }
  return {
    weight: row.querySelector('.weight-input')?.value,
    reps: row.querySelector('.reps-input')?.value,
    duration_minutes: null
  };
}

function applyMedal(row) {
  const check = row.querySelector('.check-icon');
  if (!check) return;
  check.classList.remove(...MEDALHAS);
  check.removeAttribute('title');
  if (!check.classList.contains('done')) return; // série vazia não tem medalha
  const ref = rowRef(row);
  const medalha = setMedal(rowValues(row), ref);
  check.classList.add('medal-' + medalha);
  // Sem referência a bolinha é ouro, mas dizer "acima da última vez" seria
  // mentira: não houve última vez.
  check.title = ref ? MEDAL_TITULO[medalha] : 'Primeiro registro desta série';
}

// === Reset dos inputs de um dia (evita acúmulo de placeholder ao trocar tabs) ===
function resetDayInputs(day) {
  dayRows(day).forEach(row => {
    const wi = row.querySelector('.weight-input');
    const ri = row.querySelector('.reps-input');
    const mi = row.querySelector('.minutes-input');
    const check = row.querySelector('.check-icon');
    if (wi) { wi.value = ''; wi.placeholder = '-'; }
    if (ri) { ri.value = ''; ri.placeholder = ri.dataset.prescribed || ''; }
    if (mi) { mi.value = ''; mi.placeholder = mi.dataset.prescribed || 'minutos'; }
    // Tira também o resíduo da animação: sem isso, um Salvar depois da troca
    // de dia não reanimaria a bolinha (a classe já estaria lá). A referência
    // vai junto — ela é do dia que está saindo.
    if (check) { check.classList.remove('done', 'just-saved', ...MEDALHAS); check.removeAttribute('title'); }
    clearRowRef(row);
  });
}

// Preenche uma linha com o que foi registrado.
// isToday: valor de verdade (editável). Passado: só placeholder, como referência.
function applyRecordToRow(row, record, isToday) {
  const minutesInput = row.querySelector('.minutes-input');
  if (minutesInput) {
    if (record.duration_minutes === null || record.duration_minutes === undefined) return;
    if (isToday) {
      minutesInput.value = record.duration_minutes;
      const check = row.querySelector('.check-icon');
      if (check) check.classList.add('done');
    } else {
      minutesInput.placeholder = record.duration_minutes + ' min';
    }
    return;
  }
  const weightInput = row.querySelector('.weight-input');
  const repsInput = row.querySelector('.reps-input');
  if (isToday) {
    if (weightInput && record.weight !== null) weightInput.value = record.weight;
    if (repsInput && record.reps !== null) repsInput.value = record.reps;
    const check = row.querySelector('.check-icon');
    if (check && (record.weight !== null || record.reps !== null)) check.classList.add('done');
  } else {
    if (weightInput && record.weight !== null) weightInput.placeholder = record.weight + ' kg';
    if (repsInput && record.reps !== null) {
      const prescribed = repsInput.dataset.prescribed || '';
      repsInput.placeholder = record.reps + (prescribed ? ' · ' + prescribed : '');
    }
  }
}

// === Carregamento de dados do dia ===
async function loadTodayData(day) {
  try {
    resetDayInputs(day);
    const sessionDate = getDateForDay(day);
    const { data, error } = await scopeToPlan(_sb.from('workout_logs')
      .select('*')
      .eq('student_id', studentId)
      .eq('weekday', day)
      .eq('session_date', sessionDate))
      .order('set_number', { ascending: true });
    if (error) throw error;
    if (!data || data.length === 0) { await loadLastWorkout(day); return; }
    const isToday = (sessionDate === getTodayDate());
    const setsWithData = new Set();
    data.forEach(record => {
      setsWithData.add(record.exercise_name + '|' + record.set_number);
      const card = document.querySelector(`[data-exercise="${CSS.escape(record.exercise_name)}"][data-day="${day}"]`);
      if (!card) return;
      const rows = card.querySelectorAll('.set-row:not(.set-header)');
      const row = rows[record.set_number - 1];
      if (!row) return;
      applyRecordToRow(row, record, isToday);
    });
    // Carregar hints do último treino para as séries que não têm log hoje
    // (por série, não por exercício inteiro — senão salvar a 1ª série apaga
    // a referência da semana passada nas séries seguintes ainda vazias)
    await loadLastWorkout(day, setsWithData);
    // A cor sai da comparação com a sessão anterior, que só chega no
    // loadLastWorkout — por isso a passada vem aqui, e não no applyRecordToRow.
    dayRows(day).forEach(applyMedal);
  } catch (e) { console.log('Erro ao carregar dados do dia:', e); }
}

async function loadLastWorkout(day, excludeSets) {
  try {
    let query = scopeToPlan(_sb.from('workout_logs')
      .select('*')
      .eq('student_id', studentId)
      .eq('weekday', day));
    // Se já existem dados de hoje, excluir a sessão de hoje para buscar o treino anterior
    if (excludeSets && excludeSets.size > 0) {
      query = query.neq('session_date', getTodayDate());
    }
    const { data, error } = await query
      .order('created_at', { ascending: false })
      .limit(100);
    if (error || !data || data.length === 0) return;
    const lastDate = data[0].session_date;
    const lastData = data.filter(r => r.session_date === lastDate);
    lastData.forEach(record => {
      const card = document.querySelector(`[data-exercise="${CSS.escape(record.exercise_name)}"][data-day="${day}"]`);
      if (!card) return;
      const rows = card.querySelectorAll('.set-row:not(.set-header)');
      const row = rows[record.set_number - 1];
      if (!row) return;
      // A referência é gravada em TODAS as séries, inclusive nas que já têm
      // log de hoje: é ela que decide a cor da bolinha. O placeholder é que
      // continua valendo só para a série ainda vazia.
      setRowRef(row, record);
      if (excludeSets && excludeSets.has(record.exercise_name + '|' + record.set_number)) return;
      applyRecordToRow(row, record, false);
    });
  } catch (e) { console.log('Erro ao carregar último treino:', e); }
}

// === Leitura de uma linha de set (musculação ou cardio) ===
// Devolve o registro a inserir ou null quando a linha está vazia.
// Centralizado porque saveExercise e saveGroup precisam da MESMA regra —
// duplicar isso é como cardio entraria em um fluxo e não no outro.
function readSetRow(row, setNumber, base) {
  if (row.classList.contains('cardio-row')) {
    const minutes = parseCardioMinutes(row.querySelector('.minutes-input')?.value);
    if (minutes === null) return null;
    return Object.assign({}, base, {
      set_type: 'cardio',
      set_number: setNumber,
      weight: null,
      reps: null,
      duration_minutes: minutes,
      notes: row.dataset.notes || null
    });
  }
  const weight = row.querySelector('.weight-input')?.value || '';
  const reps = row.querySelector('.reps-input')?.value || '';
  if (weight === '' && reps === '') return null;
  return Object.assign({}, base, {
    set_type: row.dataset.setType,
    set_number: setNumber,
    weight: weight ? parseFloat(weight) : null,
    reps: reps ? parseInt(reps) : null,
    duration_minutes: null,
    notes: row.dataset.notes || null
  });
}

// Linha preenchida? (usado para marcar o ✓ depois de salvar)
function rowHasValue(row) {
  if (row.classList.contains('cardio-row')) {
    return parseCardioMinutes(row.querySelector('.minutes-input')?.value) !== null;
  }
  return !!(row.querySelector('.weight-input')?.value || row.querySelector('.reps-input')?.value);
}

// Marca o ✓ da linha depois de salvar, com a animação da bolinha.
// `ordem` escalona as séries do exercício (a 1ª anima primeiro), limitado a 5
// para um exercício comprido não terminar de confirmar meio segundo depois.
function markSaved(row, ordem) {
  const check = row.querySelector('.check-icon');
  if (!check) return;
  const done = rowHasValue(row);
  check.classList.toggle('done', done);
  check.classList.remove('just-saved');
  applyMedal(row);
  if (!done) return;
  check.style.setProperty('--pop-delay', Math.min(ordem || 0, 5) * 70 + 'ms');
  void check.offsetWidth; // reinicia a animação quando o aluno salva 2x seguidas
  check.classList.add('just-saved');
}

// O botão desabilita enquanto o POST corre; os pontos animados são o sinal de
// que ainda está indo. innerHTML (não textContent) porque cada ponto é um <i>.
const SAVING_LABEL = 'Salvando<span class="saving-dots"><i>.</i><i>.</i><i>.</i></span>';

// === Salvar ===
async function saveExercise(day, exerciseName, cardId) {
  const card = document.getElementById(cardId);
  const btn = card.querySelector('.save-btn');
  // Evita cliques duplicados
  if (btn.disabled) return;

  const rows = card.querySelectorAll('.set-row:not(.set-header)');
  const records = [];
  const sessionDate = getDateForDay(day);
  rows.forEach((row, i) => {
    const rec = readSetRow(row, i + 1, Object.assign({
      student_id: studentId,
      session_date: sessionDate,
      weekday: day,
      exercise_name: exerciseName
    }, planStamp()));
    if (rec) records.push(rec);
  });
  if (records.length === 0) { showToast('Preencha ao menos um set', true); return; }

  // Pergunta antes de gravar; o exercício é salvo com qualquer resposta.
  await offerStartWorkout(day);

  btn.disabled = true;
  btn.innerHTML = SAVING_LABEL;
  try {
    // Deleta registros de hoje deste exercício
    const { error: delErr } = await _sb.from('workout_logs')
      .delete()
      .eq('student_id', studentId)
      .eq('session_date', sessionDate)
      .eq('exercise_name', exerciseName);
    if (delErr) throw delErr;
    // Insere novos
    const { error: insErr } = await _sb.from('workout_logs').insert(records);
    if (insErr) throw insErr;
    btn.textContent = '✓ Salvo!'; btn.classList.add('saved');
    rows.forEach((row, i) => markSaved(row, i));
    setTimeout(() => { btn.textContent = 'Salvar'; btn.classList.remove('saved'); btn.disabled = false; }, 2000);
    showToast('Salvo com sucesso!');
  } catch (e) { showToast('Erro ao salvar: ' + e.message, true); btn.disabled = false; btn.textContent = 'Salvar'; }
}

// === Salvar grupo (biset/triset) ===
async function saveGroup(day, cardIds) {
  const wrapper = document.getElementById(cardIds[0]).closest('.biset-wrapper');
  const btn = wrapper.querySelector('.save-btn');
  if (btn.disabled) return;

  const sessionDate = getDateForDay(day);
  const allRecords = [];
  const exerciseNames = [];

  for (const cardId of cardIds) {
    const card = document.getElementById(cardId);
    const exerciseName = card.dataset.exercise;
    exerciseNames.push(exerciseName);
    const rows = card.querySelectorAll('.set-row:not(.set-header)');
    rows.forEach((row, i) => {
      const rec = readSetRow(row, i + 1, Object.assign({
        student_id: studentId,
        session_date: sessionDate,
        weekday: day,
        exercise_name: exerciseName
      }, planStamp()));
      if (rec) allRecords.push(rec);
    });
  }

  if (allRecords.length === 0) { showToast('Preencha ao menos um set', true); return; }

  // Pergunta antes de gravar; o grupo é salvo com qualquer resposta.
  await offerStartWorkout(day);

  btn.disabled = true;
  btn.innerHTML = SAVING_LABEL;
  try {
    // Deleta registros de hoje de todos os exercícios do grupo
    for (const name of exerciseNames) {
      const { error: delErr } = await _sb.from('workout_logs')
        .delete()
        .eq('student_id', studentId)
        .eq('session_date', sessionDate)
        .eq('exercise_name', name);
      if (delErr) throw delErr;
    }
    // Insere todos
    const { error: insErr } = await _sb.from('workout_logs').insert(allRecords);
    if (insErr) throw insErr;

    btn.textContent = '✓ Salvo!'; btn.classList.add('saved');
    // Marca checks. No biset/triset a ordem da animação segue a execução:
    // todas as séries do 1º exercício, depois as do 2º.
    let ordem = 0;
    for (const cardId of cardIds) {
      const card = document.getElementById(cardId);
      card.querySelectorAll('.set-row:not(.set-header)').forEach(row => markSaved(row, ordem++));
    }
    setTimeout(() => { btn.textContent = 'Salvar'; btn.classList.remove('saved'); btn.disabled = false; }, 2000);
    showToast('Salvo com sucesso!');
  } catch (e) { showToast('Erro ao salvar: ' + e.message, true); btn.disabled = false; btn.textContent = 'Salvar'; }
}

// === Histórico ===
async function loadHistory(exerciseName) {
  try {
    const fourWeeksAgo = new Date();
    fourWeeksAgo.setDate(fourWeeksAgo.getDate() - 28);
    const since = toLocalISO(fourWeeksAgo);

    // Buscar logs e sessões em paralelo
    const [logsRes, sessionsRes] = await Promise.all([
      scopeToPlan(_sb.from('workout_logs')
        .select('*')
        .eq('student_id', studentId)
        .eq('exercise_name', exerciseName)
        .gte('session_date', since))
        .order('created_at', { ascending: false })
        .order('set_number', { ascending: true }),
      _sb.from('workout_sessions')
        .select('started_at, duration_seconds')
        .eq('student_id', studentId)
        .gte('started_at', since + 'T00:00:00')
        .not('duration_seconds', 'is', null)
        .order('started_at', { ascending: false })
    ]);

    if (logsRes.error) throw logsRes.error;
    const data = logsRes.data;
    const sessions = sessionsRes.data || [];

    // Mapa: data (YYYY-MM-DD) -> duração em segundos
    const sessionsByDate = {};
    sessions.forEach(s => {
      const d = toLocalISO(new Date(s.started_at));
      if (!sessionsByDate[d]) sessionsByDate[d] = s.duration_seconds;
    });

    const body = document.getElementById('historyModalBody');
    document.getElementById('historyModalTitle').textContent = exerciseName;
    if (!data || data.length === 0) {
      // Com o histórico escopado ao plano, "sem registros" pode significar
      // "o professor acabou de trocar o treino" — o texto diz qual dos dois é.
      const vazio = planScoped
        ? 'Sem histórico neste treino nas últimas 4 semanas'
        : 'Sem histórico nas últimas 4 semanas';
      body.innerHTML = '<div style="color:#888;text-align:center;padding:20px;">' + vazio + '</div>';
      return;
    }
    // Cada dia vira um card; os cards são dispostos numa grade de 2 colunas
    // (dia 1 col 1, dia 2 col 2, dia 3 linha 2 col 1, ...).
    let html = '<div class="history-grid">', lastDate = '';
    data.forEach(r => {
      const date = new Date(r.created_at).toLocaleDateString('pt-BR', { day:'2-digit', month:'2-digit', weekday:'short' });
      if (date !== lastDate) {
        if (lastDate !== '') html += '</div>';
        // Verifica se tem sessão válida nesse dia
        const sessionDuration = sessionsByDate[r.session_date];
        const durationText = sessionDuration ? ` · ⏱ ${formatDuration(sessionDuration)}` : '';
        html += `<div class="history-day"><div class="history-date">${esc(date)}${durationText}</div>`;
        lastDate = date;
      }
      const detalhe = (r.duration_minutes !== null && r.duration_minutes !== undefined)
        ? `${r.duration_minutes} min`
        : `${r.weight || '-'}kg × ${r.reps || '-'} reps`;
      html += `<div class="history-set">${esc(r.set_type)} ${r.set_number}: ${detalhe}</div>`;
    });
    if (lastDate !== '') html += '</div>';
    html += '</div>';
    body.innerHTML = html;
  } catch (e) {
    document.getElementById('historyModalBody').innerHTML = '<div style="color:#f44336;">Erro ao carregar</div>';
  }
}

// Guarda qual exercício está aberto no modal — o gráfico é carregado só quando
// o aluno pede, então precisa saber depois do clique inicial.
let currentHistoryExercise = null;
let currentHistoryIsCardio = false;
let historyChartInstance = null;

function toggleHistory(exerciseName, isCardioExercise) {
  currentHistoryExercise = exerciseName;
  currentHistoryIsCardio = !!isCardioExercise;
  document.getElementById('historyModal').classList.add('show');
  document.getElementById('historyModalBody').innerHTML = '<div style="color:#888;text-align:center;padding:20px;">Carregando...</div>';
  resetExerciseChart();

}

function closeHistoryModal() {
  document.getElementById('historyModal').classList.remove('show');

}

// === Gráfico de evolução do exercício ===
// Mesma leitura que o professor tem: volume e 1RM estimado por treino (ou
// minutos por treino, quando o exercício é cardio), na janela de 12 semanas.
function resetExerciseChart() {
  if (historyChartInstance) { historyChartInstance.destroy(); historyChartInstance = null; }
  const box = document.getElementById('historyChart');
  box.classList.remove('show');
  box.querySelector('.chart-info').innerHTML = '';
  document.getElementById('historyChartLegend').innerHTML = '';
  const canvas = box.querySelector('canvas');
  canvas.style.display = '';
  const btn = document.getElementById('historyChartBtn');
  btn.disabled = false;
  btn.textContent = currentHistoryIsCardio ? '📈 Ver evolução do cardio' : '📈 Ver evolução';
}

// Chart.js é injetado na PRIMEIRA vez que o aluno pede o gráfico.
// No <head> ele custaria ~200KB de download em toda abertura do app, numa tela
// que a maioria abre apenas para registrar as séries.
let chartLibPromise = null;
function loadChartLib() {
  if (window.Chart) return Promise.resolve();
  if (!chartLibPromise) {
    chartLibPromise = new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js';
      s.onload = () => resolve();
      s.onerror = () => { chartLibPromise = null; reject(new Error('sem conexão')); };
      document.head.appendChild(s);
    });
  }
  return chartLibPromise;
}

async function toggleExerciseChart() {
  const box = document.getElementById('historyChart');
  const btn = document.getElementById('historyChartBtn');

  if (box.classList.contains('show')) {
    box.classList.remove('show');
    btn.textContent = currentHistoryIsCardio ? '📈 Ver evolução do cardio' : '📈 Ver evolução';
    return;
  }

  // Já renderizado: só reexibe (não baixa nem consulta de novo)
  if (historyChartInstance || box.querySelector('.chart-info').innerHTML) {
    box.classList.add('show');
    btn.textContent = 'Esconder evolução';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Carregando gráfico...';
  try {
    await loadChartLib();
  } catch (e) {
    btn.disabled = false;
    btn.textContent = 'Tentar novamente';
    showToast('Não foi possível carregar o gráfico (' + e.message + ')', true);
    return;
  }

  box.classList.add('show');
  const canvas = box.querySelector('canvas');
  const setInfo = (html) => { box.querySelector('.chart-info').innerHTML = html; };

  try {
    if (currentHistoryIsCardio) await renderCardioChart(currentHistoryExercise, canvas, setInfo);
    else await renderStrengthChart(currentHistoryExercise, canvas, setInfo);
  } catch (e) {
    canvas.style.display = 'none';
    setInfo(`<div class="no-data">Erro ao carregar: ${esc(e.message)}</div>`);
  }
  btn.disabled = false;
  btn.textContent = 'Esconder evolução';
}

// Volume (kg×reps) e 1RM estimado por treino, só das séries hard.
// Aquecimento, feeder e cardio ficariam no gráfico como queda de carga sem
// queda de esforço — por isso a query exclui esses tipos.
async function renderStrengthChart(exerciseName, canvas, setInfo) {
  const from = new Date();
  from.setDate(from.getDate() - (CHART_WINDOW_DAYS - 1));

  const { data, error } = await scopeToPlan(_sb.from('workout_logs')
    .select('session_date, weight, reps')
    .eq('student_id', studentId)
    .eq('exercise_name', exerciseName)
    .not('set_type', 'in', '(aquec,ativação,feeder,cardio)')
    .gte('session_date', toLocalISO(from)))
    .order('session_date', { ascending: true })
    .limit(400);
  if (error) throw error;

  if (!data || data.length === 0) {
    canvas.style.display = 'none';
    setInfo('<div class="no-data">Sem registros' + (planScoped ? ' neste treino' : '') + ' nas últimas 12 semanas</div>');
    return;
  }
  canvas.style.display = '';
  document.getElementById('historyChartLegend').innerHTML =
    '<span><span class="dot" style="background:#00d5ff"></span> Volume (kg×reps)</span>' +
    '<span><span class="dot" style="background:#4caf50"></span> 1RM estimado (kg)</span>';

  // Agrupa por session_date (não created_at: created_at é UTC e jogava treinos
  // da noite para o dia seguinte)
  const byDate = {};
  data.forEach(r => {
    if (!byDate[r.session_date]) byDate[r.session_date] = [];
    byDate[r.session_date].push(r);
  });

  const labels = [], volumeData = [], e1rmData = [];
  let bestE1rm = 0, bestSet = null, bestDate = null, maxWeight = 0;
  const dates = Object.keys(byDate).sort();

  dates.forEach(date => {
    labels.push(formatDayMonth(date));
    let volume = 0, dayBest = 0;
    byDate[date].forEach(s => {
      const w = Number(s.weight) || 0;
      const r = Number(s.reps) || 0;
      volume += w * r;
      if (w > maxWeight) maxWeight = w;
      const est = e1rm(w, r);
      if (est > dayBest) dayBest = est;
      if (est > bestE1rm) { bestE1rm = est; bestSet = s; bestDate = date; }
    });
    volumeData.push(volume);
    e1rmData.push(Math.round(dayBest));
  });

  historyChartInstance = new Chart(canvas.getContext('2d'), {
    type: 'line',
    data: {
      labels,
      datasets: [
        {
          label: 'Volume (kg×reps)', data: volumeData,
          borderColor: '#00d5ff', backgroundColor: 'rgba(0, 213, 255, 0.1)',
          borderWidth: 2, tension: 0.3, fill: true, pointRadius: 2, yAxisID: 'y'
        },
        {
          label: '1RM estimado (kg)', data: e1rmData,
          borderColor: '#4caf50', backgroundColor: 'rgba(76, 175, 80, 0.1)',
          borderWidth: 2, tension: 0.3, fill: false, pointRadius: 2, yAxisID: 'y1'
        }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#101419', titleColor: '#00d5ff', bodyColor: '#f0f0f0',
          borderColor: '#232a33', borderWidth: 1
        }
      },
      scales: {
        x: { ticks: { color: '#666', font: { size: 9 }, maxRotation: 45 }, grid: { color: '#222' } },
        y: { position: 'left', ticks: { color: '#00d5ff', font: { size: 9 } }, grid: { color: '#222' } },
        y1: { position: 'right', ticks: { color: '#4caf50', font: { size: 9 } }, grid: { display: false } }
      }
    }
  });

  // --- Texto: melhor série da janela, progressão e frequência ---
  let html = `<div class="chart-caption">${FORCA_CAPTION}</div>`;
  const row = (label, value, cls) =>
    `<div class="stat-row"><span class="stat-label">${label}</span><span class="stat-value${cls ? ' ' + cls : ''}">${value}</span></div>`;

  if (bestSet) {
    // Rótulo honesto: é o melhor das últimas 12 semanas, não recorde histórico —
    // a query é limitada à janela de propósito.
    html += row('🏆 Melhor (12 sem.)',
      `${bestSet.weight} kg × ${bestSet.reps} · 1RM ${Math.round(bestE1rm)} kg <span style="color:#666;font-weight:400;">(${formatDayMonth(bestDate)})</span>`);
    html += row('Carga máx (12 sem.)', `${maxWeight} kg`);
  }
  if (e1rmData.length >= 2) {
    const ini = e1rmData[0], fim = e1rmData[e1rmData.length - 1];
    const diff = ini > 0 ? Math.round(((fim - ini) / ini) * 100) : 0;
    const cls = diff > 0 ? 'up' : diff < 0 ? 'down' : '';
    const arrow = diff > 0 ? '↑' : diff < 0 ? '↓' : '=';
    html += row('1º → último treino (1RM est.)', `${ini} → ${fim} kg ${arrow} ${Math.abs(diff)}%`, cls);
  }
  html += frequencyHtml(dates);
  setInfo(html);
}

// Minutos por treino. Volume e 1RM não existem no cardio — o que evolui é tempo.
async function renderCardioChart(exerciseName, canvas, setInfo) {
  const from = new Date();
  from.setDate(from.getDate() - (CHART_WINDOW_DAYS - 1));

  const { data, error } = await scopeToPlan(_sb.from('workout_logs')
    .select('session_date, set_type, duration_minutes')
    .eq('student_id', studentId)
    .eq('exercise_name', exerciseName)
    .eq('set_type', 'cardio')
    .not('duration_minutes', 'is', null)
    .gte('session_date', toLocalISO(from)))
    .order('session_date', { ascending: true })
    .limit(400);
  if (error) throw error;

  if (!data || data.length === 0) {
    canvas.style.display = 'none';
    setInfo(cardioChartInfo([], []).html);
    return;
  }

  // O mesmo dia pode ter mais de um set de cardio: soma.
  const byDate = {};
  data.forEach(r => {
    if (!byDate[r.session_date]) byDate[r.session_date] = [];
    byDate[r.session_date].push(r);
  });

  const dates = Object.keys(byDate).sort();
  const labels = dates.map(formatDayMonth);
  const minutesData = dates.map(d => sumCardioMinutes(byDate[d]));

  const info = cardioChartInfo(dates, minutesData);
  setInfo(info.html + frequencyHtml(dates));
  if (!info.showChart) { canvas.style.display = 'none'; return; }
  canvas.style.display = '';
  document.getElementById('historyChartLegend').innerHTML =
    '<span><span class="dot" style="background:#ff9800"></span> Minutos de cardio por treino</span>';

  historyChartInstance = new Chart(canvas.getContext('2d'), {
    type: 'bar',
    data: {
      labels,
      datasets: [{
        label: 'Minutos', data: minutesData,
        backgroundColor: 'rgba(255, 152, 0, 0.55)', borderColor: '#ff9800', borderWidth: 1
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#101419', titleColor: '#ff9800', bodyColor: '#f0f0f0',
          borderColor: '#232a33', borderWidth: 1
        }
      },
      scales: {
        x: { ticks: { color: '#666', font: { size: 9 }, maxRotation: 45 }, grid: { color: '#222' } },
        y: { beginAtZero: true, ticks: { color: '#ff9800', font: { size: 9 } }, grid: { color: '#222' } }
      }
    }
  });
}

// Em quantas das últimas 12 semanas o exercício foi feito.
// A janela é FIXA (termina nesta semana): contar "da primeira à última sessão"
// faria quem fez o exercício uma vez e parou aparecer como 1/1 semanas (100%).
function frequencyHtml(dates) {
  const weekStartOf = (d) => {
    const x = new Date(d);
    const wd = x.getDay();
    x.setDate(x.getDate() - (wd === 0 ? 6 : wd - 1));
    x.setHours(12, 0, 0, 0);
    return toLocalISO(x);
  };
  const trainedWeeks = new Set(dates.map(ds => weekStartOf(new Date(ds + 'T12:00:00'))));

  const weeks = [];
  const cursor = new Date();
  for (let i = 0; i < CHART_WINDOW_WEEKS; i++) {
    const wk = new Date(cursor);
    wk.setDate(cursor.getDate() - i * 7);
    weeks.push(weekStartOf(wk));
  }
  weeks.reverse();

  const attended = weeks.filter(w => trainedWeeks.has(w)).length;
  const percent = Math.round((attended / CHART_WINDOW_WEEKS) * 100);
  const dots = weeks.map(w => {
    const hit = trainedWeeks.has(w);
    return `<span class="freq-dot${hit ? '' : ' missed'}" title="Semana de ${formatDayMonth(w)}"></span>`;
  }).join('');

  return `<div class="frequency">Você fez em <strong>${attended}/${CHART_WINDOW_WEEKS} semanas (${percent}%)</strong>` +
    `<div class="freq-dots">${dots}</div>` +
    `<div style="margin-top:4px;font-size: var(--fs-2xs);">🟢 fez &nbsp; 🔴 não fez &nbsp;·&nbsp; mais antiga → esta semana</div></div>`;
}

// Aceita watch?v=, youtu.be/, shorts/ e embed/ — qualquer formato que o
// professor cole. Se não for reconhecido (Vimeo, Instagram, Drive...),
// retorna null e o link abre externo em vez de forçar um embed quebrado.
function extractYouTubeId(url) {
  if (!url) return null;
  const m = String(url).match(/(?:youtube\.com\/(?:watch\?v=|shorts\/|embed\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
  return m ? m[1] : null;
}

// Remove qualificadores de método de treino que o professor costuma anotar
// junto do nome ("Peck Deck (ativação)", "Cadeira Extensora (pico de
// contração)") — eles não mudam QUAL exercício é, só como a série é feita.
// Propositalmente NÃO mexe em qualificadores de equipamento/pegada/ângulo
// ("Remada Baixa (Triângulo)" vs "(Barra Reta)" são exercícios diferentes).
function stripTrainingAnnotation(nameLower) {
  return nameLower.replace(/\s*\((?:ativação|aquecimento|pico de contração|drop ?set)\)\s*$/i, '').trim();
}

function openVideo(url, exerciseName, nameLower) {
  const customId = extractYouTubeId(url);
  if (url && !customId) {
    // Link do professor não é (ou não foi reconhecido como) YouTube — respeita
    // a escolha dele, mas não dá pra embutir. window.open('_blank') deixava uma
    // aba/janela órfã em branco ao voltar dentro do PWA instalado — mesma
    // navegação na aba atual, como já era antes deste recurso existir.
    window.location.href = url;
    return;
  }
  const videoId = customId
    || DEFAULT_EXERCISE_VIDEOS[nameLower]
    || DEFAULT_EXERCISE_VIDEOS[stripTrainingAnnotation(nameLower)]
    || null;

}
