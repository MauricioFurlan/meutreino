<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Treino</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#00d5ff">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; connect-src 'self' https://*.supabase.co; img-src 'self' data:;">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MeuTreino">
  <link rel="icon" type="image/png" href="/icon-192.png">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="stylesheet" href="theme.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body::-webkit-scrollbar, *::-webkit-scrollbar { display: none; }
    body, * { scrollbar-width: none; }
    /* Escala tipográfica — 9 passos fixos. Sem isso cada elemento nascia com
       um font-size "quase igual" ao vizinho (0.6/0.62/0.65/0.66/0.68rem...)
       e a tela ia acumulando tamanhos que não conversavam entre si. */
    :root {
      --fs-2xs: 0.65rem;
      --fs-xs: 0.7rem;
      --fs-sm: 0.75rem;
      --fs-base: 0.8rem;
      --fs-md: 0.85rem;
      --fs-lg: 0.9rem;
      --fs-xl: 1rem;
      --fs-2xl: 1.1rem;
      --fs-3xl: 1.3rem;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg-body);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 80px;
    }
    .header {
      background: var(--bg-header);
      padding: 16px;
      text-align: center;
      border-bottom: 1px solid var(--border);
      position: relative;
    }
    .header h1 { font-size: var(--fs-2xl); color: var(--accent); letter-spacing: 1px; }
    .header .subtitle { font-size: var(--fs-base); color: var(--text-muted); margin-top: 4px; }
    .header .app-logo {
      display: inline-block; height: 76px; width: auto; color: var(--logo-color);
    }
    .header .plan-title { font-size: var(--fs-xl); color: var(--text); font-weight: bold; margin-top: 2px; }
    .header .plan-dates {
      position: absolute; bottom: 10px; right: 14px;
      font-size: var(--fs-2xs); color: var(--text-muted2);
      background: var(--bg-secondary); padding: 3px 9px;
      border-radius: 10px; border: 1px solid var(--border);
      white-space: nowrap;
    }
    .header .plan-dates.hidden { display: none; }
    .header .plan-dates.expiring { color: var(--warning); border-color: var(--warning); }
    .header .plan-dates.expired { color: var(--error); border-color: var(--error); }
    .block-logout-btn {
      margin-top: 18px; background: none; border: 1px solid var(--text-dim);
      color: var(--text-muted); font-size: var(--fs-sm); padding: 6px 16px; border-radius: 14px; cursor: pointer;
    }
    .block-logout-btn:active { opacity: 0.6; }
    .sticky-top {
      position: sticky; top: 0; z-index: 99; background: var(--bg-header);
    }
    .tabs {
      display: flex;
      background: var(--bg-header);
      padding: 8px;
      gap: 4px;
      border-bottom: 1px solid var(--border);
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      flex: 1;
      padding: 8px 4px;
      border-radius: 20px;
      background: var(--bg-secondary);
      color: var(--text-muted2);
      font-size: var(--fs-xs);
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      text-align: center;
    }
    .tab.active { background: var(--accent); color: var(--text-dark); }
    .day-content { display: none; padding: 16px; }
    .day-content.active { display: block; }

    /* === Modo cíclico: tela do aluno === */
    .cyclic-view { padding: 16px; }
    .cyclic-sequence-bar {
      display: flex; gap: 4px; align-items: center; flex-wrap: wrap;
      padding: 10px 12px; margin-bottom: 14px;
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px;
      font-size: var(--fs-xs); color: var(--text-muted2);
    }
    .cyclic-sequence-bar .seq-dot {
      padding: 4px 8px; border-radius: 6px; font-weight: 700;
      background: var(--bg-secondary); color: var(--text-muted2); font-size: var(--fs-xs);
    }
    .cyclic-sequence-bar .seq-dot.current { background: var(--accent); color: var(--text-dark); }
    .cyclic-sequence-bar .seq-dot.rest { color: var(--text-muted); font-weight: 400; font-style: italic; }
    .cyclic-sequence-bar .seq-arrow { color: var(--text-dim); font-size: var(--fs-2xs); }

    .cyclic-suggested {
      background: var(--bg-card); border: 2px solid var(--accent); border-radius: 14px;
      padding: 18px 16px; margin-bottom: 14px; text-align: center;
    }
    .cyclic-suggested .cs-label { font-size: var(--fs-xs); color: var(--text-muted2); text-transform: uppercase; font-weight: 700; letter-spacing: 0.5px; margin-bottom: 6px; }
    .cyclic-suggested .cs-title { font-size: var(--fs-2xl); font-weight: 700; color: var(--accent); }
    .cyclic-suggested .cs-subtitle { font-size: var(--fs-base); color: var(--text-muted); margin-top: 4px; }
    .cyclic-suggested .cs-btn {
      margin-top: 14px; width: 100%; padding: 14px; border: none; border-radius: 10px;
      background: var(--accent); color: var(--text-dark); font-weight: 700; font-size: var(--fs-lg); cursor: pointer;
    }
    .cyclic-suggested .cs-btn:active { opacity: 0.7; }

    .cyclic-rest-card {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px;
      padding: 24px 16px; margin-bottom: 14px; text-align: center;
    }
    .cyclic-rest-card .cr-title { font-size: var(--fs-xl); font-weight: 700; color: var(--text-muted); margin-bottom: 4px; }
    .cyclic-rest-card .cr-sub { font-size: var(--fs-sm); color: var(--text-muted2); }

    .cyclic-others-label { font-size: var(--fs-xs); color: var(--text-muted2); font-weight: 600; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.3px; }
    .cyclic-option {
      display: flex; align-items: center; gap: 12px;
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px;
      padding: 14px; margin-bottom: 8px; cursor: pointer; transition: border-color 0.2s;
    }
    .cyclic-option:active { border-color: var(--accent); }
    .cyclic-option .co-letter {
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--bg-secondary); display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: var(--fs-md); color: var(--accent); flex-shrink: 0;
    }
    .cyclic-option .co-body { flex: 1; min-width: 0; }
    .cyclic-option .co-title { font-size: var(--fs-md); font-weight: 600; color: var(--text); }
    .cyclic-option .co-subtitle { font-size: var(--fs-xs); color: var(--text-muted2); margin-top: 2px; }
    .cyclic-option .co-arrow { color: var(--text-dim); font-size: var(--fs-base); }

    /* Quando o aluno está dentro de um treino cíclico (exercícios abertos) */
    .cyclic-back-btn {
      display: inline-flex; align-items: center; gap: 4px;
      background: none; border: 1px solid var(--border); color: var(--text-muted);
      font-size: var(--fs-xs); font-weight: 600; padding: 6px 12px;
      border-radius: 8px; cursor: pointer; margin-bottom: 12px;
    }
    .cyclic-back-btn:active { opacity: 0.6; }
    .cyclic-day-title {
      font-size: var(--fs-xl); font-weight: 700; color: var(--accent); margin-bottom: 4px;
    }
    .cyclic-day-subtitle { font-size: var(--fs-base); color: var(--text-muted); margin-bottom: 14px; }
    .exercise-card {
      background: var(--bg-card);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      border: 1px solid var(--border);
    }

    /* Biset/Triset/Giant Set wrapper */
    .biset-wrapper {
      border: 2px solid var(--accent);
      border-radius: 14px;
      padding: 12px 10px 10px;
      margin-bottom: 12px;
      position: relative;
      background: var(--bg-input);
    }
    .biset-wrapper .biset-label {
      position: absolute; top: -11px; left: 14px;
      background: var(--bg-input); color: var(--accent); font-size: var(--fs-xs);
      font-weight: 700; padding: 0 8px; letter-spacing: 0.5px;
    }
    .biset-wrapper .exercise-card {
      margin-bottom: 8px;
      border: 1px solid var(--border);
    }
    .biset-wrapper .exercise-card:last-of-type { margin-bottom: 10px; }
    .biset-wrapper .save-btn { margin-top: 4px; }
    .exercise-name {
      font-size: var(--fs-3xl);
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 10px;
      text-transform: uppercase;
    }
    .set-row {
      display: grid;
      grid-template-columns: auto 1fr 1fr 40px;
      gap: 8px;
      align-items: center;
      margin-bottom: 10px;
      padding: 6px 0;
    }
    .set-label {
      font-size: var(--fs-sm);
      color: var(--text);
      text-transform: uppercase;
      min-width: 60px;
      font-weight: 600;
    }
    .set-label.type-aquec { color: var(--success-light); }
    .set-label.type-feeder { color: var(--info); }
    .set-label.type-hard { color: var(--error-light); }
    .set-label.type-cardio { color: var(--warning); }
    /* Cardio: uma coluna só (minutos) em vez de KG × REPS */
    .set-row.cardio-row { grid-template-columns: auto 1fr 40px; }
    .set-row.cardio-row input { border-color: var(--accent-dark); }
    .set-row.cardio-row input:focus { border-color: var(--warning); }
    /* Descanso prescrito: sempre visível, em linha PRÓPRIA — quando era
       inline dividia a linha com o "Ver histórico" e ficava colado nele. */
    .rest-line { display: block; margin: 2px 0 8px; }
    .rest-pill {
      display: inline-flex; align-items: baseline; flex-wrap: wrap; gap: 5px;
      background: var(--bg-input); border: 1px solid var(--border); color: var(--accent-hover);
      font-size: var(--fs-xs); font-weight: 600; padding: 5px 10px;
      border-radius: 10px; line-height: 1.4; max-width: 100%;
    }
    .rest-pill .rest-key { color: var(--text-muted2); font-weight: 600; }
    .rest-pill .rest-value { font-size: var(--fs-sm); font-weight: 700; word-break: break-word; }
    .history-btn { display: block; }
    .no-sets {
      background: var(--bg-input); border: 1px solid var(--accent-dark); color: var(--warning-light);
      font-size: var(--fs-sm); padding: 8px 10px; border-radius: 8px; margin-top: 4px;
    }
    .set-row input {
      width: 100%;
      padding: 10px 8px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-body);
      color: var(--text-bright);
      font-size: 16px;
      font-weight: 600;
      text-align: center;
      min-width: 0;
      box-sizing: border-box;
    }
    .set-header { margin-bottom: 0; padding: 0; }
    .col-title { font-size: var(--fs-2xs); color: var(--text-muted2); text-align: center; font-weight: 700; text-transform: uppercase; }
    .set-row input::placeholder { color: var(--text-muted); font-size: 14px; font-weight: 500; }
    .set-row input:focus { outline: none; border-color: var(--accent); }
    /* Treino do dia: placeholder de referência (peso/reps da semana passada) em destaque. */
    .today-tab .set-row input::placeholder { color: var(--accent); font-size: 15px; font-weight: 600; opacity: 0.85; }
    .save-btn {
      width: 100%; padding: 12px; border: none; border-radius: 8px;
      background: var(--accent); color: var(--text-dark); font-weight: 700; font-size: var(--fs-lg);
      cursor: pointer; margin-top: 8px; transition: opacity 0.2s;
    }
    .save-btn:active:not(:disabled) { opacity: 0.7; }
    .save-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .save-btn.saved { background: var(--save-done); color: var(--text-bright); }
    .history-btn {
      background: none; border: none; color: var(--accent); font-size: var(--fs-sm);
      cursor: pointer; padding: 4px 0; margin-bottom: 8px; text-decoration: underline;
    }
    .check-icon {
      width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--text-dim);
      display: flex; align-items: center; justify-content: center; transition: all 0.2s;
    }
    .check-icon svg { display: none; }
    .check-icon.done { border-color: var(--save-done); background: var(--save-done); }
    .check-icon.done svg { display: block; }
    /* Timer de treino - discreto */
    .start-workout-row {
      display: flex; flex-direction: column; align-items: stretch; gap: 8px;
      padding: 10px 16px; background: var(--bg-header); border-bottom: 1px solid var(--border-light);
    }
    .start-workout-btn {
      width: 100%; background: none; border: 1px solid var(--accent); color: var(--accent);
      font-size: var(--fs-lg); font-weight: 700; padding: 12px;
      border-radius: 8px; cursor: pointer; transition: opacity 0.2s;
    }
    .start-workout-btn:active { opacity: 0.6; }
    .start-workout-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .workout-timer-inline {
      font-size: var(--fs-lg); color: var(--accent); font-weight: 700;
      font-variant-numeric: tabular-nums; letter-spacing: 0.5px;
      text-align: center;
    }
    .end-workout-row {
      display: flex; gap: 8px; padding: 12px 16px; margin-top: 8px;
    }
    .end-workout-btn, .pause-workout-btn, .restart-workout-btn {
      flex: 1; background: none; border: 1px solid var(--accent); color: var(--accent);
      font-size: var(--fs-lg); font-weight: 700; padding: 12px;
      border-radius: 8px; cursor: pointer; transition: opacity 0.2s;
    }
    .end-workout-btn:active, .pause-workout-btn:active, .restart-workout-btn:active { opacity: 0.6; }
    .restart-workout-btn { border-color: var(--text-muted); color: var(--text-muted); }
    .workout-timer-inline.paused { opacity: 0.7; }
    .workout-done-msg {
      font-size: var(--fs-lg); color: var(--accent); font-weight: 700;
      text-align: center; padding: 12px 16px;
    }
    .restart-workout-row {
      display: flex; padding: 0 16px 12px; margin-top: 8px;
    }

    /* ── Modal: nota do treino ao encerrar ────────────────────────── */
    .rating-modal {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75);
      z-index: 2000; align-items: flex-end; justify-content: center;
    }
    .rating-modal.show { display: flex; }
    .rating-modal-content {
      background: var(--bg-card); border-radius: 18px 18px 0 0;
      width: 100%; max-width: 480px; padding: 20px 20px 24px;
    }
    .rating-modal-content h3 { font-size: var(--fs-xl); color: var(--text); margin-bottom: 4px; }
    .rating-modal-sub { font-size: var(--fs-sm); color: var(--text-muted3); margin-bottom: 16px; }
    .rating-scale { display: flex; gap: 8px; margin-bottom: 16px; }
    .rating-option {
      flex: 1; padding: 12px 0; text-align: center; border-radius: 8px;
      background: var(--bg-input); border: 1px solid var(--border); color: var(--text-muted);
      font-size: var(--fs-lg); font-weight: 700; cursor: pointer;
    }
    .rating-option.selected { background: var(--accent); border-color: var(--accent); color: var(--text-dark); }
    #ratingFeedback {
      width: 100%; min-height: 70px; background: var(--bg-input); color: var(--text);
      border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px;
      font-family: inherit; font-size: var(--fs-md); resize: none; margin-bottom: 16px;
    }
    #ratingFeedback:focus { outline: none; border-color: var(--accent); }
    .rating-actions { display: flex; gap: 10px; }
    .rating-skip-btn {
      padding: 12px 16px; border: 1px solid var(--border); border-radius: 10px;
      background: none; color: var(--text-muted2); font-size: var(--fs-base); cursor: pointer;
    }
    .rating-save-btn {
      flex: 1; padding: 12px; border: none; border-radius: 10px;
      background: var(--accent); color: var(--text-dark); font-weight: 700; font-size: var(--fs-lg); cursor: pointer;
    }
    .rating-save-btn:active, .rating-skip-btn:active { opacity: 0.7; }

    .loading { text-align: center; padding: 40px; color: var(--text-muted2); }
    .empty-state {
      text-align: center; padding: 60px 24px;
      display: flex; flex-direction: column; align-items: center; gap: 12px;
    }
    .empty-state .empty-icon { font-size: 3rem; }
    .empty-state .empty-title { font-size: var(--fs-2xl); font-weight: 700; color: var(--accent); }
    .empty-state .empty-text { font-size: var(--fs-lg); color: var(--text-muted); line-height: 1.6; }
    .toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: var(--accent); color: var(--text-dark); padding: 10px 20px; border-radius: 20px;
      font-size: var(--fs-md); font-weight: 600; display: none; z-index: 1000;
    }
    .toast.error { background: var(--error); color: var(--text-bright); }
    .toast.show { display: block; animation: fadeOut 2s forwards; }
    @keyframes fadeOut { 0%,70% { opacity: 1; } 100% { opacity: 0; } }
    .note-icon {
      display: none; background: var(--error); color: var(--text-bright); width: 18px; height: 18px;
      border-radius: 50%; font-size: var(--fs-2xs); font-weight: 700; border: none;
      cursor: pointer; margin-left: 4px; flex-shrink: 0; vertical-align: middle;
    }
    .note-icon.visible { display: inline-flex; align-items: center; justify-content: center; }
    .exercise-header { display: flex; align-items: center; }
    .exercise-name { flex: 1; }
    .video-btn {
      background: none; border: 1px solid var(--text-dim); color: var(--accent); width: 22px; height: 22px;
      border-radius: 50%; font-size: var(--fs-2xs); cursor: pointer; margin-left: 8px;
      flex-shrink: 0; display: none; align-items: center; justify-content: center;
    }
    .video-btn.visible { display: flex; }
    .note-bubble {
      display: none; background: var(--bg-secondary); border: 1px solid var(--accent); border-radius: 8px;
      padding: 10px; margin-bottom: 10px; font-size: var(--fs-base); color: var(--text);
    }
    .note-bubble.show { display: block; }
    .note-bubble-label { font-size: var(--fs-2xs); color: var(--accent); margin-bottom: 4px; font-weight: 600; }
    .history-modal {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.9); z-index: 1000; align-items: center;
      justify-content: center; padding: 16px;
    }
    .history-modal.show { display: flex; }
    .history-modal-content {
      background: var(--bg-card); border-radius: 12px; padding: 16px; width: 100%;
      max-width: 400px; max-height: 80vh; overflow-y: auto; border: 1px solid var(--border);
    }
    .history-modal-content h3 { color: var(--accent); font-size: var(--fs-lg); margin-bottom: 12px; }
    .history-modal-close {
      width: 100%; padding: 10px; border: none; border-radius: 8px;
      background: var(--bg-secondary); color: var(--text-muted); font-weight: 600; font-size: var(--fs-md);
      cursor: pointer; margin-top: 12px;
    }
    .logout-modal { z-index: 1150; }
    .history-date { color: var(--accent); font-size: var(--fs-sm); font-weight: 600; margin-top: 10px; margin-bottom: 4px; }
    .history-set { font-size: var(--fs-base); color: var(--text); padding: 3px 0; border-bottom: 1px solid var(--border-light); }
    /* Tela de bloqueio */
    .block-screen { display: none; text-align: center; padding: 60px 24px; }
    .block-screen.show { display: block; }
    .block-screen .icon { font-size: 2.4rem; margin-bottom: 12px; }
    .block-screen h2 { font-size: var(--fs-2xl); color: var(--accent); margin-bottom: 8px; }
    .block-screen p { font-size: var(--fs-lg); color: var(--text-muted); line-height: 1.5; }
    /* Loading overlay */
    .loading-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: var(--overlay-bg); z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 16px; transition: opacity 0.3s;
    }
    .loading-overlay.hidden { opacity: 0; pointer-events: none; }
    .loading-spinner {
      width: 44px; height: 44px; border: 3px solid var(--spinner-track);
      border-top-color: var(--spinner-accent); border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { color: var(--text-muted); font-size: var(--fs-base); font-weight: 500; letter-spacing: 0.5px; }

    /* ── Modal de anotações do aluno ─────────────────────────── */
    .notes-modal {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.92); z-index: 1000;
      align-items: flex-end; justify-content: center;
    }
    .notes-modal.show { display: flex; }
    .notes-modal-sheet {
      background: var(--bg-card); border-radius: 16px 16px 0 0;
      width: 100%; max-width: 520px;
      max-height: 88vh; display: flex; flex-direction: column;
      border: 1px solid var(--border); border-bottom: none;
    }
    .notes-modal-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px 10px; border-bottom: 1px solid var(--bg-secondary); flex-shrink: 0;
    }
    .notes-modal-header h3 { color: var(--accent); font-size: var(--fs-xl); font-weight: 700; }
    .notes-modal-close {
      background: var(--bg-secondary); border: none; color: var(--text-muted); font-size: var(--fs-2xl);
      width: 28px; height: 28px; border-radius: 50%; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .notes-modal-close:active { opacity: 0.6; }
    .notes-modal-body {

<!-- Cálculos compartilhados com as telas do professor (toLocalISO, e1rm,
     helpers de cardio, janela dos gráficos). Não puxa nada da rede. -->
<script src="/metrics.js"></script>
<script>
// === Estado global ===
function showLoading() { document.getElementById('loadingOverlay').classList.remove('hidden'); }
function hideLoading() { document.getElementById('loadingOverlay').classList.add('hidden'); }
let WORKOUT = {};  // carregado do banco
let studentId = null;
let planMode = 'weekly';      // 'weekly' | 'cyclic'
let planSubtitles = {};       // subtítulos por dia/letra
let planCycleSequence = [];   // sequência do ciclo (ex: ['A','B','rest','C'])
let cyclicPosition = 0;       // posição atual na sequência (derivada do último log)

// === Helpers ===
const esc = (s) => { // escape HTML (proteção XSS)
  const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML;
};

function getToday() {
  const days = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
  return days[new Date().getDay()];
}

// toLocalISO() vem de metrics.js: converte um Date para 'YYYY-MM-DD' no fuso
// LOCAL. NÃO usar toISOString() para datas — ele converte para UTC e, após ~21h
// no Brasil, devolve o dia seguinte, gravando o treino na data errada.

function getTodayDate() { return toLocalISO(new Date()); }

// Retorna a data mais recente para o dia da semana informado
// Ex: se hoje é Domingo e day='Segunda', retorna a segunda passada (há 6 dias)
// Se day é o dia de hoje, retorna hoje
// No modo cíclico (letras), sempre retorna hoje
function getDateForDay(day) {
  if (planMode === 'cyclic') return getTodayDate();
  const dayIndex = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'].indexOf(day);
  if (dayIndex < 0) return getTodayDate(); // letra cíclica ou desconhecido
  const now = new Date();
  const todayIndex = now.getDay();
  let diff = todayIndex - dayIndex;
  if (diff < 0) diff += 7;
  const target = new Date(now);
  target.setDate(now.getDate() - diff);
  return toLocalISO(target);
}

function showToast(text, isError) {
  const t = document.getElementById('toast');
  t.textContent = text;
  t.className = 'toast show' + (isError ? ' error' : '');
  setTimeout(() => t.className = 'toast', 2500);
}

// === Reset dos inputs de um dia (evita acúmulo de placeholder ao trocar tabs) ===
function resetDayInputs(day) {
  // No modo cíclico não temos div#day-X, buscamos cards por data-day
  let dayEl = document.getElementById('day-' + day);
  const rows = dayEl
    ? dayEl.querySelectorAll('.set-row:not(.set-header)')
    : document.querySelectorAll(`[data-day="${day}"] .set-row:not(.set-header)`);
  rows.forEach(row => {
    const wi = row.querySelector('.weight-input');
    const ri = row.querySelector('.reps-input');
    const mi = row.querySelector('.minutes-input');
    const check = row.querySelector('.check-icon');
    if (wi) { wi.value = ''; wi.placeholder = '-'; }
    if (ri) { ri.value = ''; ri.placeholder = ri.dataset.prescribed || ''; }
    if (mi) { mi.value = ''; mi.placeholder = mi.dataset.prescribed || 'minutos'; }
    if (check) check.classList.remove('done');
  });
}

// Preenche uma linha com o que foi registrado.
// isToday: valor de verdade (editável). Passado: só placeholder, como referência.
function applyRecordToRow(row, record, isToday) {
  const minutesInput = row.querySelector('.minutes-input');
  if (minutesInput) {
    if (record.duration_minutes === null || record.duration_minutes === undefined) return;
    if (isToday) {
      minutesInput.value = record.duration_minutes;
      const check = row.querySelector('.check-icon');
      if (check) check.classList.add('done');
    } else {
      minutesInput.placeholder = record.duration_minutes + ' min';
    }
    return;
  }
  const weightInput = row.querySelector('.weight-input');
  const repsInput = row.querySelector('.reps-input');
  if (isToday) {
    if (weightInput && record.weight !== null) weightInput.value = record.weight;
    if (repsInput && record.reps !== null) repsInput.value = record.reps;
    const check = row.querySelector('.check-icon');
    if (check && (record.weight !== null || record.reps !== null)) check.classList.add('done');
  } else {
    if (weightInput && record.weight !== null) weightInput.placeholder = record.weight + ' kg';
    if (repsInput && record.reps !== null) {
      const prescribed = repsInput.dataset.prescribed || '';
      repsInput.placeholder = record.reps + (prescribed ? ' · ' + prescribed : '');
    }
  }
}

// === Carregamento de dados do dia ===
async function loadTodayData(day) {
  try {
    resetDayInputs(day);
    const sessionDate = getDateForDay(day);
    const { data, error } = await _sb.from('workout_logs')
      .select('*')
      .eq('student_id', studentId)
      .eq('weekday', day)
      .eq('session_date', sessionDate)
      .order('set_number', { ascending: true });
    if (error) throw error;
    if (!data || data.length === 0) { await loadLastWorkout(day); return; }
    const isToday = (sessionDate === getTodayDate());
    const setsWithData = new Set();
    data.forEach(record => {
      setsWithData.add(record.exercise_name + '|' + record.set_number);
      const card = document.querySelector(`[data-exercise="${CSS.escape(record.exercise_name)}"][data-day="${day}"]`);
      if (!card) return;
      const rows = card.querySelectorAll('.set-row:not(.set-header)');
      const row = rows[record.set_number - 1];
      if (!row) return;
      applyRecordToRow(row, record, isToday);
    });
    // Carregar hints do último treino para as séries que não têm log hoje
    // (por série, não por exercício inteiro — senão salvar a 1ª série apaga
    // a referência da semana passada nas séries seguintes ainda vazias)
    await loadLastWorkout(day, setsWithData);
  } catch (e) { console.log('Erro ao carregar dados do dia:', e); }
}

async function loadLastWorkout(day, excludeSets) {
  try {
    let query = _sb.from('workout_logs')
      .select('*')
      .eq('student_id', studentId)
      .eq('weekday', day);
    // Se já existem dados de hoje, excluir a sessão de hoje para buscar o treino anterior
    if (excludeSets && excludeSets.size > 0) {
      query = query.neq('session_date', getTodayDate());
    }
    const { data, error } = await query
      .order('created_at', { ascending: false })
      .limit(100);
    if (error || !data || data.length === 0) return;
    const lastDate = data[0].session_date;
    const lastData = data.filter(r => r.session_date === lastDate);
    lastData.forEach(record => {
      if (excludeSets && excludeSets.has(record.exercise_name + '|' + record.set_number)) return;
      const card = document.querySelector(`[data-exercise="${CSS.escape(record.exercise_name)}"][data-day="${day}"]`);
      if (!card) return;
      const rows = card.querySelectorAll('.set-row:not(.set-header)');
      const row = rows[record.set_number - 1];
      if (!row) return;
      applyRecordToRow(row, record, false);
    });
  } catch (e) { console.log('Erro ao carregar último treino:', e); }
}

// === Leitura de uma linha de set (musculação ou cardio) ===
// Devolve o registro a inserir ou null quando a linha está vazia.
// Centralizado porque saveExercise e saveGroup precisam da MESMA regra —
// duplicar isso é como cardio entraria em um fluxo e não no outro.
function readSetRow(row, setNumber, base) {
  if (row.classList.contains('cardio-row')) {
    const minutes = parseCardioMinutes(row.querySelector('.minutes-input')?.value);
    if (minutes === null) return null;
    return Object.assign({}, base, {
      set_type: 'cardio',
      set_number: setNumber,
      weight: null,
      reps: null,
      duration_minutes: minutes,
      notes: row.dataset.notes || null
    });
  }
  const weight = row.querySelector('.weight-input')?.value || '';
  const reps = row.querySelector('.reps-input')?.value || '';
  if (weight === '' && reps === '') return null;
  return Object.assign({}, base, {
    set_type: row.dataset.setType,
    set_number: setNumber,
    weight: weight ? parseFloat(weight) : null,
    reps: reps ? parseInt(reps) : null,
    duration_minutes: null,
    notes: row.dataset.notes || null
  });
}

// Linha preenchida? (usado para marcar o ✓ depois de salvar)
function rowHasValue(row) {
  if (row.classList.contains('cardio-row')) {
    return parseCardioMinutes(row.querySelector('.minutes-input')?.value) !== null;
  }
  return !!(row.querySelector('.weight-input')?.value || row.querySelector('.reps-input')?.value);
}

// === Salvar ===
async function saveExercise(day, exerciseName, cardId) {
  const card = document.getElementById(cardId);
  const btn = card.querySelector('.save-btn');
  // Evita cliques duplicados
  if (btn.disabled) return;
  btn.disabled = true;
  btn.textContent = 'Salvando...';

  const rows = card.querySelectorAll('.set-row:not(.set-header)');
  const records = [];
  const sessionDate = getDateForDay(day);
  rows.forEach((row, i) => {
    const rec = readSetRow(row, i + 1, {
      student_id: studentId,
      session_date: sessionDate,
      weekday: day,
      exercise_name: exerciseName
    });
    if (rec) records.push(rec);
  });
  if (records.length === 0) { showToast('Preencha ao menos um set', true); btn.disabled = false; btn.textContent = 'Salvar'; return; }
  try {
    // Deleta registros de hoje deste exercício
    const { error: delErr } = await _sb.from('workout_logs')
      .delete()
      .eq('student_id', studentId)
      .eq('session_date', sessionDate)
      .eq('exercise_name', exerciseName);
    if (delErr) throw delErr;
    // Insere novos
    const { error: insErr } = await _sb.from('workout_logs').insert(records);
    if (insErr) throw insErr;
    btn.textContent = '✓ Salvo!'; btn.classList.add('saved');
    rows.forEach(row => {
      const check = row.querySelector('.check-icon');
      if (!check) return;
      check.classList.toggle('done', rowHasValue(row));
    });
    setTimeout(() => { btn.textContent = 'Salvar'; btn.classList.remove('saved'); btn.disabled = false; }, 2000);
    showToast('Salvo com sucesso!');
  } catch (e) { showToast('Erro ao salvar: ' + e.message, true); btn.disabled = false; btn.textContent = 'Salvar'; }
}

// === Salvar grupo (biset/triset) ===
async function saveGroup(day, cardIds) {
  const wrapper = document.getElementById(cardIds[0]).closest('.biset-wrapper');
  const btn = wrapper.querySelector('.save-btn');
  if (btn.disabled) return;
  btn.disabled = true;
  btn.textContent = 'Salvando...';

  const sessionDate = getDateForDay(day);
  const allRecords = [];
  const exerciseNames = [];

  for (const cardId of cardIds) {
    const card = document.getElementById(cardId);
    const exerciseName = card.dataset.exercise;
    exerciseNames.push(exerciseName);
    const rows = card.querySelectorAll('.set-row:not(.set-header)');
    rows.forEach((row, i) => {
      const rec = readSetRow(row, i + 1, {
        student_id: studentId,
        session_date: sessionDate,
        weekday: day,
        exercise_name: exerciseName
      });
      if (rec) allRecords.push(rec);
    });
  }

  if (allRecords.length === 0) { showToast('Preencha ao menos um set', true); btn.disabled = false; btn.textContent = 'Salvar'; return; }

  try {
    // Deleta registros de hoje de todos os exercícios do grupo
    for (const name of exerciseNames) {
      const { error: delErr } = await _sb.from('workout_logs')
        .delete()
        .eq('student_id', studentId)
        .eq('session_date', sessionDate)
        .eq('exercise_name', name);
      if (delErr) throw delErr;
    }
    // Insere todos
    const { error: insErr } = await _sb.from('workout_logs').insert(allRecords);
    if (insErr) throw insErr;

    btn.textContent = '✓ Salvo!'; btn.classList.add('saved');
    // Marca checks
    for (const cardId of cardIds) {
      const card = document.getElementById(cardId);
      card.querySelectorAll('.set-row:not(.set-header)').forEach(row => {
        const check = row.querySelector('.check-icon');
        if (check) check.classList.toggle('done', rowHasValue(row));
      });
    }
    setTimeout(() => { btn.textContent = 'Salvar'; btn.classList.remove('saved'); btn.disabled = false; }, 2000);
    showToast('Salvo com sucesso!');
  } catch (e) { showToast('Erro ao salvar: ' + e.message, true); btn.disabled = false; btn.textContent = 'Salvar'; }
}

// === Histórico ===
async function loadHistory(exerciseName) {
  try {
    const fourWeeksAgo = new Date();
    fourWeeksAgo.setDate(fourWeeksAgo.getDate() - 28);
    const since = toLocalISO(fourWeeksAgo);

    // Buscar logs e sessões em paralelo
    const [logsRes, sessionsRes] = await Promise.all([
      _sb.from('workout_logs')
        .select('*')
        .eq('student_id', studentId)
        .eq('exercise_name', exerciseName)
        .gte('session_date', since)
        .order('created_at', { ascending: false })
        .order('set_number', { ascending: true }),
      _sb.from('workout_sessions')
        .select('started_at, duration_seconds')
        .eq('student_id', studentId)
        .gte('started_at', since + 'T00:00:00')
        .not('duration_seconds', 'is', null)
        .order('started_at', { ascending: false })
    ]);

    if (logsRes.error) throw logsRes.error;
    const data = logsRes.data;
    const sessions = sessionsRes.data || [];

    // Mapa: data (YYYY-MM-DD) -> duração em segundos
    const sessionsByDate = {};
    sessions.forEach(s => {
      const d = toLocalISO(new Date(s.started_at));
      if (!sessionsByDate[d]) sessionsByDate[d] = s.duration_seconds;
    });

    const body = document.getElementById('historyModalBody');
    document.getElementById('historyModalTitle').textContent = exerciseName;
    if (!data || data.length === 0) {
      body.innerHTML = '<div style="color:#888;text-align:center;padding:20px;">Sem histórico nas últimas 4 semanas</div>';
      return;
    }
    let html = '', lastDate = '';
    data.forEach(r => {
      const date = new Date(r.created_at).toLocaleDateString('pt-BR', { day:'2-digit', month:'2-digit', weekday:'short' });
      if (date !== lastDate) {
        // Verifica se tem sessão válida nesse dia
        const sessionDuration = sessionsByDate[r.session_date];
        const durationText = sessionDuration ? ` · ⏱ ${formatDuration(sessionDuration)}` : '';
        html += `<div class="history-date">${esc(date)}${durationText}</div>`;
        lastDate = date;
      }
      const detalhe = (r.duration_minutes !== null && r.duration_minutes !== undefined)
        ? `${r.duration_minutes} min`
        : `${r.weight || '-'}kg × ${r.reps || '-'} reps`;
      html += `<div class="history-set">${esc(r.set_type)} ${r.set_number}: ${detalhe}</div>`;
    });
    body.innerHTML = html;
  } catch (e) {
    document.getElementById('historyModalBody').innerHTML = '<div style="color:#f44336;">Erro ao carregar</div>';
  }
}

// === Gráfico de evolução do exercício ===
// Mesma leitura que o professor tem: volume e 1RM estimado por treino (ou
// minutos por treino, quando o exercício é cardio), na janela de 12 semanas.
function resetExerciseChart() {
  if (historyChartInstance) { historyChartInstance.destroy(); historyChartInstance = null; }
  const box = document.getElementById('historyChart');
  box.classList.remove('show');
  box.querySelector('.chart-info').innerHTML = '';
  document.getElementById('historyChartLegend').innerHTML = '';
  const canvas = box.querySelector('canvas');
  canvas.style.display = '';

// Chart.js é injetado na PRIMEIRA vez que o aluno pede o gráfico.
// No <head> ele custaria ~200KB de download em toda abertura do app, numa tela
// que a maioria abre apenas para registrar as séries.
let chartLibPromise = null;
function loadChartLib() {
  if (window.Chart) return Promise.resolve();
  if (!chartLibPromise) {
    chartLibPromise = new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js';
      s.onload = () => resolve();
      s.onerror = () => { chartLibPromise = null; reject(new Error('sem conexão')); };
      document.head.appendChild(s);
    });
  }
  return chartLibPromise;
}

async function toggleExerciseChart() {
  const box = document.getElementById('historyChart');
  const btn = document.getElementById('historyChartBtn');

  if (box.classList.contains('show')) {
    box.classList.remove('show');
    btn.textContent = currentHistoryIsCardio ? '📈 Ver evolução do cardio' : '📈 Ver evolução';
    return;
  }

  // Já renderizado: só reexibe (não baixa nem consulta de novo)
  if (historyChartInstance || box.querySelector('.chart-info').innerHTML) {
    box.classList.add('show');
    btn.textContent = 'Esconder evolução';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Carregando gráfico...';
  try {
    await loadChartLib();
  } catch (e) {
    btn.disabled = false;
    btn.textContent = 'Tentar novamente';
    showToast('Não foi possível carregar o gráfico (' + e.message + ')', true);
    return;
  }

  box.classList.add('show');
  const canvas = box.querySelector('canvas');
  const setInfo = (html) => { box.querySelector('.chart-info').innerHTML = html; };

  try {
    if (currentHistoryIsCardio) await renderCardioChart(currentHistoryExercise, canvas, setInfo);
    else await renderStrengthChart(currentHistoryExercise, canvas, setInfo);
  } catch (e) {
    canvas.style.display = 'none';
    setInfo(`<div class="no-data">Erro ao carregar: ${esc(e.message)}</div>`);
  }
  btn.disabled = false;
  btn.textContent = 'Esconder evolução';
}

// Volume (kg×reps) e 1RM estimado por treino, só das séries hard.
// Aquecimento, feeder e cardio ficariam no gráfico como queda de carga sem
// queda de esforço — por isso a query exclui esses tipos.
async function renderStrengthChart(exerciseName, canvas, setInfo) {
  const from = new Date();
  from.setDate(from.getDate() - (CHART_WINDOW_DAYS - 1));

  const { data, error } = await _sb.from('workout_logs')
    .select('session_date, weight, reps')
    .eq('student_id', studentId)
    .eq('exercise_name', exerciseName)
    .not('set_type', 'in', '(aquec,feeder,cardio)')
    .gte('session_date', toLocalISO(from))
    .order('session_date', { ascending: true })
    .limit(400);
  if (error) throw error;

  if (!data || data.length === 0) {
    canvas.style.display = 'none';
    setInfo('<div class="no-data">Sem registros nas últimas 12 semanas</div>');
    return;
  }
  canvas.style.display = '';
  document.getElementById('historyChartLegend').innerHTML =
    '<span><span class="dot" style="background:#00d5ff"></span> Volume (kg×reps)</span>' +
    '<span><span class="dot" style="background:#4caf50"></span> 1RM estimado (kg)</span>';

  // Agrupa por session_date (não created_at: created_at é UTC e jogava treinos
  // da noite para o dia seguinte)
  const byDate = {};
  data.forEach(r => {
    if (!byDate[r.session_date]) byDate[r.session_date] = [];
    byDate[r.session_date].push(r);
  });

  const labels = [], volumeData = [], e1rmData = [];
  let bestE1rm = 0, bestSet = null, bestDate = null, maxWeight = 0;
  const dates = Object.keys(byDate).sort();

  dates.forEach(date => {
    labels.push(formatDayMonth(date));
    let volume = 0, dayBest = 0;
    byDate[date].forEach(s => {
      const w = Number(s.weight) || 0;
      const r = Number(s.reps) || 0;
      volume += w * r;
      if (w > maxWeight) maxWeight = w;
      const est = e1rm(w, r);
      if (est > dayBest) dayBest = est;
      if (est > bestE1rm) { bestE1rm = est; bestSet = s; bestDate = date; }
    });
    volumeData.push(volume);
    e1rmData.push(Math.round(dayBest));
  });

  historyChartInstance = new Chart(canvas.getContext('2d'), {
    type: 'line',
    data: {
      labels,
      datasets: [
        {
          label: 'Volume (kg×reps)', data: volumeData,
          borderColor: '#00d5ff', backgroundColor: 'rgba(0, 213, 255, 0.1)',
          borderWidth: 2, tension: 0.3, fill: true, pointRadius: 2, yAxisID: 'y'
        },
        {
          label: '1RM estimado (kg)', data: e1rmData,
          borderColor: '#4caf50', backgroundColor: 'rgba(76, 175, 80, 0.1)',
          borderWidth: 2, tension: 0.3, fill: false, pointRadius: 2, yAxisID: 'y1'
        }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#101419', titleColor: '#00d5ff', bodyColor: '#f0f0f0',
          borderColor: '#232a33', borderWidth: 1
        }
      },
      scales: {
        x: { ticks: { color: '#666', font: { size: 9 }, maxRotation: 45 }, grid: { color: '#222' } },
        y: { position: 'left', ticks: { color: '#00d5ff', font: { size: 9 } }, grid: { color: '#222' } },
        y1: { position: 'right', ticks: { color: '#4caf50', font: { size: 9 } }, grid: { display: false } }
      }
    }
  });

  // --- Texto: melhor série da janela, progressão e frequência ---
  let html = `<div class="chart-caption">${FORCA_CAPTION}</div>`;
  const row = (label, value, cls) =>
    `<div class="stat-row"><span class="stat-label">${label}</span><span class="stat-value${cls ? ' ' + cls : ''}">${value}</span></div>`;

  if (bestSet) {
    // Rótulo honesto: é o melhor das últimas 12 semanas, não recorde histórico —
    // a query é limitada à janela de propósito.
    html += row('🏆 Melhor (12 sem.)',
      `${bestSet.weight} kg × ${bestSet.reps} · 1RM ${Math.round(bestE1rm)} kg <span style="color:#666;font-weight:400;">(${formatDayMonth(bestDate)})</span>`);
    html += row('Carga máx (12 sem.)', `${maxWeight} kg`);
  }
  if (e1rmData.length >= 2) {
    const ini = e1rmData[0], fim = e1rmData[e1rmData.length - 1];
    const diff = ini > 0 ? Math.round(((fim - ini) / ini) * 100) : 0;
    const cls = diff > 0 ? 'up' : diff < 0 ? 'down' : '';
    const arrow = diff > 0 ? '↑' : diff < 0 ? '↓' : '=';
    html += row('1º → último treino (1RM est.)', `${ini} → ${fim} kg ${arrow} ${Math.abs(diff)}%`, cls);
  }
  html += frequencyHtml(dates);
  setInfo(html);
}

// Minutos por treino. Volume e 1RM não existem no cardio — o que evolui é tempo.

// Em quantas das últimas 12 semanas o exercício foi feito.
// A janela é FIXA (termina nesta semana): contar "da primeira à última sessão"
// faria quem fez o exercício uma vez e parou aparecer como 1/1 semanas (100%).
function frequencyHtml(dates) {
  const weekStartOf = (d) => {
    const x = new Date(d);
    const wd = x.getDay();
    x.setDate(x.getDate() - (wd === 0 ? 6 : wd - 1));
    x.setHours(12, 0, 0, 0);
    return toLocalISO(x);
  };
  const trainedWeeks = new Set(dates.map(ds => weekStartOf(new Date(ds + 'T12:00:00'))));

  const weeks = [];
  const cursor = new Date();
  for (let i = 0; i < CHART_WINDOW_WEEKS; i++) {
    const wk = new Date(cursor);
    wk.setDate(cursor.getDate() - i * 7);
    weeks.push(weekStartOf(wk));
  }
  weeks.reverse();

  const attended = weeks.filter(w => trainedWeeks.has(w)).length;
  const percent = Math.round((attended / CHART_WINDOW_WEEKS) * 100);
  const dots = weeks.map(w => {
    const hit = trainedWeeks.has(w);
    return `<span class="freq-dot${hit ? '' : ' missed'}" title="Semana de ${formatDayMonth(w)}"></span>`;
  }).join('');

  return `<div class="frequency">Você fez em <strong>${attended}/${CHART_WINDOW_WEEKS} semanas (${percent}%)</strong>` +
    `<div class="freq-dots">${dots}</div>` +
    `<div style="margin-top:4px;font-size: var(--fs-2xs);">🟢 fez &nbsp; 🔴 não fez &nbsp;·&nbsp; mais antiga → esta semana</div></div>`;
}

// === Render ===
// === Modo cíclico: determinar próximo treino ===
async function determineCyclicPosition() {
  // Busca o último log do aluno para saber qual foi o último treino feito
  const { data } = await _sb.from('workout_logs')
    .select('weekday, session_date')
    .eq('student_id', studentId)
    .order('session_date', { ascending: false })
    .order('created_at', { ascending: false })
    .limit(1);

  if (!data || data.length === 0) {
    cyclicPosition = 0;
    return;
  }

  const lastLabel = data[0].weekday; // No modo cíclico armazena a letra (A, B, C...)
  // Encontra a posição do último treino na sequência e avança para o próximo
  const lastIdx = planCycleSequence.indexOf(lastLabel);
  if (lastIdx >= 0) {
    cyclicPosition = (lastIdx + 1) % planCycleSequence.length;
  } else {
    cyclicPosition = 0;
  }
}

function renderCyclicView() {
  const contentEl = document.getElementById('content');
  contentEl.innerHTML = '';

  const div = document.createElement('div');
  div.className = 'cyclic-view';
  div.id = 'cyclicView';

  // Barra de sequência visual
  let seqHtml = '<div class="cyclic-sequence-bar">';
  planCycleSequence.forEach((item, i) => {
    if (i > 0) seqHtml += '<span class="seq-arrow">›</span>';
    const isRest = item === 'rest';
    const isCurrent = i === cyclicPosition;
    const label = isRest ? 'Desc.' : item;
    seqHtml += `<span class="seq-dot${isCurrent ? ' current' : ''}${isRest ? ' rest' : ''}">${label}</span>`;
  });
  seqHtml += '</div>';
  div.innerHTML = seqHtml;

  // Card principal: sugerido ou descanso
  const currentItem = planCycleSequence[cyclicPosition];
  if (currentItem === 'rest') {
    // Próximo treino após o descanso
    let nextTrainIdx = -1;
    for (let i = 1; i < planCycleSequence.length; i++) {
      const idx = (cyclicPosition + i) % planCycleSequence.length;
      if (planCycleSequence[idx] !== 'rest') { nextTrainIdx = idx; break; }
    }
    const nextLabel = nextTrainIdx >= 0 ? planCycleSequence[nextTrainIdx] : '';
    const nextSub = nextLabel ? (planSubtitles[nextLabel] || '') : '';

    div.innerHTML += `
      <div class="cyclic-rest-card">
        <div class="cr-title">Dia de descanso</div>
        <div class="cr-sub">${nextLabel ? `Próximo treino: ${nextLabel}${nextSub ? ' — ' + esc(nextSub) : ''}` : ''}</div>
      </div>
      <div class="cyclic-others-label">Ou escolha um treino</div>
    `;
  } else {
    const subtitle = planSubtitles[currentItem] || '';
    div.innerHTML += `
      <div class="cyclic-suggested">
        <div class="cs-label">Sugerido</div>
        <div class="cs-title">Treino ${currentItem}</div>
        ${subtitle ? `<div class="cs-subtitle">${esc(subtitle)}</div>` : ''}
        <button class="cs-btn" onclick="openCyclicWorkout('${currentItem}')">Iniciar Treino ${currentItem}</button>
      </div>
      <div class="cyclic-others-label">Outros treinos</div>
    `;
  }

  // Lista dos outros treinos disponíveis
  const letters = Object.keys(WORKOUT).filter(k => (WORKOUT[k] || []).length > 0);
  letters.forEach(letter => {
    if (letter === currentItem && currentItem !== 'rest') return; // já está no sugerido
    const subtitle = planSubtitles[letter] || '';
    div.innerHTML += `
      <div class="cyclic-option" onclick="openCyclicWorkout('${letter}')">
        <div class="co-letter">${letter}</div>
        <div class="co-body">
          <div class="co-title">Treino ${letter}</div>
          ${subtitle ? `<div class="co-subtitle">${esc(subtitle)}</div>` : ''}
        </div>
        <span class="co-arrow">›</span>
      </div>
    `;
  });

  contentEl.appendChild(div);
}

function openCyclicWorkout(letter) {
  const contentEl = document.getElementById('content');
  const subtitle = planSubtitles[letter] || '';
  // Esconde tabs e mostra o treino selecionado
  document.getElementById('tabs').style.display = 'none';

  let html = `<div class="cyclic-view today-tab" id="day-${letter}">`;
  html += `<button class="cyclic-back-btn" onclick="backToCyclicMenu()">← Voltar</button>`;
  html += `<div class="cyclic-day-title">Treino ${letter}</div>`;
  if (subtitle) html += `<div class="cyclic-day-subtitle">${esc(subtitle)}</div>`;
  html += renderDay(letter);
  html += `</div>`;

  contentEl.innerHTML = html;
  currentTabDay = letter;
  updateTimerVisibility();
  loadTodayData(letter);
}

function backToCyclicMenu() {
  document.getElementById('tabs').style.display = '';
  renderCyclicView();
  currentTabDay = null;
  updateTimerVisibility();
}

function renderDay(day) {
  const exercises = WORKOUT[day];
  if (!exercises || exercises.length === 0) {
    return '<div class="loading">Dia de descanso 🎉</div>';
  }
  let html = '';
  let i = 0;
  while (i < exercises.length) {
    const ex = exercises[i];
    if (ex.group) {
      // Coleta todos os consecutivos com o mesmo group
      const groupId = ex.group;
      const grouped = [];
      const startIdx = i;
      while (i < exercises.length && exercises[i].group === groupId) {
        grouped.push({ ex: exercises[i], idx: i });
        i++;
      }
      const label = grouped.length === 2 ? 'BISET' : grouped.length === 3 ? 'TRISET' : 'GIANT SET';
      html += `<div class="biset-wrapper">`;
      html += `<span class="biset-label">🔗 ${label}</span>`;
      grouped.forEach(({ ex: gex, idx: gIdx }) => {
        html += renderExerciseCard(day, gIdx, gex);
      });
      // Botão salvar único para o grupo
      const groupCardIds = grouped.map(({ idx: gIdx }) => `card-${day}-${gIdx}`);
      html += `<button class="save-btn" onclick="saveGroup('${day}', [${groupCardIds.map(id => `'${id}'`).join(',')}])">Salvar ${label}</button>`;
      html += `</div>`;
    } else {
      html += renderExerciseCard(day, i, ex);
      i++;
    }
  }
  return html;
}

// =====================================================================
// Descanso prescrito e cardio
// O descanso vem do exercício (ex.rest) e é só leitura para o aluno.
// Cardio é set de TEMPO: o aluno registra minutos, que vão para a coluna
// duration_minutes — não para reps, senão contaminaria o volume.
// =====================================================================

// '90' → '90s' · '1:30' → '1min30s' · '2m'/'2minutos' → '2min' · '90seg' → '90s'.
// Mesma regra do editor.html (o professor pode digitar de várias formas).
// Texto livre ('até recuperar', '60-90s') passa intacto.
function normalizeRest(raw) {
  const t = String(raw || '').trim().toLowerCase();
  if (!t) return '';
  const compact = t.replace(/\s+/g, '');
  if (/^\d+$/.test(compact)) return compact + 's';
  const mmss = compact.match(/^(\d+):([0-5]\d)$/);
  if (mmss) return mmss[2] === '00' ? mmss[1] + 'min' : `${mmss[1]}min${Number(mmss[2])}s`;
  const seg = compact.match(/^(\d+)s(eg(undos?)?)?$/);
  if (seg) return seg[1] + 's';
  const min = compact.match(/^(\d+)m(in(uto)?s?)?$/);
  if (min) return min[1] + 'min';
  return t;
}

// Rótulo curto do tipo, para o resumo caber em uma linha no celular.
function restLabel(type) {
  const t = String(type || '').trim().toLowerCase();
  if (t === 'feeder') return 'FED';
  if (!t) return 'SET';
  const first = t.split(/[^0-9a-záàâãéêíóôõúç]+/i)[0] || t;
  return first.slice(0, 6).toUpperCase();
}

// Resumo por tipo de série: 'AQUEC-2min / FED-2min / HARD-3min'.
// Quando todas as séries têm o mesmo intervalo devolve só o valor ('2min'),
// e quem exibe usa o singular — repetir 5x o mesmo número é ruído.
// legacyRest: descanso da versão antiga, guardado no exercício.
function restSummary(sets, legacyRest) {
  const list = (sets || []).map(s => ({
    label: restLabel(s.type),
    rest: normalizeRest(s.rest || legacyRest || '')
  })).filter(x => x.rest);
  if (list.length === 0) return { text: '', uniform: false };
  const distintos = [...new Set(list.map(x => x.rest))];
  if (distintos.length === 1 && list.length === (sets || []).length) {
    return { text: distintos[0], uniform: true };
  }
  const vistos = new Set();
  const partes = [];
  list.forEach(x => {
    const chave = x.label + '|' + x.rest;
    if (vistos.has(chave)) return;
    vistos.add(chave);
    partes.push(`${x.label}-${x.rest}`);
  });
  return { text: partes.join(' / '), uniform: false };
}

function isCardioSet(type) {
  return String(type || '').trim().toLowerCase() === 'cardio';
}

// Aceita "40", "40min", "40 min" → 40. Vazio/zero → null (não salva).
// Teto de 600 min é o mesmo check do banco: acima disso é erro de digitação.
function parseCardioMinutes(raw) {
  const digits = String(raw == null ? '' : raw).replace(/[^\d]/g, '');
  if (!digits) return null;
  const n = parseInt(digits, 10);
  if (!Number.isFinite(n) || n <= 0) return null;
  return Math.min(n, 600);
}

function renderExerciseCard(day, exIdx, ex) {
  const cardId = `card-${day}-${exIdx}`;
  const exName = esc(ex.name);
  const videoUrl = ex.video_url || '';
  const exNote = ex.note || '';
  const sets = ex.sets || [];
  const descanso = restSummary(sets, ex.rest);
  const allCardio = sets.length > 0 && sets.every(s => isCardioSet(s.type));

  let html = '';
  html += `<div class="exercise-card" id="${cardId}" data-exercise="${exName}" data-day="${day}">`;
  // Header
  html += `<div class="exercise-header">`;
  html += `<div class="exercise-name">${exName}</div>`;
  html += `<button class="video-btn ${videoUrl ? 'visible' : ''}" onclick="openVideo('${esc(videoUrl).replace(/'/g,"\\'")}','${exName.replace(/'/g,"\\'")}')">▶</button>`;
  html += `<button class="note-icon ${exNote ? 'visible' : ''}" onclick="toggleNote('nb-${day}-${exIdx}')">!</button>`;
  html += `</div>`;
  // Nota do exercício
  html += `<div class="note-bubble" id="nb-${day}-${exIdx}"><div class="note-bubble-label">📋 Observação do treinador:</div><span>${esc(exNote)}</span></div>`;
  // Descanso prescrito (só aparece se foi prescrito), em linha própria
  if (descanso.text) {
    const chave = descanso.uniform ? 'Descanso' : 'Descansos';
    html += `<div class="rest-line"><span class="rest-pill">⏱ <span class="rest-key">${chave}:</span> <span class="rest-value">${esc(descanso.text)}</span></span></div>`;
  }
  // Histórico (o modal também abre o gráfico de evolução deste exercício)
  html += `<button class="history-btn" onclick="toggleHistory('${exName.replace(/'/g,"\\'")}', ${allCardio})">Ver histórico</button>`;
  // Exercício sem série: não há o que registrar. Aviso honesto em vez de card vazio.
  if (sets.length === 0) {
    html += `<div class="no-sets">Sem séries definidas — fale com seu personal.</div>`;
    html += `</div>`;
    return html;
  }
  // Header colunas
  if (allCardio) {
    html += `<div class="set-row cardio-row set-header"><span class="set-label"></span><span class="col-title">MINUTOS</span><span></span></div>`;
  } else {
    html += `<div class="set-row set-header"><span class="set-label"></span><span class="col-title">KG</span><span class="col-title">REPS</span><span></span></div>`;
  }
  // Sets
  sets.forEach((set, setIdx) => {
    const cardio = isCardioSet(set.type);
    const typeLabel = set.type === 'aquec' ? 'AQUEC' : set.type === 'feeder' ? 'FEEDER' : set.type === 'hard' ? 'HARD' : cardio ? 'CARDIO' : (set.type || 'SET').toUpperCase();
    const typeClass = (set.type === 'aquec' || set.type === 'feeder' || set.type === 'hard' || cardio) ? 'type-' + (cardio ? 'cardio' : set.type) : '';
    const setNote = set.note || '';
    const repsText = set.reps || '';
    const notes = repsText.includes('+') ? repsText.split('+')[1].trim() : '';
    const checkHtml = `<span class="check-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></span>`;
    html += `<div class="set-row${cardio ? ' cardio-row' : ''}" data-set-type="${esc(set.type)}" data-notes="${esc(notes)}">`;
    html += `<span class="set-label ${typeClass}">${typeLabel}${cardio && sets.length === 1 ? '' : ' ' + (setIdx+1)} <button class="note-icon ${setNote ? 'visible' : ''}" onclick="toggleNote('nb-${day}-${exIdx}-${setIdx}')">!</button></span>`;
    if (cardio) {
      // Um campo só: minutos feitos. O placeholder mostra o que foi prescrito (ex: 40min).
      html += `<input type="number" class="minutes-input" placeholder="${esc(repsText || 'minutos')}" data-prescribed="${esc(repsText)}" inputmode="numeric">`;
    } else {
      html += `<input type="number" class="weight-input" placeholder="-" inputmode="decimal">`;
      html += `<input type="number" class="reps-input" placeholder="${esc(repsText)}" data-prescribed="${esc(repsText)}" inputmode="numeric">`;
    }
    html += checkHtml;
    html += `</div>`;
    // Nota do set
    html += `<div class="note-bubble" id="nb-${day}-${exIdx}-${setIdx}"><div class="note-bubble-label">📋 Observação do treinador:</div><span>${esc(setNote)}</span></div>`;
  });
  // Salvar individual (só para exercícios soltos, dentro de grupo o wrapper tem o botão)
  if (!ex.group) {
    html += `<button class="save-btn" onclick="saveExercise('${day}','${exName.replace(/'/g,"\\'")}','${cardId}')">Salvar</button>`;
  }
  html += `</div>`;
  return html;
}

// === Timer de treino ===
let timerInterval = null;
let sessionStartTime = null;
let currentSessionId = null;
let todaySessionId = null; // id da sessão de hoje (mantido mesmo após encerrar, p/ permitir reiniciar)
let currentTabDay = null;
let pausedSeconds = 0;     // total já fechado (vem do banco)
let pauseStartedAt = null; // ms (Date.now) do início da pausa atual, ou null

function formatDuration(seconds) {
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  const s = seconds % 60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function updateTimerDisplay() {
  if (!sessionStartTime) return;
  let elapsed = Math.floor((Date.now() - sessionStartTime) / 1000) - pausedSeconds;
  if (pauseStartedAt) elapsed -= Math.floor((Date.now() - pauseStartedAt) / 1000);
  document.getElementById('timerDisplay').textContent = formatDuration(Math.max(0, elapsed));
}

function isCurrentTabToday() {
  if (planMode === 'cyclic') return !!currentTabDay; // no cíclico, treino é sempre "hoje"
  return currentTabDay === getToday();
}

function updateTimerVisibility() {
  const row = document.getElementById('startWorkoutRow');
  // Remove botão encerrar antigo de todos os dias
  document.querySelectorAll('.end-workout-row').forEach(el => el.remove());
  document.querySelectorAll('.workout-done-msg').forEach(el => el.remove());
  document.querySelectorAll('.restart-workout-row').forEach(el => el.remove());

  if (!isCurrentTabToday()) {
    row.style.display = 'none';
    return;
  }

  // Dia de descanso (sem exercícios) — não mostrar botão iniciar
  const dayKey = planMode === 'cyclic' ? currentTabDay : getToday();
  const exercises = WORKOUT[dayKey];
  if (!exercises || exercises.length === 0) {
    row.style.display = 'none';
    return;
  }

  // Dia atual: mostrar conforme estado
  if (currentSessionId && !document.querySelector('.session-ended')) {
    // Sessão em andamento
    row.style.display = 'flex';
    document.getElementById('timerStartBtn').style.display = 'none';
    const timerInlineEl = document.getElementById('timerInline');
    timerInlineEl.style.display = 'inline';
    timerInlineEl.classList.toggle('paused', !!pauseStartedAt);
    // Mostra qual treino está em execução
    const label = document.getElementById('timerLabel');
    if (label && currentTabDay) {
      const sub = planSubtitles[currentTabDay] || '';
      label.textContent = '· Treino ' + currentTabDay + (sub ? ' — ' + sub : '') + (pauseStartedAt ? ' · Pausado' : '');
    }
    // Adicionar botão encerrar no final do conteúdo do dia
    appendEndButton();
  } else if (document.querySelector('.session-ended')) {
    // Já encerrou hoje
    row.style.display = 'none';
    appendDoneMessage();
  } else {
    // Nenhuma sessão - mostrar botão iniciar
    row.style.display = 'flex';
    document.getElementById('timerStartBtn').style.display = 'inline-block';
    document.getElementById('timerInline').style.display = 'none';
    const label = document.getElementById('timerLabel');
    if (label) label.textContent = '';
  }
}

function appendEndButton() {
  const dayKey = planMode === 'cyclic' ? currentTabDay : getToday();
  const dayEl = document.getElementById('day-' + dayKey);
  if (!dayEl || dayEl.querySelector('.end-workout-row')) return;
  const div = document.createElement('div');
  div.className = 'end-workout-row';
  const pauseLabel = pauseStartedAt ? 'Retomar' : 'Pausar';
  const pauseAction = pauseStartedAt ? 'resumeWorkout()' : 'pauseWorkout()';
  div.innerHTML = `<button class="pause-workout-btn" onclick="${pauseAction}">${pauseLabel}</button>` +
    '<button class="end-workout-btn" onclick="stopWorkoutSession()">Encerrar Treino</button>';
  dayEl.appendChild(div);
  const restartRow = document.createElement('div');
  restartRow.className = 'restart-workout-row';
  restartRow.innerHTML = '<button class="restart-workout-btn" onclick="restartWorkout()">Reiniciar Treino</button>';
  dayEl.appendChild(restartRow);
}

function appendDoneMessage() {
  const dayKey = planMode === 'cyclic' ? currentTabDay : getToday();
  const dayEl = document.getElementById('day-' + dayKey);
  if (!dayEl || dayEl.querySelector('.workout-done-msg')) return;
  const elapsed = sessionEndDuration || 0;
  const div = document.createElement('div');
  div.className = 'workout-done-msg';
  div.textContent = 'Treino concluído · ' + formatDuration(elapsed);
  dayEl.appendChild(div);
  const restartRow = document.createElement('div');
  restartRow.className = 'restart-workout-row';
  restartRow.innerHTML = '<button class="restart-workout-btn" onclick="restartWorkout()">Reiniciar Treino</button>';
  dayEl.appendChild(restartRow);
}

let sessionEndDuration = 0;

async function loadTodaySession() {
  const today = getTodayDate();
  const { data, error } = await _sb.from('workout_sessions')
    .select('*')
    .eq('student_id', studentId)
    .gte('started_at', today + 'T00:00:00')
    .lte('started_at', today + 'T23:59:59')
    .order('started_at', { ascending: false })
    .limit(1)
    .maybeSingle();

  if (data && !data.ended_at) {
    const elapsed = Math.floor((Date.now() - new Date(data.started_at).getTime()) / 1000);
    const MAX_DURATION = 5 * 60 * 60; // 5 horas em segundos

    if (elapsed >= MAX_DURATION) {
      // Passou de 5h — invalida a sessão (marca como expirada)
      await _sb.from('workout_sessions')
        .update({ ended_at: new Date(new Date(data.started_at).getTime() + MAX_DURATION * 1000).toISOString(), duration_seconds: null })
        .eq('id', data.id);
      // Mostra como se não tivesse sessão válida hoje
      showTimerExpired();
    } else {
      // Sessão em andamento válida
      currentSessionId = data.id;
      todaySessionId = data.id;
      sessionStartTime = new Date(data.started_at).getTime();
      pausedSeconds = data.paused_seconds || 0;
      pauseStartedAt = data.pause_started_at ? new Date(data.pause_started_at).getTime() : null;
      updateTimerDisplay();
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        updateTimerDisplay();
        // Verifica expiração em tempo real
        const now = Math.floor((Date.now() - sessionStartTime) / 1000);
        if (now >= MAX_DURATION) {
          stopWorkoutExpired();
        }
      }, 1000);
    }
  } else if (data && data.ended_at) {
    if (data.duration_seconds !== null) {
      // Encerrou normalmente
      todaySessionId = data.id;
      sessionEndDuration = data.duration_seconds;
      const marker = document.createElement('span');
      marker.className = 'session-ended';
      marker.style.display = 'none';
      document.body.appendChild(marker);
    } else {
      // Expirou (duration_seconds = null)
      showTimerExpired();
      updateTimerVisibility();
      return;
    }
  }

  updateTimerVisibility();
}

function showTimerExpired() {
  const row = document.getElementById('startWorkoutRow');
  row.style.display = 'flex';
  document.getElementById('timerStartBtn').style.display = 'none';
  document.getElementById('timerInline').style.display = 'inline';
  document.getElementById('timerDisplay').textContent = 'Expirado';
  document.getElementById('timerInline').style.color = '#888';

  // Mostra mensagem no final do dia
  const dayKey = planMode === 'cyclic' ? currentTabDay : getToday();
  const dayEl = document.getElementById('day-' + dayKey);
  if (dayEl && !dayEl.querySelector('.workout-done-msg')) {
    const div = document.createElement('div');
    div.className = 'workout-done-msg';
    div.style.color = '#888';
    div.textContent = '⚠️ Sessão expirada (não encerrada em 5h)';
    dayEl.appendChild(div);
  }
}

async function stopWorkoutExpired() {
  if (!currentSessionId) return;
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }

  // Marca como expirada (duration_seconds = null indica sessão inválida)
  await _sb.from('workout_sessions')
    .update({ ended_at: new Date().toISOString(), duration_seconds: null })
    .eq('id', currentSessionId);

  currentSessionId = null;
  sessionStartTime = null;
  pausedSeconds = 0;
  pauseStartedAt = null;
  showTimerExpired();
  updateTimerVisibility();
  showToast('Sessão expirada — passou de 5h sem encerrar.', true);
}

async function confirmStartWorkout() {
  if (!confirm('Iniciar o treino agora?')) return;
  startWorkoutSession();
}

async function startWorkoutSession() {
  const btn = document.getElementById('timerStartBtn');
  btn.disabled = true;
  const weekday = planMode === 'cyclic' ? (currentTabDay || getToday()) : getToday();

  const { data, error } = await _sb.from('workout_sessions')
    .insert({ student_id: studentId, weekday: weekday, started_at: new Date().toISOString() })
    .select()
    .single();

  if (error) {
    showToast('Erro ao iniciar: ' + error.message, true);
    btn.disabled = false;
    return;
  }

  currentSessionId = data.id;
  todaySessionId = data.id;
  sessionStartTime = new Date(data.started_at).getTime();
  pausedSeconds = 0;
  pauseStartedAt = null;
  updateTimerDisplay();
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(updateTimerDisplay, 1000);
  updateTimerVisibility();
  showToast('Treino iniciado! Bom treino 💪');
}

async function pauseWorkout() {
  if (!currentSessionId || pauseStartedAt) return;
  const now = new Date().toISOString();
  const { error } = await _sb.from('workout_sessions')
    .update({ pause_started_at: now })
    .eq('id', currentSessionId);

  if (error) {
    showToast('Erro ao pausar: ' + error.message, true);
    return;
  }

  pauseStartedAt = new Date(now).getTime();
  updateTimerVisibility();
}

async function resumeWorkout() {
  if (!currentSessionId || !pauseStartedAt) return;
  const newPaused = pausedSeconds + Math.floor((Date.now() - pauseStartedAt) / 1000);
  const { error } = await _sb.from('workout_sessions')
    .update({ paused_seconds: newPaused, pause_started_at: null })
    .eq('id', currentSessionId);

  if (error) {
    showToast('Erro ao retomar: ' + error.message, true);
    return;
  }

  pausedSeconds = newPaused;
  pauseStartedAt = null;
  updateTimerVisibility();
}

async function stopWorkoutSession() {
  if (!currentSessionId) return;

  const endedAt = new Date().toISOString();
  let finalPaused = pausedSeconds;
  if (pauseStartedAt) finalPaused += Math.floor((Date.now() - pauseStartedAt) / 1000);
  const durationSeconds = Math.max(0, Math.floor((Date.now() - sessionStartTime) / 1000) - finalPaused);

  const { error } = await _sb.from('workout_sessions')
    .update({ ended_at: endedAt, duration_seconds: durationSeconds, paused_seconds: finalPaused, pause_started_at: null })
    .eq('id', currentSessionId);

  if (error) {
    showToast('Erro ao encerrar: ' + error.message, true);
    return;
  }

  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  sessionEndDuration = durationSeconds;
  const endedSessionId = currentSessionId;
  currentSessionId = null;
  sessionStartTime = null;
  pausedSeconds = 0;
  pauseStartedAt = null;

  // Marca como encerrado
  const marker = document.createElement('span');
  marker.className = 'session-ended';
  marker.style.display = 'none';
  document.body.appendChild(marker);

  updateTimerVisibility();
  showToast('Treino encerrado! ' + formatDuration(durationSeconds));
  openRatingModal(endedSessionId);
}

// === Nota do treino ao encerrar ===
let ratingSessionId = null;
let selectedRating = null;

function openRatingModal(sessionId) {
  ratingSessionId = sessionId;
  selectedRating = null;
  document.querySelectorAll('#ratingScale .rating-option').forEach(el => el.classList.remove('selected'));
  document.getElementById('ratingFeedback').value = '';
  document.getElementById('ratingModal').classList.add('show');
}

function closeRatingModal() {
  document.getElementById('ratingModal').classList.remove('show');
  ratingSessionId = null;
}

function selectRating(value) {
  selectedRating = value;
  document.querySelectorAll('#ratingScale .rating-option').forEach(el => {
    el.classList.toggle('selected', Number(el.dataset.value) === value);
  });
}

async function submitRating() {
  if (!ratingSessionId) { closeRatingModal(); return; }
  const feedbackText = document.getElementById('ratingFeedback').value.trim();

  if (selectedRating === null && !feedbackText) { closeRatingModal(); return; }

  const { error } = await _sb.from('workout_sessions')
    .update({ rating: selectedRating, feedback_text: feedbackText || null })
    .eq('id', ratingSessionId);

  if (error) {
    showToast('Erro ao salvar avaliação: ' + error.message, true);
    return;
  }

  closeRatingModal();
  showToast('Avaliação salva, obrigado!');
}

async function restartWorkout() {
  if (!confirm('Reiniciar o treino de hoje? O tempo registrado será apagado.')) return;

  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }

  if (todaySessionId) {
    const { error } = await _sb.from('workout_sessions').delete().eq('id', todaySessionId);
    if (error) {
      showToast('Erro ao reiniciar: ' + error.message, true);
      return;
    }
  }

  currentSessionId = null;
  todaySessionId = null;
  sessionStartTime = null;
  pausedSeconds = 0;
  pauseStartedAt = null;
  sessionEndDuration = 0;
  document.querySelectorAll('.session-ended').forEach(el => el.remove());
  updateTimerVisibility();
  showToast('Treino reiniciado.');
}

// === Anotações do professor ===
let trainerNoteContent  = '';
let trainerNoteUpdated  = '';

// Chave do "já vi esta orientação". Guardada por aluno porque o mesmo aparelho
// pode ser usado por mais de uma conta (celular emprestado na academia).
const noteSeenKey = () => 'noteSeen:' + studentId;

function markNoteAsSeen() {
  try { localStorage.setItem(noteSeenKey(), trainerNoteUpdated || '1'); } catch (e) {}
  document.getElementById('menuBtn').classList.remove('has-news');
  document.getElementById('drawerNoteItem').classList.remove('has-news');
}

async function loadTrainerNote() {
  try {
    const { data } = await _sb.from('trainer_notes')
      .select('content, updated_at')
      .eq('student_id', studentId)
      .maybeSingle();

    const item = document.getElementById('drawerNoteItem');
    const desc = document.getElementById('drawerNoteDesc');

    if (!data || !data.content || !data.content.trim()) {
      desc.textContent = 'Nenhuma orientação no momento';
      return;
    }

    trainerNoteContent = data.content;
    trainerNoteUpdated = data.updated_at || '';
    desc.textContent = trainerNoteUpdated
      ? 'Atualizado em ' + new Date(trainerNoteUpdated).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: '2-digit' })
      : 'Dieta, orientações e recados';

    // Orientação nova (ou nunca aberta) → ponto vermelho no hamburger.
    // O menu esconde as Orientações atrás de um toque; sem o aviso o aluno
    // perderia o recado do professor sem saber que existia.
    let seen = '';
    try { seen = localStorage.getItem(noteSeenKey()) || ''; } catch (e) {}
    if (seen !== (trainerNoteUpdated || '1')) {
      document.getElementById('menuBtn').classList.add('has-news');
      item.classList.add('has-news');
    }
  } catch (e) {
    console.log('Erro ao carregar orientações:', e);
  }
}

function renderNoteHtml(raw) {
  if (!raw || !raw.trim()) return '<p style="color:#555;text-align:center;padding:20px">Sem orientações no momento.</p>';
  const lines   = raw.split('\n');
  let html      = '<div class="note-render">';
  let inSection = false;

  function closeSection() {
    if (inSection) { html += '</div>'; inSection = false; }
  }

  lines.forEach(line => {
    if (/^#\s+/.test(line)) {
      closeSection();
      const title = line.replace(/^#+\s*/, '').trim();
      html += `<div class="note-section"><div class="note-section-title">${esc(title)}</div>`;
      inSection = true;
      return;
    }
    const trimmed = line.trim();
    if (!trimmed) { html += '<div class="note-spacer"></div>'; return; }
    if (/^[•*]\s+/.test(trimmed)) {
      html += `<div class="note-line bullet">${esc(trimmed.replace(/^[•*]\s+/, ''))}</div>`;
      return;
    }
    if (/^[-—]\s+/.test(trimmed)) {
      html += `<div class="note-line dash">${esc(trimmed.replace(/^[-—]\s+/, ''))}</div>`;
      return;
    }
    const numMatch = trimmed.match(/^(\d+)[.)]\s+(.*)/);
    if (numMatch) {
      html += `<div class="note-line num" data-num="${numMatch[1]}">${esc(numMatch[2])}</div>`;
      return;
    }
    html += `<div class="note-line">${esc(trimmed)}</div>`;
  });

  closeSection();
  html += '</div>';

  if (trainerNoteUpdated) {
    const d   = new Date(trainerNoteUpdated);
    const fmt = d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: '2-digit' }) + ' ' +
                d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    html += `<div class="note-modal-updated">Atualizado em ${fmt}</div>`;
  }

  return html;
}
