// === Bloqueio ===
function showBlock(state) {
  hideLoading();
  document.getElementById('tabs').style.display = 'none';
  document.getElementById('content').style.display = 'none';
  // Sem acesso liberado, o menu não leva a nada útil (as telas de dentro
  // também bloqueiam) — melhor não oferecer.
  document.getElementById('menuBtn').style.display = 'none';
  const screen = document.getElementById('blockScreen');
  screen.classList.add('show');
  const map = {
    expired: { t: 'Período encerrado', p: 'Seu período de acompanhamento terminou. Fale com seu personal para renovar.' },
    unavailable: { t: 'Acesso indisponível', p: 'Seu acesso está indisponível no momento. Fale com seu personal.' },
    suspended: { t: 'Acesso suspenso', p: 'Seu acesso está suspenso. Entre em contato para regularizar.' }
  };
  const m = map[state] || map.unavailable;
  document.getElementById('blockTitle').textContent = m.t;
  document.getElementById('blockText').textContent = m.p;
}

// === Inicialização via auth-guard ===
guard('student', {
  onReady: async (session, profile) => {
    showLoading();
    studentId = profile.id;
    // Sincroniza tema do perfil (Supabase tem prioridade sobre localStorage)
    if (profile.app_theme) {
      // console.log('aaa', profile.app_theme)
      // localStorage.setItem('app-theme', profile.app_theme);
      const customTheme = localStorage.getItem('app-theme')
      document.documentElement.setAttribute('data-theme', customTheme);
    }

    // Header: saudação + academia + título do treino
    document.getElementById('greeting').textContent = 'Olá ' + (profile.full_name || '');
    if (profile.gym_name) document.getElementById('gymName').textContent = profile.gym_name;
    document.getElementById('drawerName').textContent = profile.full_name || 'Menu';
    document.getElementById('drawerSub').textContent = profile.gym_name || '';

    // Orientações e anamnese existem mesmo sem treino cadastrado, então o menu
    // é carregado antes de decidir o que mostrar no corpo da tela.
    loadTrainerNote();

    // Carrega plano ativo (com fallback resiliente)
    let plan = null;
    {
      let { data, error } = await _sb.from('workout_plans')
        .select('title, structure, plan_start_date, plan_end_date, mode, subtitles, cycle_sequence')
        .eq('student_id', studentId)
        .eq('is_active', true)
        .maybeSingle();

      if (error) {
        console.error('[MeuTreino] Erro ao carregar plano (tentativa 1):', error.message || error);
        // Fallback 1: erro de coluna inexistente (migration 17 não rodada) — tenta sem colunas novas
        if (error.message && (error.message.includes('column') || error.code === '42703')) {
          const fallback = await _sb.from('workout_plans')
            .select('title, structure, plan_start_date, plan_end_date')
            .eq('student_id', studentId)
            .eq('is_active', true)
            .maybeSingle();
          if (!fallback.error && fallback.data) {
            data = fallback.data;
            error = null;
            console.warn('[MeuTreino] Fallback sem colunas cíclicas funcionou. Rode a migration 17_cyclic_mode.sql no Supabase.');
          } else if (fallback.error) {
            console.error('[MeuTreino] Fallback também falhou:', fallback.error.message);
          }
        }
        // Fallback 2: múltiplos planos ativos (maybeSingle rejeita >1 row)
        if (error && error.message && error.message.includes('multiple')) {
          console.warn('[MeuTreino] Múltiplos planos ativos detectados, usando o mais recente.');
          const fallback = await _sb.from('workout_plans')
            .select('title, structure, plan_start_date, plan_end_date, mode, subtitles, cycle_sequence')
            .eq('student_id', studentId)
            .eq('is_active', true)
            .order('updated_at', { ascending: false })
            .limit(1);
          if (!fallback.error && fallback.data && fallback.data.length > 0) {
            data = fallback.data[0];
            error = null;
          } else if (fallback.error) {
            console.error('[MeuTreino] Fallback múltiplos também falhou:', fallback.error.message);
          }
        }
      }

      plan = data;
      if (!plan) {
        if (error) console.error('[MeuTreino] Plano não carregado. Erro final:', error.message || error);
        hideLoading();
        document.getElementById('content').innerHTML = '<div class="empty-state"><div class="empty-icon">📋</div><div class="empty-title">Nenhum treino disponível</div><div class="empty-text">Seu personal ainda não cadastrou um treino para você.<br>Aguarde ou entre em contato com ele.</div></div>';
        return;
      }
    }

    if (plan.title) document.getElementById('planTitle').textContent = plan.title;

    // Exibe datas do plano no header (se existirem)
    if (plan.plan_start_date || plan.plan_end_date) {
      const fmt = (d) => { const [y,m,dd] = d.split('-'); return `${dd}/${m}`; };
      let datesText = '';
      if (plan.plan_start_date && plan.plan_end_date) {
        datesText = `${fmt(plan.plan_start_date)} — ${fmt(plan.plan_end_date)}`;
      } else if (plan.plan_start_date) {
        datesText = `Início: ${fmt(plan.plan_start_date)}`;
      } else {
        datesText = `Até: ${fmt(plan.plan_end_date)}`;
      }
      const datesEl = document.getElementById('planDates');
      datesEl.textContent = datesText;
      datesEl.classList.remove('hidden', 'expiring', 'expired');
      if (plan.plan_end_date) {
        const now = new Date();
        const end = new Date(plan.plan_end_date + 'T23:59:59');
        const daysLeft = Math.ceil((end - now) / (1000 * 60 * 60 * 24));
        if (end < now) datesEl.classList.add('expired');
        else if (daysLeft <= 7) datesEl.classList.add('expiring');
      }
    }
    WORKOUT = plan.structure || {};
    planMode = plan.mode || 'weekly';
    planSubtitles = plan.subtitles || {};
    planCycleSequence = Array.isArray(plan.cycle_sequence) ? plan.cycle_sequence : [];

    // Se o modo é cíclico mas a sequência está vazia, derivar das chaves do structure
    if (planMode === 'cyclic' && planCycleSequence.length === 0) {
      const keys = Object.keys(WORKOUT).filter(k => Array.isArray(WORKOUT[k]) && WORKOUT[k].length > 0);
      if (keys.length > 0) {
        planCycleSequence = [...keys, 'rest'];
        console.warn('[MeuTreino] cycle_sequence vazio, derivado do structure:', planCycleSequence);
      }
    }

    if (planMode === 'cyclic') {
      // Modo cíclico: determinar posição e renderizar menu
      await determineCyclicPosition();
      // Esconde tabs (o menu cíclico substitui)
      document.getElementById('tabs').style.display = 'none';
      renderCyclicView();
      currentTabDay = null;
      await loadTodaySession();
      hideLoading();
    } else {
      // Modo semanal: renderiza tabs normais com subtítulos
      const today = getToday();
      const days = ['Segunda','Terça','Quarta','Quinta','Sexta','Sábado','Domingo'];
      const tabsEl = document.getElementById('tabs');
      const contentEl = document.getElementById('content');

      days.forEach(day => {
        const tab = document.createElement('button');
        tab.className = 'tab' + (day === today ? ' active' : '');
        const subtitle = planSubtitles[day] || '';
        tab.textContent = day.substring(0, 3);
        if (subtitle) tab.title = subtitle;
        tab.onclick = () => {
          document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
          document.querySelectorAll('.day-content').forEach(d => d.classList.remove('active'));
          tab.classList.add('active');
          document.getElementById('day-' + day).classList.add('active');
          currentTabDay = day;
          updateTimerVisibility();
          loadTodayData(day);
        };
        tabsEl.appendChild(tab);

        const div = document.createElement('div');
        div.className = 'day-content' + (day === today ? ' active today-tab' : '');
        div.id = 'day-' + day;
        // Adiciona subtítulo acima dos exercícios
        let dayHtml = '';
        if (subtitle) dayHtml += `<div class="cyclic-day-subtitle">${esc(subtitle)}</div>`;
        dayHtml += renderDay(day);
        div.innerHTML = dayHtml;
        contentEl.appendChild(div);
      });

      loadTodayData(today);
      currentTabDay = today;
      await loadTodaySession();
      hideLoading();
    }
  },
  onBlocked: showBlock
});

if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }
