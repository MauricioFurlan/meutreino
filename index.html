<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Treino</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#f5c518">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; connect-src 'self' https://qslvwyhpamazoqhcmqan.supabase.co; img-src 'self' data:;">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icon-192.svg">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body::-webkit-scrollbar, *::-webkit-scrollbar { display: none; }
    body, * { scrollbar-width: none; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0d0d0d;
      color: #f0f0f0;
      min-height: 100vh;
      padding-bottom: 80px;
    }
    .header {
      background: #1a1a1a;
      padding: 16px;
      text-align: center;
      border-bottom: 1px solid #333;
      position: relative;
    }
    .header h1 { font-size: 1.2rem; color: #f5c518; letter-spacing: 1px; }
    .header .subtitle { font-size: 0.8rem; color: #999; margin-top: 4px; }
    .header .plan-title { font-size: 0.75rem; color: #666; margin-top: 2px; }
    .header .plan-dates {
      font-size: 0.65rem; color: #888; margin-top: 4px;
      background: #2a2a2a; display: inline-block; padding: 2px 10px;
      border-radius: 10px; border: 1px solid #333;
    }
    .header .plan-dates.hidden { display: none; }
    .logout-btn {
      position: absolute; top: 14px; right: 14px; background: none; border: 1px solid #555;
      color: #999; font-size: 0.65rem; padding: 4px 10px; border-radius: 12px; cursor: pointer;
    }
    .logout-btn:active { opacity: 0.6; }
    .tabs {
      display: flex;
      background: #1a1a1a;
      padding: 8px;
      gap: 4px;
      position: sticky;
      top: 0;
      z-index: 99;
      border-bottom: 1px solid #333;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      flex: 1;
      padding: 8px 4px;
      border-radius: 20px;
      background: #2a2a2a;
      color: #888;
      font-size: 0.7rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      text-align: center;
    }
    .tab.active { background: #f5c518; color: #000; }
    .day-content { display: none; padding: 16px; }
    .day-content.active { display: block; }
    .exercise-card {
      background: #1a1a1a;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      border: 1px solid #333;
    }

    /* Biset/Triset/Giant Set wrapper */
    .biset-wrapper {
      border: 2px solid #f5c518;
      border-radius: 14px;
      padding: 12px 10px 10px;
      margin-bottom: 12px;
      position: relative;
      background: #111;
    }
    .biset-wrapper .biset-label {
      position: absolute; top: -11px; left: 14px;
      background: #111; color: #f5c518; font-size: 0.7rem;
      font-weight: 700; padding: 0 8px; letter-spacing: 0.5px;
    }
    .biset-wrapper .exercise-card {
      margin-bottom: 8px;
      border: 1px solid #333;
    }
    .biset-wrapper .exercise-card:last-of-type { margin-bottom: 10px; }
    .biset-wrapper .save-btn { margin-top: 4px; }
    .exercise-name {
      font-size: 1.3rem;
      font-weight: 700;
      color: #f5c518;
      margin-bottom: 10px;
      text-transform: uppercase;
    }
    .set-row {
      display: grid;
      grid-template-columns: auto 1fr 1fr 40px;
      gap: 8px;
      align-items: center;
      margin-bottom: 10px;
      padding: 6px 0;
    }
    .set-label {
      font-size: 0.75rem;
      color: #ccc;
      text-transform: uppercase;
      min-width: 60px;
      font-weight: 600;
    }
    .set-label.type-aquec { color: #4caf50; }
    .set-label.type-feeder { color: #42a5f5; }
    .set-label.type-hard { color: #ff5252; }
    .set-row input {
      width: 100%;
      padding: 10px 8px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #0d0d0d;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      text-align: center;
      min-width: 0;
      box-sizing: border-box;
    }
    .set-header { margin-bottom: 0; padding: 0; }
    .col-title { font-size: 0.65rem; color: #888; text-align: center; font-weight: 700; text-transform: uppercase; }
    .set-row input::placeholder { color: #999; font-size: 14px; font-weight: 500; }
    .set-row input:focus { outline: none; border-color: #f5c518; }
    .save-btn {
      width: 100%; padding: 12px; border: none; border-radius: 8px;
      background: #f5c518; color: #000; font-weight: 700; font-size: 0.9rem;
      cursor: pointer; margin-top: 8px; transition: opacity 0.2s;
    }
    .save-btn:active:not(:disabled) { opacity: 0.7; }
    .save-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .save-btn.saved { background: #4caf50; color: #fff; }
    .history-btn {
      background: none; border: none; color: #f5c518; font-size: 0.75rem;
      cursor: pointer; padding: 4px 0; margin-bottom: 8px; text-decoration: underline;
    }
    .check-icon {
      width: 28px; height: 28px; border-radius: 50%; border: 2px solid #555;
      display: flex; align-items: center; justify-content: center; transition: all 0.2s;
    }
    .check-icon svg { display: none; }
    .check-icon.done { border-color: #4caf50; background: #4caf50; }
    .check-icon.done svg { display: block; }
    .loading { text-align: center; padding: 40px; color: #888; }
    .toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: #f5c518; color: #000; padding: 10px 20px; border-radius: 20px;
      font-size: 0.85rem; font-weight: 600; display: none; z-index: 1000;
    }
    .toast.error { background: #f44336; color: #fff; }
    .toast.show { display: block; animation: fadeOut 2s forwards; }
    @keyframes fadeOut { 0%,70% { opacity: 1; } 100% { opacity: 0; } }
    .date-display { text-align: center; padding: 8px; font-size: 0.8rem; color: #999; }
    .note-icon {
      display: none; background: #f44336; color: #fff; width: 18px; height: 18px;
      border-radius: 50%; font-size: 0.65rem; font-weight: 700; border: none;
      cursor: pointer; margin-left: 4px; flex-shrink: 0; vertical-align: middle;
    }
    .note-icon.visible { display: inline-flex; align-items: center; justify-content: center; }
    .exercise-header { display: flex; align-items: center; }
    .exercise-name { flex: 1; }
    .video-btn {
      background: none; border: 1px solid #555; color: #f5c518; width: 22px; height: 22px;
      border-radius: 50%; font-size: 0.6rem; cursor: pointer; margin-left: 8px;
      flex-shrink: 0; display: none; align-items: center; justify-content: center;
    }
    .video-btn.visible { display: flex; }
    .note-bubble {
      display: none; background: #2a2a2a; border: 1px solid #f5c518; border-radius: 8px;
      padding: 10px; margin-bottom: 10px; font-size: 0.8rem; color: #f0f0f0;
    }
    .note-bubble.show { display: block; }
    .note-bubble-label { font-size: 0.65rem; color: #f5c518; margin-bottom: 4px; font-weight: 600; }
    .history-modal {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.9); z-index: 1000; align-items: center;
      justify-content: center; padding: 16px;
    }
    .history-modal.show { display: flex; }
    .history-modal-content {
      background: #1a1a1a; border-radius: 12px; padding: 16px; width: 100%;
      max-width: 400px; max-height: 80vh; overflow-y: auto; border: 1px solid #333;
    }
    .history-modal-content h3 { color: #f5c518; font-size: 0.9rem; margin-bottom: 12px; }
    .history-modal-close {
      width: 100%; padding: 10px; border: none; border-radius: 8px;
      background: #2a2a2a; color: #999; font-weight: 600; font-size: 0.85rem;
      cursor: pointer; margin-top: 12px;
    }
    .history-date { color: #f5c518; font-size: 0.75rem; font-weight: 600; margin-top: 10px; margin-bottom: 4px; }
    .history-set { font-size: 0.8rem; color: #ddd; padding: 3px 0; border-bottom: 1px solid #222; }
    /* Tela de bloqueio */
    .block-screen { display: none; text-align: center; padding: 60px 24px; }
    .block-screen.show { display: block; }
    .block-screen .icon { font-size: 2.4rem; margin-bottom: 12px; }
    .block-screen h2 { font-size: 1.05rem; color: #f5c518; margin-bottom: 8px; }
    .block-screen p { font-size: 0.9rem; color: #ccc; line-height: 1.5; }
    /* Loading overlay */
    .loading-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(13,13,13,0.92); z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 16px; transition: opacity 0.3s;
    }
    .loading-overlay.hidden { opacity: 0; pointer-events: none; }
    .loading-spinner {
      width: 44px; height: 44px; border: 3px solid #333;
      border-top-color: #f5c518; border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { color: #999; font-size: 0.8rem; font-weight: 500; letter-spacing: 0.5px; }
  </style>
</head>
<body>
  <div class="loading-overlay" id="loadingOverlay">
    <div class="loading-spinner"></div>
    <div class="loading-text">Carregando...</div>
  </div>
  <div class="header">
    <button class="logout-btn" onclick="location.href='login.html?logout'">Sair</button>
    <h1 id="greeting">Carregando...</h1>
    <div class="subtitle" id="gymName"></div>
    <div class="plan-title" id="planTitle"></div>
    <div class="plan-dates hidden" id="planDates"></div>
  </div>
  <div class="date-display" id="dateDisplay"></div>
  <div class="tabs" id="tabs"></div>
  <div id="content"></div>
  <div class="toast" id="toast"></div>
  <div class="block-screen" id="blockScreen">
    <div class="icon">🔒</div>
    <h2 id="blockTitle"></h2>
    <p id="blockText"></p>
  </div>
  <div class="history-modal" id="historyModal">
    <div class="history-modal-content">
      <h3 id="historyModalTitle">Histórico</h3>
      <div id="historyModalBody"></div>
      <button class="history-modal-close" onclick="closeHistoryModal()">Fechar</button>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth-guard.js"></script>
<script>
// === Estado global ===
function showLoading() { document.getElementById('loadingOverlay').classList.remove('hidden'); }
function hideLoading() { document.getElementById('loadingOverlay').classList.add('hidden'); }
let WORKOUT = {};  // carregado do banco
let studentId = null;

// === Helpers ===
const esc = (s) => { // escape HTML (proteção XSS)
  const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML;
};

function getToday() {
  const days = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
  return days[new Date().getDay()];
}

function getTodayDate() { return new Date().toISOString().split('T')[0]; }

// Retorna a data mais recente para o dia da semana informado
// Ex: se hoje é Domingo e day='Segunda', retorna a segunda passada (há 6 dias)
// Se day é o dia de hoje, retorna hoje
function getDateForDay(day) {
  const dayIndex = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'].indexOf(day);
  const now = new Date();
  const todayIndex = now.getDay();
  let diff = todayIndex - dayIndex;
  if (diff < 0) diff += 7;
  const target = new Date(now);
  target.setDate(now.getDate() - diff);
  return target.toISOString().split('T')[0];
}

function showToast(text, isError) {
  const t = document.getElementById('toast');
  t.textContent = text;
  t.className = 'toast show' + (isError ? ' error' : '');
  setTimeout(() => t.className = 'toast', 2500);
}

// === Reset dos inputs de um dia (evita acúmulo de placeholder ao trocar tabs) ===
function resetDayInputs(day) {
  const dayEl = document.getElementById('day-' + day);
  if (!dayEl) return;
  dayEl.querySelectorAll('.set-row:not(.set-header)').forEach(row => {
    const wi = row.querySelector('.weight-input');
    const ri = row.querySelector('.reps-input');
    const check = row.querySelector('.check-icon');
    if (wi) { wi.value = ''; wi.placeholder = '-'; }
    if (ri) { ri.value = ''; ri.placeholder = ri.dataset.prescribed || ''; }
    if (check) check.classList.remove('done');
  });
}

// === Carregamento de dados do dia ===
async function loadTodayData(day) {
  try {
    resetDayInputs(day);
    const sessionDate = getDateForDay(day);
    const { data, error } = await _sb.from('workout_logs')
      .select('*')
      .eq('student_id', studentId)
      .eq('weekday', day)
      .eq('session_date', sessionDate)
      .order('set_number', { ascending: true });
    if (error) throw error;
    if (!data || data.length === 0) { await loadLastWorkout(day); return; }
    data.forEach(record => {
      const card = document.querySelector(`[data-exercise="${CSS.escape(record.exercise_name)}"][data-day="${day}"]`);
      if (!card) return;
      const rows = card.querySelectorAll('.set-row:not(.set-header)');
      const row = rows[record.set_number - 1];
      if (!row) return;
      const weightInput = row.querySelector('.weight-input');
      const repsInput = row.querySelector('.reps-input');
      const check = row.querySelector('.check-icon');
      if (weightInput && record.weight !== null) weightInput.value = record.weight;
      if (repsInput && record.reps !== null) repsInput.value = record.reps;
      if (check && (record.weight !== null || record.reps !== null)) check.classList.add('done');
    });
  } catch (e) { console.log('Erro ao carregar dados do dia:', e); }
}

async function loadLastWorkout(day) {
  try {
    const { data, error } = await _sb.from('workout_logs')
      .select('*')
      .eq('student_id', studentId)
      .eq('weekday', day)
      .order('created_at', { ascending: false })
      .limit(100);
    if (error || !data || data.length === 0) return;
    const lastDate = data[0].session_date;
    const lastData = data.filter(r => r.session_date === lastDate);
    lastData.forEach(record => {
      const card = document.querySelector(`[data-exercise="${CSS.escape(record.exercise_name)}"][data-day="${day}"]`);
      if (!card) return;
      const rows = card.querySelectorAll('.set-row:not(.set-header)');
      const row = rows[record.set_number - 1];
      if (!row) return;
      const weightInput = row.querySelector('.weight-input');
      const repsInput = row.querySelector('.reps-input');
      if (weightInput && record.weight !== null) weightInput.placeholder = record.weight + ' kg';
      if (repsInput && record.reps !== null) {
        const prescribed = repsInput.dataset.prescribed || '';
        repsInput.placeholder = record.reps + (prescribed ? ' · ' + prescribed : '');
      }
    });
  } catch (e) { console.log('Erro ao carregar último treino:', e); }
}

// === Salvar ===
async function saveExercise(day, exerciseName, cardId) {
  const card = document.getElementById(cardId);
  const btn = card.querySelector('.save-btn');
  // Evita cliques duplicados
  if (btn.disabled) return;
  btn.disabled = true;
  btn.textContent = 'Salvando...';

  const rows = card.querySelectorAll('.set-row:not(.set-header)');
  const records = [];
  const sessionDate = getDateForDay(day);
  rows.forEach((row, i) => {
    const weight = row.querySelector('.weight-input')?.value;
    const reps = row.querySelector('.reps-input')?.value;
    if (weight !== '' || reps !== '') {
      records.push({
        student_id: studentId,
        session_date: sessionDate,
        weekday: day,
        exercise_name: exerciseName,
        set_type: row.dataset.setType,
        set_number: i + 1,
        weight: weight ? parseFloat(weight) : null,
        reps: reps ? parseInt(reps) : null,
        notes: row.dataset.notes || null
      });
    }
  });
  if (records.length === 0) { showToast('Preencha ao menos um set', true); btn.disabled = false; btn.textContent = 'Salvar'; return; }
  try {
    // Deleta registros de hoje deste exercício
    const { error: delErr } = await _sb.from('workout_logs')
      .delete()
      .eq('student_id', studentId)
      .eq('session_date', sessionDate)
      .eq('exercise_name', exerciseName);
    if (delErr) throw delErr;
    // Insere novos
    const { error: insErr } = await _sb.from('workout_logs').insert(records);
    if (insErr) throw insErr;
    btn.textContent = '✓ Salvo!'; btn.classList.add('saved');
    rows.forEach(row => {
      const weight = row.querySelector('.weight-input')?.value;
      const reps = row.querySelector('.reps-input')?.value;
      const check = row.querySelector('.check-icon');
      if ((weight || reps) && check) check.classList.add('done');
      else if (check) check.classList.remove('done');
    });
    setTimeout(() => { btn.textContent = 'Salvar'; btn.classList.remove('saved'); btn.disabled = false; }, 2000);
    showToast('Salvo com sucesso!');
  } catch (e) { showToast('Erro ao salvar: ' + e.message, true); btn.disabled = false; btn.textContent = 'Salvar'; }
}

// === Salvar grupo (biset/triset) ===
async function saveGroup(day, cardIds) {
  const wrapper = document.getElementById(cardIds[0]).closest('.biset-wrapper');
  const btn = wrapper.querySelector('.save-btn');
  if (btn.disabled) return;
  btn.disabled = true;
  btn.textContent = 'Salvando...';

  const sessionDate = getDateForDay(day);
  const allRecords = [];
  const exerciseNames = [];

  for (const cardId of cardIds) {
    const card = document.getElementById(cardId);
    const exerciseName = card.dataset.exercise;
    exerciseNames.push(exerciseName);
    const rows = card.querySelectorAll('.set-row:not(.set-header)');
    rows.forEach((row, i) => {
      const weight = row.querySelector('.weight-input')?.value;
      const reps = row.querySelector('.reps-input')?.value;
      if (weight !== '' || reps !== '') {
        allRecords.push({
          student_id: studentId,
          session_date: sessionDate,
          weekday: day,
          exercise_name: exerciseName,
          set_type: row.dataset.setType,
          set_number: i + 1,
          weight: weight ? parseFloat(weight) : null,
          reps: reps ? parseInt(reps) : null,
          notes: row.dataset.notes || null
        });
      }
    });
  }

  if (allRecords.length === 0) { showToast('Preencha ao menos um set', true); btn.disabled = false; btn.textContent = 'Salvar'; return; }

  try {
    // Deleta registros de hoje de todos os exercícios do grupo
    for (const name of exerciseNames) {
      const { error: delErr } = await _sb.from('workout_logs')
        .delete()
        .eq('student_id', studentId)
        .eq('session_date', sessionDate)
        .eq('exercise_name', name);
      if (delErr) throw delErr;
    }
    // Insere todos
    const { error: insErr } = await _sb.from('workout_logs').insert(allRecords);
    if (insErr) throw insErr;

    btn.textContent = '✓ Salvo!'; btn.classList.add('saved');
    // Marca checks
    for (const cardId of cardIds) {
      const card = document.getElementById(cardId);
      card.querySelectorAll('.set-row:not(.set-header)').forEach(row => {
        const weight = row.querySelector('.weight-input')?.value;
        const reps = row.querySelector('.reps-input')?.value;
        const check = row.querySelector('.check-icon');
        if ((weight || reps) && check) check.classList.add('done');
        else if (check) check.classList.remove('done');
      });
    }
    setTimeout(() => { btn.textContent = 'Salvar'; btn.classList.remove('saved'); btn.disabled = false; }, 2000);
    showToast('Salvo com sucesso!');
  } catch (e) { showToast('Erro ao salvar: ' + e.message, true); btn.disabled = false; btn.textContent = 'Salvar'; }
}

// === Histórico ===
async function loadHistory(exerciseName) {
  try {
    const fourWeeksAgo = new Date();
    fourWeeksAgo.setDate(fourWeeksAgo.getDate() - 28);
    const since = fourWeeksAgo.toISOString().split('T')[0];
    const { data, error } = await _sb.from('workout_logs')
      .select('*')
      .eq('student_id', studentId)
      .eq('exercise_name', exerciseName)
      .gte('session_date', since)
      .order('created_at', { ascending: false })
      .order('set_number', { ascending: true });
    if (error) throw error;
    const body = document.getElementById('historyModalBody');
    document.getElementById('historyModalTitle').textContent = exerciseName;
    if (!data || data.length === 0) {
      body.innerHTML = '<div style="color:#888;text-align:center;padding:20px;">Sem histórico nas últimas 4 semanas</div>';
      return;
    }
    let html = '', lastDate = '';
    data.forEach(r => {
      const date = new Date(r.created_at).toLocaleDateString('pt-BR', { day:'2-digit', month:'2-digit', weekday:'short' });
      if (date !== lastDate) { html += `<div class="history-date">${esc(date)}</div>`; lastDate = date; }
      html += `<div class="history-set">${esc(r.set_type)} ${r.set_number}: ${r.weight || '-'}kg × ${r.reps || '-'} reps</div>`;
    });
    body.innerHTML = html;
  } catch (e) {
    document.getElementById('historyModalBody').innerHTML = '<div style="color:#f44336;">Erro ao carregar</div>';
  }
}

function toggleHistory(exerciseName) {
  document.getElementById('historyModal').classList.add('show');
  document.getElementById('historyModalBody').innerHTML = '<div style="color:#888;text-align:center;padding:20px;">Carregando...</div>';
  loadHistory(exerciseName);
}
function closeHistoryModal() { document.getElementById('historyModal').classList.remove('show'); }

// === Vídeo ===
function openVideo(url, exerciseName) {
  const target = url || 'https://www.youtube.com/results?search_query=' + encodeURIComponent(exerciseName + ' execução correta');
  window.location.href = target;
}

// === Notas toggle ===
function toggleNote(id) {
  const bubble = document.getElementById(id);
  if (bubble) bubble.classList.toggle('show');
}

// === Render ===
function renderDay(day) {
  const exercises = WORKOUT[day];
  if (!exercises || exercises.length === 0) {
    return '<div class="loading">Dia de descanso 🎉</div>';
  }
  let html = '';
  let i = 0;
  while (i < exercises.length) {
    const ex = exercises[i];
    if (ex.group) {
      // Coleta todos os consecutivos com o mesmo group
      const groupId = ex.group;
      const grouped = [];
      const startIdx = i;
      while (i < exercises.length && exercises[i].group === groupId) {
        grouped.push({ ex: exercises[i], idx: i });
        i++;
      }
      const label = grouped.length === 2 ? 'BISET' : grouped.length === 3 ? 'TRISET' : 'GIANT SET';
      html += `<div class="biset-wrapper">`;
      html += `<span class="biset-label">🔗 ${label}</span>`;
      grouped.forEach(({ ex: gex, idx: gIdx }) => {
        html += renderExerciseCard(day, gIdx, gex);
      });
      // Botão salvar único para o grupo
      const groupCardIds = grouped.map(({ idx: gIdx }) => `card-${day}-${gIdx}`);
      html += `<button class="save-btn" onclick="saveGroup('${day}', [${groupCardIds.map(id => `'${id}'`).join(',')}])">Salvar ${label}</button>`;
      html += `</div>`;
    } else {
      html += renderExerciseCard(day, i, ex);
      i++;
    }
  }
  return html;
}

function renderExerciseCard(day, exIdx, ex) {
  const cardId = `card-${day}-${exIdx}`;
  const exName = esc(ex.name);
  const videoUrl = ex.video_url || '';
  const exNote = ex.note || '';

  let html = '';
  html += `<div class="exercise-card" id="${cardId}" data-exercise="${exName}" data-day="${day}">`;
  // Header
  html += `<div class="exercise-header">`;
  html += `<div class="exercise-name">${exName}</div>`;
  html += `<button class="video-btn ${videoUrl ? 'visible' : ''}" onclick="openVideo('${esc(videoUrl).replace(/'/g,"\\'")}','${exName.replace(/'/g,"\\'")}')">▶</button>`;
  html += `<button class="note-icon ${exNote ? 'visible' : ''}" onclick="toggleNote('nb-${day}-${exIdx}')">!</button>`;
  html += `</div>`;
  // Nota do exercício
  html += `<div class="note-bubble" id="nb-${day}-${exIdx}"><div class="note-bubble-label">📋 Observação do treinador:</div><span>${esc(exNote)}</span></div>`;
  // Histórico
  html += `<button class="history-btn" onclick="toggleHistory('${exName.replace(/'/g,"\\'")}')">Ver histórico</button>`;
  // Header colunas
  html += `<div class="set-row set-header"><span class="set-label"></span><span class="col-title">KG</span><span class="col-title">REPS</span><span></span></div>`;
  // Sets
  ex.sets.forEach((set, setIdx) => {
    const typeLabel = set.type === 'aquec' ? 'AQUEC' : set.type === 'feeder' ? 'FEEDER' : set.type === 'hard' ? 'HARD' : (set.type || 'SET').toUpperCase();
    const typeClass = (set.type === 'aquec' || set.type === 'feeder' || set.type === 'hard') ? 'type-' + set.type : '';
    const setNote = set.note || '';
    const repsText = set.reps || '';
    const notes = repsText.includes('+') ? repsText.split('+')[1].trim() : '';
    html += `<div class="set-row" data-set-type="${set.type}" data-notes="${esc(notes)}">`;
    html += `<span class="set-label ${typeClass}">${typeLabel} ${setIdx+1} <button class="note-icon ${setNote ? 'visible' : ''}" onclick="toggleNote('nb-${day}-${exIdx}-${setIdx}')">!</button></span>`;
    html += `<input type="number" class="weight-input" placeholder="-" inputmode="decimal">`;
    html += `<input type="number" class="reps-input" placeholder="${esc(repsText)}" data-prescribed="${esc(repsText)}" inputmode="numeric">`;
    html += `<span class="check-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></span>`;
    html += `</div>`;
    // Nota do set
    html += `<div class="note-bubble" id="nb-${day}-${exIdx}-${setIdx}"><div class="note-bubble-label">📋 Observação do treinador:</div><span>${esc(setNote)}</span></div>`;
  });
  // Salvar individual (só para exercícios soltos, dentro de grupo o wrapper tem o botão)
  if (!ex.group) {
    html += `<button class="save-btn" onclick="saveExercise('${day}','${exName.replace(/'/g,"\\'")}','${cardId}')">Salvar</button>`;
  }
  html += `</div>`;
  return html;
}

// === Bloqueio ===
function showBlock(state) {
  hideLoading();
  document.getElementById('tabs').style.display = 'none';
  document.getElementById('content').style.display = 'none';
  const screen = document.getElementById('blockScreen');
  screen.classList.add('show');
  const map = {
    expired: { t: 'Período encerrado', p: 'Seu período de acompanhamento terminou. Fale com seu personal para renovar.' },
    unavailable: { t: 'Acesso indisponível', p: 'Seu acesso está indisponível no momento. Fale com seu personal.' },
    suspended: { t: 'Acesso suspenso', p: 'Seu acesso está suspenso. Entre em contato para regularizar.' }
  };
  const m = map[state] || map.unavailable;
  document.getElementById('blockTitle').textContent = m.t;
  document.getElementById('blockText').textContent = m.p;
}

// === Inicialização via auth-guard ===
guard('student', {
  onReady: async (session, profile) => {
    showLoading();
    studentId = profile.id;

    // Header: saudação + academia + título do treino
    document.getElementById('greeting').textContent = 'Olá ' + (profile.full_name || '');
    if (profile.gym_name) document.getElementById('gymName').textContent = profile.gym_name;

    // Data
    document.getElementById('dateDisplay').textContent = new Date().toLocaleDateString('pt-BR', {
      weekday: 'long', day: 'numeric', month: 'long'
    });

    // Carrega plano ativo
    const { data: plan, error } = await _sb.from('workout_plans')
      .select('title, structure, plan_start_date, plan_end_date')
      .eq('student_id', studentId)
      .eq('is_active', true)
      .maybeSingle();

    if (error || !plan) {
      document.getElementById('content').innerHTML = '<div class="loading">Nenhum treino atribuído.<br>Fale com seu personal.</div>';
      return;
    }

    if (plan.title) document.getElementById('planTitle').textContent = plan.title;

    // Exibe datas do plano no header (se existirem)
    if (plan.plan_start_date || plan.plan_end_date) {
      const fmt = (d) => { const [y,m,dd] = d.split('-'); return `${dd}/${m}`; };
      let datesText = '';
      if (plan.plan_start_date && plan.plan_end_date) {
        datesText = `📅 ${fmt(plan.plan_start_date)} — ${fmt(plan.plan_end_date)}`;
      } else if (plan.plan_start_date) {
        datesText = `📅 Início: ${fmt(plan.plan_start_date)}`;
      } else {
        datesText = `📅 Até: ${fmt(plan.plan_end_date)}`;
      }
      const datesEl = document.getElementById('planDates');
      datesEl.textContent = datesText;
      datesEl.classList.remove('hidden');
    }
    WORKOUT = plan.structure || {};

    // Renderiza tabs e dias
    const today = getToday();
    const days = ['Segunda','Terça','Quarta','Quinta','Sexta','Sábado','Domingo'];
    const tabsEl = document.getElementById('tabs');
    const contentEl = document.getElementById('content');

    days.forEach(day => {
      const tab = document.createElement('button');
      tab.className = 'tab' + (day === today ? ' active' : '');
      tab.textContent = day.substring(0, 3);
      tab.onclick = () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.day-content').forEach(d => d.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById('day-' + day).classList.add('active');
        loadTodayData(day);
      };
      tabsEl.appendChild(tab);

      const div = document.createElement('div');
      div.className = 'day-content' + (day === today ? ' active' : '');
      div.id = 'day-' + day;
      div.innerHTML = renderDay(day);
      contentEl.appendChild(div);
    });

    loadTodayData(today);
    hideLoading();
  },
  onBlocked: showBlock
});

if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }
