// =====================================================================
// Cronômetro de descanso
// O descanso prescrito pelo professor vira botão na própria linha da série
// ("90s"), e o toque abre a contagem em destaque. A contagem é calculada a
// partir de Date.now(), não somando ticks: se a tela apagar ou o app for
// para segundo plano, o tempo restante continua certo ao voltar.
// =====================================================================

// '90s'/'2min'/'1min30s'/'1:30' → segundos. Faixa ('60-90s') usa o MAIOR.
// Texto livre ('até recuperar') devolve 0 — esse não vira botão.
const REST_UNIT = '(s|seg|segs|segundo|segundos|m|min|mins|minuto|minutos)';

function restUnitToSeconds(n, unit) {
  const secs = String(unit || '').startsWith('m') ? n * 60 : n; // sem unidade = segundos
  return (secs > 0 && secs <= 3600) ? secs : 0;
}

function restToSeconds(raw) {
  const t = String(raw || '').trim().toLowerCase().replace(/\s+/g, '');
  if (!t) return 0;
  const faixa = t.match(new RegExp('^(\\d+)[-–a](\\d+)' + REST_UNIT + '?$'));
  if (faixa) return restUnitToSeconds(Number(faixa[2]), faixa[3]);
  const mmss = t.match(/^(\d+):([0-5]\d)$/);
  if (mmss) return Number(mmss[1]) * 60 + Number(mmss[2]);
  const composto = t.match(/^(\d+)(?:m|min|mins|minuto|minutos)(\d+)(?:s|seg|segs|segundos?)?$/);
  if (composto) return Number(composto[1]) * 60 + Number(composto[2]);
  const simples = t.match(new RegExp('^(\\d+)' + REST_UNIT + '?$'));
  if (simples) return restUnitToSeconds(Number(simples[1]), simples[2]);
  return 0;
}

function formatRestClock(seconds) {
  const s = Math.max(0, Math.ceil(seconds));
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}

// Preferências (som, vibração, tela ligada) — ficam em config.html.
// Padrão ligado: só o valor '0' desliga.
const REST_PREF_KEYS = { sound: 'rest-timer-sound', vibrate: 'rest-timer-vibrate', screen: 'rest-timer-screen' };
function restPref(key) {
  try { return localStorage.getItem(REST_PREF_KEYS[key]) !== '0'; } catch (e) { return true; }
}

// --- Apito (Web Audio, sem arquivo de áudio) ---------------------------
// Sopro = ruído filtrado; a "bolinha" do apito = vibrato rápido no tom.
let restAudioCtx = null;
let restNoiseBuffer = null;

function restEnsureAudio() {
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return null;
    if (!restAudioCtx) restAudioCtx = new Ctx();
    // iOS/Chrome só liberam áudio dentro de um gesto do usuário — este
    // resume roda no mesmo toque que abriu o cronômetro.
    if (restAudioCtx.state === 'suspended') restAudioCtx.resume();
    return restAudioCtx;
  } catch (e) { return null; }
}

function restGetNoise(ctx) {
  if (restNoiseBuffer) return restNoiseBuffer;
  const len = Math.floor(ctx.sampleRate * 0.8);
  const buf = ctx.createBuffer(1, len, ctx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
  restNoiseBuffer = buf;
  return buf;
}

function restWhistleBlast(ctx, t0, dur) {
  const master = ctx.createGain();
  master.connect(ctx.destination);
  master.gain.setValueAtTime(0.0001, t0);
  master.gain.exponentialRampToValueAtTime(0.45, t0 + 0.02);
  master.gain.setValueAtTime(0.45, t0 + Math.max(0.04, dur - 0.06));
  master.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

  const osc = ctx.createOscillator();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(2350, t0);
  const vibrato = ctx.createOscillator();
  vibrato.frequency.value = 38;
  const vibratoGain = ctx.createGain();
  vibratoGain.gain.value = 120;
  vibrato.connect(vibratoGain);
  vibratoGain.connect(osc.frequency);
  const oscGain = ctx.createGain();
  oscGain.gain.value = 0.55;
  osc.connect(oscGain);
  oscGain.connect(master);

  const noise = ctx.createBufferSource();
  noise.buffer = restGetNoise(ctx);
  noise.loop = true;
  const bp = ctx.createBiquadFilter();
  bp.type = 'bandpass';
  bp.frequency.value = 2400;
  bp.Q.value = 5;
  const noiseGain = ctx.createGain();
  noiseGain.gain.value = 0.22;
  noise.connect(bp);
  bp.connect(noiseGain);
  noiseGain.connect(master);

  osc.start(t0); vibrato.start(t0); noise.start(t0);
  osc.stop(t0 + dur); vibrato.stop(t0 + dur); noise.stop(t0 + dur);
}

function restPlayWhistle() {
  const ctx = restEnsureAudio();
  if (!ctx) return;
  const now = ctx.currentTime + 0.02;
  restWhistleBlast(ctx, now, 0.16);
  restWhistleBlast(ctx, now + 0.24, 0.16);
  restWhistleBlast(ctx, now + 0.48, 0.55);
}

// --- Tela ligada durante o descanso ------------------------------------
let restWakeLock = null;

function restRequestWakeLock() {
  if (!restPref('screen') || !navigator.wakeLock) return;
  navigator.wakeLock.request('screen')
    .then(lock => {
      // Se o cronômetro já fechou enquanto a promise resolvia, solta na hora.
      if (!restState) { lock.release().catch(() => {}); return; }
      restWakeLock = lock;
      lock.addEventListener('release', () => { restWakeLock = null; });
    })
    .catch(() => {});
}

function restReleaseWakeLock() {
  if (restWakeLock) { restWakeLock.release().catch(() => {}); restWakeLock = null; }
}

// --- Contagem ----------------------------------------------------------
const REST_RING_CIRCUMFERENCE = 603.19; // 2πr, r=96 (igual ao SVG)
let restState = null;    // { total, endsAt, restante, pausado, concluido, btn }
let restRafId = null;
let restBackstop = null; // em segundo plano o rAF congela; o interval garante o fim

function openRestTimer(seconds, label, btn) {
  const total = Number(seconds) || 0;
  if (total <= 0) return;
  restEnsureAudio(); // libera o áudio dentro do gesto que abriu o modal
  restClearRunners();
  if (restState && restState.btn) restState.btn.classList.remove('running');
  restState = {
    total: total,
    endsAt: Date.now() + total * 1000,
    restante: total,
    pausado: false,
    concluido: false,
    btn: btn || null
  };
  if (btn) btn.classList.add('running');

  const modal = document.getElementById('restModal');
  modal.classList.remove('warning', 'paused', 'done');
  modal.classList.add('show');
  document.getElementById('restModalSub').textContent = label || '';
  document.getElementById('restOf').textContent = 'de ' + formatRestClock(total);
  document.getElementById('restStatus').textContent = '';
  document.getElementById('restMainBtn').textContent = 'Pausar';
  document.getElementById('restModalNote').textContent =
    (restPref('sound') || restPref('vibrate')) ? '' : 'Alertas desligados nas configurações.';
  restRender();
  restStartRunners();
  restRequestWakeLock();
}

function restStartRunners() {
  const loop = () => {
    restTick();
    if (restState && !restState.concluido && !restState.pausado) restRafId = requestAnimationFrame(loop);
  };
  restRafId = requestAnimationFrame(loop);
  restBackstop = setInterval(restTick, 500);
}

function restClearRunners() {
  if (restRafId) { cancelAnimationFrame(restRafId); restRafId = null; }
  if (restBackstop) { clearInterval(restBackstop); restBackstop = null; }
}

function restTick() {
  if (!restState || restState.concluido || restState.pausado) return;
  restState.restante = (restState.endsAt - Date.now()) / 1000;
  if (restState.restante <= 0) { restState.restante = 0; restFinish(); return; }
  restRender();
}

function restRender() {
  if (!restState) return;
  const restante = Math.max(0, restState.restante);
  const modal = document.getElementById('restModal');
  document.getElementById('restTime').textContent =
    restState.concluido ? 'Pode voltar' : formatRestClock(restante);
  const fracao = restState.total > 0 ? Math.min(1, restante / restState.total) : 0;
  document.getElementById('restRingBar').setAttribute(
    'stroke-dashoffset', String(REST_RING_CIRCUMFERENCE * (1 - fracao))
  );
  modal.classList.toggle('warning', !restState.concluido && !restState.pausado && restante <= 5);
  modal.classList.toggle('paused', restState.pausado);
}

function restFinish() {
  if (!restState || restState.concluido) return;
  restState.concluido = true;
  restClearRunners();
  restReleaseWakeLock();
  const modal = document.getElementById('restModal');
  modal.classList.remove('warning', 'paused');
  modal.classList.add('done');
  document.getElementById('restOf').textContent = 'Descanso de ' + formatRestClock(restState.total);
  document.getElementById('restStatus').textContent = 'Descanso concluído';
  document.getElementById('restMainBtn').textContent = 'Repetir';
  if (restState.btn) restState.btn.classList.remove('running');
  restRender();
  if (restPref('sound')) restPlayWhistle();
  if (restPref('vibrate') && navigator.vibrate) {
    try { navigator.vibrate([220, 120, 220, 120, 500]); } catch (e) {}
  }
}

function restToggle() {
  if (!restState) return;
  if (restState.concluido) { // "Repetir": roda o mesmo descanso de novo
    openRestTimer(restState.total, document.getElementById('restModalSub').textContent, restState.btn);
    return;
  }
  if (restState.pausado) {
    restState.pausado = false;
    restState.endsAt = Date.now() + restState.restante * 1000;
    document.getElementById('restMainBtn').textContent = 'Pausar';
    restStartRunners();
    restRequestWakeLock();
  } else {
    restState.pausado = true;
    restState.restante = Math.max(0, (restState.endsAt - Date.now()) / 1000);
    document.getElementById('restMainBtn').textContent = 'Retomar';
    restClearRunners();
    restReleaseWakeLock();
  }
  restRender();
}

function restAdjust(delta) {
  if (!restState) return;
  if (restState.concluido) { // já acabou: +15s recomeça uma contagem curta
    if (delta <= 0) return;
    openRestTimer(delta, document.getElementById('restModalSub').textContent, restState.btn);
    return;
  }
  const base = restState.pausado ? restState.restante : (restState.endsAt - Date.now()) / 1000;
  const novo = Math.max(1, Math.min(3600, base + delta));
  restState.restante = novo;
  restState.total = Math.max(restState.total, novo);
  if (!restState.pausado) restState.endsAt = Date.now() + novo * 1000;
  document.getElementById('restOf').textContent = 'de ' + formatRestClock(restState.total);
  restRender();
}

function closeRestTimer() {
  restClearRunners();
  restReleaseWakeLock();
  if (restState && restState.btn) restState.btn.classList.remove('running');
  restState = null;
  document.getElementById('restModal').classList.remove('show', 'warning', 'paused', 'done');
}

// O sistema solta o wake lock sozinho ao trocar de app: repede ao voltar.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && restState && !restState.pausado && !restState.concluido) {
    restRequestWakeLock();
  }
});

// === Render ===
// === Modo cíclico: determinar próximo treino ===
async function determineCyclicPosition() {
  // Busca o último log do aluno para saber qual foi o último treino feito
  const { data } = await scopeToPlan(_sb.from('workout_logs')
    .select('weekday, session_date')
    .eq('student_id', studentId))
    .order('session_date', { ascending: false })
    .order('created_at', { ascending: false })
    .limit(1);

  if (!data || data.length === 0) {
    cyclicPosition = 0;
    return;
  }

  const lastLabel = data[0].weekday; // No modo cíclico armazena a letra (A, B, C...)
  // Encontra a posição do último treino na sequência e avança para o próximo
  const lastIdx = planCycleSequence.indexOf(lastLabel);
  if (lastIdx >= 0) {
    cyclicPosition = (lastIdx + 1) % planCycleSequence.length;
  } else {
    cyclicPosition = 0;
  }
}

function renderCyclicView() {
  const contentEl = document.getElementById('content');
  contentEl.innerHTML = '';

  const div = document.createElement('div');
  div.className = 'cyclic-view';
  div.id = 'cyclicView';

  // Barra de sequência visual
  let seqHtml = '<div class="cyclic-sequence-bar">';
  planCycleSequence.forEach((item, i) => {
    if (i > 0) seqHtml += '<span class="seq-arrow">›</span>';
    const isRest = item === 'rest';
    const isCurrent = i === cyclicPosition;
    const label = isRest ? 'Desc.' : item;
    seqHtml += `<span class="seq-dot${isCurrent ? ' current' : ''}${isRest ? ' rest' : ''}">${label}</span>`;
  });
  seqHtml += '</div>';
  div.innerHTML = seqHtml;

  // Card principal: sugerido ou descanso
  const currentItem = planCycleSequence[cyclicPosition];
  if (currentItem === 'rest') {
    // Próximo treino após o descanso
    let nextTrainIdx = -1;
    for (let i = 1; i < planCycleSequence.length; i++) {
      const idx = (cyclicPosition + i) % planCycleSequence.length;
      if (planCycleSequence[idx] !== 'rest') { nextTrainIdx = idx; break; }
    }
    const nextLabel = nextTrainIdx >= 0 ? planCycleSequence[nextTrainIdx] : '';
    const nextSub = nextLabel ? (planSubtitles[nextLabel] || '') : '';

    div.innerHTML += `
      <div class="cyclic-rest-card">
        <div class="cr-title">Dia de descanso</div>
        <div class="cr-sub">${nextLabel ? `Próximo treino: ${nextLabel}${nextSub ? ' — ' + esc(nextSub) : ''}` : ''}</div>
      </div>
      <div class="cyclic-others-label">Ou escolha um treino</div>
    `;
  } else {
    const subtitle = planSubtitles[currentItem] || '';
    div.innerHTML += `
      <div class="cyclic-suggested">
        <div class="cs-label">Sugerido</div>
        <div class="cs-title">Treino ${currentItem}</div>
        ${subtitle ? `<div class="cs-subtitle">${esc(subtitle)}</div>` : ''}
        <button class="cs-btn" onclick="openCyclicWorkout('${currentItem}')">Iniciar Treino ${currentItem}</button>
      </div>
      <div class="cyclic-others-label">Outros treinos</div>
    `;
  }

  // Lista dos outros treinos disponíveis
  const letters = Object.keys(WORKOUT).filter(k => (WORKOUT[k] || []).length > 0);
  letters.forEach(letter => {
    if (letter === currentItem && currentItem !== 'rest') return; // já está no sugerido
    const subtitle = planSubtitles[letter] || '';
    div.innerHTML += `
      <div class="cyclic-option" onclick="openCyclicWorkout('${letter}')">
        <div class="co-letter">${letter}</div>
        <div class="co-body">
          <div class="co-title">Treino ${letter}</div>
          ${subtitle ? `<div class="co-subtitle">${esc(subtitle)}</div>` : ''}
        </div>
        <span class="co-arrow">›</span>
      </div>
    `;
  });

  contentEl.appendChild(div);
}

function openCyclicWorkout(letter) {
  const contentEl = document.getElementById('content');
  const subtitle = planSubtitles[letter] || '';
  // Esconde tabs e mostra o treino selecionado
  document.getElementById('tabs').style.display = 'none';

  let html = `<div class="cyclic-view today-tab" id="day-${letter}">`;
  html += `<button class="cyclic-back-btn" onclick="backToCyclicMenu()">← Voltar</button>`;
  html += `<div class="cyclic-day-title">Treino ${letter}</div>`;
  if (subtitle) html += `<div class="cyclic-day-subtitle">${esc(subtitle)}</div>`;
  html += renderDay(letter);
  html += `</div>`;

  contentEl.innerHTML = html;
  currentTabDay = letter;
  updateTimerVisibility();
  loadTodayData(letter);
}

function backToCyclicMenu() {
  document.getElementById('tabs').style.display = '';
  renderCyclicView();
  currentTabDay = null;
  updateTimerVisibility();
}

function renderDay(day) {
  const exercises = WORKOUT[day];
  if (!exercises || exercises.length === 0) {
    return '<div class="loading">Dia de descanso 🎉</div>';
  }
  let html = '';
  let i = 0;
  while (i < exercises.length) {
    const ex = exercises[i];
    if (ex.group) {
      // Coleta todos os consecutivos com o mesmo group
      const groupId = ex.group;
      const grouped = [];
      const startIdx = i;
      while (i < exercises.length && exercises[i].group === groupId) {
        grouped.push({ ex: exercises[i], idx: i });
        i++;
      }
      const label = grouped.length === 2 ? 'BISET' : grouped.length === 3 ? 'TRISET' : 'GIANT SET';
      html += `<div class="biset-wrapper">`;
      html += `<span class="biset-label">🔗 ${label}</span>`;
      grouped.forEach(({ ex: gex, idx: gIdx }) => {
        html += renderExerciseCard(day, gIdx, gex);
      });
      // Botão salvar único para o grupo
      const groupCardIds = grouped.map(({ idx: gIdx }) => `card-${day}-${gIdx}`);
      html += `<button class="save-btn" onclick="saveGroup('${day}', [${groupCardIds.map(id => `'${id}'`).join(',')}])">Salvar ${label}</button>`;
      html += `</div>`;
    } else {
      html += renderExerciseCard(day, i, ex);
      i++;
    }
  }
  return html;
}

// =====================================================================
// Descanso prescrito e cardio
// O descanso vem do exercício (ex.rest) e é só leitura para o aluno.
// Cardio é set de TEMPO: o aluno registra minutos, que vão para a coluna
// duration_minutes — não para reps, senão contaminaria o volume.
// =====================================================================

// '90' → '90s' · '1:30' → '1min30s' · '2m'/'2minutos' → '2min' · '90seg' → '90s'.
// Mesma regra do editor.html (o professor pode digitar de várias formas).
// Texto livre ('até recuperar', '60-90s') passa intacto.
function normalizeRest(raw) {
  const t = String(raw || '').trim().toLowerCase();
  if (!t) return '';
  const compact = t.replace(/\s+/g, '');
  if (/^\d+$/.test(compact)) return compact + 's';
  const mmss = compact.match(/^(\d+):([0-5]\d)$/);
  if (mmss) return mmss[2] === '00' ? mmss[1] + 'min' : `${mmss[1]}min${Number(mmss[2])}s`;
  const seg = compact.match(/^(\d+)s(eg(undos?)?)?$/);
  if (seg) return seg[1] + 's';
  const min = compact.match(/^(\d+)m(in(uto)?s?)?$/);
  if (min) return min[1] + 'min';
  return t;
}

// Rótulo curto do tipo, para o resumo caber em uma linha no celular.
function restLabel(type) {
  const t = String(type || '').trim().toLowerCase();
  if (t === 'feeder') return 'FED';
  if (!t) return 'SET';
  const first = t.split(/[^0-9a-záàâãéêíóôõúç]+/i)[0] || t;
  return first.slice(0, 6).toUpperCase();
}

// Resumo por tipo de série: 'AQUEC-2min / FED-2min / HARD-3min'.
// Quando todas as séries têm o mesmo intervalo devolve só o valor ('2min'),
// e quem exibe usa o singular — repetir 5x o mesmo número é ruído.
// legacyRest: descanso da versão antiga, guardado no exercício.
function restSummary(sets, legacyRest) {
  const list = (sets || []).map(s => ({
    label: restLabel(s.type),
    rest: normalizeRest(s.rest || legacyRest || '')
  })).filter(x => x.rest);
  if (list.length === 0) return { text: '', uniform: false };
  const distintos = [...new Set(list.map(x => x.rest))];
  if (distintos.length === 1 && list.length === (sets || []).length) {
    return { text: distintos[0], uniform: true };
  }
  const vistos = new Set();
  const partes = [];
  list.forEach(x => {
    const chave = x.label + '|' + x.rest;
    if (vistos.has(chave)) return;
    vistos.add(chave);
    partes.push(`${x.label}-${x.rest}`);
  });
  return { text: partes.join(' / '), uniform: false };
}

function isCardioSet(type) {
  return String(type || '').trim().toLowerCase() === 'cardio';
}

// Aceita "40", "40min", "40 min" → 40. Vazio/zero → null (não salva).
// Teto de 600 min é o mesmo check do banco: acima disso é erro de digitação.
function parseCardioMinutes(raw) {
  const digits = String(raw == null ? '' : raw).replace(/[^\d]/g, '');
  if (!digits) return null;
  const n = parseInt(digits, 10);
  if (!Number.isFinite(n) || n <= 0) return null;
  return Math.min(n, 600);
}

function renderExerciseCard(day, exIdx, ex) {
  const cardId = `card-${day}-${exIdx}`;
  const exName = esc(ex.name);
  const videoUrl = ex.video_url || '';
  const nameLower = String(ex.name || '').toLowerCase().trim();
  const exNote = ex.note || '';
  const sets = ex.sets || [];
  // A pilula resume so os descansos que NAO viram botao na linha (texto
  // livre como 'ate recuperar'). Repetir os que ja aparecem em cada serie
  // era ruido: a mesma informacao duas vezes na mesma tela.
  const descanso = restSummary(
    sets.map(sv => {
      const bruto = sv.rest || ex.rest || '';
      return restToSeconds(bruto) > 0 ? Object.assign({}, sv, { rest: '' }) : sv;
    }),
    restToSeconds(ex.rest) > 0 ? '' : ex.rest
  );
  const allCardio = sets.length > 0 && sets.every(s => isCardioSet(s.type));

  let html = '';
  html += `<div class="exercise-card" id="${cardId}" data-exercise="${exName}" data-day="${day}">`;
  // Header
  html += `<div class="exercise-header">`;
  html += `<div class="exercise-name">${exName}</div>`;
  html += `<button class="video-btn visible" onclick="openVideo('${esc(videoUrl).replace(/'/g,"\\'")}','${exName.replace(/'/g,"\\'")}','${esc(nameLower).replace(/'/g,"\\'")}')">▶ Vídeo</button>`;
  html += `<button class="note-icon ${exNote ? 'visible' : ''}" onclick="toggleNote('nb-${day}-${exIdx}')">!</button>`;
  html += `</div>`;
  // Nota do exercício
  html += `<div class="note-bubble" id="nb-${day}-${exIdx}"><div class="note-bubble-label">📋 Observação do treinador:</div><span>${esc(exNote)}</span></div>`;
  // Descanso prescrito (só aparece se foi prescrito), em linha própria
  if (descanso.text) {
    // Plural pelo que a pill REALMENTE lista: com o filtro acima ela pode
    // ficar com um item so mesmo quando as series tem descansos diferentes.
    const chave = descanso.text.includes(' / ') ? 'Descansos' : 'Descanso';
    html += `<div class="rest-line"><span class="rest-pill">⏱ <span class="rest-key">${chave}:</span> <span class="rest-value">${esc(descanso.text)}</span></span></div>`;
  }
  // Histórico (o modal também abre o gráfico de evolução deste exercício)
  html += `<button class="history-btn" onclick="toggleHistory('${exName.replace(/'/g,"\\'")}', ${allCardio})">Ver histórico</button>`;
  // Exercício sem série: não há o que registrar. Aviso honesto em vez de card vazio.
  if (sets.length === 0) {
    html += `<div class="no-sets">Sem séries definidas — fale com seu personal.</div>`;
    html += `</div>`;
    return html;
  }
  // A coluna do descanso so existe se algum tempo virar botao: exercicio
  // sem descanso prescrito nao ganha coluna vazia nem titulo.
  const temDescanso = sets.some(sv => restToSeconds(sv.rest || ex.rest || '') > 0);
  const restClass = temDescanso ? ' has-rest' : '';
  const restHeader = temDescanso ? '<span class="col-title col-rest">⏱</span>' : '';
  // Header colunas
  if (allCardio) {
    html += `<div class="set-row cardio-row set-header${restClass}"><span class="set-label"></span><span class="col-title">MINUTOS</span>${restHeader}<span></span></div>`;
  } else {
    html += `<div class="set-row set-header${restClass}"><span class="set-label"></span><span class="col-title">KG</span><span class="col-title">REPS</span>${restHeader}<span></span></div>`;
  }
  // Sets
  sets.forEach((set, setIdx) => {
    const cardio = isCardioSet(set.type);
    const typeLabel = set.type === 'aquec' ? 'AQUEC' : set.type === 'feeder' ? 'FEEDER' : set.type === 'hard' ? 'HARD' : cardio ? 'CARDIO' : (set.type || 'SET').toUpperCase();
    const typeClass = (set.type === 'aquec' || set.type === 'feeder' || set.type === 'hard' || cardio) ? 'type-' + (cardio ? 'cardio' : set.type) : '';
    const setNote = set.note || '';
    const repsText = set.reps || '';
    const notes = repsText.includes('+') ? repsText.split('+')[1].trim() : '';
    const checkHtml = `<span class="check-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></span>`;
    html += `<div class="set-row${cardio ? ' cardio-row' : ''}${restClass}" data-set-type="${esc(set.type)}" data-notes="${esc(notes)}">`;
    html += `<span class="set-label ${typeClass}">${typeLabel}${cardio && sets.length === 1 ? '' : ' ' + (setIdx+1)} <button class="note-icon ${setNote ? 'visible' : ''}" onclick="toggleNote('nb-${day}-${exIdx}-${setIdx}')">!</button></span>`;
    if (cardio) {
      // Um campo só: minutos feitos. O placeholder mostra o que foi prescrito (ex: 40min).
      html += `<input type="number" class="minutes-input" placeholder="${esc(repsText || 'minutos')}" data-prescribed="${esc(repsText)}" inputmode="numeric">`;
    } else {
      html += `<input type="number" class="weight-input" placeholder="-" inputmode="decimal">`;
      html += `<input type="number" class="reps-input" placeholder="${esc(repsText)}" data-prescribed="${esc(repsText)}" inputmode="numeric">`;
    }
    // Descanso desta serie: o valor prescrito e o proprio botao do cronometro.
    // Serie sem tempo (ou com texto livre, 'ate recuperar') fica com a celula
    // vazia — a coluna existe porque OUTRA serie do exercicio tem tempo, e sem
    // a celula a grade desalinharia.
    if (temDescanso) {
      const setRestText = normalizeRest(set.rest || ex.rest || '');
      const setRestSecs = restToSeconds(setRestText);
      if (setRestSecs > 0) {
        const rowLabel = typeLabel + (cardio && sets.length === 1 ? '' : ' ' + (setIdx + 1));
        const restLabelJs = (ex.name + ' - ' + rowLabel).replace(/'/g, "\\'");
        html += `<span class="rest-cell"><button type="button" class="rest-timer-btn" onclick="openRestTimer(${setRestSecs}, '${esc(restLabelJs)}', this)">${esc(setRestText)}</button></span>`;
      } else {
        html += `<span class="rest-cell"></span>`;
      }
    }
    html += checkHtml;
    html += `</div>`;
    // Nota do set
    html += `<div class="note-bubble" id="nb-${day}-${exIdx}-${setIdx}"><div class="note-bubble-label">📋 Observação do treinador:</div><span>${esc(setNote)}</span></div>`;
  });
  // Salvar individual (só para exercícios soltos, dentro de grupo o wrapper tem o botão)
  if (!ex.group) {
    html += `<button class="save-btn" onclick="saveExercise('${day}','${exName.replace(/'/g,"\\'")}','${cardId}')">Salvar</button>`;
  }
  html += `</div>`;
  return html;
}

// === Timer de treino ===
let timerInterval = null;
let sessionStartTime = null;
let currentSessionId = null;
let todaySessionId = null; // id da sessão de hoje (mantido mesmo após encerrar, p/ permitir reiniciar)
let currentTabDay = null;
let pausedSeconds = 0;     // total já fechado (vem do banco)
let pauseStartedAt = null; // ms (Date.now) do início da pausa atual, ou null

function formatDuration(seconds) {
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  const s = seconds % 60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function updateTimerDisplay() {
  if (!sessionStartTime) return;
  let elapsed = Math.floor((Date.now() - sessionStartTime) / 1000) - pausedSeconds;
  if (pauseStartedAt) elapsed -= Math.floor((Date.now() - pauseStartedAt) / 1000);
  document.getElementById('timerDisplay').textContent = formatDuration(Math.max(0, elapsed));
}

function isCurrentTabToday() {
  if (planMode === 'cyclic') return !!currentTabDay; // no cíclico, treino é sempre "hoje"
  return currentTabDay === getToday();
}

function isDayToday(day) {
  if (planMode === 'cyclic') return !!day && day === currentTabDay; // no cíclico, o treino aberto é o de hoje
  return day === getToday();
}

// O aluno recusou iniciar nesta visita. Não insiste a cada exercício salvo —
// o botão "Iniciar Treino" continua ali se ele mudar de ideia.
let startWorkoutDeclined = false;

// Só vale oferecer quando o botão "Iniciar Treino" está realmente disponível:
// dia de hoje, com exercícios, sem sessão em andamento, encerrada ou expirada.
function canOfferStartWorkout() {
  const row = document.getElementById('startWorkoutRow');
  const btn = document.getElementById('timerStartBtn');
  if (!row || !btn) return false;
  if (row.style.display === 'none') return false;
  return btn.style.display !== 'none' && !btn.disabled;
}

// Salvar sem ter iniciado o cronômetro é comum: o aluno abre o treino e já
// registra a primeira série. Aqui só se pergunta — quem chama salva de
// qualquer forma, com "sim" ou com "não".
async function offerStartWorkout(day) {
  if (startWorkoutDeclined) return;
  if (!isDayToday(day) || !canOfferStartWorkout()) return;
  if (!confirm('Você ainda não começou o treino. Deseja começar agora?')) {
    startWorkoutDeclined = true;
    return;
  }
  await startWorkoutSession();
}

function updateTimerVisibility() {
  const row = document.getElementById('startWorkoutRow');
  // Remove botão encerrar antigo de todos os dias
  document.querySelectorAll('.end-workout-row').forEach(el => el.remove());
  document.querySelectorAll('.workout-done-msg').forEach(el => el.remove());
  document.querySelectorAll('.restart-workout-row').forEach(el => el.remove());

  if (!isCurrentTabToday()) {
    row.style.display = 'none';
    return;
  }

  // Dia de descanso (sem exercícios) — não mostrar botão iniciar
  const dayKey = planMode === 'cyclic' ? currentTabDay : getToday();
  const exercises = WORKOUT[dayKey];
  if (!exercises || exercises.length === 0) {
    row.style.display = 'none';
    return;
  }

  // Dia atual: mostrar conforme estado
  if (currentSessionId && !document.querySelector('.session-ended')) {
    // Sessão em andamento
    row.style.display = 'flex';
    document.getElementById('timerStartBtn').style.display = 'none';
    const timerInlineEl = document.getElementById('timerInline');
    timerInlineEl.style.display = 'inline';
    timerInlineEl.classList.toggle('paused', !!pauseStartedAt);
    // Mostra qual treino está em execução
    const label = document.getElementById('timerLabel');
    if (label && currentTabDay) {
      const sub = planSubtitles[currentTabDay] || '';
      label.textContent = '· Treino ' + currentTabDay + (sub ? ' — ' + sub : '') + (pauseStartedAt ? ' · Pausado' : '');
    }
    // Adicionar botão encerrar no final do conteúdo do dia
    appendEndButton();
  } else if (document.querySelector('.session-ended')) {
    // Já encerrou hoje
    row.style.display = 'none';
    appendDoneMessage();
  } else {
    // Nenhuma sessão - mostrar botão iniciar
    row.style.display = 'flex';
    document.getElementById('timerStartBtn').style.display = 'inline-block';
    document.getElementById('timerInline').style.display = 'none';
    const label = document.getElementById('timerLabel');
    if (label) label.textContent = '';
  }
}

function appendEndButton() {
  const dayKey = planMode === 'cyclic' ? currentTabDay : getToday();
  const dayEl = document.getElementById('day-' + dayKey);
  if (!dayEl || dayEl.querySelector('.end-workout-row')) return;
  const div = document.createElement('div');
  div.className = 'end-workout-row';
  const pauseLabel = pauseStartedAt ? 'Retomar' : 'Pausar';
  const pauseAction = pauseStartedAt ? 'resumeWorkout()' : 'pauseWorkout()';
  div.innerHTML = `<button class="pause-workout-btn" onclick="${pauseAction}">${pauseLabel}</button>` +
    '<button class="end-workout-btn" onclick="stopWorkoutSession()">Encerrar Treino</button>';
  dayEl.appendChild(div);
  const restartRow = document.createElement('div');
  restartRow.className = 'restart-workout-row';
  restartRow.innerHTML = '<button class="restart-workout-btn" onclick="restartWorkout()">Reiniciar Treino</button>';
  dayEl.appendChild(restartRow);
}

function appendDoneMessage() {
  const dayKey = planMode === 'cyclic' ? currentTabDay : getToday();
  const dayEl = document.getElementById('day-' + dayKey);
  if (!dayEl || dayEl.querySelector('.workout-done-msg')) return;
  const elapsed = sessionEndDuration || 0;
  const div = document.createElement('div');
  div.className = 'workout-done-msg';
  div.textContent = 'Treino concluído · ' + formatDuration(elapsed);
  dayEl.appendChild(div);
  const restartRow = document.createElement('div');
  restartRow.className = 'restart-workout-row';
  restartRow.innerHTML = '<button class="restart-workout-btn" onclick="restartWorkout()">Reiniciar Treino</button>';
  dayEl.appendChild(restartRow);
}

let sessionEndDuration = 0;

async function loadTodaySession() {
  const today = getTodayDate();
  const { data, error } = await _sb.from('workout_sessions')
    .select('*')
    .eq('student_id', studentId)
    .gte('started_at', today + 'T00:00:00')
    .lte('started_at', today + 'T23:59:59')
    .order('started_at', { ascending: false })
    .limit(1)
    .maybeSingle();

  if (data && !data.ended_at) {
    const elapsed = Math.floor((Date.now() - new Date(data.started_at).getTime()) / 1000);
    const MAX_DURATION = 5 * 60 * 60; // 5 horas em segundos

    if (elapsed >= MAX_DURATION) {
      // Passou de 5h — invalida a sessão (marca como expirada)
      await _sb.from('workout_sessions')
        .update({ ended_at: new Date(new Date(data.started_at).getTime() + MAX_DURATION * 1000).toISOString(), duration_seconds: null })
        .eq('id', data.id);
      // Mostra como se não tivesse sessão válida hoje
      showTimerExpired();
    } else {
      // Sessão em andamento válida
      currentSessionId = data.id;
      todaySessionId = data.id;
      sessionStartTime = new Date(data.started_at).getTime();
      pausedSeconds = data.paused_seconds || 0;
      pauseStartedAt = data.pause_started_at ? new Date(data.pause_started_at).getTime() : null;
      updateTimerDisplay();
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        updateTimerDisplay();
        // Verifica expiração em tempo real
        const now = Math.floor((Date.now() - sessionStartTime) / 1000);
        if (now >= MAX_DURATION) {
          stopWorkoutExpired();
        }
      }, 1000);
    }
  } else if (data && data.ended_at) {
    if (data.duration_seconds !== null) {
      // Encerrou normalmente
      todaySessionId = data.id;
      sessionEndDuration = data.duration_seconds;
      const marker = document.createElement('span');
      marker.className = 'session-ended';
      marker.style.display = 'none';
      document.body.appendChild(marker);
    } else {
      // Expirou (duration_seconds = null)
      showTimerExpired();
      updateTimerVisibility();
      return;
    }
  }

  updateTimerVisibility();
}

function showTimerExpired() {
  const row = document.getElementById('startWorkoutRow');
  row.style.display = 'flex';
  document.getElementById('timerStartBtn').style.display = 'none';
  document.getElementById('timerInline').style.display = 'inline';
  document.getElementById('timerDisplay').textContent = 'Expirado';
  document.getElementById('timerInline').style.color = '#888';

  // Mostra mensagem no final do dia
  const dayKey = planMode === 'cyclic' ? currentTabDay : getToday();
  const dayEl = document.getElementById('day-' + dayKey);
  if (dayEl && !dayEl.querySelector('.workout-done-msg')) {
    const div = document.createElement('div');
    div.className = 'workout-done-msg';
    div.style.color = '#888';
    div.textContent = '⚠️ Sessão expirada (não encerrada em 5h)';
    dayEl.appendChild(div);
  }
}

async function stopWorkoutExpired() {
  if (!currentSessionId) return;
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }

  // Marca como expirada (duration_seconds = null indica sessão inválida)
  await _sb.from('workout_sessions')
    .update({ ended_at: new Date().toISOString(), duration_seconds: null })
    .eq('id', currentSessionId);

  currentSessionId = null;
  sessionStartTime = null;
  pausedSeconds = 0;
  pauseStartedAt = null;
  showTimerExpired();
  updateTimerVisibility();
  showToast('Sessão expirada — passou de 5h sem encerrar.', true);
}

async function confirmStartWorkout() {
  if (!confirm('Iniciar o treino agora?')) return;
  startWorkoutSession();
}

async function startWorkoutSession() {
  const btn = document.getElementById('timerStartBtn');
  btn.disabled = true;
  const weekday = planMode === 'cyclic' ? (currentTabDay || getToday()) : getToday();

  const { data, error } = await _sb.from('workout_sessions')
    .insert(Object.assign({ student_id: studentId, weekday: weekday, started_at: new Date().toISOString() }, planStamp()))
    .select()
    .single();

  if (error) {
    showToast('Erro ao iniciar: ' + error.message, true);
    btn.disabled = false;
    return;
  }

  currentSessionId = data.id;
  todaySessionId = data.id;
  sessionStartTime = new Date(data.started_at).getTime();
  pausedSeconds = 0;
  pauseStartedAt = null;
  updateTimerDisplay();
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(updateTimerDisplay, 1000);
  updateTimerVisibility();
  showToast('Treino iniciado! Bom treino 💪');
}

async function pauseWorkout() {
  if (!currentSessionId || pauseStartedAt) return;
  const now = new Date().toISOString();
  const { error } = await _sb.from('workout_sessions')
    .update({ pause_started_at: now })
    .eq('id', currentSessionId);

  if (error) {
    showToast('Erro ao pausar: ' + error.message, true);
    return;
  }

  pauseStartedAt = new Date(now).getTime();
  updateTimerVisibility();
}

async function resumeWorkout() {
  if (!currentSessionId || !pauseStartedAt) return;
  const newPaused = pausedSeconds + Math.floor((Date.now() - pauseStartedAt) / 1000);
  const { error } = await _sb.from('workout_sessions')
    .update({ paused_seconds: newPaused, pause_started_at: null })
    .eq('id', currentSessionId);

  if (error) {
    showToast('Erro ao retomar: ' + error.message, true);
    return;
  }

  pausedSeconds = newPaused;
  pauseStartedAt = null;
  updateTimerVisibility();
}

async function stopWorkoutSession() {
  if (!currentSessionId) return;

  const endedAt = new Date().toISOString();
  let finalPaused = pausedSeconds;
  if (pauseStartedAt) finalPaused += Math.floor((Date.now() - pauseStartedAt) / 1000);
  const durationSeconds = Math.max(0, Math.floor((Date.now() - sessionStartTime) / 1000) - finalPaused);

  const { error } = await _sb.from('workout_sessions')
    .update({ ended_at: endedAt, duration_seconds: durationSeconds, paused_seconds: finalPaused, pause_started_at: null })
    .eq('id', currentSessionId);

  if (error) {
    showToast('Erro ao encerrar: ' + error.message, true);
    return;
  }

  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  sessionEndDuration = durationSeconds;
  const endedSessionId = currentSessionId;
  currentSessionId = null;
  sessionStartTime = null;
  pausedSeconds = 0;
  pauseStartedAt = null;

  // Marca como encerrado
  const marker = document.createElement('span');
  marker.className = 'session-ended';
  marker.style.display = 'none';
  document.body.appendChild(marker);

  updateTimerVisibility();
  showToast('Treino encerrado! ' + formatDuration(durationSeconds));
  openRatingModal(endedSessionId);
}

// === Nota do treino ao encerrar ===
let ratingSessionId = null;
let selectedRating = null;

function openRatingModal(sessionId) {
  ratingSessionId = sessionId;
  selectedRating = null;
  document.querySelectorAll('#ratingScale .rating-option').forEach(el => el.classList.remove('selected'));
  document.getElementById('ratingFeedback').value = '';
  document.getElementById('ratingModal').classList.add('show');
}

function closeRatingModal() {
  document.getElementById('ratingModal').classList.remove('show');
  ratingSessionId = null;
}

function selectRating(value) {
  selectedRating = value;
  document.querySelectorAll('#ratingScale .rating-option').forEach(el => {
    el.classList.toggle('selected', Number(el.dataset.value) === value);
  });
}

async function submitRating() {
  if (!ratingSessionId) { closeRatingModal(); return; }
  const feedbackText = document.getElementById('ratingFeedback').value.trim();

  if (selectedRating === null && !feedbackText) { closeRatingModal(); return; }

  const { error } = await _sb.from('workout_sessions')
    .update({ rating: selectedRating, feedback_text: feedbackText || null })
    .eq('id', ratingSessionId);

  if (error) {
    showToast('Erro ao salvar avaliação: ' + error.message, true);
    return;
  }

  closeRatingModal();
  showToast('Avaliação salva, obrigado!');
}

async function restartWorkout() {
  if (!confirm('Reiniciar o treino de hoje? O tempo registrado será apagado.')) return;

  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }

  if (todaySessionId) {
    const { error } = await _sb.from('workout_sessions').delete().eq('id', todaySessionId);
    if (error) {
      showToast('Erro ao reiniciar: ' + error.message, true);
      return;
    }
  }

  currentSessionId = null;
  todaySessionId = null;
  sessionStartTime = null;
  pausedSeconds = 0;
  pauseStartedAt = null;
  sessionEndDuration = 0;
  document.querySelectorAll('.session-ended').forEach(el => el.remove());
  updateTimerVisibility();
  showToast('Treino reiniciado.');
}

// === Anotações do professor ===
let trainerNoteContent  = '';
let trainerNoteUpdated  = '';

// Chave do "já vi esta orientação". Guardada por aluno porque o mesmo aparelho
// pode ser usado por mais de uma conta (celular emprestado na academia).
const noteSeenKey = () => 'noteSeen:' + studentId;

function markNoteAsSeen() {
  try { localStorage.setItem(noteSeenKey(), trainerNoteUpdated || '1'); } catch (e) {}
  document.getElementById('menuBtn').classList.remove('has-news');
  document.getElementById('drawerNoteItem').classList.remove('has-news');
}

async function loadTrainerNote() {
  try {
    const { data } = await _sb.from('trainer_notes')
      .select('content, updated_at')
      .eq('student_id', studentId)
      .maybeSingle();

    const item = document.getElementById('drawerNoteItem');
    const desc = document.getElementById('drawerNoteDesc');

    if (!data || !data.content || !data.content.trim()) {
      desc.textContent = 'Nenhuma orientação no momento';
      return;
    }

    trainerNoteContent = data.content;
    trainerNoteUpdated = data.updated_at || '';
    desc.textContent = trainerNoteUpdated
      ? 'Atualizado em ' + new Date(trainerNoteUpdated).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: '2-digit' })
      : 'Dieta, orientações e recados';

    // Orientação nova (ou nunca aberta) → ponto vermelho no hamburger.
    // O menu esconde as Orientações atrás de um toque; sem o aviso o aluno
    // perderia o recado do professor sem saber que existia.
    let seen = '';
    try { seen = localStorage.getItem(noteSeenKey()) || ''; } catch (e) {}
    if (seen !== (trainerNoteUpdated || '1')) {
      document.getElementById('menuBtn').classList.add('has-news');
      item.classList.add('has-news');
    }
  } catch (e) {
    console.log('Erro ao carregar orientações:', e);
  }
}

function renderNoteHtml(raw) {
  if (!raw || !raw.trim()) return '<p style="color:#555;text-align:center;padding:20px">Sem orientações no momento.</p>';
  const lines   = raw.split('\n');
  let html      = '<div class="note-render">';
  let inSection = false;

  function closeSection() {
    if (inSection) { html += '</div>'; inSection = false; }
  }

  lines.forEach(line => {
    if (/^#\s+/.test(line)) {
      closeSection();
      const title = line.replace(/^#+\s*/, '').trim();
      html += `<div class="note-section"><div class="note-section-title">${esc(title)}</div>`;
      inSection = true;
      return;
    }
    const trimmed = line.trim();
    if (!trimmed) { html += '<div class="note-spacer"></div>'; return; }
    if (/^[•*]\s+/.test(trimmed)) {
      html += `<div class="note-line bullet">${esc(trimmed.replace(/^[•*]\s+/, ''))}</div>`;
      return;
    }
    if (/^[-—]\s+/.test(trimmed)) {
      html += `<div class="note-line dash">${esc(trimmed.replace(/^[-—]\s+/, ''))}</div>`;
      return;
    }
    const numMatch = trimmed.match(/^(\d+)[.)]\s+(.*)/);
    if (numMatch) {
      html += `<div class="note-line num" data-num="${numMatch[1]}">${esc(numMatch[2])}</div>`;
      return;
    }
    html += `<div class="note-line">${esc(trimmed)}</div>`;
  });

  closeSection();
  html += '</div>';

  if (trainerNoteUpdated) {
    const d   = new Date(trainerNoteUpdated);
    const fmt = d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: '2-digit' }) + ' ' +
                d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    html += `<div class="note-modal-updated">Atualizado em ${fmt}</div>`;
  }

  return html;
}

function openNotesModal() {
  const modal = document.getElementById('notesModal');
  document.getElementById('notesModalBody').innerHTML = renderNoteHtml(trainerNoteContent);
  modal.classList.add('show');
  document.body.style.overflow = 'hidden';
  markNoteAsSeen();
}

  document.body.style.overflow = '';
}

function handleNotesModalClick(e) {

  if (e.target === document.getElementById('notesModal')) closeNotesModal();
}

// === Bloqueio ===
function showBlock(state) {
  hideLoading();
  document.getElementById('tabs').style.display = 'none';
  document.getElementById('content').style.display = 'none';
  // Sem acesso liberado, o menu não leva a nada útil (as telas de dentro
  // também bloqueiam) — melhor não oferecer.
  document.getElementById('menuBtn').style.display = 'none';
  const screen = document.getElementById('blockScreen');
  screen.classList.add('show');
  const map = {
    expired: { t: 'Período encerrado', p: 'Seu período de acompanhamento terminou. Fale com seu personal para renovar.' },
    unavailable: { t: 'Acesso indisponível', p: 'Seu acesso está indisponível no momento. Fale com seu personal.' },
    suspended: { t: 'Acesso suspenso', p: 'Seu acesso está suspenso. Entre em contato para regularizar.' }
  };
  const m = map[state] || map.unavailable;
  document.getElementById('blockTitle').textContent = m.t;
  document.getElementById('blockText').textContent = m.p;
}

// === Inicialização via auth-guard ===
guard('student', {
  onReady: async (session, profile) => {
    showLoading();
    studentId = profile.id;
    // Sincroniza tema do perfil (Supabase tem prioridade sobre localStorage)
    if (profile.app_theme) {
      // console.log('aaa', profile.app_theme)
      // localStorage.setItem('app-theme', profile.app_theme);
      const customTheme = localStorage.getItem('app-theme')
      document.documentElement.setAttribute('data-theme', customTheme);
    }

    // Header: saudação + academia + título do treino
    document.getElementById('greeting').textContent = 'Olá ' + (profile.full_name || '');
    if (profile.gym_name) document.getElementById('gymName').textContent = profile.gym_name;
    document.getElementById('drawerName').textContent = profile.full_name || 'Menu';
    document.getElementById('drawerSub').textContent = profile.gym_name || '';

    // Orientações e anamnese existem mesmo sem treino cadastrado, então o menu
    // é carregado antes de decidir o que mostrar no corpo da tela.
    loadTrainerNote();

    // Carrega plano ativo (com fallback resiliente)
    let plan = null;
    {
      let { data, error } = await _sb.from('workout_plans')
        .select('id, title, structure, plan_start_date, plan_end_date, mode, subtitles, cycle_sequence')
        .eq('student_id', studentId)
        .eq('is_active', true)
        .maybeSingle();

      if (error) {
        console.error('[MeuTreino] Erro ao carregar plano (tentativa 1):', error.message || error);
        // Fallback 1: erro de coluna inexistente (migration 17 não rodada) — tenta sem colunas novas
        if (error.message && (error.message.includes('column') || error.code === '42703')) {
          const fallback = await _sb.from('workout_plans')
            .select('id, title, structure, plan_start_date, plan_end_date')
            .eq('student_id', studentId)
            .eq('is_active', true)
            .maybeSingle();
          if (!fallback.error && fallback.data) {
            data = fallback.data;
            error = null;
            console.warn('[MeuTreino] Fallback sem colunas cíclicas funcionou. Rode a migration 17_cyclic_mode.sql no Supabase.');
          } else if (fallback.error) {
            console.error('[MeuTreino] Fallback também falhou:', fallback.error.message);
          }
        }
        // Fallback 2: múltiplos planos ativos (maybeSingle rejeita >1 row)
        if (error && error.message && error.message.includes('multiple')) {
          console.warn('[MeuTreino] Múltiplos planos ativos detectados, usando o mais recente.');
          const fallback = await _sb.from('workout_plans')
            .select('id, title, structure, plan_start_date, plan_end_date, mode, subtitles, cycle_sequence')
            .eq('student_id', studentId)
            .eq('is_active', true)
            .order('updated_at', { ascending: false })
            .limit(1);
          if (!fallback.error && fallback.data && fallback.data.length > 0) {
            data = fallback.data[0];
            error = null;
          } else if (fallback.error) {
            console.error('[MeuTreino] Fallback múltiplos também falhou:', fallback.error.message);
          }
        }
      }

      plan = data;
      if (!plan) {
        if (error) console.error('[MeuTreino] Plano não carregado. Erro final:', error.message || error);
        hideLoading();
        document.getElementById('content').innerHTML = '<div class="empty-state"><div class="empty-icon">📋</div><div class="empty-title">Nenhum treino disponível</div><div class="empty-text">Seu personal ainda não cadastrou um treino para você.<br>Aguarde ou entre em contato com ele.</div></div>';
        return;
      }
    }

    // Escopo do histórico: tudo que o aluno lê de volta é filtrado por este id.
    activePlanId = plan.id || null;
    planScoped = await detectPlanScope();

    if (plan.title) document.getElementById('planTitle').textContent = plan.title;

    // Exibe datas do plano no header (se existirem)
    if (plan.plan_start_date || plan.plan_end_date) {
      const fmt = (d) => { const [y,m,dd] = d.split('-'); return `${dd}/${m}`; };
      let datesText = '';
      if (plan.plan_start_date && plan.plan_end_date) {
        datesText = `${fmt(plan.plan_start_date)} — ${fmt(plan.plan_end_date)}`;
      } else if (plan.plan_start_date) {
        datesText = `Início: ${fmt(plan.plan_start_date)}`;
      } else {
        datesText = `Até: ${fmt(plan.plan_end_date)}`;
      }
      const datesEl = document.getElementById('planDates');
      datesEl.textContent = datesText;
      datesEl.classList.remove('hidden', 'expiring', 'expired');
      if (plan.plan_end_date) {
        const now = new Date();
        const end = new Date(plan.plan_end_date + 'T23:59:59');
        const daysLeft = Math.ceil((end - now) / (1000 * 60 * 60 * 24));
        if (end < now) datesEl.classList.add('expired');
        else if (daysLeft <= 7) datesEl.classList.add('expiring');
      }
    }
    WORKOUT = plan.structure || {};
    planMode = plan.mode || 'weekly';
    planSubtitles = plan.subtitles || {};
    planCycleSequence = Array.isArray(plan.cycle_sequence) ? plan.cycle_sequence : [];

    // Se o modo é cíclico mas a sequência está vazia, derivar das chaves do structure
    if (planMode === 'cyclic' && planCycleSequence.length === 0) {
      const keys = Object.keys(WORKOUT).filter(k => Array.isArray(WORKOUT[k]) && WORKOUT[k].length > 0);
      if (keys.length > 0) {
        planCycleSequence = [...keys, 'rest'];
        console.warn('[MeuTreino] cycle_sequence vazio, derivado do structure:', planCycleSequence);
      }
    }

    if (planMode === 'cyclic') {
      // Modo cíclico: determinar posição e renderizar menu
      await determineCyclicPosition();
      // Esconde tabs (o menu cíclico substitui)
      document.getElementById('tabs').style.display = 'none';
      renderCyclicView();
      currentTabDay = null;
      await loadTodaySession();
      hideLoading();
    } else {
      // Modo semanal: renderiza tabs normais com subtítulos
      const today = getToday();
      const days = ['Segunda','Terça','Quarta','Quinta','Sexta','Sábado','Domingo'];
      const tabsEl = document.getElementById('tabs');
      const contentEl = document.getElementById('content');

      days.forEach(day => {
        const tab = document.createElement('button');
        tab.className = 'tab' + (day === today ? ' active' : '');
        const subtitle = planSubtitles[day] || '';
        tab.textContent = day.substring(0, 3);
        if (subtitle) tab.title = subtitle;
        tab.onclick = () => {
          document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
          document.querySelectorAll('.day-content').forEach(d => d.classList.remove('active'));
          tab.classList.add('active');
          document.getElementById('day-' + day).classList.add('active');
          currentTabDay = day;
          updateTimerVisibility();
          loadTodayData(day);
        };
        tabsEl.appendChild(tab);

        const div = document.createElement('div');
        div.className = 'day-content' + (day === today ? ' active today-tab' : '');
        div.id = 'day-' + day;
        // Adiciona subtítulo acima dos exercícios
        let dayHtml = '';
        if (subtitle) dayHtml += `<div class="cyclic-day-subtitle">${esc(subtitle)}</div>`;
        dayHtml += renderDay(day);
        div.innerHTML = dayHtml;
        contentEl.appendChild(div);
      });

      loadTodayData(today);
      currentTabDay = today;
      await loadTodaySession();
      hideLoading();
    }
  },
  onBlocked: showBlock
});

if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }
