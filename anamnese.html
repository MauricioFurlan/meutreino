<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Anamnese</title>
  <meta name="theme-color" content="#f5c518">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; connect-src 'self' https://qslvwyhpamazoqhcmqan.supabase.co blob:; img-src 'self' data:;">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body::-webkit-scrollbar, *::-webkit-scrollbar { display: none; }
    body, * { scrollbar-width: none; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0d0d0d; color: #f0f0f0; min-height: 100vh; padding-bottom: 40px;
    }
    .header { background: #1a1a1a; padding: 16px; text-align: center; border-bottom: 1px solid #333; position: relative; }
    .header h1 { font-size: 1.1rem; color: #f5c518; }
    .header .subtitle { font-size: 0.8rem; color: #999; margin-top: 4px; }
    .nav-btn { position: absolute; top: 14px; background: none; border: 1px solid #555; color: #999; font-size: 0.65rem; padding: 4px 10px; border-radius: 12px; cursor: pointer; }
    .nav-btn.left { left: 14px; }
    .nav-btn.right { right: 14px; }
    .nav-btn:active { opacity: 0.6; }

    .tabs { display: flex; gap: 4px; padding: 12px; background: #1a1a1a; border-bottom: 1px solid #333; }
    .tab { flex: 1; padding: 10px 8px; border-radius: 20px; background: #2a2a2a; color: #888; font-size: 0.75rem; font-weight: 600; cursor: pointer; border: none; text-align: center; }
    .tab.active { background: #f5c518; color: #000; }

    .panel { display: none; padding: 12px; overflow: hidden; }
    .panel.active { display: block; }

    .info-bar { background: #1a1a1a; border: 1px solid #333; border-radius: 10px; padding: 12px; margin-bottom: 16px; display: flex; gap: 16px; flex-wrap: wrap; }
    .info-item { font-size: 0.75rem; color: #999; }
    .info-item strong { color: #f5c518; }

    /* Formulário */
    .form-card { background: #1a1a1a; border: 1px solid #333; border-radius: 12px; padding: 14px; margin-bottom: 12px; overflow: hidden; }
    .form-card h3 { font-size: 0.8rem; color: #f5c518; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
    .field { display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
    .field label { font-size: 0.65rem; color: #888; margin-bottom: 3px; text-transform: uppercase; font-weight: 600; }
    .field input, .field textarea, .field select {
      padding: 10px 8px; border-radius: 8px; border: 1px solid #333; background: #0d0d0d; color: #fff; font-size: 16px;
      width: 100%; max-width: 100%; min-width: 0; box-sizing: border-box;
    }
    .field input:focus, .field textarea:focus { outline: none; border-color: #f5c518; }
    .field textarea { resize: vertical; min-height: 60px; }
    .field-full { grid-column: 1 / -1; }
    .submit-btn { width: 100%; padding: 14px; border: none; border-radius: 10px; background: #f5c518; color: #000; font-weight: 700; font-size: 0.9rem; cursor: pointer; margin-top: 8px; }
    .submit-btn:disabled { opacity: 0.5; }
    .submit-btn:active { opacity: 0.7; }

    /* Timeline */
    .timeline-item { background: #1a1a1a; border: 1px solid #333; border-radius: 10px; padding: 14px; margin-bottom: 10px; cursor: pointer; }
    .timeline-item:active { border-color: #f5c518; }
    .timeline-date { font-size: 0.8rem; color: #f5c518; font-weight: 700; }
    .timeline-summary { font-size: 0.75rem; color: #999; margin-top: 4px; }

    /* Gráficos */
    .chart-selector { margin-bottom: 12px; }
    .chart-selector label { font-size: 0.7rem; color: #888; text-transform: uppercase; font-weight: 600; margin-bottom: 6px; display: block; letter-spacing: 0.5px; }
    .chart-selector .select-wrap { position: relative; }
    .chart-selector .select-wrap::before {
      content: '📊';
      position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
      font-size: 1rem; pointer-events: none; z-index: 1;
    }
    .chart-selector .select-wrap::after {
      content: '▼';
      position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
      font-size: 0.65rem; color: #f5c518; pointer-events: none; z-index: 1;
    }
    .chart-selector select {
      padding: 14px 36px 14px 40px; border-radius: 10px; border: 1px solid #f5c518;
      background: #1a1a1a; color: #fff; font-size: 0.9rem; font-weight: 600;
      width: 100%; box-sizing: border-box; cursor: pointer;
      -webkit-appearance: none; -moz-appearance: none; appearance: none;
    }
    .chart-selector select:focus { outline: none; border-color: #f5c518; box-shadow: 0 0 0 2px rgba(245,197,24,0.2); }
    .chart-container { background: #1a1a1a; border: 1px solid #333; border-radius: 12px; padding: 12px; }
    canvas { max-height: 280px; }

    .empty-state { text-align: center; padding: 30px; color: #666; font-size: 0.85rem; }
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #f5c518; color: #000; padding: 10px 20px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; display: none; z-index: 1000; }
    .toast.error { background: #f44336; color: #fff; }
    .toast.show { display: block; animation: fadeOut 2.5s forwards; }
    @keyframes fadeOut { 0%,70% { opacity: 1; } 100% { opacity: 0; } }

    .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.9); z-index: 1000; align-items: center; justify-content: center; padding: 16px; }
    .modal.show { display: flex; }
    .modal-content { background: #1a1a1a; border-radius: 12px; padding: 20px; width: 100%; max-width: 400px; border: 1px solid #333; }
    .modal-content h3 { color: #f5c518; font-size: 0.9rem; margin-bottom: 14px; }
    .modal-close { width: 100%; padding: 10px; border: none; border-radius: 8px; background: #2a2a2a; color: #999; font-weight: 600; font-size: 0.85rem; cursor: pointer; margin-top: 12px; }
    .detail-section { margin-bottom: 12px; }
    .detail-section h4 { font-size: 0.75rem; color: #f5c518; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
    .detail-row { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid #222; }
    .detail-row .label { font-size: 0.78rem; color: #999; }
    .detail-row .value { font-size: 0.78rem; color: #f0f0f0; font-weight: 600; }

    /* Loading overlay */
    .loading-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(13,13,13,0.92); z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 16px; transition: opacity 0.3s;
    }
    .loading-overlay.hidden { opacity: 0; pointer-events: none; }
    .loading-spinner {
      width: 44px; height: 44px; border: 3px solid #333;
      border-top-color: #f5c518; border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { color: #999; font-size: 0.8rem; font-weight: 500; letter-spacing: 0.5px; }
  </style>
</head>
<body>
  <div class="loading-overlay" id="loadingOverlay">
    <div class="loading-spinner"></div>
    <div class="loading-text">Carregando...</div>
  </div>

  <div class="header">
    <button class="nav-btn left" onclick="location.href='professor.html'">← Voltar</button>
    <h1>Anamnese</h1>
    <div class="subtitle" id="studentName"></div>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('form')">Nova Avaliação</button>
    <button class="tab" onclick="switchTab('history')">Histórico</button>
    <button class="tab" onclick="switchTab('charts')">Evolução</button>
  </div>

  <!-- Info do aluno -->
  <div style="padding:12px 16px 0;">
    <div class="info-bar" id="infoBar"></div>
  </div>

  <!-- Nova Avaliação -->
  <div class="panel active" id="panel-form">
    <form id="assessmentForm" onsubmit="saveAssessment(event)">
      <div class="form-card">
        <h3>📅 Dados gerais</h3>
        <div class="field-row">
          <div class="field"><label>Data</label><input type="date" id="fDate" required></div>
          <div class="field"><label>Objetivo</label><input type="text" id="fObj" placeholder="Ex: Hipertrofia"></div>
        </div>
      </div>

      <div class="form-card">
        <h3>📏 Antropometria</h3>
        <div class="field-row">
          <div class="field"><label>Peso (kg)</label><input type="number" step="0.1" id="fPeso" inputmode="decimal"></div>
          <div class="field"><label>Altura (cm)</label><input type="number" step="0.1" id="fAltura" inputmode="decimal"></div>
        </div>
      </div>

      <div class="form-card">
        <h3>📐 Circunferências (cm)</h3>
        <div class="field-row">
          <div class="field"><label>Cintura</label><input type="number" step="0.1" id="fCintura" inputmode="decimal"></div>
          <div class="field"><label>Abdômen</label><input type="number" step="0.1" id="fAbdomen" inputmode="decimal"></div>
        </div>
        <div class="field-row">
          <div class="field"><label>Quadril</label><input type="number" step="0.1" id="fQuadril" inputmode="decimal"></div>
          <div class="field"><label>Tórax</label><input type="number" step="0.1" id="fTorax" inputmode="decimal"></div>
        </div>
        <div class="field-row">
          <div class="field"><label>Ombro</label><input type="number" step="0.1" id="fOmbro" inputmode="decimal"></div>
        </div>
        <div class="field-row">
          <div class="field"><label>Braço D relaxado</label><input type="number" step="0.1" id="fBracoDR" inputmode="decimal"></div>
          <div class="field"><label>Braço D contraído</label><input type="number" step="0.1" id="fBracoDC" inputmode="decimal"></div>
        </div>
        <div class="field-row">
          <div class="field"><label>Braço E relaxado</label><input type="number" step="0.1" id="fBracoER" inputmode="decimal"></div>
          <div class="field"><label>Braço E contraído</label><input type="number" step="0.1" id="fBracoEC" inputmode="decimal"></div>
        </div>
        <div class="field-row">
          <div class="field"><label>Antebraço D</label><input type="number" step="0.1" id="fAntebD" inputmode="decimal"></div>
          <div class="field"><label>Antebraço E</label><input type="number" step="0.1" id="fAntebE" inputmode="decimal"></div>
        </div>
        <div class="field-row">
          <div class="field"><label>Coxa D</label><input type="number" step="0.1" id="fCoxaD" inputmode="decimal"></div>
          <div class="field"><label>Coxa E</label><input type="number" step="0.1" id="fCoxaE" inputmode="decimal"></div>
        </div>
        <div class="field-row">
          <div class="field"><label>Panturrilha D</label><input type="number" step="0.1" id="fPantD" inputmode="decimal"></div>
          <div class="field"><label>Panturrilha E</label><input type="number" step="0.1" id="fPantE" inputmode="decimal"></div>
        </div>
      </div>

      <div class="form-card">
        <h3>📎 Dobras cutâneas (mm)</h3>
        <div class="field-row">
          <div class="field"><label>Tríceps</label><input type="number" step="0.1" id="fDTriceps" inputmode="decimal"></div>
          <div class="field"><label>Subescapular</label><input type="number" step="0.1" id="fDSubesc" inputmode="decimal"></div>
        </div>
        <div class="field-row">
          <div class="field"><label>Supra-ilíaca</label><input type="number" step="0.1" id="fDSupra" inputmode="decimal"></div>
          <div class="field"><label>Abdominal</label><input type="number" step="0.1" id="fDAbdom" inputmode="decimal"></div>
        </div>
        <div class="field-row">
          <div class="field"><label>Coxa</label><input type="number" step="0.1" id="fDCoxa" inputmode="decimal"></div>
          <div class="field"><label>Axilar média</label><input type="number" step="0.1" id="fDAxilar" inputmode="decimal"></div>
        </div>
        <div class="field-row">
          <div class="field"><label>Torácica</label><input type="number" step="0.1" id="fDToracica" inputmode="decimal"></div>
        </div>
      </div>

      <div class="form-card">
        <h3>⚖️ Composição corporal</h3>
        <div class="field-row">
          <div class="field"><label>% Gordura</label><input type="number" step="0.1" id="fGord" inputmode="decimal"></div>
          <div class="field"><label>% Massa magra (auto)</label><input type="text" id="fMagraPerc" readonly placeholder="calculado" style="color:#f5c518;"></div>
        </div>
        <div class="field-row">
          <div class="field"><label>Massa magra (kg)</label><input type="number" step="0.1" id="fMagra" inputmode="decimal"></div>
          <div class="field"><label>Massa gorda (kg)</label><input type="number" step="0.1" id="fGorda" inputmode="decimal"></div>
        </div>
        <div class="field-row">
          <div class="field"><label>IMC (auto)</label><input type="text" id="fIMC" readonly placeholder="calculado" style="color:#f5c518;"></div>
        </div>
      </div>

      <div class="form-card">
        <h3>🏥 Saúde</h3>
        <div class="field-row">
          <div class="field field-full"><label>Lesões / Cirurgias</label><textarea id="fLesoes" placeholder="Descreva se houver"></textarea></div>
        </div>
        <div class="field-row">
          <div class="field field-full"><label>Medicamentos</label><textarea id="fMeds" placeholder="Quais?"></textarea></div>
        </div>
        <div class="field-row">
          <div class="field field-full"><label>Restrições / Limitações</label><textarea id="fRestr" placeholder="Movimentos que não pode fazer, etc."></textarea></div>
        </div>
        <div class="field-row">
          <div class="field"><label>Nível de atividade</label>
            <select id="fNivel"><option value="">-</option><option>Sedentário</option><option>Leve</option><option>Moderado</option><option>Ativo</option><option>Muito ativo</option></select>
          </div>
        </div>
      </div>

      <div class="form-card">
        <h3>📝 Observações</h3>
        <div class="field-row">
          <div class="field field-full"><textarea id="fObs" placeholder="Observações gerais..."></textarea></div>
        </div>
      </div>

      <button type="submit" class="submit-btn" id="saveBtn">Salvar Avaliação</button>
      <button type="button" class="modal-close" id="cancelEditBtn" style="display:none; margin-top:8px;" onclick="cancelEdit(); document.getElementById('assessmentForm').reset(); populatePlaceholders();">Cancelar edição</button>
    </form>
  </div>

  <!-- Histórico -->
  <div class="panel" id="panel-history">
    <div id="historyList"></div>
  </div>

  <!-- Gráficos -->
  <div class="panel" id="panel-charts">
    <div class="chart-selector">
      <label>Selecione a métrica</label>
      <div class="select-wrap">
        <select id="chartMetric" onchange="renderChart()">
          <option value="peso">Peso (kg)</option>
          <option value="gordura">% Gordura</option>
          <option value="massa_magra">Massa magra (kg)</option>
          <option value="massa_magra_perc">% Massa magra</option>
          <option value="massa_gorda">Massa gorda (kg)</option>
          <option value="imc">IMC</option>
          <option value="cintura">Cintura (cm)</option>
          <option value="abdomen">Abdômen (cm)</option>
          <option value="quadril">Quadril (cm)</option>
          <option value="ombro">Ombro (cm)</option>
          <option value="torax">Tórax (cm)</option>
          <option value="braco_d_relaxado">Braço D relaxado (cm)</option>
          <option value="braco_d_contraido">Braço D contraído (cm)</option>
          <option value="braco_e_relaxado">Braço E relaxado (cm)</option>
          <option value="braco_e_contraido">Braço E contraído (cm)</option>
          <option value="antebraco_d">Antebraço D (cm)</option>
          <option value="antebraco_e">Antebraço E (cm)</option>
          <option value="coxa_d">Coxa D (cm)</option>
          <option value="coxa_e">Coxa E (cm)</option>
          <option value="panturrilha_d">Panturrilha D (cm)</option>
          <option value="panturrilha_e">Panturrilha E (cm)</option>
        </select>
      </div>
    </div>
    <div class="chart-container"><canvas id="evolutionChart"></canvas></div>
  </div>

  <!-- Modal detalhe avaliação -->
  <div class="modal" id="detailModal">
    <div class="modal-content" style="max-height:85vh; overflow-y:auto;">
      <h3 id="detailTitle">Avaliação</h3>
      <div id="detailBody"></div>
      <div style="display:flex; gap:8px; margin-top:12px;">
        <button class="submit-btn" style="flex:1;" onclick="generatePDF()">📄 PDF</button>
        <button class="submit-btn" style="flex:1; background:#2196F3;" onclick="editAssessment()">✏️ Editar</button>
        <button class="submit-btn" style="flex:1; background:#f44336;" onclick="deleteAssessment()">🗑️ Excluir</button>
      </div>
      <button class="modal-close" onclick="document.getElementById('detailModal').classList.remove('show')">Fechar</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth-guard.js"></script>
<script>
let studentId = null, coachId = null, assessments = [];
let chartInstance = null;
let studentInfo = null; // dados do aluno para o PDF
let currentAssessmentId = null; // avaliação aberta no modal
let editingId = null; // se !== null, estamos editando ao invés de criando

function showLoading() { document.getElementById('loadingOverlay').classList.remove('hidden'); }
function hideLoading() { document.getElementById('loadingOverlay').classList.add('hidden'); }

const esc = (s) => { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; };
function showToast(t, err) { const e = document.getElementById('toast'); e.textContent = t; e.className = 'toast show' + (err ? ' error' : ''); setTimeout(() => e.className = 'toast', 2500); }

// === Tabs ===
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.classList.toggle('active', t.textContent.toLowerCase().includes(tab === 'form' ? 'nova' : tab === 'history' ? 'hist' : 'evol'));
  });
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById('panel-' + tab).classList.add('active');
  if (tab === 'history') loadHistory();
  if (tab === 'charts') renderChart();
}

// === IMC automático ===
// === IMC e % Massa Magra automáticos ===
document.addEventListener('input', (e) => {
  if (e.target.id === 'fPeso' || e.target.id === 'fAltura') {
    const peso = parseFloat(document.getElementById('fPeso').value);
    const alt = parseFloat(document.getElementById('fAltura').value);
    if (peso > 0 && alt > 0) {
      const imc = (peso / ((alt / 100) ** 2)).toFixed(1);
      document.getElementById('fIMC').value = imc;
    }
  }
  if (e.target.id === 'fGord') {
    const gordura = parseFloat(document.getElementById('fGord').value);
    if (gordura >= 0 && gordura <= 100) {
      document.getElementById('fMagraPerc').value = (100 - gordura).toFixed(1);
    }
  }
});

// === Calcular idade ===
function calcAge(birthDate) {
  if (!birthDate) return null;
  const today = new Date();
  const b = new Date(birthDate + 'T00:00:00');
  let age = today.getFullYear() - b.getFullYear();
  const m = today.getMonth() - b.getMonth();
  if (m < 0 || (m === 0 && today.getDate() < b.getDate())) age--;
  return age;
}

// === Coletar dados do formulário ===
function collectFormData() {
  const v = (id) => { const el = document.getElementById(id); return el.value.trim() || null; };
  const n = (id) => { const val = parseFloat(document.getElementById(id).value); return isNaN(val) ? null : val; };
  return {
    objetivo: v('fObj'),
    peso: n('fPeso'), altura: n('fAltura'), imc: n('fIMC'),
    circunferencias: { cintura: n('fCintura'), abdomen: n('fAbdomen'), quadril: n('fQuadril'), torax: n('fTorax'), ombro: n('fOmbro'), braco_d_relaxado: n('fBracoDR'), braco_d_contraido: n('fBracoDC'), braco_e_relaxado: n('fBracoER'), braco_e_contraido: n('fBracoEC'), antebraco_d: n('fAntebD'), antebraco_e: n('fAntebE'), coxa_d: n('fCoxaD'), coxa_e: n('fCoxaE'), panturrilha_d: n('fPantD'), panturrilha_e: n('fPantE') },
    dobras: { triceps: n('fDTriceps'), subescapular: n('fDSubesc'), suprailiaca: n('fDSupra'), abdominal: n('fDAbdom'), coxa: n('fDCoxa'), axilar_media: n('fDAxilar'), toracica: n('fDToracica') },
    composicao: { gordura: n('fGord'), massa_magra: n('fMagra'), massa_gorda: n('fGorda'), massa_magra_perc: n('fMagraPerc') },
    saude: { lesoes: v('fLesoes'), medicamentos: v('fMeds'), restricoes: v('fRestr'), nivel_atividade: v('fNivel') },
    observacoes: v('fObs')
  };
}

// === Salvar (insert ou update) ===
async function saveAssessment(e) {
  e.preventDefault();
  const date = document.getElementById('fDate').value;
  if (!date) { showToast('Informe a data.', true); return; }
  const data = collectFormData();
  const btn = document.getElementById('saveBtn');
  btn.disabled = true;

  let error;
  if (editingId) {
    // Modo edição: update
    ({ error } = await _sb.from('assessments').update({ assessment_date: date, data }).eq('id', editingId));
  } else {
    // Modo criação: insert
    ({ error } = await _sb.from('assessments').insert({ student_id: studentId, coach_id: coachId, assessment_date: date, data }));
  }

  btn.disabled = false;
  if (error) { showToast('Erro: ' + error.message, true); return; }
  showToast(editingId ? 'Avaliação atualizada!' : 'Avaliação salva!');
  cancelEdit();
  document.getElementById('assessmentForm').reset();
  await loadAssessments();
  populatePlaceholders();
}

// === Cancelar edição (volta ao modo criação) ===
function cancelEdit() {
  editingId = null;
  document.getElementById('saveBtn').textContent = 'Salvar Avaliação';
  const cancelBtn = document.getElementById('cancelEditBtn');
  if (cancelBtn) cancelBtn.style.display = 'none';
}

// === Excluir avaliação ===
async function deleteAssessment() {
  if (!currentAssessmentId) return;
  if (!confirm('Tem certeza que deseja excluir esta avaliação? Essa ação não pode ser desfeita.')) return;
  const { error } = await _sb.from('assessments').delete().eq('id', currentAssessmentId);
  if (error) { showToast('Erro ao excluir: ' + error.message, true); return; }
  document.getElementById('detailModal').classList.remove('show');
  showToast('Avaliação excluída.');
  await loadAssessments();
  populatePlaceholders();
  loadHistory();
}

// === Carregar avaliações ===
async function loadAssessments() {
  const { data, error } = await _sb.from('assessments')
    .select('*').eq('student_id', studentId)
    .order('assessment_date', { ascending: true });
  if (!error) assessments = data || [];
}

// === Histórico ===
async function loadHistory() {
  if (assessments.length === 0) await loadAssessments();
  const container = document.getElementById('historyList');
  if (assessments.length === 0) { container.innerHTML = '<div class="empty-state">Nenhuma avaliação registrada.</div>'; return; }
  container.innerHTML = [...assessments].reverse().map(a => {
    const d = a.data || {};
    const summary = [d.peso ? d.peso + 'kg' : null, d.composicao?.gordura ? d.composicao.gordura + '% gord' : null, d.objetivo].filter(Boolean).join(' · ');
    return `<div class="timeline-item" onclick="viewAssessment('${a.id}')">
      <div class="timeline-date">${new Date(a.assessment_date + 'T00:00:00').toLocaleDateString('pt-BR')}</div>
      <div class="timeline-summary">${esc(summary) || 'Avaliação registrada'}</div>
    </div>`;
  }).join('');
}

function viewAssessment(id) {
  currentAssessmentId = id;
  const a = assessments.find(x => x.id === id);
  if (!a) return;
  const d = a.data || {};
  const c = d.circunferencias || {};
  const db = d.dobras || {};
  const comp = d.composicao || {};
  const saude = d.saude || {};

  const dateStr = new Date(a.assessment_date + 'T00:00:00').toLocaleDateString('pt-BR');
  document.getElementById('detailTitle').textContent = 'Avaliação — ' + dateStr;

  function row(label, value, unit) {
    if (value == null || value === '') return '';
    return `<div class="detail-row"><span class="label">${esc(label)}</span><span class="value">${esc(String(value))}${unit ? ' ' + esc(unit) : ''}</span></div>`;
  }

  function section(title, rows) {
    const content = rows.join('');
    if (!content) return '';
    return `<div class="detail-section"><h4>${esc(title)}</h4>${content}</div>`;
  }

  let html = '';

  html += section('Dados gerais', [
    row('Objetivo', d.objetivo),
    row('Peso', d.peso, 'kg'),
    row('Altura', d.altura, 'cm'),
    row('IMC', d.imc)
  ]);

  html += section('Circunferências (cm)', [
    row('Cintura', c.cintura),
    row('Abdômen', c.abdomen),
    row('Quadril', c.quadril),
    row('Tórax', c.torax),
    row('Ombro', c.ombro),
    row('Braço D relaxado', c.braco_d_relaxado),
    row('Braço D contraído', c.braco_d_contraido),
    row('Braço E relaxado', c.braco_e_relaxado),
    row('Braço E contraído', c.braco_e_contraido),
    row('Antebraço D', c.antebraco_d),
    row('Antebraço E', c.antebraco_e),
    row('Coxa D', c.coxa_d),
    row('Coxa E', c.coxa_e),
    row('Panturrilha D', c.panturrilha_d),
    row('Panturrilha E', c.panturrilha_e)
  ]);

  html += section('Dobras cutâneas (mm)', [
    row('Tríceps', db.triceps),
    row('Subescapular', db.subescapular),
    row('Supra-ilíaca', db.supra_iliaca),
    row('Abdominal', db.abdominal),
    row('Coxa', db.coxa),
    row('Axilar média', db.axilar_media),
    row('Torácica', db.toracica)
  ]);

  html += section('Composição corporal', [
    row('% Gordura', comp.gordura, '%'),
    row('Massa magra', comp.massa_magra, 'kg'),
    row('Massa gorda', comp.massa_gorda, 'kg')
  ]);

  html += section('Saúde', [
    row('Lesões / Cirurgias', saude.lesoes),
    row('Medicamentos', saude.medicamentos),
    row('Restrições', saude.restricoes),
    row('Nível de atividade', saude.nivel_atividade)
  ]);

  if (d.observacoes) {
    html += section('Observações', [
      `<div class="detail-row"><span class="value" style="color:#ccc; font-weight:400;">${esc(d.observacoes)}</span></div>`
    ]);
  }

  if (!html) html = '<div class="empty-state">Nenhum dado registrado nesta avaliação.</div>';

  document.getElementById('detailBody').innerHTML = html;
  document.getElementById('detailModal').classList.add('show');
}

// === Gráficos ===
function getMetricValues(metric) {
  return assessments.map(a => {
    const d = a.data || {};
    let value;
    switch (metric) {
      case 'peso': value = d.peso; break;
      case 'gordura': value = d.composicao?.gordura; break;
      case 'massa_magra': value = d.composicao?.massa_magra; break;
      case 'massa_magra_perc': value = d.composicao?.massa_magra_perc || (d.composicao?.gordura ? 100 - d.composicao.gordura : null); break;
      case 'massa_gorda': value = d.composicao?.massa_gorda; break;
      case 'imc': value = d.imc; break;
      case 'cintura': value = d.circunferencias?.cintura; break;
      case 'abdomen': value = d.circunferencias?.abdomen; break;
      case 'quadril': value = d.circunferencias?.quadril; break;
      case 'ombro': value = d.circunferencias?.ombro; break;
      case 'braco_d_relaxado': value = d.circunferencias?.braco_d_relaxado; break;
      case 'braco_d_contraido': value = d.circunferencias?.braco_d_contraido; break;
      case 'braco_e_relaxado': value = d.circunferencias?.braco_e_relaxado; break;
      case 'braco_e_contraido': value = d.circunferencias?.braco_e_contraido; break;
      case 'antebraco_d': value = d.circunferencias?.antebraco_d; break;
      case 'antebraco_e': value = d.circunferencias?.antebraco_e; break;
      case 'coxa_d': value = d.circunferencias?.coxa_d; break;
      case 'coxa_e': value = d.circunferencias?.coxa_e; break;
      case 'panturrilha_d': value = d.circunferencias?.panturrilha_d; break;
      case 'panturrilha_e': value = d.circunferencias?.panturrilha_e; break;
      case 'torax': value = d.circunferencias?.torax; break;
      default: value = null;
    }
    const num = parseFloat(value);
    return { date: a.assessment_date, value: isNaN(num) ? null : num };
  }).filter(p => p.value !== null);
}

function renderChart() {
  if (assessments.length === 0) { loadAssessments().then(() => renderChart()); return; }
  const metric = document.getElementById('chartMetric').value;
  const points = getMetricValues(metric);
  const canvas = document.getElementById('evolutionChart');

  if (chartInstance) chartInstance.destroy();

  if (points.length === 0) {
    canvas.parentElement.innerHTML = '<div class="empty-state" style="padding:40px;">Sem dados para esta métrica.</div><canvas id="evolutionChart"></canvas>';
    return;
  }

  const labels = points.map(p => new Date(p.date + 'T00:00:00').toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' }));
  const values = points.map(p => p.value);
  const label = document.getElementById('chartMetric').selectedOptions[0].text;

  chartInstance = new Chart(canvas, {
    type: 'line',
    data: {
      labels,
      datasets: [{ label, data: values, borderColor: '#f5c518', backgroundColor: 'rgba(245,197,24,0.1)', tension: 0.3, fill: true, pointRadius: 5, pointBackgroundColor: '#f5c518' }]
    },
    options: {
      responsive: true,
      plugins: { legend: { labels: { color: '#ccc' } } },
      scales: {
        x: { ticks: { color: '#888' }, grid: { color: '#222' } },
        y: { ticks: { color: '#888' }, grid: { color: '#222' } }
      }
    }
  });
}

// === Gerar PDF da avaliação ===
function generatePDF() {
  const a = assessments.find(x => x.id === currentAssessmentId);
  if (!a) { showToast('Nenhuma avaliação selecionada.', true); return; }

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF('p', 'mm', 'a4');
  const d = a.data || {};
  const c = d.circunferencias || {};
  const db = d.dobras || {};
  const comp = d.composicao || {};
  const saude = d.saude || {};
  const dateStr = new Date(a.assessment_date + 'T00:00:00').toLocaleDateString('pt-BR');

  const pageW = 210;
  const marginL = 15;
  const marginR = 195;
  let y = 15;

  // === Cabeçalho ===
  doc.setFontSize(16);
  doc.setFont('helvetica', 'bold');
  doc.text('AVALIAÇÃO FÍSICA', pageW / 2, y, { align: 'center' });
  y += 8;
  doc.setFontSize(9);
  doc.setFont('helvetica', 'normal');
  doc.text('Data: ' + dateStr, marginR, y, { align: 'right' });
  y += 6;

  // Linha separadora
  doc.setDrawColor(200); doc.line(marginL, y, marginR, y); y += 6;

  // === Dados pessoais ===
  doc.setFontSize(11); doc.setFont('helvetica', 'bold'); doc.setTextColor(40);
  doc.text('DADOS PESSOAIS', marginL, y); y += 6;
  doc.setFontSize(9); doc.setFont('helvetica', 'normal'); doc.setTextColor(60);

  const nome = studentInfo?.full_name || '-';
  const idade = calcAge(studentInfo?.birth_date);
  const sexo = studentInfo?.sex === 'M' ? 'Masculino' : studentInfo?.sex === 'F' ? 'Feminino' : '-';
  const nascimento = studentInfo?.birth_date ? new Date(studentInfo.birth_date + 'T00:00:00').toLocaleDateString('pt-BR') : '-';

  doc.text(`Nome: ${nome}`, marginL, y); y += 5;
  doc.text(`Idade: ${idade || '-'}`, marginL, y);
  doc.text(`Sexo: ${sexo}`, marginL + 50, y);
  doc.text(`Nascimento: ${nascimento}`, marginL + 100, y); y += 5;
  if (d.objetivo) { doc.text(`Objetivo: ${d.objetivo}`, marginL, y); y += 5; }
  y += 3;

  // === Antropometria ===
  if (d.peso || d.altura || d.imc) {
    doc.setDrawColor(200); doc.line(marginL, y, marginR, y); y += 5;
    doc.setFontSize(11); doc.setFont('helvetica', 'bold'); doc.setTextColor(40);
    doc.text('ANTROPOMETRIA', marginL, y); y += 6;
    doc.setFontSize(9); doc.setFont('helvetica', 'normal'); doc.setTextColor(60);
    const items = [];
    if (d.peso) items.push('Peso: ' + d.peso + ' kg');
    if (d.altura) items.push('Altura: ' + d.altura + ' cm');
    if (d.imc) items.push('IMC: ' + d.imc);
    doc.text(items.join('    |    '), marginL, y); y += 7;
  }

  // === Circunferências ===
  function hasValues(obj) { return Object.values(obj).some(v => v != null && v !== ''); }
  if (hasValues(c)) {
    doc.setDrawColor(200); doc.line(marginL, y, marginR, y); y += 5;
    doc.setFontSize(11); doc.setFont('helvetica', 'bold'); doc.setTextColor(40);
    doc.text('CIRCUNFERÊNCIAS (cm)', marginL, y); y += 6;
    doc.setFontSize(9); doc.setFont('helvetica', 'normal'); doc.setTextColor(60);

    const circRows = [
      ['Cintura', c.cintura, 'Abdômen', c.abdomen],
      ['Quadril', c.quadril, 'Tórax', c.torax],
      ['Ombro', c.ombro, '', ''],
      ['Braço D relax.', c.braco_d_relaxado, 'Braço D contr.', c.braco_d_contraido],
      ['Braço E relax.', c.braco_e_relaxado, 'Braço E contr.', c.braco_e_contraido],
      ['Antebraço D', c.antebraco_d, 'Antebraço E', c.antebraco_e],
      ['Coxa D', c.coxa_d, 'Coxa E', c.coxa_e],
      ['Panturrilha D', c.panturrilha_d, 'Panturrilha E', c.panturrilha_e]
    ];
    circRows.forEach(row => {
      if (row[1] == null && row[3] == null) return;
      let line = '';
      if (row[0] && row[1] != null) line += `${row[0]}: ${row[1]}`;
      if (row[2] && row[3] != null) line += `    |    ${row[2]}: ${row[3]}`;
      if (line) { doc.text(line, marginL, y); y += 4.5; }
    });
    y += 2;
  }

  // === Dobras cutâneas ===
  if (hasValues(db)) {
    if (y > 250) { doc.addPage(); y = 15; }
    doc.setDrawColor(200); doc.line(marginL, y, marginR, y); y += 5;
    doc.setFontSize(11); doc.setFont('helvetica', 'bold'); doc.setTextColor(40);
    doc.text('DOBRAS CUTÂNEAS (mm)', marginL, y); y += 6;
    doc.setFontSize(9); doc.setFont('helvetica', 'normal'); doc.setTextColor(60);

    const dobraRows = [
      ['Tríceps', db.triceps, 'Subescapular', db.subescapular],
      ['Supra-ilíaca', db.supra_iliaca, 'Abdominal', db.abdominal],
      ['Coxa', db.coxa, 'Axilar média', db.axilar_media],
      ['Torácica', db.toracica, '', '']
    ];
    dobraRows.forEach(row => {
      if (row[1] == null && row[3] == null) return;
      let line = '';
      if (row[0] && row[1] != null) line += `${row[0]}: ${row[1]}`;
      if (row[2] && row[3] != null) line += `    |    ${row[2]}: ${row[3]}`;
      if (line) { doc.text(line, marginL, y); y += 4.5; }
    });
    y += 2;
  }

  // === Composição corporal ===
  if (hasValues(comp)) {
    if (y > 260) { doc.addPage(); y = 15; }
    doc.setDrawColor(200); doc.line(marginL, y, marginR, y); y += 5;
    doc.setFontSize(11); doc.setFont('helvetica', 'bold'); doc.setTextColor(40);
    doc.text('COMPOSIÇÃO CORPORAL', marginL, y); y += 6;
    doc.setFontSize(9); doc.setFont('helvetica', 'normal'); doc.setTextColor(60);
    const compItems = [];
    if (comp.gordura != null) compItems.push('% Gordura: ' + comp.gordura);
    if (comp.massa_magra != null) compItems.push('Massa magra: ' + comp.massa_magra + ' kg');
    if (comp.massa_gorda != null) compItems.push('Massa gorda: ' + comp.massa_gorda + ' kg');
    doc.text(compItems.join('    |    '), marginL, y); y += 7;
  }

  // === Saúde ===
  if (hasValues(saude)) {
    if (y > 250) { doc.addPage(); y = 15; }
    doc.setDrawColor(200); doc.line(marginL, y, marginR, y); y += 5;
    doc.setFontSize(11); doc.setFont('helvetica', 'bold'); doc.setTextColor(40);
    doc.text('SAÚDE', marginL, y); y += 6;
    doc.setFontSize(9); doc.setFont('helvetica', 'normal'); doc.setTextColor(60);
    if (saude.lesoes) { doc.text('Lesões/Cirurgias: ' + saude.lesoes, marginL, y, { maxWidth: 170 }); y += 5; }
    if (saude.medicamentos) { doc.text('Medicamentos: ' + saude.medicamentos, marginL, y, { maxWidth: 170 }); y += 5; }
    if (saude.restricoes) { doc.text('Restrições: ' + saude.restricoes, marginL, y, { maxWidth: 170 }); y += 5; }
    if (saude.nivel_atividade) { doc.text('Nível de atividade: ' + saude.nivel_atividade, marginL, y); y += 5; }
    y += 2;
  }

  // === Observações ===
  if (d.observacoes) {
    if (y > 255) { doc.addPage(); y = 15; }
    doc.setDrawColor(200); doc.line(marginL, y, marginR, y); y += 5;
    doc.setFontSize(11); doc.setFont('helvetica', 'bold'); doc.setTextColor(40);
    doc.text('OBSERVAÇÕES', marginL, y); y += 6;
    doc.setFontSize(9); doc.setFont('helvetica', 'normal'); doc.setTextColor(60);
    doc.text(d.observacoes, marginL, y, { maxWidth: 170 }); y += 7;
  }

  // === Rodapé ===
  doc.setFontSize(7); doc.setTextColor(150);
  doc.text('Gerado automaticamente pelo sistema de treino', pageW / 2, 287, { align: 'center' });

  // Download
  const fileName = `avaliacao_${(studentInfo?.full_name || 'aluno').replace(/\s+/g, '_')}_${a.assessment_date}.pdf`;
  doc.save(fileName);
  showToast('PDF gerado!');
}

      student?.full_name ? `<div class="info-item"><strong>${esc(student.full_name)}</strong></div>` : '',
      age ? `<div class="info-item">Idade: <strong>${age} anos</strong></div>` : '',
      student?.sex ? `<div class="info-item">Sexo: <strong>${student.sex === 'M' ? 'Masculino' : 'Feminino'}</strong></div>` : '',
      student?.gym_name ? `<div class="info-item">Academia: <strong>${esc(student.gym_name)}</strong></div>` : ''
    ].join('');
    document.getElementById('infoBar').innerHTML = infoHtml;

    // Preenche data de hoje
    document.getElementById('fDate').value = new Date().toISOString().split('T')[0];

    await loadAssessments();
    populatePlaceholders();
    hideLoading();
  },
  onBlocked: () => { location.replace('login.html'); }
});
</script>
</body>
</html>
