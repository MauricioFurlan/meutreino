<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Painel do Dono</title>
  <meta name="theme-color" content="#00d5ff">
  <!-- PWA: precisa estar em TODAS as páginas, senão o iOS mostra a barra do
       Safari ao navegar dentro do app instalado (modo standalone) -->
  <link rel="manifest" href="/manifest-pro.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MeuTreino Pro">
  <link rel="icon" type="image/png" href="/icon-pro-192.png">
  <link rel="apple-touch-icon" href="/icon-pro-192.png">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; connect-src 'self' https://*.supabase.co; img-src 'self' data:;">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body::-webkit-scrollbar, *::-webkit-scrollbar { display: none; }
    body, * { scrollbar-width: none; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #08090c; color: #f0f0f0; min-height: 100vh; padding-bottom: 40px; }
    .header { background: #101419; padding: 16px; text-align: center; border-bottom: 1px solid #232a33; position: relative; }
    .header h1 { font-size: 1.1rem; color: #00d5ff; letter-spacing: 1px; }
    .header .subtitle { font-size: 0.8rem; color: #999; margin-top: 4px; }
    .logout-btn { position: absolute; top: 14px; right: 14px; background: none; border: 1px solid #555; color: #999; font-size: 0.65rem; padding: 4px 10px; border-radius: 12px; cursor: pointer; }
    .logout-btn:active { opacity: 0.6; }
    .section { padding: 16px; }
    .section-title { font-size: 0.85rem; color: #00d5ff; font-weight: 700; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px; }

    .alert-card { background: #0c1015; border: 1px solid #00d5ff; border-radius: 10px; padding: 12px; margin-bottom: 8px; }
    .alert-card.expired { background: #2a0000; border-color: #f44336; }
    .alert-card .name { font-weight: 600; font-size: 0.9rem; }
    .alert-card .info { font-size: 0.75rem; color: #ccc; margin-top: 2px; }

    .trainer-card { background: #101419; border: 1px solid #232a33; border-radius: 12px; padding: 14px; margin-bottom: 10px; }
    .trainer-card.suspended { opacity: 0.5; }
    .trainer-top { display: flex; align-items: center; gap: 12px; }
    .trainer-avatar { width: 38px; height: 38px; border-radius: 50%; background: #232a33; display: flex; align-items: center; justify-content: center; font-size: 0.9rem; font-weight: 700; color: #00d5ff; flex-shrink: 0; }
    .trainer-info { flex: 1; min-width: 0; }
    .trainer-name { font-size: 0.9rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .trainer-meta { font-size: 0.7rem; color: #999; margin-top: 2px; }
    .trainer-status { font-size: 0.6rem; padding: 3px 8px; border-radius: 10px; font-weight: 600; flex-shrink: 0; }
    .trainer-status.active { background: #1b3a1b; color: #4caf50; }
    .trainer-status.expired { background: #3a1b1b; color: #f44336; }
    .trainer-status.suspended { background: #161b22; color: #888; }
    .actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    .action-btn { padding: 6px 12px; border: 1px solid #555; border-radius: 8px; background: none; color: #ccc; font-size: 0.7rem; cursor: pointer; font-weight: 500; }
    .action-btn:active { opacity: 0.6; }
    .action-btn.danger { border-color: #f44336; color: #f44336; }
    .action-btn.success { border-color: #4caf50; color: #4caf50; }
    .students-count { font-size: 0.65rem; color: #666; margin-top: 6px; }

    .form-section { background: #101419; border: 1px solid #232a33; border-radius: 12px; margin-bottom: 16px; overflow: hidden; }
    .form-section h3 { font-size: 0.9rem; color: #00d5ff; padding: 14px 16px; margin: 0; cursor: pointer; display: flex; align-items: center; justify-content: space-between; }
    .form-section h3::after { content: '▼'; font-size: 0.6rem; color: #888; transition: transform 0.2s; }
    .form-section.open h3::after { transform: rotate(180deg); }
    .form-body { display: none; padding: 0 16px 16px; }
    .form-section.open .form-body { display: block; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.7rem; color: #999; margin-bottom: 4px; text-transform: uppercase; font-weight: 600; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #232a33; background: #08090c; color: #fff; font-size: 16px; font-family: inherit; }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: #00d5ff; }
    .form-group select option { background: #101419; }
    .form-group textarea { resize: none; line-height: 1.4; }
    .form-row { display: flex; gap: 10px; }
    .form-row .form-group { flex: 1; min-width: 0; }
    .trainer-extra { font-size: 0.68rem; color: #777; margin-top: 3px; display: flex; gap: 10px; flex-wrap: wrap; }
    .trainer-extra span { display: inline-flex; align-items: center; gap: 3px; }
    .plan-badge { display: inline-block; font-size: 0.58rem; padding: 2px 7px; border-radius: 8px; font-weight: 700; text-transform: uppercase; }
    .plan-badge.free   { background: #222; color: #888; border: 1px solid #444; }
    .plan-badge.basic  { background: #141a21; color: #64b5f6; border: 1px solid #1e4a7a; }
    .plan-badge.pro    { background: #0c1015; color: #00d5ff; border: 1px solid #0091b3; }
    .submit-btn { width: 100%; padding: 14px; border: none; border-radius: 10px; background: #00d5ff; color: #000; font-weight: 700; font-size: 0.9rem; cursor: pointer; }
    .submit-btn:disabled { opacity: 0.5; }
    .submit-btn:active { opacity: 0.7; }

    .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.9); z-index: 1000; align-items: center; justify-content: center; padding: 16px; }
    .modal.show { display: flex; }
    .modal-content { background: #101419; border-radius: 12px; padding: 20px; width: 100%; max-width: 360px; border: 1px solid #232a33; }
    .modal-content h3 { color: #00d5ff; font-size: 0.9rem; margin-bottom: 14px; }
    .modal-close { width: 100%; padding: 10px; border: none; border-radius: 8px; background: #161b22; color: #999; font-weight: 600; font-size: 0.85rem; cursor: pointer; margin-top: 12px; }

    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #00d5ff; color: #000; padding: 10px 20px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; display: none; z-index: 1001; }
    .toast.error { background: #f44336; color: #fff; }
    .toast.show { display: block; animation: fadeOut 2.5s forwards; }
    @keyframes fadeOut { 0%,70% { opacity: 1; } 100% { opacity: 0; } }
    .empty-state { text-align: center; padding: 30px; color: #666; font-size: 0.85rem; }

    /* Loading overlay */
    .loading-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(13,13,13,0.92); z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 16px; transition: opacity 0.3s;
    }
    .loading-overlay.hidden { opacity: 0; pointer-events: none; }
    .loading-spinner {
      width: 44px; height: 44px; border: 3px solid #232a33;
      border-top-color: #00d5ff; border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { color: #999; font-size: 0.8rem; font-weight: 500; letter-spacing: 0.5px; }
  </style>
  <!-- Camada de identidade visual (precisa vir DEPOIS do <style> inline) -->
  <link rel="stylesheet" href="brand.css">
</head>
<body>
  <div class="loading-overlay" id="loadingOverlay">
    <div class="loading-spinner"></div>
    <div class="loading-text">Carregando...</div>
  </div>

  <div class="header">
    <button class="logout-btn" onclick="location.href='login.html?logout'">Sair</button>
    <h1>Painel do Dono</h1>
    <div class="subtitle">Gestão de Professores</div>
  </div>

  <!-- Alertas -->
  <div class="section" id="alertsSection" style="display:none;">
    <div class="section-title">⚠️ Atenção</div>
    <div id="alertsList"></div>
  </div>

  <!-- Novo Professor -->
  <div class="section">
    <div class="form-section" id="createForm">
      <h3 onclick="this.parentElement.classList.toggle('open')">+ Novo Professor</h3>
      <div class="form-body">
        <div class="form-group"><label>Nome completo</label><input type="text" id="newName" placeholder="Nome do professor"></div>
        <div class="form-group"><label>E-mail</label><input type="email" id="newEmail" inputmode="email" placeholder="email@exemplo.com"></div>
        <div class="form-row">
          <div class="form-group"><label>CREF</label><input type="text" id="newCref" placeholder="012345-G/SP"></div>
          <div class="form-group"><label>Telefone</label><input type="tel" id="newPhone" inputmode="tel" placeholder="(11) 99999-9999"></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>CPF</label><input type="text" id="newCpf" inputmode="numeric" placeholder="000.000.000-00"></div>
          <div class="form-group"><label>Plano</label>
            <select id="newPlanTier">
              <option value="free">Free</option>
              <option value="basic">Basic</option>
              <option value="pro">Pro</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>Limite de alunos</label><input type="number" id="newStudentLimit" inputmode="numeric" value="10" min="1"></div>
          <div class="form-group"><label>Duração paga (meses)</label><input type="number" id="newMonths" inputmode="numeric" value="1" min="1" max="24"></div>
        </div>
        <div class="form-group"><label>Especialidades</label><input type="text" id="newSpecialties" placeholder="musculação, corrida, crossfit..."></div>
        <div class="form-group"><label>Bio</label><textarea id="newBio" rows="2" placeholder="Apresentação curta do professor"></textarea></div>
        <div class="form-row">
          <div class="form-group"><label>Valor (R$)</label><input type="number" id="newAmount" inputmode="decimal" step="0.01" placeholder="0.00"></div>
          <div class="form-group"><label>Método de pagamento</label><input type="text" id="newMethod" placeholder="PIX, dinheiro..."></div>
        </div>
        <button class="submit-btn" id="createBtn" onclick="createTrainer()">Cadastrar Professor</button>
      </div>
    </div>
  </div>

  <!-- Lista -->
  <div class="section">
    <div class="section-title">Professores</div>
    <div id="trainersList"></div>
  </div>

  <!-- Modal de edição do professor -->
  <div class="modal" id="editModal">
    <div class="modal-content" style="max-height:90vh;overflow-y:auto;">
      <h3>Editar Professor</h3>
      <div class="form-group"><label>Nome completo</label><input type="text" id="editName" placeholder="Nome do professor"></div>
      <div class="form-row">
        <div class="form-group"><label>CREF</label><input type="text" id="editCref" placeholder="012345-G/SP"></div>
        <div class="form-group"><label>Telefone</label><input type="tel" id="editPhone" inputmode="tel" placeholder="(11) 99999-9999"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>CPF</label><input type="text" id="editCpf" inputmode="numeric" placeholder="000.000.000-00"></div>
        <div class="form-group"><label>Plano</label>
          <select id="editPlanTier">
            <option value="free">Free</option>
            <option value="basic">Basic</option>
            <option value="pro">Pro</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Limite de alunos</label><input type="number" id="editStudentLimit" inputmode="numeric" min="1"></div>
        <div class="form-group"><label>URL da foto</label><input type="url" id="editAvatarUrl" placeholder="https://..."></div>
      </div>
      <div class="form-group"><label>Especialidades</label><input type="text" id="editSpecialties" placeholder="musculação, corrida, crossfit..."></div>
      <div class="form-group"><label>Bio</label><textarea id="editBio" rows="3" placeholder="Apresentação curta do professor"></textarea></div>
      <button class="submit-btn" onclick="confirmEdit()">Salvar</button>
      <button class="modal-close" onclick="closeEditModal()">Cancelar</button>
    </div>
  </div>

  <!-- Modal de pagamento/renovação -->
  <div class="modal" id="payModal">
    <div class="modal-content">
      <h3>Registrar Pagamento</h3>
      <div class="form-group"><label>Professor</label><input type="text" id="payName" disabled></div>
      <div class="form-group"><label>Meses</label><input type="number" id="payMonths" inputmode="numeric" value="1" min="1" max="24"></div>
      <div class="form-group"><label>Valor (R$)</label><input type="number" id="payAmount" inputmode="decimal" step="0.01" placeholder="0.00"></div>
      <div class="form-group"><label>Método</label><input type="text" id="payMethod" placeholder="PIX, dinheiro..."></div>
      <button class="submit-btn" onclick="confirmPayment()">Registrar</button>
      <button class="modal-close" onclick="closePayModal()">Cancelar</button>
    </div>
  </div>

  <!-- Modal de histórico de pagamentos -->
  <div class="modal" id="histModal">
    <div class="modal-content">
      <h3 id="histTitle">Histórico de Pagamentos</h3>
      <div id="histBody" style="max-height:50vh;overflow-y:auto;"></div>
      <button class="modal-close" onclick="document.getElementById('histModal').classList.remove('show')">Fechar</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth-guard.js"></script>
<script>
function showLoading() { document.getElementById('loadingOverlay').classList.remove('hidden'); }
function hideLoading() { document.getElementById('loadingOverlay').classList.add('hidden'); }

let myId = null;
let trainers = [];

const esc = (s) => { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; };
function showToast(t, err) { const e = document.getElementById('toast'); e.textContent = t; e.className = 'toast show' + (err ? ' error' : ''); setTimeout(() => e.className = 'toast', 2500); }

// === Carregar professores ===
async function loadTrainers() {
  const { data, error } = await _sb.from('profiles')
    .select('id, full_name, email, status, access_starts_at, access_expires_at, max_students, cref, phone, cpf, avatar_url, plan_tier, student_limit, bio, specialties')
    .eq('role', 'trainer')
    .order('full_name', { ascending: true });
  if (error) { console.log('Erro:', error); return; }
  trainers = data || [];

  // Buscar contagem de alunos por professor
  for (const t of trainers) {
    const { count } = await _sb.from('profiles').select('*', { count: 'exact', head: true }).eq('coach_id', t.id).eq('role', 'student').eq('status', 'active');
    t.studentCount = count || 0;
  }

  renderTrainers();
  renderAlerts();
}

function getStatus(t) {
  if (t.status === 'suspended') return 'suspended';
  if (t.access_expires_at && new Date(t.access_expires_at + 'T23:59:59') < new Date()) return 'expired';
  return 'active';
}

function renderTrainers() {
  const container = document.getElementById('trainersList');
  if (trainers.length === 0) { container.innerHTML = '<div class="empty-state">Nenhum professor cadastrado.</div>'; return; }
  container.innerHTML = trainers.map(t => {
    const initials = (t.full_name || '?').split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase();
    const status = getStatus(t);
    const statusLabel = status === 'active' ? 'Ativo' : status === 'expired' ? 'Vencido' : 'Suspenso';
    const expiresText = t.access_expires_at ? new Date(t.access_expires_at + 'T00:00:00').toLocaleDateString('pt-BR') : 'Sem prazo';
    const limit = t.student_limit || t.max_students || 10;
    const tier = t.plan_tier || 'free';
    const tierLabel = { free: 'Free', basic: 'Basic', pro: 'Pro' }[tier] || tier;
    const extraParts = [];
    if (t.cref)  extraParts.push(`<span>📋 ${esc(t.cref)}</span>`);
    if (t.phone) extraParts.push(`<span>📱 ${esc(t.phone)}</span>`);
    return `
      <div class="trainer-card ${t.status === 'suspended' ? 'suspended' : ''}">
        <div class="trainer-top">
          <div class="trainer-avatar">${t.avatar_url ? `<img src="${esc(t.avatar_url)}" style="width:38px;height:38px;border-radius:50%;object-fit:cover;">` : esc(initials)}</div>
          <div class="trainer-info">
            <div class="trainer-name">${esc(t.full_name)} <span class="plan-badge ${tier}">${tierLabel}</span></div>
            <div class="trainer-meta">${esc(t.email)} · até ${expiresText}</div>
            ${extraParts.length ? `<div class="trainer-extra">${extraParts.join('')}</div>` : ''}
          </div>
          <span class="trainer-status ${status}">${statusLabel}</span>
        </div>
        <div class="students-count">${t.studentCount} aluno${t.studentCount !== 1 ? 's' : ''} (limite: ${limit})</div>
        <div class="actions">
          ${t.status === 'active'
            ? `<button class="action-btn danger" onclick="toggleStatus('${t.id}','suspended')">Suspender</button>`
            : `<button class="action-btn success" onclick="toggleStatus('${t.id}','active')">Reativar</button>`
          }
          <button class="action-btn" onclick="openPayModal('${t.id}','${esc(t.full_name).replace(/'/g,"\\'")}')">💰 Pagamento</button>
          <button class="action-btn" onclick="viewPayments('${t.id}','${esc(t.full_name).replace(/'/g,"\\'")}')">📋 Histórico</button>
          <button class="action-btn" onclick="openEditModal('${t.id}')">✏️ Editar</button>
        </div>
      </div>
    `;
  }).join('');
}

// === Alertas ===
function renderAlerts() {
  const now = new Date();
  const in7days = new Date(now.getTime() + 7 * 24 * 60 * 60 * 1000);
  const alerts = trainers.filter(t => {
    if (t.status === 'suspended') return false;
    if (!t.access_expires_at) return false;
    return new Date(t.access_expires_at + 'T23:59:59') <= in7days;
  }).sort((a, b) => a.access_expires_at.localeCompare(b.access_expires_at));

  const section = document.getElementById('alertsSection');
  const container = document.getElementById('alertsList');
  if (alerts.length === 0) { section.style.display = 'none'; return; }
  section.style.display = 'block';
  container.innerHTML = alerts.map(t => {
    const exp = new Date(t.access_expires_at + 'T23:59:59');
    const isExpired = exp < now;
    const daysLeft = Math.ceil((exp - now) / (1000 * 60 * 60 * 24));
    const label = isExpired ? 'Vencido' : `Vence em ${daysLeft} dia${daysLeft !== 1 ? 's' : ''}`;
    return `<div class="alert-card ${isExpired ? 'expired' : ''}"><div class="name">${esc(t.full_name)}</div><div class="info">${label} · ${new Date(t.access_expires_at + 'T00:00:00').toLocaleDateString('pt-BR')}</div></div>`;
  }).join('');
}

// === Criar professor ===
async function createTrainer() {
  const name = document.getElementById('newName').value.trim();
  const email = document.getElementById('newEmail').value.trim().toLowerCase();
  const months = parseInt(document.getElementById('newMonths').value) || 1;
  const amount = parseFloat(document.getElementById('newAmount').value) || null;
  const method = document.getElementById('newMethod').value.trim() || null;

  if (!name || !email) { showToast('Preencha nome e e-mail.', true); return; }

  const btn = document.getElementById('createBtn');
  btn.disabled = true;

  // Cria convite
  const { error } = await _sb.from('invites').insert({
    email, role: 'trainer', full_name: name, months, created_by: myId
  });
  btn.disabled = false;
  if (error) {
    if (error.code === '23505') showToast('E-mail já tem convite pendente.', true);
    else showToast('Erro: ' + error.message, true);
    return;
  }

  // Coleta campos extras para salvar depois que o profile for criado via trigger.
  // Por ora apenas guardamos no convite os dados básicos; os extras ficam para edição.
  // Se quiser pré-preencher no perfil, mapeie nos campos do invite ou use upsert após trigger.

  showToast('Professor cadastrado! Peça pra acessar com esse e-mail.');
  ['newName','newEmail','newCref','newPhone','newCpf','newSpecialties','newBio','newAmount','newMethod'].forEach(id => { document.getElementById(id).value = ''; });
  document.getElementById('newMonths').value = '1';
  document.getElementById('newStudentLimit').value = '10';
  document.getElementById('newPlanTier').value = 'free';
  await loadTrainers();
}

// === Suspender / Reativar ===
async function toggleStatus(trainerId, newStatus) {
  const { error } = await _sb.from('profiles').update({ status: newStatus }).eq('id', trainerId);
  if (error) { showToast('Erro: ' + error.message, true); return; }
  showToast(newStatus === 'active' ? 'Professor reativado!' : 'Professor suspenso (alunos bloqueados em cascata).');
  await loadTrainers();
}

// === Pagamento ===
let payTrainerId = null;

function openPayModal(trainerId, name) {
  payTrainerId = trainerId;
  document.getElementById('payName').value = name;
  document.getElementById('payMonths').value = '1';
  document.getElementById('payAmount').value = '';
  document.getElementById('payMethod').value = '';
  document.getElementById('payModal').classList.add('show');
}

function closePayModal() { document.getElementById('payModal').classList.remove('show'); payTrainerId = null; }

async function confirmPayment() {
  if (!payTrainerId) return;
  const months = parseInt(document.getElementById('payMonths').value) || 1;
  const amount = parseFloat(document.getElementById('payAmount').value) || null;
  const method = document.getElementById('payMethod').value.trim() || null;

  const trainer = trainers.find(t => t.id === payTrainerId);
  if (!trainer) { closePayModal(); return; }

  const now = new Date();
  const currentExp = trainer.access_expires_at ? new Date(trainer.access_expires_at + 'T00:00:00') : now;
  const base = currentExp > now ? currentExp : now;
  const newExp = new Date(base);
  newExp.setMonth(newExp.getMonth() + months);
  const periodStart = base.toISOString().split('T')[0];
  const periodEnd = newExp.toISOString().split('T')[0];

  // Registrar pagamento
  const { error: payErr } = await _sb.from('trainer_payments').insert({
    trainer_id: payTrainerId, amount, paid_at: now.toISOString().split('T')[0],
    period_start: periodStart, period_end: periodEnd, method, created_by: myId
  });
  if (payErr) { showToast('Erro ao registrar: ' + payErr.message, true); return; }

  // Estender prazo e reativar
  const { error: upErr } = await _sb.from('profiles')
    .update({ access_expires_at: periodEnd, status: 'active' })
    .eq('id', payTrainerId);
  if (upErr) { showToast('Pagamento registrado mas erro ao estender prazo.', true); closePayModal(); return; }

  showToast(`Pagamento registrado! Prazo até ${newExp.toLocaleDateString('pt-BR')}.`);
  closePayModal();
  await loadTrainers();
}

// === Histórico de pagamentos ===
async function viewPayments(trainerId, name) {
  document.getElementById('histTitle').textContent = 'Pagamentos — ' + name;
  document.getElementById('histBody').innerHTML = '<div style="color:#888;text-align:center;padding:20px;">Carregando...</div>';
  document.getElementById('histModal').classList.add('show');

  const { data, error } = await _sb.from('trainer_payments')
    .select('*')
    .eq('trainer_id', trainerId)
    .order('paid_at', { ascending: false });

  if (error || !data || data.length === 0) {
    document.getElementById('histBody').innerHTML = '<div style="color:#888;text-align:center;padding:20px;">Nenhum pagamento registrado.</div>';
    return;
  }

  document.getElementById('histBody').innerHTML = data.map(p => {
    const paidAt = new Date(p.paid_at + 'T00:00:00').toLocaleDateString('pt-BR');
    const periodEnd = p.period_end ? new Date(p.period_end + 'T00:00:00').toLocaleDateString('pt-BR') : '-';
    const amount = p.amount ? `R$ ${parseFloat(p.amount).toFixed(2)}` : '-';
    const method = p.method || '-';
    return `<div style="border-bottom:1px solid #232a33;padding:10px 0;">
      <div style="font-size:0.8rem;color:#00d5ff;font-weight:600;">${paidAt}</div>
      <div style="font-size:0.75rem;color:#ccc;margin-top:3px;">${amount} · ${esc(method)} · até ${periodEnd}</div>
      ${p.note ? `<div style="font-size:0.7rem;color:#888;margin-top:2px;">${esc(p.note)}</div>` : ''}
    </div>`;
  }).join('');
}

// === Editar professor ===
let editTrainerId = null;

function openEditModal(trainerId) {
  const t = trainers.find(x => x.id === trainerId);
  if (!t) return;
  editTrainerId = trainerId;
  document.getElementById('editName').value         = t.full_name || '';
  document.getElementById('editCref').value         = t.cref || '';
  document.getElementById('editPhone').value        = t.phone || '';
  document.getElementById('editCpf').value          = t.cpf || '';
  document.getElementById('editPlanTier').value     = t.plan_tier || 'free';
  document.getElementById('editStudentLimit').value = t.student_limit || t.max_students || 10;
  document.getElementById('editAvatarUrl').value    = t.avatar_url || '';
  document.getElementById('editSpecialties').value  = (t.specialties || []).join(', ');
  document.getElementById('editBio').value          = t.bio || '';
  document.getElementById('editModal').classList.add('show');
}

function closeEditModal() {
  document.getElementById('editModal').classList.remove('show');
  editTrainerId = null;
}

async function confirmEdit() {
  if (!editTrainerId) return;
  const specialtiesRaw = document.getElementById('editSpecialties').value.trim();
  const specialties = specialtiesRaw ? specialtiesRaw.split(',').map(s => s.trim()).filter(Boolean) : [];

  const updates = {
    full_name:     document.getElementById('editName').value.trim() || null,
    cref:          document.getElementById('editCref').value.trim() || null,
    phone:         document.getElementById('editPhone').value.trim() || null,
    cpf:           document.getElementById('editCpf').value.trim() || null,
    plan_tier:     document.getElementById('editPlanTier').value,
    student_limit: parseInt(document.getElementById('editStudentLimit').value) || 10,
    avatar_url:    document.getElementById('editAvatarUrl').value.trim() || null,
    bio:           document.getElementById('editBio').value.trim() || null,
    specialties,
  };

  const { error } = await _sb.from('profiles').update(updates).eq('id', editTrainerId);
  if (error) { showToast('Erro: ' + error.message, true); return; }
  showToast('Professor atualizado!');
  closeEditModal();
  await loadTrainers();
}

// === Init ===
guard('owner', {
  onReady: async (session, profile) => {
    showLoading();
    myId = profile.id;
    await loadTrainers();
    hideLoading();
  },
  onBlocked: () => { location.replace('login.html'); }
});
