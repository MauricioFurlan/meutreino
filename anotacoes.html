<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Anotações</title>
  <meta name="theme-color" content="#00d5ff">
  <link rel="manifest" href="/manifest-pro.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MeuTreino Pro">
  <link rel="icon" type="image/png" href="/icon-pro-192.png">
  <link rel="apple-touch-icon" href="/icon-pro-192.png">
  <link rel="stylesheet" href="theme.css">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; connect-src 'self' https://*.supabase.co; img-src 'self' data:;">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body::-webkit-scrollbar, *::-webkit-scrollbar { display: none; }
    body, * { scrollbar-width: none; }
    /* Escala tipográfica das telas do PROFESSOR: um degrau acima da escala do
       aluno (index.html). O aluno usa o app de pé na academia, olhando uma
       série por vez; o professor lê listas densas de aluno no mesmo celular e
       reclamava do texto pequeno. O editor de treino (editor.html) ficou na
       escala menor de propósito: a linha de série tem colunas de 54px/50px
       calibradas na unha e texto maior estoura a grade. */
    :root {
      --fs-2xs: 0.72rem;
      --fs-xs: 0.78rem;
      --fs-sm: 0.82rem;
      --fs-base: 0.88rem;
      --fs-md: 0.92rem;
      --fs-lg: 0.96rem;
      --fs-xl: 1.05rem;
      --fs-2xl: 1.15rem;
      --fs-3xl: 1.35rem;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg-body); color: var(--text); min-height: 100vh; padding-bottom: 60px;
    }

    /* ── Header ─────────────────────────────────────────────────── */
    .header {
      background: var(--bg-header); padding: 16px; text-align: center;
      border-bottom: 1px solid var(--border); position: relative;
    }
    .header h1 { font-size: var(--fs-2xl); color: var(--accent); letter-spacing: 1px; }
    .header .subtitle { font-size: var(--fs-base); color: var(--text-muted); margin-top: 4px; }
    .nav-btn {
      position: absolute; top: 14px; background: none; border: 1px solid var(--text-dim);
      color: var(--text-muted); font-size: var(--fs-2xs); padding: 4px 10px; border-radius: 12px; cursor: pointer;
    }
    .nav-btn.left { left: 14px; }
    .nav-btn:active { opacity: 0.6; }

    /* ── Loading overlay ─────────────────────────────────────────── */
    .loading-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: var(--overlay-bg); z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 16px; transition: opacity 0.3s;
    }
    .loading-overlay.hidden { opacity: 0; pointer-events: none; }
    .loading-spinner {
      width: 44px; height: 44px; border: 3px solid var(--spinner-track);
      border-top-color: var(--spinner-accent); border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { color: var(--text-muted); font-size: var(--fs-base); font-weight: 500; letter-spacing: 0.5px; }

    /* ── Toast ───────────────────────────────────────────────────── */
    .toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: var(--accent); color: var(--text-dark); padding: 10px 20px;
      border-radius: 20px; font-size: var(--fs-md); font-weight: 600;
      display: none; z-index: 1001; white-space: nowrap;
    }
    .toast.error { background: var(--error); color: var(--text-bright); }
    .toast.show { display: block; animation: fadeOut 2.5s forwards; }
    @keyframes fadeOut { 0%,70% { opacity: 1; } 100% { opacity: 0; } }

    /* ── Abas (editor / pré-visualização) ───────────────────────── */
    .tabs {
      display: flex; gap: 4px; padding: 10px 16px;
      background: var(--bg-header); border-bottom: 1px solid var(--border);
    }
    .tab {
      flex: 1; padding: 9px 4px; border-radius: 20px; background: var(--bg-secondary);
      color: var(--text-muted2); font-size: var(--fs-sm); font-weight: 600; cursor: pointer;
      border: none; text-align: center;
    }
    .tab.active { background: var(--accent); color: var(--text-dark); }

    /* ── Painel editor ───────────────────────────────────────────── */
    .panel { display: none; }
    .panel.active { display: block; }

    /* Atalhos de formatação */
    .toolbar {
      display: flex; gap: 6px; padding: 10px 16px;
      flex-wrap: wrap; background: var(--bg-input); border-bottom: 1px solid var(--border-light);
    }
    .tb-btn {
      background: var(--bg-secondary); border: 1px solid #444; color: var(--text-muted);
      font-size: var(--fs-xs); padding: 6px 10px; border-radius: 8px;
      cursor: pointer; font-weight: 600; white-space: nowrap;
    }
    .tb-btn:active { background: var(--accent); color: var(--text-dark); border-color: var(--accent); }

    .editor-wrap { padding: 12px 16px; }
    #noteEditor {
      width: 100%; min-height: 420px;
      background: var(--bg-input); color: var(--text);
      border: 1px solid var(--border); border-radius: 10px;
      padding: 14px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 15px; line-height: 1.7; resize: none;
    }
    #noteEditor:focus { outline: none; border-color: var(--accent); }

    .editor-hint {
      font-size: var(--fs-xs); color: var(--text-dim); margin-top: 8px; line-height: 1.5;
    }

    .save-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      padding: 10px 16px; background: var(--bg-body); border-top: 1px solid var(--border-light);
      display: flex; gap: 10px; align-items: center;
    }
    .save-btn {
      flex: 1; padding: 13px; border: none; border-radius: 10px;
      background: var(--accent); color: var(--text-dark); font-weight: 700; font-size: var(--fs-lg);
      cursor: pointer;
    }
    .save-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .save-btn:active:not(:disabled) { opacity: 0.7; }
    .clear-btn {
      padding: 13px 16px; border: 1px solid #444; border-radius: 10px;
      background: none; color: var(--text-muted2); font-size: var(--fs-base); cursor: pointer;
    }
    .clear-btn:active { border-color: var(--error); color: var(--error); }

    .last-saved {
      font-size: var(--fs-2xs); color: var(--text-dim); text-align: center;
      padding: 4px 16px 0;
    }

    /* ── Painel pré-visualização ─────────────────────────────────── */
    .preview-wrap {
      padding: 14px 16px;
    }

    /* mesmo estilo que o modal do aluno vai usar */
    .note-render { line-height: 1.7; font-size: var(--fs-lg); }
    .note-render .note-section {
      background: var(--bg-card); border: 1px solid var(--bg-secondary);
      border-radius: 10px; padding: 12px 14px; margin-bottom: 10px;
    }
    .note-render .note-section-title {
      font-size: var(--fs-base); font-weight: 700; color: var(--accent);
      text-transform: uppercase; letter-spacing: 0.5px;
      margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px solid var(--bg-secondary);
    }
    .note-render .note-line {
      font-size: var(--fs-lg); color: var(--text); padding: 2px 0;
    }
    .note-render .note-line.bullet::before {
      content: '• '; color: var(--accent);
    }
    .note-render .note-line.dash::before {
      content: '— '; color: var(--text-muted2);
    }
    .note-render .note-line.num::before {
      content: attr(data-num) '. '; color: var(--accent);
    }
    .note-render .note-line.indent {
      padding-left: 16px;
    }
    .note-render .note-spacer { height: 4px; }

    .preview-empty {
      text-align: center; padding: 48px 16px; color: var(--text-dim); font-size: var(--fs-md);
    }
    .preview-empty .icon { font-size: 2rem; margin-bottom: 8px; }

    /* ── Botão importar ──────────────────────────────────────────── */
    .import-open-btn {
      display: block; width: calc(100% - 32px); margin: 10px 16px 0;
      padding: 11px; background: none; border: 1px dashed #444;
      border-radius: 10px; color: var(--text-muted2); font-size: var(--fs-base);
      cursor: pointer; text-align: center;
    }
    .import-open-btn:active { border-color: var(--accent); color: var(--accent); }

    /* ── Modal de importação ─────────────────────────────────────── */
    .modal {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75);
      z-index: 2000; align-items: flex-end; justify-content: center;
    }
    .modal.show { display: flex; }
    .modal-content {
      background: var(--bg-card); border-radius: 18px 18px 0 0;
      width: 100%; max-height: 82vh; overflow-y: auto;
      padding: 0 0 24px;
    }
    .modal-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 16px 0; margin-bottom: 4px;
    }
    .modal-head h3 { font-size: var(--fs-xl); color: var(--text); }
    .modal-x {
      background: none; border: none; color: var(--text-muted2); font-size: var(--fs-2xl);
      cursor: pointer; padding: 4px 8px;
    }
    .modal-sub {
      font-size: var(--fs-sm); color: var(--text-muted3); padding: 0 16px 12px;
      border-bottom: 1px solid var(--bg-secondary); margin-bottom: 10px;
    }
    .modal-empty { text-align: center; padding: 32px 16px; color: var(--text-dim); font-size: var(--fs-base); }
    .modal-close {
      display: block; width: calc(100% - 32px); margin: 12px 16px 0;
      padding: 12px; background: var(--bg-secondary); border: none; border-radius: 10px;
      color: var(--text-muted2); font-size: var(--fs-md); cursor: pointer;
    }
    .import-search {
      display: block; width: calc(100% - 32px); margin: 0 16px 10px;
      padding: 10px 14px; background: var(--bg-input); border: 1px solid var(--border);
      border-radius: 10px; color: var(--text); font-size: var(--fs-md);
    }
    .import-search:focus { outline: none; border-color: var(--accent); }
    .pick-item {
      display: flex; align-items: center; gap: 12px;
      width: calc(100% - 32px); margin: 0 16px 8px;
      background: var(--bg-input); border: 1px solid var(--bg-secondary); border-radius: 10px;
      padding: 12px; cursor: pointer; text-align: left;
    }
    .pick-item:active { border-color: var(--accent); }
    .pick-avatar {
      width: 36px; height: 36px; border-radius: 50%; background: var(--bg-secondary);
      display: flex; align-items: center; justify-content: center;
      font-size: var(--fs-lg); font-weight: 700; color: var(--accent); flex-shrink: 0;
    }
    .pick-body { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
    .pick-title { font-size: var(--fs-lg); color: var(--text); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pick-meta  { font-size: var(--fs-xs); color: var(--text-muted3); }
    .pick-arrow { color: var(--text-dim); font-size: var(--fs-2xl); flex-shrink: 0; }
    .back-link {
      display: block; background: none; border: none; color: var(--accent);
      font-size: var(--fs-base); padding: 0 16px 10px; cursor: pointer; text-align: left;
    }
    .confirm-btn {
      display: block; width: calc(100% - 32px); margin: 12px 16px 0;
      padding: 13px; background: var(--accent); border: none; border-radius: 10px;
      color: var(--text-dark); font-weight: 700; font-size: var(--fs-lg); cursor: pointer;
    }
    .confirm-btn:active { opacity: 0.7; }
    .import-preview-box {
      margin: 0 16px; background: var(--bg-input); border: 1px solid var(--bg-secondary);
      border-radius: 10px; padding: 14px; max-height: 260px; overflow-y: auto;
    }

    /* Escrever a orientação é trabalho de texto — em telas largas o editor
       ganha uma coluna larga de 960px, como o editor.html. */
    @media (min-width: 640px) {
      /* Tela larga = navegador/desktop, não o celular do aluno. Fontes maiores
         aqui ajudam quem tem dificuldade de leitura pra escrever as anotações. */
      :root {
        --fs-2xs: 0.78rem;
        --fs-xs: 0.85rem;
        --fs-sm: 0.9rem;
        --fs-base: 0.95rem;
        --fs-md: 1rem;
        --fs-lg: 1.05rem;
        --fs-xl: 1.15rem;
        --fs-2xl: 1.3rem;
        --fs-3xl: 1.5rem;
      }
      .header, .tabs, .import-open-btn, .panel, .save-bar {
        max-width: 960px;
        margin-left: auto;
        margin-right: auto;
      }
    }
  </style>

<script>(function(){var t=localStorage.getItem('app-theme');if(t)document.documentElement.setAttribute('data-theme',t);})();</script>

  <div class="loading-overlay" id="loadingOverlay">

Dica: use linhas começando com # para criar seções (ex: # Café da manhã).
Linhas com • ou - viram listas. Toque nos atalhos acima para inserir rápido."></textarea>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
// =====================================================================
// Estado
// =====================================================================
let myId       = null;
let studentId  = null;
let inviteId   = null; // invite pendente (aluno ainda sem login)
let noteId     = null;   // uuid da linha no banco (null = ainda não existe)
let lastSavedContent = '';

// --- Importação ---
let importStudentsCache = [];  // alunos do professor (exceto o alvo)
let importSelectedNote  = null; // { content, student_name }

const params    = new URLSearchParams(location.search);
studentId       = params.get('aluno');
inviteId        = params.get('invite');

if (!studentId && !inviteId) {
  alert('Aluno não especificado.');
  location.replace('professor.html');
}

// =====================================================================
// Helpers
// =====================================================================
function showLoading() { document.getElementById('loadingOverlay').classList.remove('hidden'); }
function hideLoading() { document.getElementById('loadingOverlay').classList.add('hidden'); }

function showToast(text, isError) {
  const t = document.getElementById('toast');
  t.textContent = text;
  t.className = 'toast show' + (isError ? ' error' : '');
  setTimeout(() => t.className = 'toast', 2500);
}

// =====================================================================
// Abas
// =====================================================================
function switchTab(tab) {
  document.getElementById('tabEditor').classList.toggle('active', tab === 'editor');
  document.getElementById('tabPreview').classList.toggle('active', tab === 'preview');
  document.getElementById('panelEditor').classList.toggle('active', tab === 'editor');
  document.getElementById('panelPreview').classList.toggle('active', tab === 'preview');
  document.getElementById('saveBar').style.display = tab === 'editor' ? 'flex' : 'none';
  if (tab === 'preview') renderPreview();
}

// =====================================================================
// Inserção rápida de snippets
// =====================================================================
const SNIPPETS = {
  section:    '# ',
  bullet:     '• ',
  dash:       '- ',
  obs:        '# Observações\n- ',
  suplementos:'# Suplementos\n• ',
  'ao-acordar': `# Ao Acordar\n• `,
  cafe:        `# Café da Manhã\n• `,
  almoco:      `# Almoço\n• `,
  'pre-treino':  `# Pré-treino\n• `,
  intra:       `# Intra-treino\n• `,
  'pos-treino':  `# Pós-treino\n• `,
  jantar:      `# Jantar\n• `,
  ceia:        `# Ceia\n• `,
};

function insertSnippet(key) {
  const ta = document.getElementById('noteEditor');
  const snippet = SNIPPETS[key] || '';
  const pos = ta.selectionStart;
  const val = ta.value;

  // Se o cursor não está no começo de linha, adiciona quebra antes
  let prefix = '';
  if (pos > 0 && val[pos - 1] !== '\n') prefix = '\n';
  // Se há conteúdo após o cursor na mesma linha, adiciona quebra depois
  const nextNl = val.indexOf('\n', pos);
  const suffix = (nextNl === pos) ? '' : '';

  const newVal = val.slice(0, pos) + prefix + snippet;
  ta.value = newVal + val.slice(pos);
  const newPos = pos + prefix.length + snippet.length;
  ta.setSelectionRange(newPos, newPos);
  ta.focus();
}

// =====================================================================
// Renderização do preview (mesmo algoritmo do modal do aluno)
// =====================================================================
function renderNoteContent(raw) {
  if (!raw || !raw.trim()) return '<div class="preview-empty"><div class="icon">📄</div>Nenhum conteúdo ainda</div>';

  const lines   = raw.split('\n');
  let html      = '<div class="note-render">';
  let inSection = false;
  let numCount  = 0;

  function closeSection() {
    if (inSection) { html += '</div>'; inSection = false; }
  }

  lines.forEach(raw => {
    const line = raw; // preserva indentação original para análise

    // Linha de seção: começa com #
    if (/^#\s+/.test(line)) {
      closeSection();
      const title = line.replace(/^#+\s*/, '').trim();
      html += `<div class="note-section"><div class="note-section-title">${esc(title)}</div>`;
      inSection = true;
      numCount  = 0;
      return;
    }

    const trimmed = line.trim();

    // Linha em branco → espaçador
    if (!trimmed) {
      html += '<div class="note-spacer"></div>';
      numCount = 0;
      return;
    }

    // Bullet: • ou *
    if (/^[•*]\s+/.test(trimmed)) {
      const text = trimmed.replace(/^[•*]\s+/, '');
      html += `<div class="note-line bullet">${esc(text)}</div>`;
      numCount = 0;
      return;
    }

    // Dash: - ou —
    if (/^[-—]\s+/.test(trimmed)) {
      const text = trimmed.replace(/^[-—]\s+/, '');
      html += `<div class="note-line dash">${esc(text)}</div>`;
      numCount = 0;
      return;
    }

    // Numerado: começa com dígito + ponto/parêntese
    const numMatch = trimmed.match(/^(\d+)[.)]\s+(.*)/);
    if (numMatch) {
      html += `<div class="note-line num" data-num="${numMatch[1]}">${esc(numMatch[2])}</div>`;
      numCount++;
      return;
    }

    // Linha normal
    html += `<div class="note-line">${esc(trimmed)}</div>`;
  });

  closeSection();
  html += '</div>';
  return html;
}

function renderPreview() {
  const content = document.getElementById('noteEditor').value;
  document.getElementById('previewContent').innerHTML = renderNoteContent(content);
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

// =====================================================================
// Salvar
// =====================================================================
async function saveNote() {
  const btn     = document.getElementById('saveBtn');
  const content = document.getElementById('noteEditor').value.trim();

  btn.disabled = true;
  btn.textContent = 'Salvando...';

  try {
    if (noteId) {
      // Atualizar existente
      const { error } = await _sb.from('trainer_notes')
        .update({ content, updated_at: new Date().toISOString() })
        .eq('id', noteId);
      if (error) throw error;
    } else {
      // Inserir novo
      const insertData = { coach_id: myId, content };
      if (studentId) insertData.student_id = studentId;
      else if (inviteId) insertData.invite_id = inviteId;

      const { data, error } = await _sb.from('trainer_notes')
        .insert(insertData)
        .select('id')
        .single();
      if (error) throw error;
      noteId = data.id;
    }

    lastSavedContent = content;
    updateLastSaved();
    showToast('Anotações salvas ✓');
  } catch (e) {
    console.error('Erro ao salvar:', e);
    showToast('Erro ao salvar', true);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Salvar';
  }
}

function updateLastSaved() {
  const el = document.getElementById('lastSaved');
  const now = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  el.textContent = `Salvo às ${now}`;
}

// =====================================================================
// Limpar
// =====================================================================
function confirmClear() {
  if (!document.getElementById('noteEditor').value.trim()) return;
  if (!confirm('Apagar todo o conteúdo desta anotação?')) return;
  document.getElementById('noteEditor').value = '';
  document.getElementById('lastSaved').textContent = '';
}

// =====================================================================
// Carregar nota existente
// =====================================================================
async function loadNote() {
  try {
    let query = _sb.from('trainer_notes')
      .select('id, content, updated_at');
    if (studentId) query = query.eq('student_id', studentId);
    else if (inviteId) query = query.eq('invite_id', inviteId);

    const { data, error } = await query.maybeSingle();

    if (error) throw error;

    if (data) {
      noteId = data.id;
      document.getElementById('noteEditor').value = data.content || '';
      lastSavedContent = data.content || '';
      if (data.updated_at) {
        const d = new Date(data.updated_at);
        const fmt = d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' }) + ' ' +
                    d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
        document.getElementById('lastSaved').textContent = `Última edição: ${fmt}`;
      }
    }
  } catch (e) {
    console.error('Erro ao carregar nota:', e);
    showToast('Erro ao carregar anotações', true);
  }
}

// =====================================================================
// Carregar nome do aluno
// =====================================================================
async function loadStudentName() {
  try {
    let name = null;
    if (studentId) {
      const { data } = await _sb.from('profiles')
        .select('full_name')
        .eq('id', studentId)
        .maybeSingle();
      name = data?.full_name;
    } else if (inviteId) {
      const { data } = await _sb.from('invites')
        .select('full_name')
        .eq('id', inviteId)
        .maybeSingle();
      name = data?.full_name;
    }
    if (name) {
      const label = name + (inviteId && !studentId ? ' (pendente)' : '');
      document.getElementById('studentName').textContent = label;
      document.title = `Anotações — ${label}`;
    }
  } catch (e) { /* ignora */ }
}

// =====================================================================
// Modal de importação de anotações
// =====================================================================
function openImport() {
  document.getElementById('importModal').classList.add('show');
  showImportStep(1);
  if (importStudentsCache.length === 0) loadImportStudents();
}

function closeImport() {
  document.getElementById('importModal').classList.remove('show');
}

function showImportStep(n) {
  document.getElementById('importStep1').style.display = n === 1 ? 'block' : 'none';
  document.getElementById('importStep2').style.display = n === 2 ? 'block' : 'none';
  const titles = { 1: 'Importar anotações', 2: 'Confirmar importação' };
  const subs   = {
    1: 'Escolha de qual aluno copiar as anotações.',
    2: 'Revise o conteúdo antes de trazer para o editor.'
  };
  document.getElementById('importTitle').textContent = titles[n];
  document.getElementById('importSub').textContent   = subs[n];
}

async function loadImportStudents() {
  const box = document.getElementById('importStudents');
  box.innerHTML = '<div class="modal-empty">Carregando alunos...</div>';

  const { data, error } = await _sb.from('profiles')
    .select('id, full_name, gym_name')
    .eq('coach_id', myId)
    .eq('role', 'student')
    .eq('is_deleted', false)
    .order('full_name', { ascending: true });

  if (error) {
    box.innerHTML = '<div class="modal-empty">Erro ao carregar alunos.</div>';
    return;
  }

  // Exclui o aluno atual e mantém só quem tem anotação
  const others = (data || []).filter(s => s.id !== studentId);
  if (others.length > 0) {
    const { data: notes } = await _sb.from('trainer_notes')
      .select('student_id')
      .in('student_id', others.map(s => s.id));
    const withNote = new Set((notes || []).map(r => r.student_id));
    importStudentsCache = others.filter(s => withNote.has(s.id));
  } else {
    importStudentsCache = [];
  }

  renderImportStudents();
}

function renderImportStudents() {
  const box  = document.getElementById('importStudents');
  const term = (document.getElementById('importSearch').value || '').trim().toLowerCase();
  const list = term
    ? importStudentsCache.filter(s => (s.full_name || '').toLowerCase().includes(term))
    : importStudentsCache;

  if (importStudentsCache.length === 0) {
    box.innerHTML = '<div class="modal-empty">Nenhum outro aluno seu tem anotações cadastradas ainda.</div>';
    return;
  }
  if (list.length === 0) {
    box.innerHTML = '<div class="modal-empty">Nenhum aluno encontrado.</div>';
    return;
  }

  box.innerHTML = list.map(s => {
    const initial = (s.full_name || '?').trim().charAt(0).toUpperCase();
    const meta = s.gym_name || 'Academia não informada';
    return `
      <button class="pick-item" data-sid="${esc(s.id)}" data-sname="${esc(s.full_name || 'Aluno')}">
        <span class="pick-avatar">${esc(initial)}</span>
        <span class="pick-body">
          <span class="pick-title">${esc(s.full_name || 'Aluno')}</span>
          <span class="pick-meta">${esc(meta)}</span>
        </span>
        <span class="pick-arrow">›</span>
      </button>`;
  }).join('');

  // Delegação de evento — evita quebra por aspas no nome
  box.querySelectorAll('.pick-item').forEach(btn => {
    btn.addEventListener('click', () => {
      pickImportStudent(btn.dataset.sid, btn.dataset.sname);
    });
  });
}

async function pickImportStudent(sourceStudentId, studentName) {
  const box = document.getElementById('importPreview');
  box.innerHTML = '<div class="modal-empty">Carregando anotações...</div>';
  showImportStep(2);

  const { data, error } = await _sb.from('trainer_notes')
    .select('content')
    .eq('student_id', sourceStudentId)
    .maybeSingle();

  if (error || !data?.content?.trim()) {
    box.innerHTML = '<div class="modal-empty">Este aluno não tem anotações ainda.</div>';
    importSelectedNote = null;
    return;
  }

  importSelectedNote = { content: data.content, student_name: studentName };
  box.innerHTML = renderNoteContent(data.content);
}

function confirmImport() {
  if (!importSelectedNote) return;
  const current = document.getElementById('noteEditor').value.trim();
  if (current && !confirm(`Substituir as anotações atuais pelas de "${importSelectedNote.student_name}"?`)) return;

  document.getElementById('noteEditor').value = importSelectedNote.content;
  closeImport();
  switchTab('editor');
  showToast(`Anotações de ${importSelectedNote.student_name} importadas ✓`);
  importSelectedNote = null;
}

// =====================================================================
// Init
// =====================================================================
guard('trainer', {
  onReady: async (session, profile) => {
    myId = profile.id;
    await Promise.all([loadStudentName(), loadNote()]);
    hideLoading();
  }
});
</script>
